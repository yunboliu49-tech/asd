async function _doWriteFile(path,content){const parts=path.split('/');const fn=parts.pop();for(let a=0;a<3;a++){let w=null;try{if(a>0){_dirHandleCache={};const perm=await folderH.queryPermission({mode:'readwrite'});if(perm!=='granted'){if((await folderH.requestPermission({mode:'readwrite'}))!=='granted'){toast('❌ 权限已失效');return false}}await delay(200*(a+1))}let dir=folderH;for(const p of parts){const ck='_d_'+p;if(_dirHandleCache[ck])dir=_dirHandleCache[ck];else{dir=await dir.getDirectoryHandle(p,{create:true});_dirHandleCache[ck]=dir}}const f=await dir.getFileHandle(fn,{create:true});w=await f.createWritable();await w.write(content);await w.close();return true}catch(e){if(w)try{await w.abort()}catch(ae){}if(a===2){toast('❌ 保存失败: '+e.name+': '+(e.message||'').substring(0,40));return false}}}return false}

function getEntriesForDate(date){const sch=getCurSchedule();if(!sch)return[];const wn=getWeekNumber(date),wd=getWeekday(date);if(!wn||wn<1)return[];return(sch.entries||[]).filter(e=>e.day===wd&&e.startWeek<=wn&&wn<=e.endWeek).sort((a,b)=>{const at=getEntryTime(a,sch),bt=getEntryTime(b,sch);return at.start.localeCompare(bt.start)})}

//== getEntryTime ==//
function getEntryTime(e,sch){if(e.startTime&&e.endTime)return{start:e.startTime,end:e.endTime};if(e.startNode&&e.step&&sch.timeSlots){const si=sch.timeSlots.find(t=>t.node===e.startNode),ei=sch.timeSlots.find(t=>t.node===e.startNode+e.step-1);return{start:si?si.start:'??',end:ei?ei.end:'??'}}return{start:'??',end:'??'}}

//== getEntryTitle ==//
function getEntryTitle(e,sch){if(e.title)return e.title;if(e.courseId!==undefined&&sch.courses){const c=sch.courses.find(x=>x.id===e.courseId);return c?c.name:'未知'}return'未命名'}

//== getEntryColor ==//
function getEntryColor(e,sch){if(e.source==='manual')return'#607d8b';if(e.courseId!==undefined&&sch.courses){const c=sch.courses.find(x=>x.id===e.courseId);if(c?.color){let cl=c.color;if(cl.length===9&&cl.startsWith('#ff'))cl='#'+cl.substring(3);return cl}}return'#4a9eff'}

//== adaptColor ==//
function adaptColor(hex){if(hex.length===9&&hex.startsWith('#ff'))hex='#'+hex.substring(3);const t=cfg.theme||'dark';if(t==='light')return{bg:hex+'35',text:'#333',border:hex+'70'};return{bg:hex+'50',text:'#fff',border:hex+'90'}}

//== isEntryCompleted ==//
function isEntryCompleted(e,date){if(e.completedTask)return true;if(e.completedDates&&date)return e.completedDates.includes(fmtDate(date));return false}

//== isOverdue ==//
function isOverdue(t){if(t.status!=='active')return false;const td=fmtDate(new Date());return(t.type==='once'&&t.deadline&&t.deadline<td)||(t.type==='cycle'&&t.nextDue&&t.nextDue<td)}

//== isDueToday ==//
function isDueToday(t){if(t.status!=='active')return false;const td=fmtDate(new Date());return(t.type==='once'&&t.deadline===td)||(t.type==='cycle'&&t.nextDue&&t.nextDue<=td)}

//== sortTasks ==//
function sortTasks(list){const po={high:0,mid:1,low:2};return list.sort((a,b)=>{const ao=isOverdue(a),bo=isOverdue(b);if(ao!==bo)return ao?-1:1;const ad=isDueToday(a),bd=isDueToday(b);if(ad!==bd)return ad?-1:1;return(po[a.priority]||1)-(po[b.priority]||1)})}

//== getOverdueTasks ==//
function getOverdueTasks(){return tasks.filter(t=>isOverdue(t))}

//== getTodayTaskList ==//
function getTodayTaskList(){const td=fmtDate(new Date()),ids=new Set();const base=tasks.filter(t=>{if(t.status!=='active')return false;if((t.type==='once'&&t.deadline===td)||(t.type==='cycle'&&t.nextDue&&t.nextDue<=td)||(t.type==='long')){ids.add(t.id);return true}return false});const entries=getEntriesForDate(new Date());entries.forEach(e=>{if(e.taskId&&!ids.has(e.taskId)){const t=tasks.find(x=>x.id===e.taskId);if(t&&t.status==='active'){ids.add(t.id);base.push(t)}}});return sortTasks(base)}

//== getUpcomingTasks ==//
function getUpcomingTasks(days){const today=new Date(),items=[];for(let d=1;d<=days;d++){const dt=addDays(today,d),ds=fmtDate(dt);tasks.forEach(t=>{if(t.status!=='active')return;if((t.type==='once'&&t.deadline===ds)||(t.type==='cycle'&&t.nextDue===ds))items.push({...t,dateStr:fmtDateShort(dt)})})}return items}

//== getLinkedEntries ==//
function getLinkedEntries(taskId){const r=[];Object.values(schedulesData.schedules).forEach(sch=>{(sch.entries||[]).forEach(e=>{if(e.taskId===taskId)r.push({...e,_schName:sch.name,_schId:sch.id})})});return r}

//== getVisibleCols ==//
function getVisibleCols(){const w=window.innerWidth-36;if(w>1200)return 10;if(w>900)return 7;return 5}

//== checkOverdueAlert ==//
function checkOverdueAlert(){const td=fmtDate(new Date());if(localStorage.getItem('lastOverdueAlert')===td)return;const od=getOverdueTasks();if(!od.length)return;let b='<div style="text-align:center;margin-bottom:10px"><div style="font-size:30px">⚠️</div><div style="font-weight:600;margin-top:6px">有 '+od.length+' 项逾期</div></div>';od.forEach(t=>{b+='<div style="padding:6px 8px;background:rgba(248,113,113,.1);border-radius:var(--r);margin-bottom:4px;border-left:3px solid var(--dn)"><span style="font-weight:500">'+esc(t.title)+'</span></div>'});showMo('⚠️ 逾期',b,'<button class="mo-btn sec" onclick="hideMo()">知道了</button><button class="mo-btn pri" onclick="hideMo();switchTab(\'tasks\')">查看</button>','compact');localStorage.setItem('lastOverdueAlert',td)}

//== overdueDays ==//
function overdueDays(t){const td=new Date();if(t.type==='once'&&t.deadline)return daysBetween(parseDate(t.deadline),td);if(t.type==='cycle'&&t.nextDue)return daysBetween(parseDate(t.nextDue),td);return 0}

//== renderToday ==//
function renderToday(){const d=new Date(),wn=getWeekNumber(d),sch=getCurSchedule();const el=document.getElementById('paneToday');let h='<div class="today-date" onclick="showDateJump()"><div class="main-date">'+fmtDateCN(d)+'</div><div class="sub-date">'+fmtWeekday(getWeekday(d))+(wn?' · 第'+wn+'周':'')+(sch?'/'+sch.totalWeeks+'周':'')+'  ▼</div></div><div class="today-scroll">';const od=getOverdueTasks();if(od.length){h+='<div class="today-overdue"><div class="today-overdue-title">⚠️ 逾期 ('+od.length+')</div>';sortTasks(od).forEach(t=>{h+=renderTaskCardHtml(t,true)});h+='</div>'}const entries=getEntriesForDate(d);h+='<div class="today-section"><div class="today-section-hdr">📅 今日安排 <span class="cnt">('+entries.length+')</span></div>';if(entries.length){let le=null;entries.forEach(e=>{const t=getEntryTime(e,sch);if(le&&t.start>le)h+='<div class="today-free">空闲 '+le+'-'+t.start+' ('+calcDuration(le,t.start)+')</div>';h+='<div class="today-sched-item'+(e.source==='manual'?' manual':'')+'"><span class="ts-time">'+t.start+'-'+t.end+'</span><span class="ts-title">'+esc(getEntryTitle(e,sch))+'</span>'+(e.room?'<span class="ts-loc">'+esc(e.room)+'</span>':'')+'</div>';le=t.end})}else h+='<div class="today-free">今日无安排</div>';h+='</div>';const tt=getTodayTaskList();h+='<div class="today-section"><div class="today-section-hdr">✅ 今日待办 <span class="cnt">('+tt.length+')</span></div>';tt.forEach(t=>{h+=renderTaskCardHtml(t,true)});if(!tt.length)h+='<div style="padding:10px;text-align:center;color:var(--tx-m)">无待办</div>';h+='</div>';h+=renderJustCompleted();const up=getUpcomingTasks(7);if(up.length){const n7open=!sectionFolds.near7;h+='<div class="today-section"><div class="today-section-hdr" data-key="near7" onclick="tglSection(this)"><span class="arr'+(n7open?' open':'')+'">▶</span> 📌 近7天 <span class="cnt">('+up.length+')</span></div><div style="display:'+(n7open?'block':'none')+'">';up.forEach(i=>{h+=renderTaskCardHtml(i,true)});h+='</div></div>'}h+='</div>';el.innerHTML=h}

//== renderJustCompleted ==//
function renderJustCompleted(){const items=justCompleted.filter(j=>fmtDate(new Date(j.time||Date.now()))===fmtDate(new Date()));if(!items.length)return'';let h='<div class="just-done-area"><div class="just-done-title">✅ 刚完成</div>';items.forEach(j=>{h+='<div class="just-done-item"><span>✓ '+esc(j.title)+'</span><button class="jd-undo" onclick="undoTaskDone(\''+j.taskId+'\')">撤销</button></div>'});return h+'</div>'}

//== tglSection ==//
function tglSection(hdr){const b=hdr.nextElementSibling,k=hdr.dataset.key;if(b)b.style.display=b.style.display==='none'?'block':'none';const a=hdr.querySelector('.arr');if(a)a.classList.toggle('open');if(k&&sectionFolds.hasOwnProperty(k))sectionFolds[k]=b?.style.display==='none'}

//== renderTaskCardHtml ==//
function renderTaskCardHtml(t,showCheck){const isDone=t.status==='completed'||t.status==='archived';const od=isOverdue(t),completing=justCompleted.some(j=>j.taskId===t.id);let cls='task-card pri-'+t.priority;if(isDone)cls+=' '+(t.status==='archived'?'archived':'completed');if(od)cls+=' overdue';if(completing)cls+=' completing';let h='<div class="'+cls+'">';if(showCheck&&t.type!=='long')h+='<div class="task-check'+(isDone?' done':'')+'" onclick="event.stopPropagation();toggleTaskDone(\''+t.id+'\')">'+(isDone?'✓':'')+'</div>';if(t.type==='long'&&showCheck)h+='<button class="task-archive-btn" onclick="event.stopPropagation();showArchiveTask(\''+t.id+'\')">📦</button>';h+='<div class="task-info" onclick="showEditTask(\''+t.id+'\')"><div class="task-title">'+esc(t.title)+'</div>';if(t.note)h+='<div style="font-size:11px;color:var(--tx-s);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(t.note)+'</div>';h+='<div class="task-meta">';if(t.tag)h+='<span class="task-tag-badge">'+esc(t.tag)+'</span>';if(t.type==='once'&&t.deadline)h+='<span class="tag'+(od?' overdue-tag':'')+'">'+t.deadline+(t.deadlineTime?' '+t.deadlineTime:'')+'</span>';if(t.type==='cycle')h+='<span class="tag">'+cycleLabel(t.cycle)+'</span>';h+='<span class="tag">'+priLabel(t.priority)+'</span>';if(t.status==='archived')h+='<span class="tag">📦</span>';if(t.type==='long'&&t.subtasks){const dn=t.subtasks.filter(s=>s.done).length;h+='<span class="tag">'+dn+'/'+t.subtasks.length+'</span>'}h+='</div>';if(t.type==='long'&&t.subtasks?.length){const dn=t.subtasks.filter(s=>s.done).length,pct=Math.round(dn/t.subtasks.length*100);h+='<div class="task-progress"><div class="task-prog-bar"><div class="task-prog-fill" style="width:'+pct+'%"></div></div><span class="task-prog-text">'+pct+'%</span></div>'}h+='</div>';if(completing)h+='<button class="jd-undo" onclick="event.stopPropagation();undoTaskDone(\''+t.id+'\')">撤销</button>';else if(t.type==='cycle'&&od&&showCheck)h+='<button class="task-skip" onclick="event.stopPropagation();skipCycleTask(\''+t.id+'\')">跳过</button>';h+='</div>';return h}

//== toggleTaskDone ==//
function toggleTaskDone(id){const ex=justCompleted.find(j=>j.taskId===id);if(ex){undoTaskDone(id);return}const t=tasks.find(x=>x.id===id);if(!t||t.type==='long')return;const snap={status:t.status,lastDone:t.lastDone,nextDue:t.nextDue,completedAt:t.completedAt};const jc={taskId:id,title:t.title,type:t.type,time:Date.now(),snapshot:snap,confirmed:false};jc.timer=setTimeout(()=>confirmTaskDone(id),3000);justCompleted.push(jc);markDirty('today','tasks')}

//== confirmTaskDone ==//
async function confirmTaskDone(id){const jc=justCompleted.find(j=>j.taskId===id);if(!jc||jc.confirmed)return;jc.confirmed=true;const t=tasks.find(x=>x.id===id);if(!t)return;const td=fmtDate(new Date()),ym=td.substring(0,7);const hist=await loadHistory(ym);const sch=getCurSchedule();if(t.type==='once'){t.status='completed';t.completedAt=new Date().toISOString();hist.records.push({taskId:t.id,title:t.title,type:'once',doneAt:t.completedAt});if(sch)(sch.entries||[]).forEach(e=>{if(e.taskId===t.id)e.completedTask=true});logChange('task_done','完成: '+t.title)}else if(t.type==='cycle'){t.lastDone=td;t.nextDue=calcNextDue(t);hist.records.push({taskId:t.id,title:t.title,type:'cycle',doneAt:new Date().toISOString()});if(sch){const wd=getWeekday(new Date()),wn=getWeekNumber(new Date());(sch.entries||[]).forEach(e=>{if(e.taskId===t.id&&e.day===wd&&e.startWeek<=wn&&wn<=e.endWeek){if(!e.completedDates)e.completedDates=[];if(!e.completedDates.includes(td))e.completedDates.push(td)}})}logChange('task_done','完成: '+t.title)}await saveTasks();await saveHistory(ym);if(sch)await saveSchedules()}

//== undoTaskDone ==//
async function undoTaskDone(id){const idx=justCompleted.findIndex(j=>j.taskId===id);if(idx===-1)return;const jc=justCompleted[idx];clearTimeout(jc.timer);if(jc.confirmed){const t=tasks.find(x=>x.id===id);if(t&&jc.snapshot){Object.assign(t,jc.snapshot);const sch=getCurSchedule();if(sch)(sch.entries||[]).forEach(e=>{if(e.taskId===t.id){delete e.completedTask;if(e.completedDates)e.completedDates=e.completedDates.filter(d=>d!==fmtDate(new Date()))}});await saveTasks();if(sch)await saveSchedules()}}justCompleted.splice(idx,1);markDirty('today','tasks','plan');toast('已撤销')}

//== skipCycleTask ==//
async function skipCycleTask(id){const t=tasks.find(x=>x.id===id);if(!t||t.type!=='cycle')return;const td=fmtDate(new Date()),ym=td.substring(0,7);t.lastDone=td;t.nextDue=calcNextDue(t);const hist=await loadHistory(ym);hist.records.push({taskId:t.id,title:t.title,type:'cycle',doneAt:new Date().toISOString(),skipped:true});logChange('task_skip','跳过: '+t.title);await saveTasks();await saveHistory(ym);toast('✓ 已跳过')}

//== calcNextDue ==//
function calcNextDue(t){if(!t.cycle)return null;const today=new Date(),ts=fmtDate(today);if(!t.lastDone){if(t.cycle.mode==='daily')return ts;if(t.cycle.mode==='weekly'){for(let d=0;d<7;d++){const dt=addDays(today,d);if(t.cycle.weekdays.includes(getWeekday(dt)))return fmtDate(dt)}return ts}if(t.cycle.mode==='monthly'){const m=new Date(today.getFullYear(),today.getMonth(),t.cycle.day);if(m>=today)return fmtDate(m);m.setMonth(m.getMonth()+1);return fmtDate(m)}return ts}const ld=parseDate(t.lastDone);if(t.cycle.mode==='daily'){const ns=fmtDate(addDays(ld,t.cycle.interval));return ns<ts?ts:ns}if(t.cycle.mode==='weekly'){for(let d=1;d<=14;d++){const dt=addDays(ld,d);if(t.cycle.weekdays.includes(getWeekday(dt))){const ns=fmtDate(dt);return ns<ts?ts:ns}}return ts}if(t.cycle.mode==='monthly'){let m=new Date(ld.getFullYear(),ld.getMonth()+1,t.cycle.day);if(m<today)m=new Date(today.getFullYear(),today.getMonth(),t.cycle.day);if(m<today)m.setMonth(m.getMonth()+1);return fmtDate(m)}return ts}

//== showArchiveTask ==//
function showArchiveTask(id){const t=tasks.find(x=>x.id===id);if(!t)return;const dn=(t.subtasks||[]).filter(s=>s.done).length,tl=(t.subtasks||[]).length;showMo('📦 归档','<div style="padding:10px;background:var(--bg-t);border-radius:var(--r);margin-bottom:10px"><div>完成: '+dn+'/'+tl+'</div><div>持续: '+daysBetween(new Date(t.createdAt),new Date())+'天</div></div><div class="fg"><label>说明</label><textarea id="archN" rows="2"></textarea></div>','<button class="mo-btn sec" onclick="hideMo()">取消</button><button class="mo-btn pri" onclick="doArchive(\''+id+'\')">归档</button>','compact')}

//== doArchive ==//
async function doArchive(id){const t=tasks.find(x=>x.id===id);if(!t)return;t.status='archived';t.archivedAt=new Date().toISOString();t.archiveNote=document.getElementById('archN')?.value?.trim()||'';logChange('task_archive','归档: '+t.title);await saveTasks();hideMo();toast('✓')}

//== renderTasks ==//
function renderTasks(){const el=document.getElementById('paneTasks');let fl;if(taskFilter==='active')fl=tasks.filter(t=>t.status==='active');else if(taskFilter==='completed')fl=tasks.filter(t=>t.status==='completed'||t.status==='archived');else fl=[...tasks];if(taskTagFilter)fl=fl.filter(t=>(t.tag||'')===taskTagFilter);const once=sortTasks(fl.filter(t=>t.type==='once')),cycle=sortTasks(fl.filter(t=>t.type==='cycle')),long=fl.filter(t=>t.type==='long');let h='<div class="task-toolbar"><div class="task-filters"><button class="tf'+(taskFilter==='active'?' active':'')+'" onclick="setTaskFilter(\'active\')">进行中</button><button class="tf'+(taskFilter==='completed'?' active':'')+'" onclick="setTaskFilter(\'completed\')">已完成</button><button class="tf'+(taskFilter==='all'?' active':'')+'" onclick="setTaskFilter(\'all\')">全部</button></div><button class="tb pri" onclick="showAddTask()">+</button></div>';const tags=cfg.taskTags||[];if(tags.length){h+='<div style="padding:0 10px 6px"><div class="task-tag-filters"><button class="ttf'+(!taskTagFilter?' active':'')+'" onclick="setTaskTagFilter(\'\')">全部</button>';tags.forEach(tg=>{h+='<button class="ttf'+(taskTagFilter===tg?' active':'')+'" onclick="setTaskTagFilter(\''+escA(tg)+'\')">'+esc(tg)+'</button>'});h+='</div></div>'}h+='<div style="padding:0 10px">';if(once.length){h+='<div class="task-section-hdr">📌 一次性 ('+once.length+')</div>';once.forEach(t=>{h+=renderTaskCardHtml(t,true)})}if(cycle.length){h+='<div class="task-section-hdr">🔄 周期 ('+cycle.length+')</div>';cycle.forEach(t=>{h+=renderTaskCardHtml(t,true)})}if(long.length){h+='<div class="task-section-hdr">🎯 长期 ('+long.length+')</div>';long.forEach(t=>{h+=renderTaskCardHtml(t,true)})}if(!fl.length)h+='<div style="text-align:center;padding:40px;color:var(--tx-m)">无任务</div>';h+='</div>';el.innerHTML=h}

//== showAddTask ==//
function showAddTask(){const tagOpts=(cfg.taskTags||[]).map(t=>'<option value="'+escA(t)+'">'+esc(t)+'</option>').join('');showMo('添加任务','<div class="fg"><label>标题</label><input type="text" id="atT"></div><div class="fg"><label>类型</label><select id="atTy" onchange="onATChg()"><option value="once">一次性</option><option value="cycle">周期</option><option value="long">长期</option></select></div><div id="atEx"></div><div class="fg"><label>优先级</label><select id="atP"><option value="mid">中</option><option value="high">高</option><option value="low">低</option></select></div><div class="fg"><label>标签</label><select id="atTag"><option value="">无</option>'+tagOpts+'</select></div><div class="fg"><label>详情</label><textarea id="atN" rows="2"></textarea></div>','<button class="mo-btn sec" onclick="hideMo()">取消</button><button class="mo-btn pri" onclick="doAddTask()">添加</button>');onATChg()}

//== onATChg ==//
function onATChg(){const ty=document.getElementById('atTy').value,ex=document.getElementById('atEx');if(ty==='once')ex.innerHTML='<div class="fg"><label>截止日期</label><input type="date" id="atDL"></div><div class="fg"><label>截止时间</label><input type="time" id="atDLT"></div>';else if(ty==='cycle'){ex.innerHTML='<div class="fg"><label>模式</label><select id="atCM" onchange="onCMChg()"><option value="daily">每N天</option><option value="weekly">每周指定天</option><option value="monthly">每月几号</option></select></div><div id="atCE"></div>';onCMChg()}else ex.innerHTML=''}

function onCMChg(){const m=document.getElementById('atCM').value,ex=document.getElementById('atCE');if(m==='daily')ex.innerHTML='<div class="fg"><label>间隔</label><input type="number" id="atCI" value="1" min="1"></div>';else if(m==='weekly')ex.innerHTML='<div class="fg"><label>星期几</label><div style="display:flex;gap:4px;flex-wrap:wrap" id="atWD">'+[1,2,3,4,5,6,7].map(d=>'<label style="display:flex;align-items:center;gap:2px;padding:4px 6px;background:var(--bg-t);border-radius:var(--r);cursor:pointer;font-size:12px"><input type="checkbox" value="'+d+'" style="width:14px;height:14px">'+fmtWeekday(d).replace('周','')+'</label>').join('')+'</div></div>';else ex.innerHTML='<div class="fg"><label>每月几号</label><input type="number" id="atMD" value="1" min="1" max="31"></div>'}

//== doAddTask ==//

//== renderWeekViewHtml ==//
function renderWeekViewHtml(){const sch=getCurSchedule();if(!sch)return'';const {start,weeks}=getPlanBounds(),visCols=getVisibleCols(),cw=window.innerWidth-36,colW=Math.floor(cw/visCols);const fs=cfg.planFontSize||9,rowH=Math.max(35,38+(fs-9)*2);const nodes=sch.nodesPerDay||12,totalH=nodes*rowH+getWvBreakOffset(nodes+1)+Math.round(window.innerHeight*.2);wvStartDate=start;wvDayCount=weeks*7;const today=new Date(),frag=[];let hdrCells='';for(let d=0;d<wvDayCount;d++){const dt=addDays(wvStartDate,d),isT=isSameDate(dt,today),wd=getWeekday(dt);hdrCells+='<div class="wv-hdr-cell'+(isT?' today':'')+'" style="width:'+colW+'px"><div class="hc-day">'+fmtWeekday(wd).replace('周','')+'</div><div class="hc-date">'+fmtDateShort(dt)+'</div></div>';frag.push('<div class="wv-grid-col'+(isT?' today-col':'')+'" style="left:'+(d*colW)+'px;width:'+colW+'px"></div>');const dayE=getEntriesForDate(dt),conflicts=buildConflictMap(dayE,sch);dayE.forEach(e=>{const cf=conflicts[e.eid];if(cf?.hidden)return;const t=getEntryTime(e,sch),top=timeToY(t.start,sch,rowH),bot=timeToY(t.end,sch,rowH);const height=Math.max(bot-top,rowH*0.8),color=adaptColor(getEntryColor(e,sch));const title=getEntryTitle(e,sch),step=e.step||Math.max(1,Math.round(height/rowH));const nameLines=Math.min(step,4),manual=e.source==='manual',completed=isEntryCompleted(e,dt);frag.push('<div class="wv-entry'+(manual?' manual':'')+(completed?' completed-entry':'')+'" style="left:'+(d*colW+1)+'px;top:'+top+'px;width:'+(colW-2)+'px;height:'+height+'px;background:'+color.bg+';border-left:2px solid '+color.border+';color:'+color.text+'" onclick="showEntryDetail(\''+e.eid+'\')"><div class="we-name" style="font-size:'+fs+'px;-webkit-line-clamp:'+nameLines+'">'+esc(title)+'</div>'+(height>=70&&e.room?'<div class="we-room" style="font-size:'+(fs-1)+'px">'+esc(e.room)+'</div>':'')+(height>=90&&e.teacher?'<div class="we-teacher" style="font-size:'+(fs-2)+'px">'+esc(e.teacher)+'</div>':'')+(height>=120?'<div class="we-time" style="font-size:'+(fs-2)+'px">'+t.start+'-'+t.end+'</div>':'')+(cf?.count?'<div class="wv-conflict-badge" onclick="event.stopPropagation();showConflictPanel(\''+e.eid+'\',\''+fmtDate(dt)+'\')">+'+cf.count+'</div>':'')+'</div>')})}for(let n=0;n<nodes;n++)frag.push('<div class="wv-grid-row" style="top:'+(n*rowH+getWvBreakOffset(n+1))+'px"></div>');frag.push('<div class="wv-meal-break" style="top:'+(4*rowH+20)+'px">午休</div>');frag.push('<div class="wv-meal-break" style="top:'+(8*rowH+70)+'px">晚间</div>');let tl='';for(let n=0;n<nodes;n++){const ts=sch.timeSlots[n];tl+='<div class="wv-time-label" style="height:'+rowH+'px;top:'+(n*rowH+getWvBreakOffset(n+1))+'px">'+(ts?ts.start:'')+'</div>'}return'<div class="week-view"><div class="wv-hdr"><div class="wv-time-col"></div><div class="wv-hdr-scroll"><div class="wv-hdr-inner" id="wvHI" style="width:'+(wvDayCount*colW)+'px">'+hdrCells+'</div></div></div><div class="wv-body"><div class="wv-time-labels" style="height:'+totalH+'px">'+tl+'</div><div class="wv-grid-scroll" id="wvGS" onscroll="onWeekScroll()"><div class="wv-grid-inner" style="width:'+(wvDayCount*colW)+'px;height:'+totalH+'px">'+frag.join('')+'</div></div></div></div>'}

//== buildConflictMap ==//
function buildConflictMap(entries,sch){const map={};entries.forEach(e=>{const t=getEntryTime(e,sch),s=timeToMinutes(t.start),en=timeToMinutes(t.end);const overlaps=entries.filter(o=>{if(o.eid===e.eid)return false;const ot=getEntryTime(o,sch);return s<timeToMinutes(ot.end)&&timeToMinutes(ot.start)<en});if(overlaps.length){const isFg=e.foreground||!overlaps.some(o=>o.foreground);map[e.eid]={count:overlaps.length,hidden:!isFg};overlaps.forEach(o=>{if(!map[o.eid])map[o.eid]={count:0,hidden:!o.foreground&&isFg}})}});return map}

function showConflictPanel(eid,dateStr){const sch=getCurSchedule();if(!sch)return;const date=parseDate(dateStr),dayE=getEntriesForDate(date),target=dayE.find(e=>e.eid===eid);if(!target)return;const t=getEntryTime(target,sch),s=timeToMinutes(t.start),en=timeToMinutes(t.end);const overlaps=dayE.filter(e=>{const ot=getEntryTime(e,sch);return timeToMinutes(ot.start)<en&&s<timeToMinutes(ot.end)});let h='<div style="font-size:13px;margin-bottom:8px">'+t.start+'-'+t.end+' 重叠</div>';overlaps.forEach(e=>{h+='<div style="display:flex;align-items:center;gap:8px;padding:6px;background:var(--bg-t);border-radius:var(--r);margin-bottom:3px;border-left:3px solid '+getEntryColor(e,sch)+'"><span style="flex:1;font-size:13px">'+(e.foreground?'★ ':'')+esc(getEntryTitle(e,sch))+'</span><button class="bbn" onclick="setForeground(\''+e.eid+'\');hideMo();renderPlan()">'+(e.foreground?'前台':'设前台')+'</button></div>'});showMo('冲突',h,'<button class="mo-btn sec" onclick="hideMo()">关闭</button>','compact')}

//== setForeground ==//

//== timeToY ==//
function timeToY(ts,sch,rowH){const mins=timeToMinutes(ts),slots=sch.timeSlots||[];for(let i=0;i<slots.length;i++){const sm=timeToMinutes(slots[i].start),em=timeToMinutes(slots[i].end);if(mins<=sm){if(i>0){const pem=timeToMinutes(slots[i-1].end);if(mins>pem){const r=(mins-pem)/(sm-pem),pb=i*rowH+getWvBreakOffset(i),ct=i*rowH+getWvBreakOffset(i+1);return pb+r*(ct-pb)}}return i*rowH+getWvBreakOffset(i+1)}if(mins<=em)return(i+(mins-sm)/(em-sm))*rowH+getWvBreakOffset(i+1)}return(slots.length||0)*rowH+getWvBreakOffset((slots.length||0)+1)}

function buildChatMsgHtml(msg,i){const isG=pendingReq?.msgId===msg.id,rawContent=msg.content||'',thr=cfg.foldThreshold||500,isCfm=cfmSt.id==='cmsg-'+i;const displayContent=rawContent.replace(/<<\s*(task|plan|memory|course)\s*:\s*(add|done|del|edit|sub_add|sub_done|sub_del)\s*\|.+?>>/gi,'').replace(/\n{3,}/g,'\n\n').trim();const dcc=displayContent.length,fd=dcc>thr&&foldMgr.isFolded(msg.id);let rH='';if(msg.reasoning&&msg.role==='assistant'){const dur=msg.reasoningDuration?`${(msg.reasoningDuration/1000).toFixed(1)}s`:'';const rid=msg.id+'_r';rH='<div class="rsn-block"><div class="rsn-hdr" onclick="tglRsn(\''+rid+'\')"><span class="arr" id="ra-'+rid+'">▶</span><span>🧠'+(dur?' ('+dur+')':'')+'</span></div><div class="rsn-ct" id="rc-'+rid+'">'+esc(msg.reasoning)+'</div></div>'}let body='';if(isG&&!rawContent&&!msg.reasoning)body='<span class="typing-i"><span></span><span></span><span></span></span>';else if(msg.error)body='<div style="color:var(--dn)">❌ '+esc(msg.error)+'</div>';else if(dcc>thr&&!isG)body='<div class="fold-full" style="'+(fd?'display:none':'')+'">'+renderMd(displayContent)+'</div><div class="fold-preview-wrap" style="'+(fd?'':'display:none;')+'max-height:8em;overflow:hidden;position:relative">'+mdFmt(esc(displayContent.substring(0,400)))+'<div class="fold-mask"></div></div><button class="fold-btn" onclick="toggleChatFold(this,'+i+')">'+(fd?'▼ 展开 ('+dcc.toLocaleString()+'字)':'▲ 收起')+'</button>';else body=renderMd(displayContent);const hd=['<span class="msg-idx">#'+(i+1)+'</span>'];if(msg.model)hd.push('<span class="msg-model">'+esc(msg.model)+'</span>');hd.push('<span class="msg-time">'+fmtTime(msg.timestamp)+'</span>');hd.push('<span class="msg-chars">'+dcc.toLocaleString()+'字</span>');let extra='';if(msg.interrupted)extra='<div class="msg-interrupted">⚠️ 传输中断</div>';let cmdHtml='';if(msg.executedCmds?.length){cmdHtml='<div class="msg-cmds">';msg.executedCmds.forEach(c=>{cmdHtml+='<span class="cmd-tag '+(c.success?'ok':'fail')+'">'+(c.success?'✅':'⚠️') //== execChatReq ==//
async function execChatReq(ctxIdx,msgId){const ac=apiConfigs.find(c=>c.id===curApiId);if(!ac){toast('❌ 未找到API');return}pendingReq={msgId,abort:new AbortController(),status:'generating',content:'',reasoning:'',startTime:Date.now(),reasoningStart:null,reasoningEnd:null,firstTokenTime:null};lastStreamSaveLen=0;autoScrollOn=true;updateStopBar();startStreamTimer();const mi=chatData.messages.findIndex(m=>m.id===msgId);try{const msgs=buildChatContext(ctxIdx);const body={model:curModel,messages:msgs,stream:cfg.stream!==false};if(cfg.temperature!==null&&!isNaN(cfg.temperature))body.temperature=cfg.temperature;if(cfg.maxTokens)body.max_tokens=cfg.maxTokens;const resp=await fetch(fixApiUrl(ac.url),{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+ac.key},body:JSON.stringify(body),signal:pendingReq.abort.signal});if(!resp.ok){let em='HTTP '+resp.status;try{em=(await resp.json()).error?.message||em}catch(e){}throw new Error(em)}if(cfg.stream!==false){const rdr=resp.body.getReader(),dec=new TextDecoder();let buf='';while(true){const{done,value}=await rdr.read();if(done)break;buf+=dec.decode(value,{stream:true});const lines=buf.split('\n');buf=lines.pop();for(const line of lines){const tr=line.trim();if(!tr||!tr.startsWith('data: '))continue;const d=tr.slice(6);if(d==='[DONE]')continue;try{const j=JSON.parse(d),dl=j.choices?.[0]?.delta||{};if(dl.content){if(!pendingReq.firstTokenTime)pendingReq.firstTokenTime=Date.now();if(pendingReq.reasoningStart&&!pendingReq.reasoningEnd)pendingReq.reasoningEnd=Date.now();pendingReq.content+=dl.content}for(const f of(cfg.reasoningFields||RSN_F)){if(dl[f]){if(!pendingReq.reasoningStart)pendingReq.reasoningStart=Date.now();pendingReq.reasoning+=dl[f];break}}}catch(e){}}scheduleStreamUpdate();if(pendingReq.content.length-lastStreamSaveLen>=500){lastStreamSaveLen=pendingReq.content.length;if(mi>=0){chatData.messages[mi].content=pendingReq.content;if(pendingReq.reasoning)chatData.messages[mi].reasoning=pendingReq.reasoning;saveChat()}}}}else{const data=await resp.json();if(data.error)throw new Error(data.error.message);pendingReq.content=data.choices?.[0]?.message?.content||'';for(const f of(cfg.reasoningFields||RSN_F)){if(data.choices?.[0]?.message?.[f]){pendingReq.reasoning=data.choices[0].message[f];break}}}if(!pendingReq.content?.trim()){if(mi>=0)chatData.messages[mi].error='AI返回空内容';pendingReq.status='failed'}else pendingReq.status='completed'}catch(e){if(e.name==='AbortError'){pendingReq.content+=(pendingReq.content?'\n\n':'')+'[已停止]';pendingReq.status='stopped'}else{if(pendingReq.content){if(mi>=0)chatData.messages[mi].interrupted=true;pendingReq.status='stopped';toast('⚠️ 中断: '+e.message)}else{if(mi>=0)chatData.messages[mi].error=e.message;pendingReq.status='failed';toast('❌ '+e.message)}}}finally{try{await finalizeChatReq()}catch(fe){console.warn('finalizeChatReq error',fe)}pendingReq=null;updateStopBar()}}

//== buildChatContext ==//
function buildChatContext(ctxIdx){const msgs=[];msgs.push({role:'system',content:getSystemPrompt()});msgs.push({role:'system',content:generateTaskPanorama()});const sch=getCurSchedule();if(sch){msgs.push({role:'system',content:generateCourseOverview(sch)});let wt='';for(let w=0;w<(cfg.chatWeeks||1);w++)wt+=generateWeekScheduleText(addDays(new Date(),w*7),sch)+'\n';msgs.push({role:'system',content:wt})}const ul=(chatData.changeLog||[]).filter(l=>!l.coveredBy);if(ul.length)msgs.push({role:'system',content:'【操作记录】\n'+ul.slice(-50).map(l=>fmtTime(l.time)+' '+l.detail).join('\n')});const coveredMsgIds=new Set(),coveredDayIds=new Set(),coveredWeekIds=new Set();chatData.summaries.filter(s=>s.level==='day').forEach(s=>(s.msgIds||[]).forEach(id=>coveredMsgIds.add(id)));chatData.summaries.filter(s=>s.level==='week').forEach(s=>(s.sourceIds||[]).forEach(id=>coveredDayIds.add(id)));chatData.summaries.filter(s=>s.level==='month').forEach(s=>(s.sourceIds||[]).forEach(id=>coveredWeekIds.add(id)));const mS=chatData.summaries.filter(s=>s.level==='month').sort((a,b)=>a.dateKey.localeCompare(b.dateKey));const wS=chatData.summaries.filter(s=>s.level==='week'&&!coveredWeekIds.has(s.id)).sort((a,b)=>a.dateKey.localeCompare(b.dateKey));const dS=chatData.summaries.filter(s=>s.level==='day'&&!coveredDayIds.has(s.id)).sort((a,b)=>a.dateKey.localeCompare(b.dateKey));if(mS.length)msgs.push({role:'system',content:'【月记忆】\n'+mS.map(s=>s.dateKey+': '+s.content).join('\n\n')});if(wS.length)msgs.push({role:'system',content:'【周记忆】\n'+wS.map(s=>s.dateKey+': '+s.content).join('\n\n')});if(dS.length)msgs.push({role:'system',content:'【日记忆】\n'+dS.map(s=>s.dateKey+': '+s.content).join('\n\n')});let lastTs=null,lastDateStr=null;chatData.messages.forEach((m,i)=>{if(i>ctxIdx||coveredMsgIds.has(m.id)||m.error)return;let ct=m.content||'';if(cfg.parseContentTags&&m.role==='assistant')ct=stripContentTags(ct);const curTs=m.timestamp?new Date(m.timestamp):null;let prefix='';if(curTs){const curDateStr=fmtDate(curTs);const hh=String(curTs.getHours()).padStart(2,'0'),mm=String(curTs.getMinutes()).padStart(2,'0');const timeStr=lastDateStr&&curDateStr===lastDateStr?hh+':'+mm:(curTs.getMonth()+1)+'/'+curTs.getDate()+' '+hh+':'+mm;let gapStr='';if(lastTs){const gapMs=curTs-lastTs,gapMin=Math.floor(gapMs/6e4);if(gapMin>=10){if(gapMin<60)gapStr=' ⏱'+gapMin+'m';else{const gh=Math.floor(gapMin/60),gm=gapMin%60;if(gh<24)gapStr=' ⏱'+gh+'h'+(gm?gm+'m':'');else{const gd=Math.floor(gh/24),grh=gh%24;gapStr=' ⏱'+gd+'d'+(grh?grh+'h':'')}}}}prefix='['+timeStr+gapStr+'] ';lastDateStr=curDateStr}lastTs=curTs;msgs.push({role:m.role,content:prefix+ct})});return msgs}

//== getSystemPrompt ==//
function getSystemPrompt(){const d=new Date(),sch=getCurSchedule(),wn=getWeekNumber(d),tw=sch?sch.totalWeeks:null;const timeStr=String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');const availTags=(cfg.taskTags||[]).join('、');let p=`你是用户的日程助手。简洁直接像朋友聊天。给建议具体到时间段。

⚠️ 重要规则：
- 你必须且只能通过指令标记来操作任务/计划/记忆/课程
- 仅在回复中说"已添加""已完成"是无效的，系统只识别指令格式
- 每次操作都必须在回复末尾附带对应指令，否则不会执行
- 增删任务和计划前先和用户确认，得到确认后才附指令
- 完成任务可以直接执行（用户说"搞定了"就是确认）
- 添加有明确时间安排的任务时，建议在task:add中带date/start/end参数，系统会自动创建计划并关联，无需再单独发plan:add

⚠️ 数据准确性：
- 【今日课表】【今日待办】【周期任务】等方括号段落是系统实时生成的最新数据，以此为准
- 历史对话和摘要中提到的任务状态可能已过时（用户频繁增删改任务）
- 当前数据和历史记忆冲突时，以当前数据为准

任务指令：
<<task:add|title:名|type:once|deadline:YYYY-MM-DD|priority:high|tag:标签|detail:详情|date:YYYY-MM-DD|start:14:00|end:16:00>>
带date+start+end会自动创建计划并关联，无需再单独发plan:add。
<<task:add|title:名|type:cycle|cycle:daily:1|priority:mid|tag:标签>>
<<task:add|title:名|type:cycle|cycle:weekly:1,4|priority:mid>>
<<task:add|title:名|type:cycle|cycle:monthly:15|priority:mid>>
<<task:add|title:名|type:long|priority:low|tag:标签>>
<<task:done|title:名>><<task:del|title:名>>
可用标签: ${availTags||'无'}

子任务指令（仅长期任务）：
<<task:sub_add|title:父任务名|sub:子任务名|detail:子任务详情>>
<<task:sub_done|title:父任务名|sub:子任务名>>
<<task:sub_del|title:父任务名|sub:子任务名>>

计划指令(单次推荐date)：
<<plan:add|title:名|date:YYYY-MM-DD|start:14:00|end:17:00|detail:详情>>
<<plan:add|title:名|day:3|start:14:00|end:17:00|startWeek:3|endWeek:10>>
<<plan:del|title:名|date:YYYY-MM-DD|start:14:00>>

课程指令（正式课程，非自由计划）：
<<course:add|name:课名|day:3|startNode:3|step:2|room:教室|teacher:老师|startWeek:1|endWeek:16|color:#2196f3>>
也可用时间代替节次: <<course:add|name:课名|day:3|start:10:00|end:11:45|room:教室|teacher:老师|startWeek:1|endWeek:16>>
<<course:del|name:课名|day:3|startNode:3>>

记忆指令：
<<memory:add|title:标题|content:内容|category:偏好|tags:标签1,标签2>>
category可选: 偏好/个人信息/规则/备忘(默认)
<<memory:del|content:关键词>>
<<memory:edit|find:关键词|content:新内容|title:新标题>>

指令对用户不可见，不要提及指令格式。一条回复可附多条指令。

今天${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日 ${fmtWeekday(getWeekday(d))}${wn?'第'+wn+'周':''}${tw?'/'+tw+'周':''} ${timeStr}`;if(chatData.memory?.length){p+='\n\n【长期记忆】';const byCat={};chatData.memory.forEach(m=>{const cat=m.category||'备忘';if(!byCat[cat])byCat[cat]=[];byCat[cat].push(m)});MEM_CATS.forEach(cat=>{if(byCat[cat]?.length){p+='\n['+cat+']';byCat[cat].forEach(m=>{p+='\n- '+(m.title?m.title+': ':'')+m.content+(m.tags?.length?' ['+m.tags.join(',')+']':'')})}})}return p}

//== generateTaskPanorama ==//
function generateTaskPanorama(){const today=new Date(),ts=fmtDate(today),sch=getCurSchedule();let out='';const lastU=chatData.messages.filter(m=>m.role==='user').pop();const lastD=lastU?fmtDate(new Date(lastU.timestamp)):null;if(lastD&&lastD!==ts){out+='【新一天 '+fmtDateCN(today)+'】\n';const ydStr=fmtDate(addDays(today,-1));const ydH=(historyCache[ydStr.substring(0,7)]?.records||[]).filter(r=>r.doneAt&&fmtDate(new Date(r.doneAt))===ydStr);if(ydH.length){const done=ydH.filter(r=>!r.skipped).map(r=>r.title),skip=ydH.filter(r=>r.skipped).map(r=>r.title);if(done.length)out+='昨完成: '+done.join('、')+'\n';if(skip.length)out+='昨跳过: '+skip.join('、')+'\n'}out+='\n'}if(sch){const entries=getEntriesForDate(today);out+='【今日课表】\n';if(entries.length){let le=null;entries.forEach(e=>{const t=getEntryTime(e,sch);if(le&&t.start>le)out+='  空闲'+le+'-'+t.start+'\n';out+=t.start+'-'+t.end+' '+getEntryTitle(e,sch)+(e.room?' ('+e.room+')':'')+'\n';le=t.end})}else out+='无课\n';out+='\n'}const od=getOverdueTasks();if(od.length){out+='【逾期】⚠️ ('+od.length+'项)\n';od.forEach(t=>{const days=overdueDays(t);out+='❌ '+t.title+(t.tag?' ['+t.tag+']':'')+' ⚠️逾期'+days+'天'+(t.deadline?' (截止'+t.deadline+')':'')+(t.nextDue?' (应于'+t.nextDue+')':'')+' ['+priLabel(t.priority)+']\n';if(t.note)out+='  详情: '+t.note+'\n'});out+='\n'}const tt=getTodayTaskList();if(tt.length){out+='【今日待办】('+tt.length+'项)\n';tt.forEach(t=>{let info='';if(t.type==='cycle')info+=' ['+cycleLabel(t.cycle)+', 下次:'+(t.nextDue||'?')+']';if(t.type==='once'&&t.deadlineTime)info+=' '+t.deadlineTime+'前';out+='⬜ '+t.title+(t.tag?' ['+t.tag+']':'')+info+' ['+priLabel(t.priority)+']\n';if(t.note)out+='  详情: '+t.note+'\n'});out+='\n'}const up=getUpcomingTasks(7);if(up.length){out+='【近期7天】\n';up.forEach(i=>{out+=i.dateStr+' ⬜ '+i.title+(i.tag?' ['+i.tag+']':'')+'\n'});out+='\n'}const shownIds=new Set([...od.map(t=>t.id),...tt.map(t=>t.id)]);const otherCycle=tasks.filter(t=>t.type==='cycle'&&t.status==='active'&&!shownIds.has(t.id));if(otherCycle.length){out+='【周期任务】\n';otherCycle.forEach(t=>{out+='⬜ '+t.title+(t.tag?' ['+t.tag+']':'')+' ['+cycleLabel(t.cycle)+', 下次:'+(t.nextDue||'?')+'] ['+priLabel(t.priority)+']\n'});out+='\n'}const lt=tasks.filter(t=>t.type==='long'&&t.status==='active');if(lt.length){out+='【长期】\n';lt.forEach(t=>{const dn=(t.subtasks||[]).filter(s=>s.done).length,tl=(t.subtasks||[]).length;out+='📌 '+t.title+(t.tag?' ['+t.tag+']':'')+(tl?' ['+dn+'/'+tl+']':'')+'\n';if(t.note)out+='  详情: '+t.note+'\n';if(tl)(t.subtasks||[]).forEach(s=>{out+='  '+(s.done?'✅':'⬜')+' '+s.title+(s.detail?' | '+s.detail:'')+'\n'})})}return out||'（暂无）'}

//== generateCourseOverview ==//
function generateCourseOverview(sch){if(!sch?.entries?.length)return'';let out='【课程一览】\n';const cm={};sch.entries.forEach(e=>{const t=getEntryTitle(e,sch),tm=getEntryTime(e,sch);if(!cm[t])cm[t]=[];cm[t].push(fmtWeekday(e.day)+tm.start+'-'+tm.end+'第'+e.startWeek+'-'+e.endWeek+'周')});Object.entries(cm).forEach(([n,s])=>{out+=n+': '+s.join(' / ')+'\n'});return out}

//== generateWeekScheduleText ==//
function generateWeekScheduleText(date,sch){const mon=getMonday(date),wn=getWeekNumber(mon);let out='【第'+(wn||'?')+'周】\n';for(let d=0;d<7;d++){const dt=addDays(mon,d),entries=getEntriesForDate(dt);out+=fmtWeekday(d+1)+(isSameDate(dt,new Date())?' (今)':'')+': '+(entries.length?entries.map(e=>{const t=getEntryTime(e,sch);return t.start+'-'+t.end+' '+getEntryTitle(e,sch)}).join(', '):'空')+'\n'}return out}

//== getUncoveredMsgs ==//
function getUncoveredMsgs(){if(!chatData.summaries.length)return[...chatData.messages];const coveredIds=new Set();chatData.summaries.filter(s=>s.level==='day').forEach(s=>{(s.msgIds||[]).forEach(id=>coveredIds.add(id))});return chatData.messages.filter(m=>!coveredIds.has(m.id))}

//== matchSubByTitle ==//
function matchSubByTitle(subtasks,title){if(!title||!subtasks?.length)return null;const tl=title.toLowerCase().trim();return subtasks.find(s=>s.title===title)||subtasks.find(s=>s.title.toLowerCase()===tl)||subtasks.find(s=>s.title.toLowerCase().includes(tl))||subtasks.find(s=>tl.includes(s.title.toLowerCase()))||null}

//== parseAndExecuteCommands ==//
function parseAndExecuteCommands(content){if(!content)return[];const normalized=content.replace(/｜/g,'|');const rx=/<<\s*(task|plan|memory|course)\s*:\s*(add|done|del|edit|sub_add|sub_done|sub_del)\s*\|(.+?)>>/gi;let m;const results=[];while((m=rx.exec(normalized))!==null){const type=m[1].toLowerCase(),action=m[2].toLowerCase(),params=parseParams(m[3]);let r;if(type==='task')r=executeTaskCmd(action,params);else if(type==='plan')r=executePlanCmd(action,params);else if(type==='memory')r=executeMemoryCmd(action,params);else if(type==='course')r=executeCourseCmd(action,params);if(r)results.push(r)}results.forEach(r=>{if(r.success)toast('✓ '+r.msg);else if(r.msg)toast('⚠️ '+r.msg)});return results}

//== parseParams ==//
function parseParams(str){const params={};let lk='';str.replace(/｜/g,'|').split('|').forEach(p=>{p=p.trim();if(!p)return;const idx=p.indexOf(':');if(idx>0){const key=p.substring(0,idx).trim().toLowerCase();let val=p.substring(idx+1).trim();if((val.startsWith('"')&&val.endsWith('"'))||(val.startsWith("'")&&val.endsWith("'")))val=val.slice(1,-1);params[key]=val;lk=key}else if(lk){params[lk]+='|'+p}});return params}

//== executeTaskCmd ==//
function executeTaskCmd(action,params){if(action==='add'){const t={id:gid2(),title:params.title||'未命名',type:params.type||'once',priority:params.priority||'mid',note:params.detail||params.note||'',tag:params.tag||'',status:'active',createdAt:new Date().toISOString(),completedAt:null};if(t.type==='once')t.deadline=params.deadline||null;if(t.type==='cycle'){t.cycle=parseCycleStr(params.cycle||'daily:1');t.lastDone=null;t.nextDue=calcNextDue(t)}if(t.type==='long')t.subtasks=[];tasks.push(t);saveTasks();let msg='添加: '+t.title;if(params.date&&params.start&&params.end){const pr=executePlanCmd('add',{title:t.title,date:params.date,start:params.start,end:params.end,detail:params.detail||''});const sch=getCurSchedule();if(sch){const pe=(sch.entries||[]).slice(-1)[0];if(pe&&pe.title===t.title)pe.taskId=t.id}if(pr?.success)msg+=' +计划'}return{success:true,msg}}if(action==='done'){const t=matchTaskByTitle(params.title);if(t){toggleTaskDone(t.id);return{success:true,msg:'完成: '+t.title}}return{success:false,msg:'未找到: '+params.title}}if(action==='del'){const t=matchTaskByTitle(params.title);if(t){tasks=tasks.filter(x=>x.id!==t.id);saveTasks();return{success:true,msg:'删除: '+t.title}}return{success:false,msg:'未找到: '+params.title}}if(action==='sub_add'){const t=matchTaskByTitle(params.title);if(!t)return{success:false,msg:'未找到: '+params.title};if(t.type!=='long')return{success:false,msg:t.title+'不是长期任务'};if(!t.subtasks)t.subtasks=[];t.subtasks.push({id:gid2(),title:params.sub||'未命名',detail:params.detail||'',done:false});saveTasks();return{success:true,msg:'子任务+: '+params.sub}}if(action==='sub_done'){const t=matchTaskByTitle(params.title);if(!t)return{success:false,msg:'未找到: '+params.title};const s=matchSubByTitle(t.subtasks,params.sub);if(!s)return{success:false,msg:'子任务未找到: '+params.sub};s.done=true;saveTasks();return{success:true,msg:'子任务✓: '+s.title}}if(action==='sub_del'){const t=matchTaskByTitle(params.title);if(!t)return{success:false,msg:'未找到: '+params.title};const s=matchSubByTitle(t.subtasks,params.sub);if(!s)return{success:false,msg:'子任务未找到: '+params.sub};t.subtasks=t.subtasks.filter(x=>x.id!==s.id);saveTasks();return{success:true,msg:'子任务删: '+s.title}}return{success:false,msg:'未知操作'}}

//== executePlanCmd ==//
function executePlanCmd(action,params){const sch=getCurSchedule();if(!sch)return{success:false,msg:'无课表'};if(action==='add'){const entry={eid:'e_'+gid2(),title:params.title||'未命名',detail:params.detail||'',source:'manual',foreground:false};if(params.date){const d=parseDate(params.date);entry.day=getWeekday(d);const wn=getWeekNumber(d);if(wn){entry.startWeek=wn;entry.endWeek=wn}}else{entry.day=parseInt(params.day)||1;entry.startWeek=parseInt(params.startweek||params.startWeek)||1;entry.endWeek=parseInt(params.endweek||params.endWeek||params.startweek||params.startWeek)||entry.startWeek}entry.startTime=params.start||'14:00';entry.endTime=params.end||'16:00';if(params.taskid||params.taskId){const t=matchTaskByTitle(params.taskid||params.taskId);if(t){entry.taskId=t.id;entry.scheduleId=schedulesData.current}}if(!sch.entries)sch.entries=[];sch.entries.push(entry);saveSchedules();return{success:true,msg:'计划: '+entry.title}}if(action==='del'){let day=params.day?parseInt(params.day):null;if(!day&&params.date)day=getWeekday(parseDate(params.date));const idx=(sch.entries||[]).findIndex(e=>{const t=getEntryTitle(e,sch);return t.toLowerCase().includes((params.title||'').toLowerCase())&&(!day||e.day===day)});if(idx>=0){const rm=getEntryTitle(sch.entries[idx],sch);sch.entries.splice(idx,1);saveSchedules();return{success:true,msg:'删除: '+rm}}return{success:false,msg:'未找到: '+params.title}}return{success:false,msg:'未知操作'}}

//== executeCourseCmd ==//
function executeCourseCmd(action,params){const sch=getCurSchedule();if(!sch)return{success:false,msg:'无课表'};if(action==='add'){const name=params.name||params.title||'未命名';let course=sch.courses.find(c=>c.name===name);if(!course){const maxId=sch.courses.length?Math.max(...sch.courses.map(c=>c.id))+1:0;const color=params.color||randCourseColor();course={id:maxId,name,color,credit:0,note:''};sch.courses.push(course)}const entry={eid:'e_'+gid2(),courseId:course.id,day:parseInt(params.day)||1,startWeek:parseInt(params.startweek||params.startWeek)||1,endWeek:parseInt(params.endweek||params.endWeek)||sch.totalWeeks||16,room:params.room||'',teacher:params.teacher||'',source:'added',foreground:false};if(params.start&&params.end){entry.startTime=params.start;entry.endTime=params.end;let sn=0,step=2;const sMins=timeToMinutes(params.start),eMins=timeToMinutes(params.end);for(const ts of sch.timeSlots){if(Math.abs(timeToMinutes(ts.start)-sMins)<15){sn=ts.node;break}}if(sn){let eNode=sn;for(const ts of sch.timeSlots){if(ts.node>=sn&&timeToMinutes(ts.end)<=eMins+15)eNode=ts.node}step=Math.max(1,eNode-sn+1)}else{step=Math.max(1,Math.round((eMins-sMins)/50))}entry.startNode=sn||1;entry.step=step}else{entry.startNode=parseInt(params.startnode||params.startNode)||1;entry.step=parseInt(params.step)||2}if(!sch.entries)sch.entries=[];sch.entries.push(entry);logChange('course_add','添加课程: '+name+' '+fmtWeekday(entry.day));saveSchedules();return{success:true,msg:'课程: '+name+' '+fmtWeekday(entry.day)}}if(action==='del'){const name=(params.name||params.title||'').toLowerCase();const day=params.day?parseInt(params.day):null;let sn=parseInt(params.startnode||params.startNode)||0;if(!sn&&params.start){const mins=timeToMinutes(params.start);for(const ts of sch.timeSlots){if(Math.abs(timeToMinutes(ts.start)-mins)<15){sn=ts.node;break}}}const idx=(sch.entries||[]).findIndex(e=>{const t=getEntryTitle(e,sch).toLowerCase();return t.includes(name)&&(!day||e.day===day)&&(!sn||e.startNode===sn)});if(idx>=0){const rm=getEntryTitle(sch.entries[idx],sch);sch.entries.splice(idx,1);logChange('course_del','删除课程排课: '+rm);saveSchedules();return{success:true,msg:'删除: '+rm}}return{success:false,msg:'未找到: '+params.name}}return{success:false,msg:'未知操作'}}

//== randCourseColor ==//
function randCourseColor(){const colors=['#ff1744','#2979ff','#1de9b6','#a375ff','#ff9100','#ff3d00','#2196f3','#005caf','#fa6278'];return colors[Math.floor(Math.random()*colors.length)]}

//== executeMemoryCmd ==//
function executeMemoryCmd(action,params){if(!chatData.memory)chatData.memory=[];if(!chatData.memoryTrash)chatData.memoryTrash=[];if(action==='add'){const content=params.content;if(!content)return{success:false,msg:'内容为空'};const tags=(params.tags||'').split(',').map(s=>s.trim()).filter(s=>s);const cat=MEM_CATS.includes(params.category)?params.category:'备忘';chatData.memory.push({id:'mem_'+gid2(),title:params.title||'',content,category:cat,tags,createdAt:new Date().toISOString(),source:'ai'});saveChat();return{success:true,msg:'记住: '+content.substring(0,30)}}if(action==='del'){const kw=(params.content||'').toLowerCase();const idx=chatData.memory.findIndex(m=>m.content.toLowerCase().includes(kw));if(idx>=0){const rm=chatData.memory[idx];chatData.memoryTrash.push({...rm,deletedAt:new Date().toISOString(),action:'deleted'});if(chatData.memoryTrash.length>50)chatData.memoryTrash=chatData.memoryTrash.slice(-50);chatData.memory.splice(idx,1);saveChat();return{success:true,msg:'忘记: '+rm.content.substring(0,30)}}return{success:false,msg:'未找到: '+params.content}}if(action==='edit'){const kw=(params.find||'').toLowerCase();if(!kw)return{success:false,msg:'缺少find参数'};const idx=chatData.memory.findIndex(m=>m.content.toLowerCase().includes(kw));if(idx>=0){const old={...chatData.memory[idx]};chatData.memoryTrash.push({...old,deletedAt:new Date().toISOString(),action:'edited'});if(chatData.memoryTrash.length>50)chatData.memoryTrash=chatData.memoryTrash.slice(-50);chatData.memory[idx].content=params.content||'';if(params.title!==undefined)chatData.memory[idx].title=params.title;chatData.memory[idx].updatedAt=new Date().toISOString();saveChat();return{success:true,msg:'更新: '+(params.content||'').substring(0,30)}}return{success:false,msg:'未找到: '+params.find}}return{success:false,msg:'未知操作'}}

//== parseCycleStr ==//
function parseCycleStr(s){if(!s)return{mode:'daily',interval:1};if(s.startsWith('daily'))return{mode:'daily',interval:parseInt(s.split(':')[1])||1};if(s.startsWith('weekly')){const ds=(s.split(':')[1]||'1').split(',').map(d=>parseInt(d)).filter(d=>d>=1&&d<=7);return{mode:'weekly',interval:1,weekdays:ds.length?ds:[1]}}if(s.startsWith('monthly'))return{mode:'monthly',day:parseInt(s.split(':')[1])||1};return{mode:'daily',interval:parseInt(s)||1}}

//== matchTaskByTitle ==//
function matchTaskByTitle(title){if(!title)return null;const tl=title.toLowerCase().trim();const act=tasks.filter(t=>t.status==='active');return act.find(t=>t.title===title)||act.find(t=>t.title.toLowerCase()===tl)||act.find(t=>t.title.toLowerCase().includes(tl))||act.find(t=>tl.includes(t.title.toLowerCase()))||null}

//== stripCommands ==//
function stripCommands(text){return text?text.replace(/<<\s*(task|plan|memory|course)\s*:\s*(add|done|del|edit|sub_add|sub_done|sub_del)\s*\|.+?>>/gi,'').replace(/\n{3,}/g,'\n\n').trim():text}

//== checkAndSummarize ==//
async function checkAndSummarize(){try{const today=new Date(),queue=[];const lvl=SUM_LEVELS[cfg.summaryLevel||'normal']||SUM_LEVELS.normal;const byDay=groupMessagesByDay();Object.entries(byDay).forEach(([ds,ms])=>{if(daysBetween(parseDate(ds),today)>lvl.day&&!chatData.summaries.find(s=>s.level==='day'&&s.dateKey===ds)&&!recentlyFailed('day:'+ds))queue.push({type:'day',key:ds,msgs:ms})});const daySums=chatData.summaries.filter(s=>s.level==='day');const byWeek={};daySums.forEach(s=>{const wk=getWeekKeyFromDate(s.dateKey);if(!byWeek[wk])byWeek[wk]=[];byWeek[wk].push(s)});Object.entries(byWeek).forEach(([wk,sums])=>{const newest=sums.reduce((m,s)=>s.dateKey>m?s.dateKey:m,'');if(daysBetween(parseDate(newest),today)>lvl.week&&!chatData.summaries.find(s=>s.level==='week'&&s.dateKey===wk)&&!recentlyFailed('week:'+wk))queue.push({type:'week',key:wk,sources:sums})});const weekSums=chatData.summaries.filter(s=>s.level==='week');const byMonth={};weekSums.forEach(s=>{const mk=s.dateKey.substring(0,7);if(!byMonth[mk])byMonth[mk]=[];byMonth[mk].push(s)});Object.entries(byMonth).forEach(([mk,sums])=>{const newest=sums.reduce((m,s)=>s.dateKey>m?s.dateKey:m,'');if(newest&&daysBetween(parseDate(newest.length>=10?newest:newest+'-28'),today)>lvl.month&&!chatData.summaries.find(s=>s.level==='month'&&s.dateKey===mk)&&!recentlyFailed('month:'+mk))queue.push({type:'month',key:mk,sources:sums})});const batch=queue.slice(0,3);if(!batch.length)return;toast('📝 整理记忆...');for(const job of batch){try{if(job.type==='day')await generateDaySummary(job.key,job.msgs);else if(job.type==='week')await mergeWeekSummary(job.key,job.sources);else if(job.type==='month')await mergeMonthSummary(job.key,job.sources)}catch(e){addSummaryFail(job.type+':'+job.key,e.message);toast('⚠️ 摘要失败: '+e.message)}}await saveChat()}catch(e){console.warn('摘要检查失败',e)}}

//== generateDaySummary ==//
async function generateDaySummary(dateStr,msgs){const logs=(chatData.changeLog||[]).filter(l=>!l.coveredBy&&fmtDate(new Date(l.time))===dateStr);let bg='你在帮用户整理日程对话记忆。\n';if(chatData.memory?.length){bg+='用户记忆摘要：\n';chatData.memory.slice(0,5).forEach(m=>{bg+='- '+m.content+'\n'})}const dayTasks=tasks.filter(t=>t.status==='active').map(t=>t.title);if(dayTasks.length)bg+='当时活跃任务：'+dayTasks.join('、')+'\n';bg+='\n';let content=bg+'请总结以下对话和操作（800字以内）。\n保留：偏好、决定、结论、习惯。压缩：重复、寒暄。\n日期：'+dateStr+'\n\n--- 对话 ---\n';msgs.forEach(m=>{content+=m.role+': '+(m.content||'').substring(0,3000)+'\n'});if(logs.length){content+='\n--- 操作 ---\n';logs.forEach(l=>{content+=l.detail+'\n'})}const result=await buildSummaryRequest(content);const sum={id:'sum_'+gid2(),level:'day',dateKey:dateStr,content:result,msgIds:msgs.map(m=>m.id),createdAt:new Date().toISOString()};chatData.summaries.push(sum);logs.forEach(l=>{l.coveredBy=sum.id})}

//== mergeWeekSummary ==//
async function mergeWeekSummary(weekKey,sources){let content='请合并以下日摘要为周摘要（1200字以内）。保留重要信息。\n周：'+weekKey+'\n\n';sources.forEach(s=>{content+=s.dateKey+': '+s.content+'\n\n'});const result=await buildSummaryRequest(content);chatData.summaries.push({id:'sum_'+gid2(),level:'week',dateKey:weekKey,content:result,sourceIds:sources.map(s=>s.id),createdAt:new Date().toISOString()})}

//== mergeMonthSummary ==//
async function mergeMonthSummary(monthKey,sources){let content='请合并以下周摘要为月摘要（2000字以内）。\n月：'+monthKey+'\n\n';sources.forEach(s=>{content+=s.dateKey+': '+s.content+'\n\n'});const result=await buildSummaryRequest(content);chatData.summaries.push({id:'sum_'+gid2(),level:'month',dateKey:monthKey,content:result,sourceIds:sources.map(s=>s.id),createdAt:new Date().toISOString()})}

//== buildSummaryRequest ==//
async function buildSummaryRequest(content){const aid=cfg.summaryApiId||curApiId,mdl=cfg.summaryModel||curModel;const ac=apiConfigs.find(c=>c.id===aid);if(!ac)throw new Error('未配置摘要模型');const resp=await fetch(fixApiUrl(ac.url),{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+ac.key},body:JSON.stringify({model:mdl,messages:[{role:'user',content}],stream:false})});if(!resp.ok)throw new Error('HTTP '+resp.status);const data=await resp.json();if(data.error)throw new Error(data.error.message);return data.choices?.[0]?.message?.content||''}

//== groupMessagesByDay ==//
function groupMessagesByDay(){const g={};chatData.messages.forEach(m=>{const ds=fmtDate(new Date(m.timestamp));if(!g[ds])g[ds]=[];g[ds].push(m)});return g}

//== getWeekKeyFromDate ==//
function getWeekKeyFromDate(dateStr){return fmtDate(getMonday(parseDate(dateStr)))+'-W'}

//== recentlyFailed ==//
function recentlyFailed(key){const log=getSummaryFailLog();const r=log.find(l=>l.target===key);return r&&Date.now()-new Date(r.time).getTime()<36e5}

//== getSummaryFailLog ==//
function getSummaryFailLog(){try{return JSON.parse(localStorage.getItem('sumFailLog')||'[]')}catch(e){return[]}}

//== addSummaryFail ==//
function addSummaryFail(target,error){const log=getSummaryFailLog();log.unshift({time:new Date().toISOString(),target,error});if(log.length>20)log.length=20;localStorage.setItem('sumFailLog',JSON.stringify(log))}

//== addTaskTag ==//
function addTaskTag(){const inp=document.getElementById('newTagIn');const v=inp?.value?.trim();if(!v){toast('请输入标签名');return}if(!cfg.taskTags)cfg.taskTags=[];if(cfg.taskTags.includes(v)){toast('已存在');return}cfg.taskTags.push(v);saveCfg();renderSettings();toast('✓')}

//== delTaskTag ==//
function delTaskTag(i){if(!cfg.taskTags)return;cfg.taskTags.splice(i,1);saveCfg();renderSettings();toast('✓')}

//== setMemCatFilter ==//
function setMemCatFilter(cat){memCatFilter=cat;document.querySelectorAll('#memCatTabs .cat-tab').forEach(el=>{el.classList.toggle('active',el.textContent===(cat||'全部'))});renderMemList()}

//== renderMemList ==//
function renderMemList(){const el=document.getElementById('memMgrList');if(!el)return;const kw=(document.getElementById('memSrIn')?.value||'').trim().toLowerCase();const mem=chatData.memory||[];el.innerHTML=mem.map((m,i)=>{if(kw&&!m.content.toLowerCase().includes(kw)&&!(m.title||'').toLowerCase().includes(kw))return'';if(memCatFilter&&(m.category||'备忘')!==memCatFilter)return'';return'<div class="mem-item" style="flex-wrap:wrap;cursor:pointer" onclick="editMemoryFull('+i+')"><span class="mem-cat-badge cat-'+(m.category||'备忘')+'">'+(m.category||'备忘')+'</span><div style="flex:1;min-width:0"><div style="font-size:13px;margin-bottom:2px">'+(m.title?'<b>'+esc(m.title)+'</b>: ':'')+esc(m.content)+'</div><div style="display:flex;gap:3px;flex-wrap:wrap">'+(m.tags||[]).map(t=>'<span class="mem-tag">'+esc(t)+'</span>').join('')+'<span style="font-size:9px;color:var(--tx-m)">'+fmtTime(m.createdAt)+' '+(m.source==='ai'?'🤖':'👤')+'</span></div></div><button class="bbn red" onclick="event.stopPropagation();deleteMemoryMgr('+i+')" style="flex-shrink:0">✕</button></div>'}).join('');const cnt=document.getElementById('memCount');if(cnt)cnt.textContent='共 '+mem.length+' 条记忆'}

//== editMemoryFull ==//
function editMemoryFull(i){const m=(chatData.memory||[])[i];if(!m)return;showMo('编辑记忆','<div class="fg"><label>标题</label><input type="text" id="emfTi" value="'+escA(m.title||'')+'"></div><div class="fg"><label>分类</label><select id="emfCat">'+MEM_CATS.map(c=>'<option value="'+c+'"'+((m.category||'备忘')===c?' selected':'')+'>'+c+'</option>').join('')+'</select></div><div class="fg"><label>内容</label><textarea id="emfC" rows="10" style="min-height:200px">'+esc(m.content)+'</textarea></div><div class="fg"><label>标签(逗号分隔)</label><input type="text" id="emfT" value="'+escA((m.tags||[]).join(','))+'"></div><div style="font-size:11px;color:var(--tx-m);margin-top:4px">来源: '+(m.source==='ai'?'🤖AI':'👤 用户')+' · 创建: '+fmtTime(m.createdAt)+(m.updatedAt?' · 更新: '+fmtTime(m.updatedAt):'')+'</div>','<button class="mo-btn sec" onclick="copyText(document.getElementById(\'emfC\').value).then(()=>toast(\'✓\'))">📋复制</button><button class="mo-btn sec" onclick="hideMo()">取消</button><button class="mo-btn pri" onclick="doEditMemFull('+i+')">保存</button>')}

//== doEditMemFull ==//
async function doEditMemFull(i){const m=chatData.memory[i];if(!m)return;m.title=document.getElementById('emfTi').value.trim();m.category=document.getElementById('emfCat').value;m.content=document.getElementById('emfC').value.trim();m.tags=document.getElementById('emfT').value.split(',').map(s=>s.trim()).filter(s=>s);m.updatedAt=new Date().toISOString();await saveChat();hideMo();renderMemList();toast('✓')}

//== deleteMemoryMgr ==//
async function deleteMemoryMgr(i){const rm=chatData.memory[i];if(rm){if(!chatData.memoryTrash)chatData.memoryTrash=[];chatData.memoryTrash.push({...rm,deletedAt:new Date().toISOString(),action:'deleted'});if(chatData.memoryTrash.length>50)chatData.memoryTrash=chatData.memoryTrash.slice(-50)}chatData.memory.splice(i,1);await saveChat();renderMemList();toast('✓')}

//== showMemoryTrash ==//
function showMemoryTrash(){const trash=chatData.memoryTrash||[];if(!trash.length){toast('回收站为空');return}let html='<div style="font-size:12px;color:var(--tx-m);margin-bottom:8px">共 '+trash.length+' 条，最多保留50条</div>';trash.slice().reverse().forEach((m,ri)=>{const i=trash.length-1-ri;html+='<div class="mem-item" style="flex-wrap:wrap"><span style="font-size:9px;padding:1px 5px;border-radius:3px;color:#fff;background:'+(m.action==='edited'?'var(--wn)':'var(--dn)')+'">'+({deleted:'已删',edited:'已改'}[m.action]||'?')+'</span><div style="flex:1;min-width:0"><div style="font-size:12px">'+(m.title?'<b>'+esc(m.title)+'</b>: ':'')+esc(m.content)+'</div><div style="font-size:9px;color:var(--tx-m)">'+fmtTime(m.deletedAt)+'</div></div><button class="bbn" onclick="restoreMemFromTrash('+i+')" style="flex-shrink:0">恢复</button></div>'});showMo('🗑️ 记忆回收站',html,'<button class="mo-btn pri" onclick="hideMo()">关闭</button>')}

//== restoreMemFromTrash ==//
async function restoreMemFromTrash(i){const trash=chatData.memoryTrash||[];if(!trash[i])return;const item=trash[i];const restored={id:item.id||'mem_'+gid2(),title:item.title||'',content:item.content,category:item.category||'备忘',tags:item.tags||[],createdAt:item.createdAt||new Date().toISOString(),source:item.source||'user'};chatData.memory.push(restored);trash.splice(i,1);await saveChat();toast('✓ 已恢复');hideMo();renderMemList()}

//== tglApiExp ==//
function tglApiExp(id){expandedApis[id]=!expandedApis[id];saveLocal();renderSettings()}

//== addMdlTo ==//
function addMdlTo(id){const inp=document.getElementById('nm-'+id);const m=inp?.value?.trim();if(!m)return;const c=apiConfigs.find(x=>x.id===id);if(c&&!c.models.includes(m)){c.models.push(m);saveCfg();renderSettings()}}

//== delMdl ==//
function delMdl(id,m){const c=apiConfigs.find(x=>x.id===id);if(!c)return;c.models=c.models.filter(x=>x!==m);if(curApiId===id&&curModel===m)curModel='';saveCfg();renderSettings()}

//== fetchMdlsFor ==//

async function manualRunSummary(){showMo('摘要执行','<div style="text-align:center;padding:20px"><div id="msS">检查中...</div><div class="prog-bar"><div class="prog-fill" id="msP" style="width:0%"></div></div></div>','');const today=new Date(),queue=[];const lvl=SUM_LEVELS[cfg.summaryLevel||'normal']||SUM_LEVELS.normal;const byDay=groupMessagesByDay();Object.entries(byDay).forEach(([ds,ms])=>{if(daysBetween(parseDate(ds),today)>lvl.day&&!chatData.summaries.find(s=>s.level==='day'&&s.dateKey===ds))queue.push({type:'day',key:ds,msgs:ms})});const daySums=chatData.summaries.filter(s=>s.level==='day');const byWeek={};daySums.forEach(s=>{const wk=getWeekKeyFromDate(s.dateKey);if(!byWeek[wk])byWeek[wk]=[];byWeek[wk].push(s)});Object.entries(byWeek).forEach(([wk,sums])=>{const newest=sums.reduce((m,s)=>s.dateKey>m?s.dateKey:m,'');if(daysBetween(parseDate(newest),today)>lvl.week&&!chatData.summaries.find(s=>s.level==='week'&&s.dateKey===wk))queue.push({type:'week',key:wk,sources:sums})});if(!queue.length){hideMo();toast('无需处理');return}let done=0;for(const job of queue){const s=document.getElementById('msS'),p=document.getElementById('msP');if(s)s.textContent=job.type+': '+job.key+' ('+(done+1)+'/'+queue.length+')';if(p)p.style.width=Math.round(done/queue.length*100)+'%';try{if(job.type==='day')await generateDaySummary(job.key,job.msgs);else if(job.type==='week')await mergeWeekSummary(job.key,job.sources);else if(job.type==='month')await mergeMonthSummary(job.key,job.sources)}catch(e){addSummaryFail(job.type+':'+job.key,e.message)}done++}await saveChat();hideMo();renderSettings();toast('✓ '+done+'项')}

//== parseScheduleData ==//
function parseScheduleData(text){const lines=text.split('\n').filter(l=>l.trim());if(lines.length<5)throw new Error('需要5行数据');const raw={line0:lines[0],line1:lines[1],line2:lines[2],line3:lines[3],line4:lines[4]};let cfg2;try{cfg2=JSON.parse(lines[2])}catch(e){throw new Error('第3行解析失败')}const nodes=cfg2.nodes||12,tw=cfg2.maxWeek||20,sd=cfg2.startDate||fmtDate(new Date());let slots;try{slots=JSON.parse(lines[1]).filter(s=>s.node<=nodes&&s.startTime!=='00:00').map(s=>({node:s.node,start:s.startTime,end:s.endTime}))}catch(e){throw new Error('第2行解析失败')}let courses;try{courses=JSON.parse(lines[3]).map(c=>({id:c.id,name:c.courseName,color:c.color||'#4a9eff',credit:c.credit||0,note:c.note||''}))}catch(e){throw new Error('第4行解析失败')}let entries;try{entries=JSON.parse(lines[4]).map(e=>({eid:'e_'+gid2(),courseId:e.id,day:e.day,startNode:e.startNode,step:e.step||2,startWeek:e.startWeek||1,endWeek:e.endWeek||tw,room:e.room||'',teacher:e.teacher||'',source:'imported',foreground:false}))}catch(e){throw new Error('第5行解析失败')}const sp=sd.split('-');return{id:'',name:'',startDate:sp[0]+'-'+(sp[1]?.padStart(2,'0')||'01')+'-'+(sp[2]?.padStart(2,'0')||'01'),totalWeeks:tw,nodesPerDay:nodes,timeSlots:slots,courses,entries,raw}}

//== rebuildCourseLines ==//
function rebuildCourseLines(sch,entries){const l0=sch.raw?.line0||'{"courseLen":45,"id":1,"name":"默认","sameBreakLen":false,"sameLen":true,"theBreakLen":10}';const l1=sch.raw?.line1||JSON.stringify(sch.timeSlots.map(s=>({endTime:s.end,node:s.node,startTime:s.start,timeTable:1})));let l2Obj;try{l2Obj=sch.raw?.line2?JSON.parse(sch.raw.line2):{}}catch(e){l2Obj={}}l2Obj.startDate=sch.startDate;l2Obj.maxWeek=sch.totalWeeks;l2Obj.nodes=sch.nodesPerDay;const usedCourseIds=new Set();entries.forEach(e=>{if(e.courseId!==undefined)usedCourseIds.add(e.courseId)});const outCourses=sch.courses.filter(c=>usedCourseIds.has(c.id));const l3=JSON.stringify(outCourses.map(c=>({color:c.color,courseName:c.name,credit:c.credit||0,id:c.id,note:c.note||'',tableId:1})));const l4=JSON.stringify(entries.map(e=>{let sn=e.startNode||1,step=e.step||2;if(!e.startNode&&e.startTime){const mins=timeToMinutes(e.startTime);for(const ts of sch.timeSlots)if(Math.abs(timeToMinutes(ts.start)-mins)<15){sn=ts.node;break}step=Math.max(1,Math.round((timeToMinutes(e.endTime)-mins)/50))}return{day:e.day,endWeek:e.endWeek,id:e.courseId!==undefined?e.courseId:0,room:e.room||'',startNode:sn,startWeek:e.startWeek,step,tableId:1,teacher:e.teacher||'',type:0}}));return[l0,l1,JSON.stringify(l2Obj),l3,l4].join('\n')}

//== rebuildScheduleLines ==//
function rebuildScheduleLines(sch,entries){const l0=sch.raw?.line0||'{"courseLen":45,"id":1,"name":"默认"}';const l1=sch.raw?.line1||JSON.stringify(sch.timeSlots.map(s=>({endTime:s.end,node:s.node,startTime:s.start,timeTable:1})));let l2Obj=sch.raw?.line2?JSON.parse(sch.raw.line2):{};l2Obj.startDate=sch.startDate;l2Obj.maxWeek=sch.totalWeeks;l2Obj.nodes=sch.nodesPerDay;const allC=[...sch.courses];let nid=Math.max(0,...allC.map(c=>c.id))+1;const mcm={};entries.filter(e=>e.source==='manual').forEach(e=>{const t=e.title||'未命名';if(!mcm[t]){mcm[t]=nid;allC.push({id:nid,name:t,color:'#607d8b',credit:0,note:''});nid++}});return[l0,l1,JSON.stringify(l2Obj),JSON.stringify(allC.map(c=>({color:c.color,courseName:c.name,credit:c.credit||0,id:c.id,note:c.note||'',tableId:1}))),JSON.stringify(entries.map(e=>{const cid=e.courseId!==undefined?e.courseId:(mcm[e.title]||0);let sn=e.startNode||1,step=e.step||2;if(!e.startNode&&e.startTime){const mins=timeToMinutes(e.startTime);for(const ts of sch.timeSlots)if(Math.abs(timeToMinutes(ts.start)-mins)<15){sn=ts.node;break}step=Math.max(1,Math.round((timeToMinutes(e.endTime)-mins)/50))}return{day:e.day,endTime:e.endTime||'',endWeek:e.endWeek,id:cid,level:0,ownTime:!!e.startTime,room:e.room||'',startNode:sn,startTime:e.startTime||'',startWeek:e.startWeek,step,tableId:1,teacher:e.teacher||'',type:0}}))].join('\n')}

//== fixApiUrl ==//
function fixApiUrl(url){url=url.trim().replace(/\/+$/,'');if(url.endsWith('/chat/completions'))return url;if(url.endsWith('/models'))return url.replace(/\/models$/,'/chat/completions');if(url.match(/\/v\d+$/))return url+'/chat/completions';return url+'/v1/chat/completions'}

//== fixModelsUrl ==//
function fixModelsUrl(url){url=url.trim().replace(/\/+$/,'').replace(/\/chat\/completions\/?$/,'');if(url.endsWith('/models'))return url;if(url.match(/\/v\d+$/))return url+'/models';return url+'/v1/models'}

//== stripContentTags ==//
function stripContentTags(text){if(!text)return'';const tags=cfg.contentTags||['think','thinking'];let r=text;tags.forEach(tag=>{r=r.replace(new RegExp('<'+tag+'>[\\s\\S]*?</'+tag+'>','gi'),'');r=r.replace(new RegExp('<'+tag+'>[\\s\\S]*$','gi'),'')});return r.replace(/^\s+/,'')}

//== renderMd ==//
function renderMd(t){if(!t)return'';let h=esc(t);if(cfg.parseContentTags!==false){const tags=cfg.contentTags||['think','thinking'];const parts=[];let cursor=0,found=true;while(found&&cursor<h.length){found=false;let earliest=-1,eOTag='',eCTag='';for(const tag of tags){const oTag='&lt;'+tag+'&gt;';const idx=h.indexOf(oTag,cursor);if(idx!==-1&&(earliest===-1||idx<earliest)){earliest=idx;eOTag=oTag;eCTag='&lt;/'+tag+'&gt;'}}if(earliest!==-1){found=true;if(earliest>cursor)parts.push({type:'t',content:h.substring(cursor,earliest)});const ci=h.indexOf(eCTag,earliest+eOTag.length);if(ci===-1){parts.push({type:'r',content:h.substring(earliest+eOTag.length)});cursor=h.length}else{parts.push({type:'r',content:h.substring(earliest+eOTag.length,ci)});cursor=ci+eCTag.length}}}if(cursor<h.length)parts.push({type:'t',content:h.substring(cursor)});if(parts.some(p=>p.type==='r')){let out='';parts.forEach(p=>{if(p.type==='r'){const rid='il_'+(_rsnIdCtr++);out+='<div class="rsn-block"><div class="rsn-hdr" onclick="tglRsn(\''+rid+'\')"><span class="arr" id="ra-'+rid+'">▶</span><span>🧠</span></div><div class="rsn-ct" id="rc-'+rid+'">'+p.content+'</div></div>'}else out+=mdFmt(p.content)});return out}}return mdFmt(esc(t))}

//== mdFmt ==//
function mdFmt(s){s=s.replace(/```(\w*)\n([\s\S]*?)```/g,'<pre><code>$2</code></pre>');s=s.replace(/`([^`]+)`/g,'<code>$1</code>');s=s.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');s=s.replace(/^(#{1,6})\s+(.+)\n?/gm,(m,h,t)=>{const sz=['1.25em','1.15em','1.05em','1em','.95em','.9em'];return'<div style="font-weight:700;font-size:'+sz[h.length-1]+';margin:2px 0">'+t+'</div>'});return s.replace(/\n/g,'<br>')}

//== gid2 ==//
function gid2(){return Date.now().toString(36)+Math.random().toString(36).substr(2,6)}

//== esc ==//
function esc(s){return s?String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'):''}

//== escA ==//
function escA(s){return s?String(s).replace(/"/g,'&quot;').replace(/'/g,'&#39;'):''}

//== fmtTime ==//
function fmtTime(iso){return iso?new Date(iso).toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'}):''}

//== fmtDate ==//
function fmtDate(d){const dt=d instanceof Date?d:new Date(d);return dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0')+'-'+String(dt.getDate()).padStart(2,'0')}

//== fmtDateCN ==//
function fmtDateCN(d){const dt=d instanceof Date?d:new Date(d);return(dt.getMonth()+1)+'月'+dt.getDate()+'日'}

//== fmtDateShort ==//
function fmtDateShort(d){const dt=d instanceof Date?d:new Date(d);return(dt.getMonth()+1)+'/'+dt.getDate()}

//== fmtWeekday ==//
function fmtWeekday(n){return['','周一','周二','周三','周四','周五','周六','周日'][n]||''}

//== addDays ==//
function addDays(d,n){const r=new Date(d);r.setDate(r.getDate()+n);return r}

//== isSameDate ==//
function isSameDate(a,b){return a.getFullYear()===b.getFullYear()&&a.getMonth()===b.getMonth()&&a.getDate()===b.getDate()}

//== parseDate ==//
function parseDate(s){if(!s)return new Date();const p=s.split('-');return new Date(parseInt(p[0]),parseInt(p[1])-1,parseInt(p[2]||1))}

//== timeToMinutes ==//
function timeToMinutes(s){if(!s)return 0;const p=s.split(':');return parseInt(p[0])*60+parseInt(p[1]||0)}

//== calcDuration ==//
function calcDuration(start,end){const d=timeToMinutes(end)-timeToMinutes(start);if(d<=0)return'';const h=Math.floor(d/60),m=d%60;return h?h+'h'+(m?m+'m':''):m+'m'}

//== daysBetween ==//
function daysBetween(a,b){return Math.floor(Math.abs(b-a)/864e5)}

//== priLabel ==//
function priLabel(p){return{high:'高',mid:'中',low:'低'}[p]||'中'}

//== cycleLabel ==//
function cycleLabel(c){if(!c)return'';if(c.mode==='daily')return c.interval===1?'每天':'每'+c.interval+'天';if(c.mode==='weekly')return'每周'+(c.weekdays||[]).map(d=>fmtWeekday(d).replace('周','')).join('');if(c.mode==='monthly')return'每月'+c.day+'号';return''}

//== roleIcon ==//
function roleIcon(r){return r==='user'?'👤':r==='system'?'⚙️':'🤖'}

//== copyText ==//
function copyText(text){return navigator.clipboard.writeText(text).catch(()=>{const ta=document.createElement('textarea');ta.value=text;ta.style.cssText='position:fixed;left:-9999px';document.body.appendChild(ta);ta.select();try{document.execCommand('copy')}catch(e){}document.body.removeChild(ta)})}

//== autoRsz ==//
function autoRsz(el){el.style.height='auto';el.style.height=Math.min(el.scrollHeight,isMobile?(kbOn?90:135):120)+'px'}

//== handleKey ==//
function handleKey(e){if((e.ctrlKey||e.metaKey)&&e.key==='Enter'){e.preventDefault();sendChatMsg()}else if(e.shiftKey&&e.key==='Enter'){e.preventDefault();saveChatMsgOnly()}}

//== scrBot ==//
function scrBot(){const c=document.getElementById('aiMsgs');if(c)c.scrollTop=c.scrollHeight}

//== cntTok ==//
function cntTok(t){if(!t)return 0;let tok=0;t.split(/([\u4e00-\u9fff\u3400-\u4dbf]+)/g).forEach(p=>{if(!p)return;if(/[\u4e00-\u9fff]/.test(p))tok+=p.length*2;else p.split(/\s+/).filter(w=>w).forEach(w=>{tok+=w.length<=4?1:w.length<=10?2:Math.ceil(w.length/3)})});return Math.max(1,Math.round(tok))}

//== dl ==//
function dl(n,ct,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([ct],{type}));a.download=n;a.click();URL.revokeObjectURL(a.href)}

//== delay ==//
function delay(ms){return new Promise(r=>setTimeout(r,ms))}

//== showMo ==//
function showMo(t,b,f,cls){moStack=[];document.getElementById('moTitle').textContent=t;document.getElementById('moBody').innerHTML=b;document.getElementById('moFtr').innerHTML=f||'';document.getElementById('moBox').className='mo-box'+(cls?' '+cls:'');document.getElementById('modal').classList.add('show')}

//== hideMo ==//
function hideMo(){moStack=[];document.getElementById('modal').classList.remove('show')}

//== pushMo ==//
function pushMo(t,b,f,cls,refresh){if(document.getElementById('modal').classList.contains('show'))moStack.push({title:document.getElementById('moTitle').textContent,body:document.getElementById('moBody').innerHTML,footer:document.getElementById('moFtr').innerHTML,cls:document.getElementById('moBox').className.replace('mo-box','').trim(),scrollTop:document.getElementById('moBody').scrollTop,refresh});document.getElementById('moTitle').textContent=t;document.getElementById('moBody').innerHTML=b;document.getElementById('moFtr').innerHTML=f||'';document.getElementById('moBox').className='mo-box'+(cls?' '+cls:'');document.getElementById('modal').classList.add('show')}

//== popMo ==//
function popMo(nr){if(!moStack.length){hideMo();return}const p=moStack.pop();if(nr&&p.refresh){const sv=[...moStack];p.refresh();moStack=sv;setTimeout(()=>{document.getElementById('moBody').scrollTop=p.scrollTop},60)}else{document.getElementById('moTitle').textContent=p.title;document.getElementById('moBody').innerHTML=p.body;document.getElementById('moFtr').innerHTML=p.footer;document.getElementById('moBox').className='mo-box'+(p.cls?' '+p.cls:'');setTimeout(()=>{document.getElementById('moBody').scrollTop=p.scrollTop},0)}}

//== moClose ==//
function moClose(){moStack.length?popMo():hideMo()}
document.getElementById('modal').onclick=function(e){if(e.target===this)moClose()};

//== showCtxAt ==//
function showCtxAt(x,y,id,items){const m=document.getElementById(id);m.innerHTML=items;m.style.left=x+'px';m.style.top=y+'px';m.classList.add('show');requestAnimationFrame(()=>{const r=m.getBoundingClientRect();const wmB=wmShift?90:0;if(r.right>window.innerWidth)m.style.left=Math.max(10,window.innerWidth-r.width-10)+'px';if(r.bottom>window.innerHeight-wmB-60)m.style.top=Math.max(10,window.innerHeight-r.height-wmB-60)+'px'})}

//== hideAllCtx ==//
function hideAllCtx(){document.getElementById('ctxMenu').classList.remove('show');ctxCfm=null;clearTimeout(ctxCfmTimer)}

//== toast ==//
function toast(msg){document.querySelectorAll('.toast').forEach(t=>t.remove());const t=document.createElement('div');t.className='toast';t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),2500)}

window.onload=init;
</script>
