<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>代码工作台</title>
<style>
:root{--app-font-size:13px}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Consolas','Courier New','Source Code Pro',monospace;background:#1e1e1e;color:#d4d4d4;height:100dvh;display:flex;flex-direction:column;overflow:hidden}
/*== 顶栏 ==*/
#topBar{background:#252526;border-bottom:1px solid #444;padding:8px 16px;display:flex;align-items:center;gap:12px;min-height:48px;flex-shrink:0;flex-wrap:wrap}
#topBar h1{font-size:15px;font-weight:600;color:#e0e0e0;white-space:nowrap}
.topSpacer{flex:1}
.tbtn{background:#3c3c3c;color:#ccc;border:1px solid #555;border-radius:4px;padding:5px 14px;cursor:pointer;font-size:13px;white-space:nowrap;font-family:inherit}
.tbtn:hover{background:#4c4c4c;color:#fff}
.tbtn.primary{background:#264f78;border-color:#3a7cc8;color:#fff}
.tbtn.primary:hover{background:#305f90}
.tbtn.active{background:#3a7cc8;color:#fff;border-color:#5a9ce8}
.tbtn.green{background:#1e5631;border-color:#2d8a4e;color:#a8e6cf}
.tbtn.green:hover{background:#276e3f}
.tbtn.warn{background:#5c4a1e;border-color:#a88a2d;color:#f0d878}
.tbtn.warn:hover{background:#6e5a28}
.tbtn.danger{background:#5c1e1e;border-color:#a82d2d;color:#f08080}
.tbtn.danger:hover{background:#6e2929}
#navInfo{color:#f0c050;font-size:13px;min-width:70px;text-align:center;white-space:nowrap}
#diffTools{display:none;align-items:center;gap:8px}
label.wsLabel{font-size:13px;cursor:pointer;display:flex;align-items:center;gap:4px;color:#bbb}
label.wsLabel input{accent-color:#3a7cc8}
.mode-tabs{display:flex;gap:4px}
#projInfo{font-size:12px;color:#888;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#projInfo.on{color:#a8e6cf}
#menuBtn{background:#3c3c3c;color:#ccc;border:1px solid #555;border-radius:4px;padding:5px 10px;cursor:pointer;font-size:16px}
#menuBtn:hover{background:#4c4c4c;color:#fff}
/*== 侧边栏基础 ==*/
#sbOverlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:199;opacity:0;transition:opacity .3s}
#sbOverlay.show{display:block;opacity:1}
#sidebar{position:fixed;left:0;top:0;bottom:0;width:280px;max-width:85vw;background:#1e1e1e;border-right:1px solid #444;z-index:200;transform:translateX(-100%);transition:transform .3s ease;display:flex;flex-direction:column;overflow:hidden}
#sidebar.open{transform:translateX(0)}
.sb-head{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid #444;background:#252526}
.sb-head span{flex:1;font-size:15px;font-weight:600;color:#e0e0e0}
.sb-head button{background:none;border:none;color:#888;font-size:18px;cursor:pointer;padding:2px 6px}
.sb-head button:hover{color:#fff}
.sb-ws{padding:8px 14px;border-bottom:1px solid #333;font-size:12px}
.sb-ws .ws-name{color:#a8e6cf;font-weight:600}
.sb-ws button{margin-top:4px;width:100%;padding:6px;background:#264f78;border:1px solid #3a7cc8;border-radius:4px;color:#fff;cursor:pointer;font-size:12px}
.sb-ws button:hover{background:#305f90}
.sb-content{flex:1;overflow-y:auto;padding-bottom:8px}
/*== 侧边栏折叠区 ==*/
.sb-sec{border-bottom:1px solid #333}
.sb-sec-hdr{display:flex;align-items:center;gap:6px;padding:8px 14px;cursor:pointer;font-size:13px;font-weight:600;color:#bbb;user-select:none}
.sb-sec-hdr:hover{background:#2a2a2a;color:#fff}
.sb-sec-hdr .arr{font-size:9px;transition:transform .15s;color:#888}
.sb-sec-hdr .arr.open{transform:rotate(90deg)}
.sb-sec-hdr .s-cnt{color:#777;font-size:11px;font-weight:400;margin-left:auto}
.sb-sec-body{display:none;padding:4px 8px 8px}
.sb-sec-body.show{display:block}
/*== 侧边栏项目列表 ==*/
.sb-proj{padding:6px 10px;border-radius:4px;cursor:pointer;display:flex;align-items:center;gap:6px;margin-bottom:2px;border:1px solid transparent}
.sb-proj:hover{background:#2a2a2a}
.sb-proj.active{background:#264f78;border-color:#3a7cc8;color:#fff}
.sb-proj .p-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.sb-proj .p-dot.on{background:#a8e6cf}
.sb-proj .p-dot.off{background:#555}
.sb-proj .p-main{flex:1;min-width:0}
.sb-proj .p-name{font-size:13px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sb-proj .p-sub{font-size:10px;color:#888;margin-top:1px}
.sb-proj.active .p-sub{color:rgba(255,255,255,.6)}
.sb-proj .p-acts{display:none;gap:2px;flex-shrink:0}
.sb-proj:hover .p-acts{display:flex}
.sb-proj .p-acts button{background:none;border:1px solid #555;border-radius:3px;color:#aaa;cursor:pointer;font-size:10px;padding:1px 4px}
.sb-proj .p-acts button:hover{background:#444;color:#fff}
/*== 侧边栏版本列表 ==*/
.sb-ver{padding:6px 10px;border-radius:4px;margin-bottom:2px;background:#252526;border:1px solid #333}
.sb-ver:first-child{border-left:2px solid #a8e6cf}
.sb-ver .v-top{display:flex;align-items:center;gap:6px;font-size:12px}
.sb-ver .v-tag{font-weight:600;color:#e0e0e0}
.sb-ver .v-time{color:#777;font-size:10px;margin-left:auto}
.sb-ver .v-note{font-size:10px;color:#999;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sb-ver .v-meta{font-size:10px;color:#666;margin-top:1px}
.sb-ver .v-acts{display:flex;gap:3px;margin-top:4px}
.sb-ver .v-acts button{padding:2px 6px;background:#3c3c3c;border:1px solid #555;border-radius:3px;color:#bbb;cursor:pointer;font-size:10px}
.sb-ver .v-acts button:hover{background:#4c4c4c;color:#fff}
.sb-ver .v-acts button.dn:hover{background:#6e2929;border-color:#f08080;color:#f08080}
/*== 侧边栏修改历史 ==*/
.sb-mod{padding:6px 10px;border-radius:4px;margin-bottom:2px;background:#252526;border:1px solid #333;border-left:2px solid #555}
.sb-mod.ok{border-left-color:#6fcf97}
.sb-mod.err{border-left-color:#f08080}
.sb-mod .m-top{display:flex;align-items:center;gap:6px;font-size:12px}
.sb-mod .m-idx{color:#777;font-size:10px;min-width:18px}
.sb-mod .m-label{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.sb-mod .m-time{color:#777;font-size:10px}
.sb-mod .m-info{font-size:10px;color:#888;margin-top:2px}
.sb-mod .m-acts{display:flex;gap:3px;margin-top:4px}
.sb-mod .m-acts button{padding:2px 6px;background:#3c3c3c;border:1px solid #555;border-radius:3px;color:#bbb;cursor:pointer;font-size:10px}
.sb-mod .m-acts button:hover{background:#4c4c4c;color:#fff}
.sb-add-btn{width:100%;padding:6px;margin-top:4px;background:#252526;border:1px solid #555;border-radius:4px;color:#aaa;cursor:pointer;font-size:12px;text-align:center}
.sb-add-btn:hover{background:#3c3c3c;color:#fff;border-color:#888}
.sb-clear-btn{width:100%;padding:4px;margin-top:4px;background:none;border:1px solid #444;border-radius:4px;color:#777;cursor:pointer;font-size:11px;text-align:center}
.sb-clear-btn:hover{background:#3b1515;color:#f08080;border-color:#f08080}
/*== 侧边栏底部 ==*/
.sb-ftr{padding:8px 14px;border-top:1px solid #444;background:#252526;display:flex;flex-direction:column;gap:4px;flex-shrink:0}
.sb-exp-row{display:flex;gap:4px}
.sb-exp-row button{flex:1;padding:6px 8px;background:#1e5631;border:1px solid #2d8a4e;border-radius:4px;color:#a8e6cf;cursor:pointer;font-size:12px;white-space:nowrap}
.sb-exp-row button:hover{background:#276e3f}
.sb-exp-row button.sec{background:#3c3c3c;border-color:#555;color:#ccc}
.sb-exp-row button.sec:hover{background:#4c4c4c}
/*== 设置弹窗 ==*/
.sp-section{margin-bottom:16px}
.sp-section h4{font-size:13px;font-weight:600;color:#e0e0e0;margin-bottom:8px;padding-bottom:4px;border-bottom:1px solid #444}
.sp-ta{width:100%;min-height:200px;background:#2d2d2d;color:#d4d4d4;border:1px solid #555;border-radius:4px;padding:10px;font-size:13px;font-family:inherit;resize:vertical;line-height:1.5}
.sp-ta:focus{border-color:#3a7cc8;outline:none}
.sp-api-item{padding:6px 10px;background:#252526;border:1px solid #333;border-radius:4px;margin-bottom:3px;font-size:12px;display:flex;align-items:center;gap:6px}
.sp-api-item .api-nm{font-weight:600;color:#a8e6cf;flex:1}
.sp-api-item .api-cnt{color:#888;font-size:10px}
/*== 输入面板 ==*/
#inputView{flex:1;display:flex;flex-direction:column;overflow:hidden;padding:12px 16px}
.inputPanels{flex:1;display:flex;gap:16px;overflow:hidden}
.inputPanel{flex:1;display:flex;flex-direction:column;min-width:0}
.inputPanel .panelHead{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.inputPanel .panelHead span{font-size:14px;font-weight:600;color:#e0e0e0}
.inputPanel textarea{flex:1;background:#2d2d2d;color:#d4d4d4;border:1px solid #555;border-radius:4px;padding:10px;font-size:13px;font-family:inherit;resize:none;line-height:1.5;tab-size:4}
.inputPanel textarea:focus{border-color:#3a7cc8;outline:none}
.inputPanel textarea::placeholder{color:#666}
#bottomBar{padding:12px;text-align:center;flex-shrink:0;display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
/*== 对比视图 ==*/
#diffView{flex:1;display:none;flex-direction:column;overflow:hidden}
#reportBar{background:#1a1a2e;border-bottom:1px solid #444;max-height:200px;overflow-y:auto;display:none;font-size:12px}
#reportBar .rpt-header{padding:8px 16px;cursor:pointer;display:flex;align-items:center;gap:8px;background:#252526}
#reportBar .rpt-header:hover{background:#2a2a3e}
#reportBar .rpt-body{padding:4px 16px 8px}
.rpt-line{padding:3px 8px;border-radius:3px;margin-bottom:2px;line-height:1.6;white-space:pre-wrap;font-size:12px}
.rpt-ok{background:#0d2818;color:#6fcf97}
.rpt-err{background:#2d0a0a;color:#f08080}
.rpt-warn{background:#2d2400;color:#f0c050}
.rpt-info{background:#0a1a2d;color:#80b0f0}
.rpt-summary{padding:8px 16px;background:#252526;border-top:1px solid #333;font-weight:600}
.rpt-fuzzy-btns{display:flex;flex-wrap:wrap;gap:4px;padding:4px 8px;align-items:center}
.rpt-fuzzy-btns span{font-size:11px;color:#f0c050}
.rpt-fuzzy-btns button{padding:3px 10px;background:#5c4a1e;border:1px solid #a88a2d;border-radius:4px;color:#f0d878;cursor:pointer;font-size:11px}
.rpt-fuzzy-btns button:hover{background:#6e5a28}
#diffWrap{flex:1;overflow:auto}
#diffTable{width:100%;border-collapse:collapse}
#diffTable .row{display:flex;border-bottom:1px solid #2a2a2a}
.cell-ln{width:50px;min-width:50px;padding:0 8px;text-align:right;color:#888;background:#252526;font-size:12px;line-height:22px;user-select:none;flex-shrink:0;border-right:1px solid #333}
.cell-tx{flex:1;padding:0 10px;font-size:13px;line-height:22px;white-space:pre-wrap;word-break:break-all;min-width:0;overflow-wrap:break-word}
.gutter{width:2px;min-width:2px;background:#333;flex-shrink:0}
.row-eq .cell-tx{background:#1e1e1e}
.row-del .cell-txA{background:#3b1515}.row-del .cell-txB{background:#2a2a2a}
.row-ins .cell-txA{background:#2a2a2a}.row-ins .cell-txB{background:#153b15}
.row-mod .cell-txA{background:#3b1515}.row-mod .cell-txB{background:#153b15}
.row-del .cell-lnA{background:#2c1010}.row-ins .cell-lnB{background:#102c10}
.row-mod .cell-lnA{background:#2c1010}.row-mod .cell-lnB{background:#102c10}
.del-char{background:#6e2929;border-radius:2px}
.ins-char{background:#296e29;border-radius:2px}
.row.cur-group .cell-txA,.row.cur-group .cell-txB{box-shadow:inset 3px 0 0 #f0c050}
#statsBar{background:#252526;border-top:1px solid #444;padding:6px 16px;font-size:12px;color:#888;flex-shrink:0;display:none}
/*== 对话模式视图 ==*/
#chatView{flex:1;display:none;flex-direction:column;overflow:hidden}
.ch-top{padding:8px 14px;background:#252526;border-bottom:1px solid #444;display:flex;align-items:center;gap:8px;flex-wrap:wrap;flex-shrink:0}
.ch-top .ch-sel{position:relative}
.ch-sel-btn{padding:4px 10px;background:#3c3c3c;border:1px solid #555;border-radius:4px;color:#ccc;cursor:pointer;font-size:12px;display:flex;align-items:center;gap:4px;min-width:0}
.ch-sel-btn:hover{border-color:#3a7cc8}
.ch-sel-btn span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:120px}
.ch-sel-btn .arr{font-size:8px;color:#888;flex-shrink:0}
.star-sel{background:#5c4a1e;border-color:#a88a2d;color:#f0d878}
.star-sel:hover{background:#6e5a28}
.ch-dd{display:none;position:absolute;top:100%;left:0;margin-top:2px;background:#252526;border:1px solid #555;border-radius:4px;box-shadow:0 4px 16px rgba(0,0,0,.4);z-index:50;min-width:160px;max-height:280px;overflow-y:auto;padding:3px}
.ch-dd.show{display:block}
.ch-dd-item{padding:6px 8px;border-radius:3px;cursor:pointer;font-size:12px}
.ch-dd-item:hover{background:#3c3c3c}
.ch-dd-item.active{background:#3a7cc8;color:#fff}
.ch-dd-item .dd-sub{font-size:10px;color:#888}
.ch-dd-item.active .dd-sub{color:rgba(255,255,255,.6)}
#chatStarDD{min-width:280px;max-width:420px}
#chatStarDD .ch-dd-item{white-space:normal}
.ch-code-info{font-size:11px;color:#888;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ch-code-info strong{color:#a8e6cf}
/*== 对话消息样式 ==*/
#chatMsgWrap{flex:1;overflow-y:auto;min-height:0}
#chatMsgList{max-width:800px;margin:0 auto;padding:14px}
.ch-empty{text-align:center;color:#666;padding:60px 20px;font-size:14px}
.ch-msg{margin-bottom:12px;display:flex;gap:10px}
.ch-msg.user{flex-direction:row-reverse}
.ch-msg .ch-av{width:28px;height:28px;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0}
.ch-msg.user .ch-av{background:#264f78}
.ch-msg.assistant .ch-av{background:#2a3a2a}
.ch-msg .ch-body{flex:1;min-width:0;max-width:85%}
.ch-msg .ch-hd{font-size:10px;color:#777;margin-bottom:3px;display:flex;gap:6px;align-items:center}
.ch-msg.user .ch-hd{justify-content:flex-end}
.ch-msg .ch-ct{padding:8px 12px;border-radius:8px;font-size:13px;line-height:1.6;word-break:break-word;white-space:pre-wrap;position:relative}
.ch-msg.user .ch-ct{background:#264f78;color:#e0e0e0;border-radius:12px 12px 4px 12px}
.ch-msg.assistant .ch-ct{background:#2a2a2a;border:1px solid #444;border-radius:12px 12px 12px 4px}
.ch-msg.assistant.generating .ch-ct{border-color:#5a9ce8}
.ch-msg.muted .ch-ct{opacity:.4;border:1px dashed #666!important}
.ch-msg.muted .ch-av{opacity:.4}
.ch-msg .ch-ct pre{background:rgba(0,0,0,.3);padding:8px;border-radius:4px;overflow-x:auto;margin:6px 0;font-size:12px}
.ch-msg .ch-ct code{background:rgba(0,0,0,.2);padding:1px 3px;border-radius:2px;font-size:.9em}
.ch-msg .ch-ct pre code{background:none;padding:0}
.ch-msg .ch-acts{display:flex;gap:3px;margin-top:4px;opacity:0;transition:opacity .15s;flex-wrap:wrap}
.ch-msg:hover .ch-acts{opacity:1}
.ch-msg .ch-acts button{padding:2px 6px;background:#3c3c3c;border:1px solid #555;border-radius:3px;color:#bbb;cursor:pointer;font-size:10px}
.ch-msg .ch-acts button:hover{background:#4c4c4c;color:#fff}
.ch-msg .ch-acts button.pri{background:#264f78;border-color:#3a7cc8;color:#fff}
.ch-msg .ch-acts button.wn{color:#f0c050;border-color:#a88a2d}
.ch-msg .ch-acts button.dn{color:#f08080;border-color:#a82d2d}
/*== 对话思考区 ==*/
.ch-think{margin-bottom:8px;padding:8px 10px;background:#241f12;border:1px solid #5c4a1e;border-radius:6px;color:#f0d878;font-size:calc(var(--app-font-size) - 1px);line-height:1.6;white-space:pre-wrap}
.ch-think .th-hd{display:flex;align-items:center;gap:6px;font-size:11px;color:#d8b85c;margin-bottom:4px}
.ch-think .th-time{margin-left:auto;color:#9a8546;font-size:10px}
.ch-think .th-body{color:#d8c88a;max-height:220px;overflow-y:auto}
.ch-think.empty .th-body{color:#9a8546}
/*== 补丁检测栏 ==*/
.patch-detect{margin-top:8px;padding:8px 12px;background:#1e3a1e;border:1px solid #2d8a4e;border-radius:6px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.patch-detect .pd-info{font-size:12px;color:#a8e6cf;flex:1}
.patch-detect button{padding:4px 10px;border-radius:4px;cursor:pointer;font-size:12px;border:1px solid}
.patch-detect .pd-exec{background:#1e5631;border-color:#2d8a4e;color:#a8e6cf}
.patch-detect .pd-exec:hover{background:#276e3f}
.patch-detect .pd-copy{background:#3c3c3c;border-color:#555;color:#ccc}
.patch-detect .pd-copy:hover{background:#4c4c4c}
/*== 对话代码块 ==*/
.ch-code-wrap{position:relative;margin:6px 0}
.ch-code-hdr{display:flex;align-items:center;justify-content:space-between;padding:4px 8px;background:rgba(0,0,0,.4);border-radius:4px 4px 0 0;font-size:11px;color:#888}
.ch-code-cp{background:none;border:1px solid #555;color:#aaa;border-radius:3px;padding:1px 6px;cursor:pointer;font-size:10px}
.ch-code-cp:hover{background:#4c4c4c;color:#fff}
.ch-code-wrap pre{margin:0!important;border-radius:0 0 4px 4px!important}
/*== 对话右键菜单 ==*/
.ch-ctx-menu{position:fixed;z-index:300;background:#252526;border:1px solid #555;border-radius:6px;box-shadow:0 4px 16px rgba(0,0,0,.5);min-width:160px;padding:4px;font-size:13px}
.ch-ctx-item{padding:6px 12px;border-radius:4px;cursor:pointer;color:#ccc;white-space:nowrap}
.ch-ctx-item:hover{background:#3c3c3c;color:#fff}
.ch-ctx-item.danger{color:#f08080}
.ch-ctx-item.danger:hover{background:#3b1515}
.ch-ctx-item.primary{color:#a8e6cf}
.ch-ctx-item.primary:hover{background:#1e3a1e}
.ch-ctx-sep{height:1px;background:#444;margin:4px 8px}
/*== 对话输入区 ==*/
.ch-input{padding:8px 14px;background:#252526;border-top:1px solid #444;flex-shrink:0}
.ch-input-wrap{max-width:800px;margin:0 auto}
.ch-attach{display:flex;gap:4px;margin-bottom:4px}
.ch-attach button{padding:3px 8px;background:#3c3c3c;border:1px solid #555;border-radius:3px;color:#aaa;cursor:pointer;font-size:11px}
.ch-attach button:hover{background:#4c4c4c;color:#fff}
.ch-input-box{display:flex;gap:6px;align-items:flex-end;background:#2d2d2d;border:1px solid #555;border-radius:4px;padding:6px 10px}
.ch-input-box:focus-within{border-color:#3a7cc8}
.ch-input-box textarea{flex:1;background:transparent;border:none;color:#d4d4d4;font-size:13px;font-family:inherit;resize:none;outline:none;line-height:1.5;min-height:24px;max-height:120px}
.ch-save{padding:4px 8px;background:#3c3c3c;border:1px solid #555;border-radius:4px;color:#ccc;cursor:pointer;font-size:12px;flex-shrink:0}
.ch-save:hover{background:#4c4c4c;color:#fff}
.ch-input-box .ch-send{padding:4px 12px;background:#264f78;border:1px solid #3a7cc8;border-radius:4px;color:#fff;cursor:pointer;font-size:12px;flex-shrink:0}
.ch-input-box .ch-send:hover{background:#305f90}
.ch-stop-btn{padding:4px 12px;background:#5c1e1e;border:1px solid #a82d2d;border-radius:4px;color:#f08080;cursor:pointer;font-size:12px;flex-shrink:0}
.ch-stop-btn:hover{background:#6e2929}
.ch-tok-info{font-size:10px;color:#666;margin-top:4px;display:flex;gap:8px;flex-wrap:wrap}
.typing-dots{display:inline-flex;gap:3px;padding:4px 0}
.typing-dots span{width:5px;height:5px;background:#888;border-radius:50%;animation:td 1.2s infinite}
.typing-dots span:nth-child(2){animation-delay:.15s}

const DEFAULT_SYS_PROMPT='# 代码助手\n\n你是一个代码修改助手。用户会提供完整的单文件HTML代码，并用自然语言描述修改需求。\n\n## 工作流程\n\n1. 简单改动（改几行/一两个函数）→ 直接输出补丁指令\n2. 复杂改动（多函数联动、新功能）→ 先用大白话说清楚思路（改哪里、怎么改、有没有坑），等用户确认后再写补丁\n3. 拿不准的地方问用户，别自己猜\n\n## 代码结构约定\n- JS函数用 `//== 函数名 ==//` 标记分隔\n- CSS块用 `/*== 块名 ==*/` 标记分隔\n- 保持现有代码风格，不要擅自重构未提及的部分\n\n## 输出要求\n- 输出补丁指令，不要输出完整文件\n- 一次更新的所有指令放在一个代码框中\n- **禁止自行截断**——宁可输出很长也必须完整，截断会导致补丁无法执行\n- **禁止删减你认为"不需要"的逻辑**——你不确定的东西别动\n- **禁止改没讨论过的函数/CSS块**——发现需要连带改别的地方，先说出来让用户确认\n\n## 沟通风格\n- 讲人话，不堆术语。如果必须用技术词，紧跟一句白话解释\n- 风险点说人话后果："可能导致旧数据丢失"，而不是"向后兼容性需要考虑"\n- 思路说成"先做什么→再做什么→最后做什么"，不要抽象描述\n\n## 补丁指令格式\n\n**替换整个函数：**\n'+_PM+'PATCH 替换函数 函数名'+_PM+'\n//== 函数名 ==//\n（新的完整函数代码）\n'+_PM+'END'+_PM+'\n\n**新增函数：**\n'+_PM+'PATCH 新增函数 在XX之后'+_PM+'\n//== 新函数名 ==//\n（完整函数代码）\n'+_PM+'END'+_PM+'\n\n**删除函数：**\n'+_PM+'PATCH 删除函数 函数名'+_PM+'\n'+_PM+'END'+_PM+'\n\n**替换/新增/删除CSS块：** 同上，把"函数"换成"CSS块"\n\n**函数内局部替换（改一两行时用）：**\n'+_PM+'PATCH 函数内替换 函数名'+_PM+'\n<<<查找>>>\n（精确匹配的原文）\n<<<替换>>>\n（新内容）\n'+_PM+'END'+_PM+'\n\n**全局查找替换（必须唯一匹配）：**\n'+_PM+'PATCH 查找替换'+_PM+'\n<<<查找>>>\n（原文，必须在代码中唯一存在）\n<<<替换>>>\n（新内容）\n'+_PM+'END'+_PM+'\n\n**全部替换（所有匹配位置）：**\n'+_PM+'PATCH 全部替换'+_PM+'\n<<<查找>>>\n（要替换的文本）\n<<<替换>>>\n（新内容）\n'+_PM+'END'+_PM+'\n\n**在指定位置插入：**\n'+_PM+'PATCH 插入之后'+_PM+'\n<<<定位>>>\n（精确匹配的定位文本）\n<<<插入>>>\n（新内容）\n'+_PM+'END'+_PM+'\n\n**首尾定位替换（用开头和结尾锁定一整段）：**\n'+_PM+'PATCH 首尾替换'+_PM+'\n<<<首句>>>\n（段落开头的精确文本）\n<<<末句>>>\n（段落结尾的精确文本）\n<<<替换>>>\n（新内容）\n'+_PM+'END'+_PM+'\n\n**函数内首尾替换：**\n'+_PM+'PATCH 函数内首尾替换 函数名'+_PM+'\n<<<首句>>>\n（段落开头）\n<<<末句>>>\n（段落结尾）\n<<<替换>>>\n（新内容）\n'+_PM+'END'+_PM+'\n\n**CSS块内首尾替换：**\n'+_PM+'PATCH CSS块内首尾替换 块名'+_PM+'\n<<<首句>>>\n（段落开头）\n<<<末句>>>\n（段落结尾）\n<<<替换>>>\n（新内容）\n'+_PM+'END'+_PM+'\n\n**新增全局变量：**\n'+_PM+'PATCH 新增变量'+_PM+'\nlet xxx = ...;\n'+_PM+'END'+_PM+'\n\n## 注意事项\n- 查找串必须在代码中精确存在且唯一，拿不准就用函数级替换\n- 能用函数级/块级替换就不用查找替换——按标记定位最稳\n- 同一函数改3处以上，直接替换整个函数\n- 压缩代码中每个空格都是关键分隔符（const x、let y、return x等），丢一个就语法错误\n- PATCH 标题中的名称必须是标记里的纯名称，不要附加"函数/方法/块"等词\n- 不要擅自分段输出，一次输出尽可能长\n- 首尾替换的首句/末句要足够独特，避免 }、</div>、空行这类容易重复的文本\n- 大段代码替换优先用首尾替换或函数级替换，避免查找替换的查找内容过长导致漂移';

function fmtAgo(iso){const t=new Date(iso||0).getTime();if(!t)return'';const d=Math.max(0,Date.now()-t),m=Math.floor(d/60000),h=Math.floor(d/3600000),day=Math.floor(d/86400000);if(m<1)return'刚刚';if(m<60)return m+'分钟前';if(h<24)return h+'小时前';return day+'天前'}

//== cntTok ==//
function cntTok(t){if(!t)return 0;let tok=0;t.split(/([\u4e00-\u9fff\u3400-\u4dbf]+)/g).forEach(p=>{if(!p)return;if(/[\u4e00-\u9fff]/.test(p))tok+=Math.ceil(p.length*1.5);else p.split(/\s+/).filter(w=>w).forEach(w=>{tok+=w.length<=4?1:w.length<=10?2:Math.ceil(w.length/4)})});return Math.max(1,Math.round(tok))}

//== fixApiUrl ==//

//== autoDetectVersion ==//
function autoDetectVersion(code){if(!code)return'';const pats=[/(?:const|let|var)\s+(?:VER|VERSION|APP_VERSION|APP_VER)\s*=\s*['"]v?([0-9][0-9A-Za-z._-]*)['"]/i,/(?:version|ver|appVersion|app_version)\s*[:=]\s*['"]v?([0-9][0-9A-Za-z._-]*)['"]/i,/data-version\s*=\s*['"]v?([0-9][0-9A-Za-z._-]*)['"]/i,/(?:版本号|版本|version|ver)\s*[：:]\s*v?([0-9][0-9A-Za-z._-]*)/i,/\bv([0-9]+(?:\.[0-9A-Za-z_-]+){1,4})\b/i,/\b([0-9]+\.[0-9]+(?:\.[0-9A-Za-z_-]+){0,3})\b/];for(const re of pats){const m=code.match(re);if(m&&m[1]&&/\d/.test(m[1]))return m[1]}return''}

ritable();await vw.write(content);await vw.close()}if(!existing){const id='proj_'+Date.now().toString(36)+Math.random().toString(36).substr(2,4);projList.push({id,name:p.name,dirName:dn,updatedAt:new Date().toISOString()})}imported++}await saveProjectIndex();await loadProjectIndex();renderProjectList();if(curProjId)await selectProject(curProjId);hideModal();_backupFileData=null;toast('✓ 已导入 '+imported+' 个项目')}

//== getLineNumber ==//
function getLineNumber(code,charIdx){let line=1;for(let i=0;i<charIdx&&i<code.length;i++)if(code[i]==='\n')line++;return line}

//== getContextLines ==//
function getContextLines(code,charIdx,searchText,bn,an){if(!bn)bn=4;if(!an)an=4;const lines=code.split('\n'),sl=getLineNumber(code,charIdx),el=sl+searchText.split('\n').length-1,from=Math.max(1,sl-bn),to=Math.min(lines.length,el+an),r=[];for(let i=from;i<=to;i++)r.push((i>=sl&&i<=el?'> ':'  ')+String(i).padStart(5)+': '+lines[i-1]);return r}

//== getAllMatchPositions ==//
function getAllMatchPositions(code,searchText){const p=[];let si=0;while(true){const fi=code.indexOf(searchText,si);if(fi===-1)break;p.push({charIdx:fi,line:getLineNumber(code,fi)});si=fi+1}return p}

//== buildMultiMatchReport ==//
function buildMultiMatchReport(code,st,positions){const lines=[];positions.forEach((pos,i)=>{lines.push('   📍 第 '+pos.line+' 行 (匹配'+(i+1)+'/'+positions.length+')：');getContextLines(code,pos.charIdx,st).forEach(l=>lines.push('   '+l))});return lines}

//== normalizeText ==//
function normalizeText(text,level){let r=text;if(level>=1){r=r.replace(/[\u200B\u200C\u200D\uFEFF\u00AD]/g,'');r=r.replace(/\u00A0/g,' ');r=r.replace(/\r\n/g,'\n').replace(/\r/g,'\n')}if(level>=2){r=r.replace(/\n/g,' ');r=r.replace(/\s+/g,' ').trim()}if(level>=3){r=r.replace(/，/g,',').replace(/；/g,';').replace(/：/g,':').replace(/（/g,'(').replace(/）/g,')');r=r.replace(/[\u2018\u2019\u201A\u201B]/g,"'").replace(/[\u201C\u201D\u201E\u201F]/g,'"').replace(/\u3000/g,' ')}if(level>=4)r=r.replace(/'/g,'"');if(level>=5)r=r.toLowerCase();return r}

//== fuzzySearch ==//
function fuzzySearch(code,searchText){const ln=['','不可见字符差异','空格/缩进/换行差异','中英标点差异','引号差异','大小写差异'];for(let level=1;level<=5;level++){const nc=normalizeText(code,level),ns=normalizeText(searchText,level),positions=getAllMatchPositions(nc,ns);if(positions.length>0){const op=positions.map(p=>({charIdx:p.charIdx,line:getLineNumber(code,p.charIdx)}));const cl=[];op.forEach((pos,i)=>{cl.push('   📍 第 '+pos.line+' 行 (疑似'+(i+1)+'/'+op.length+')：');getContextLines(code,pos.charIdx,searchText).forEach(l=>cl.push('   '+l))});return{found:true,level,levelName:ln[level],positions:op,context:cl}}}const sfl=normalizeText(searchText.split('\n')[0],5);if(!sfl.trim())return{found:false};const codeLines=code.split('\n'),searchLines=searchText.split('\n'),candidates=[];for(let i=0;i<codeLines.length;i++){const nl=normalizeText(codeLines[i],5);if(nl.includes(sfl)||sfl.includes(nl)){let mc=0;for(let j=0;j<searchLines.length&&i+j<codeLines.length;j++)if(normalizeText(codeLines[i+j],5)===normalizeText(searchLines[j],5))mc++;const ratio=searchLines.length>0?mc/searchLines.length:0;if(ratio>=0.3)candidates.push({line:i+1,ratio,matchCount:mc,total:searchLines.length})}}if(candidates.length>0){candidates.sort((a,b)=>b.ratio-a.ratio);const cl=[];candidates.forEach(c=>{let ci2=0;for(let j=0;j<c.line-1&&j<codeLines.length;j++)ci2+=codeLines[j].length+1;cl.push('   📍 第 '+c.line+' 行 (相似度 '+Math.round(c.ratio*100)+'%)：');getContextLines(code,ci2,searchText).forEach(l=>cl.push('   '+l))});return{found:true,level:6,levelName:'相似内容(模糊)',positions:candidates.map(c=>({line:c.line})),context:cl}}return{found:false}}

//== buildFuzzyLines ==//
function buildFuzzyLines(fr){if(!fr?.found)return[];const lines=['   💡 '+fr.levelName+'（共'+fr.positions.length+'处疑似）：'];fr.context.forEach(l=>lines.push(l));return lines}

//== findBlockBounds ==//
function findBlockBounds(code,name,openPrefix,openSuffix,endTag){const marker=openPrefix+name+openSuffix;const start=code.indexOf(marker);if(start===-1)return null;const am=start+marker.length;const nm=code.indexOf('\n'+openPrefix,am);let end=nm===-1?(code.lastIndexOf(endTag)!==-1?code.lastIndexOf(endTag):code.length):nm+1;let te=end;while(te>am&&code[te-1]==='\n')te--;te++;return{start,end:te,markerEnd:am}}

//== findFuncBounds ==//
function findFuncBounds(code,funcName){return findBlockBounds(code,funcName,'//== ',' ==//','<'+'/script>')}

//== findCSSBlockBounds ==//
function findCSSBlockBounds(code,blockName){return findBlockBounds(code,blockName,'/*== ',' ==*/','</style>')}

//== findHeadTailRange ==//
function findHeadTailRange(code,head,tail){if(!head||!tail)return{ok:false,error:'首句/末句不能为空'};const headPositions=getAllMatchPositions(code,head);if(!headPositions.length){const fz=fuzzySearch(code,head);return{ok:false,error:'首句未找到',fuzzy:fz}}const results=[];for(const hp of headPositions){const searchFrom=hp.charIdx+head.length;const tailIdx=code.indexOf(tail,searchFrom);if(tailIdx===-1)continue;results.push({start:hp.charIdx,end:tailIdx+tail.length,headLine:hp.line,tailLine:getLineNumber(code,tailIdx)})}if(!results.length){const fz=fuzzySearch(code,tail);return{ok:false,error:'找到首句但末句未找到',fuzzy:fz}}if(results.length>1){const detail=['匹配了'+results.length+'段'];results.forEach((r,i)=>{detail.push('   📍 段'+(i+1)+': 第'+r.headLine+'行 ~ 第'+r.tailLine+'行');getContextLines(code,r.start,code.substring(r.start,r.end),2,2).forEach(l=>detail.push('   '+l))});return{ok:false,error:'匹配'+results.length+'段',count:results.length,detail,results}}const r=results[0];const rangeLines=r.tailLine-r.headLine+1;let warn='';if(rangeLines>300)warn='⚠️ 替换范围 '+rangeLines+' 行，请确认是否合理';return{ok:true,start:r.start,end:r.end,headLine:r.headLine,tailLine:r.tailLine,rangeLines,warn}}

//== parsePatchInstructions ==//
function parsePatchInstructions(text){const patches=[],lines=text.split('\n');let i=0;while(i<lines.length){const line=lines[i];if(line.startsWith('\u2593\u2593\u2593PATCH ')){const header=line.replace(/\u2593{3}$/,'').replace(/^\u2593{3}PATCH /,'').trim();const bodyLines=[];i++;while(i<lines.length&&!lines[i].startsWith('\u2593\u2593\u2593END\u2593\u2593\u2593')){bodyLines.push(lines[i]);i++}i++;const body=bodyLines.join('\n');let type='',param='';if(header.startsWith('替换函数 ')){type='replaceFunc';param=header.substring(5).trim()}else if(header.startsWith('新增函数 ')){type='insertFunc';param=header.substring(5).trim()}else if(header.startsWith('删除函数 ')){type='deleteFunc';param=header.substring(5).trim()}else if(header.startsWith('替换CSS块 ')){type='replaceCSSBlock';param=header.substring(6).trim()}else if(header.startsWith('新增CSS块 ')){type='insertCSSBlock';param=header.substring(6).trim()}else if(header.startsWith('删除CSS块 ')){type='deleteCSSBlock';param=header.substring(6).trim()}else if(header.startsWith('函数内替换 ')){type='funcFindReplace';param=header.substring(6).trim()}else if(header.startsWith('函数内首尾替换 ')){type='funcHeadTail';param=header.substring(8).trim()}else if(header.startsWith('CSS块内首尾替换 ')){type='cssHeadTail';param=header.substring(9).trim()}else if(header==='首尾替换'){type='headTail'}else if(header==='查找替换'){type='findReplace'}else if(header==='全部替换'){type='replaceAll'}else if(header==='插入之后'){type='insertAfter'}else if(header==='插入之前'){type='insertBefore'}else if(header==='新增变量'){type='addVar'}else{type='unknown';param=header}if(type==='findReplace'||type==='replaceAll'||type==='funcFindReplace'){const si2=body.indexOf('<<<替换>>>');if(si2===-1){patches.push({type,param,error:'缺少 <<<替换>>>',raw:header});continue}const fi=body.indexOf('<<<查找>>>');let ft,rt;if(fi!==-1){ft=body.substring(fi+8,si2);rt=body.substring(si2+8)}else{ft=body.substring(0,si2);rt=body.substring(si2+8)}if(ft.startsWith('\n'))ft=ft.substring(1);if(ft.endsWith('\n'))ft=ft.slice(0,-1);if(rt.start //== checkUnique ==//
function checkUnique(code,searchText){const positions=getAllMatchPositions(code,searchText);if(positions.length===0){const fuzzy=fuzzySearch(code,searchText);const detail=['未找到匹配'];const fl=buildFuzzyLines(fuzzy);if(fl.length)detail.push(...fl);return{ok:false,count:0,detail,fuzzy}}if(positions.length>1){const detail=['匹配了'+positions.length+'处'];buildMultiMatchReport(code,searchText,positions).forEach(l=>detail.push(l));return{ok:false,count:positions.length,detail,positions}}return{ok:true,count:1,charIdx:positions[0].charIdx,line:positions[0].line}}

//== runDiffInternal ==//
function runDiffInternal(tA,tB){const lA=tA.split('\n'),lB=tB.split('\n');let nA=lA,nB=lB;if(ignoreWS){nA=lA.map(l=>l.trim().replace(/\s+/g,' '));nB=lB.map(l=>l.trim().replace(/\s+/g,' '))}const ops=myersDiff(nA,nB);diffRows=[];let i=0;while(i<ops.length){if(ops[i].op==='eq'){diffRows.push({type:'eq',lineA:ops[i].idxA+1,lineB:ops[i].idxB+1,textA:lA[ops[i].idxA],textB:lB[ops[i].idxB]});i++}else{const dels=[],inss=[];while(i<ops.length&&ops[i].op==='del'){dels.push(ops[i]);i++}while(i<ops.length&&ops[i].op==='ins'){inss.push(ops[i]);i++}const pairs=Math.min(dels.length,inss.length);for(let p=0;p<pairs;p++){const hl=inlineDiff(lA[dels[p].idxA],lB[inss[p].idxB]);diffRows.push({type:'mod',lineA:dels[p].idxA+1,lineB:inss[p].idxB+1,textA:lA[dels[p].idxA],textB:lB[inss[p].idxB],htmlA:hl.htmlA,htmlB:hl.htmlB})}for(let p=pairs;p<dels.length;p++)diffRows.push({type:'del',lineA:dels[p].idxA+1,lineB:null,textA:lA[dels[p].idxA],textB:''});for(let p=pairs;p<inss.length;p++)diffRows.push({type:'ins',lineA:null,lineB:inss[p].idxB+1,textA:'',textB:lB[inss[p].idxB]})}}renderResults()}

//== myersDiff ==//
function myersDiff(a,b){const N=a.length,M=b.length,MAX=N+M;if(MAX===0)return[];let V=new Array(2*MAX+2);V[MAX+1]=0;const traces=[];outer:for(let d=0;d<=MAX;d++){const nv=new Array(2*MAX+2);for(let i=0;i<nv.length;i++)nv[i]=V[i]||0;traces.push(V.slice());for(let k=-d;k<=d;k+=2){let x;if(k===-d||(k!==d&&V[k-1+MAX]<V[k+1+MAX]))x=V[k+1+MAX];else x=V[k-1+MAX]+1;let y=x-k;while(x<N&&y<M&&a[x]===b[y]){x++;y++}nv[k+MAX]=x;if(x>=N&&y>=M){V=nv;traces.push(V.slice());break outer}}V=nv}let x=N,y=M;const ops=[];for(let d=traces.length-1;d>0;d--){const pv=traces[d-1],k=x-y;let pk;if(k===-(d-1)||(k!==(d-1)&&pv[k-1+MAX]<pv[k+1+MAX]))pk=k+1;else pk=k-1;let px=pv[pk+MAX],py=px-pk;while(x>px&&y>py){x--;y--;ops.push({op:'eq',idxA:x,idxB:y})}if(x>px){x--;ops.push({op:'del',idxA:x,idxB:y})}else if(y>py){y--;ops.push({op:'ins',idxA:x,idxB:y})}}while(x>0&&y>0){x--;y--;ops.push({op:'eq',idxA:x,idxB:y})}ops.reverse();return ops}

//== inlineDiff ==//
function inlineDiff(sa,sb){const na=sa.length,nb=sb.length;const dp=[];for(let i=0;i<=na;i++)dp[i]=new Uint16Array(nb+1);for(let i=1;i<=na;i++)for(let j=1;j<=nb;j++)dp[i][j]=sa[i-1]===sb[j-1]?dp[i-1][j-1]+1:Math.max(dp[i-1][j],dp[i][j-1]);let i=na,j=nb;const seqA=[],seqB=[];while(i>0&&j>0){if(sa[i-1]===sb[j-1]){seqA.push({ch:sa[i-1],hi:false});seqB.push({ch:sb[j-1],hi:false});i--;j--}else if(dp[i-1][j]>=dp[i][j-1]){seqA.push({ch:sa[i-1],hi:true});i--}else{seqB.push({ch:sb[j-1],hi:true});j--}}while(i>0){seqA.push({ch:sa[i-1],hi:true});i--}while(j>0){seqB.push({ch:sb[j-1],hi:true});j--}seqA.reverse();seqB.reverse();const build=(seq,cls)=>{let h='',ins2=false;for(const s of seq){if(s.hi&&!ins2){h+='<span class="'+cls+'">';ins2=true}if(!s.hi&&ins2){h+='</span>';ins2=false}h+=esc(s.ch)}if(ins2)h+='</span>';return h};return{htmlA:build(seqA,'del-char'),htmlB:build(seqB,'ins-char')}}

//== renderResults ==//
function renderResults(){const c=document.getElementById('diffTable');c.innerHTML='';diffGroups=[];let gi=-1,inG=false;const frag=document.createDocumentFragment();const stats={eq:0,mod:0,del:0,ins:0};for(let i=0;i<diffRows.length;i++){const r=diffRows[i];stats[r.type]++;const isC=r.type!=='eq';if(isC&&!inG){gi++;diffGroups.push({startIdx:i,el:null});inG=true}if(!isC)inG=false;const row=document.createElement('div');row.className='row row-'+r.type;if(isC){row.setAttribute('data-group',gi);if(!diffGroups[gi].el)diffGroups[gi].el=row}const lnA=document.createElement('div');lnA.className='cell-ln cell-lnA';lnA.textContent=r.lineA||'';const txA=document.createElement('div');txA.className='cell-tx cell-txA';const gut=document.createElement('div');gut.className='gutter';const lnB=document.createElement('div');lnB.className='cell-ln cell-lnB';lnB.textContent=r.lineB||'';const txB=document.createElement('div');txB.className='cell-tx cell-txB';if(r.type==='mod'){txA.innerHTML=r.htmlA;txB.innerHTML=r.htmlB}else if(r.type==='eq'){txA.textContent=r.textA;txB.textContent=r.textB}else if(r.type==='del')txA.textContent=r.textA;else txB.textContent=r.textB;row.append(lnA,txA,gut,lnB,txB);frag.appendChild(row)}c.appendChild(frag);document.getElementById('statsBar').textContent='共'+diffRows.length+'行 | 相同'+stats.eq+' | 修改'+stats.mod+' | 删除'+stats.del+' | 新增'+stats.ins+' | '+diffGroups.length+'处差异';document.getElementById('navInfo').textContent=diffGroups.length?'0/'+diffGroups.length:'无差异'}

//== chatMdFmt ==//
function chatMdFmt(s,msgIdx){if(!s)return'';let work=s;const slots=[];let blockIdx=0;work=work.replace(/```(\w*)\n([\s\S]*?)```/g,(m,lang,code)=>{const storeKey=(msgIdx!==undefined?msgIdx:'x')+'_'+blockIdx;chatCodeCopyStore[storeKey]=code;const id=slots.length;slots.push('<div class="ch-code-wrap"><div class="ch-code-hdr"><span>'+(lang||'code')+'</span><button class="ch-code-cp" onclick="chatCopyCodeBlock(\''+storeKey+'\',this)">📋 复制</button></div><pre><code>'+esc(code)+'</code></pre></div>');blockIdx++;return'\uE000'+id+'\uE001'});work=work.replace(/`([^`\n]+)`/g,(m,code)=>{const id=slots.length;slots.push('<code>'+esc(code)+'</code>');return'\uE000'+id+'\uE001'});work=esc(work);work=work.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');work=work.replace(/(?<!\*)\*([^*\n]+)\*(?!\*)/g,'<em>$1</em>');work=work.replace(/\n/g,'<br>');work=work.replace(/\uE000(\d+)\uE001/g,(m,id)=>slots[parseInt(id)]);return work}

//== chatMergeMsgs ==//
function chatMergeMsgs(base,local){const map=new Map();function put(m){if(!m||!m.id)return;const old=map.get(m.id);const nm={...m};if(!nm.updatedAt)nm.updatedAt=nm.deletedAt||nm.time||new Date().toISOString();if(!old){map.set(nm.id,nm);return}const ot=new Date(old.deletedAt||old.updatedAt||old.time||0).getTime();const nt=new Date(nm.deletedAt||nm.updatedAt||nm.time||0).getTime();map.set(nm.id,nt>=ot?{...old,...nm}:{...nm,...old})}(base||[]).forEach(put);(local||[]).forEach(put);return Array.from(map.values()).sort((a,b)=>new Date(a.time||a.updatedAt||0)-new Date(b.time||b.updatedAt||0))}

//== renderChatMsgs ==//
function renderChatMsgs(){const el=document.getElementById('chatMsgList');const visible=chatVisibleMsgs();chatCodeCopyStore={};if(!visible.length){el.innerHTML='<div class="ch-empty">💬 开始跟AI聊代码</div>';return}const shouldScroll=chatAutoScroll||chatIsAtBottom();el.innerHTML=visible.map(({m,i})=>{const req=chatGetReq(m.id);const generating=req?.status==='generating';const pc=m.role==='assistant'?chatDetectPatches(m.content):0;const isMuted=m.muted;let bodyH='';const reasoning=m.reasoningContent||req?.reasoningContent||'';let thinkH='';if(m.role==='assistant'&&(generating||reasoning)){const sec=generating&&req?.startTime?Math.floor((Date.now()-req.startTime)/1000):'';thinkH='<div class="ch-think'+(reasoning?'':' empty')+'" id="chatThink-'+i+'"><div class="th-hd"><span>🤔 思考'+(generating?'中':'')+'</span>'+(sec!==''?'<span class="th-time">'+sec+'s</span>':'')+(generating?'<button class="ch-stop-btn" onclick="chatStop(\''+escA(m.id)+'\')" style="padding:2px 8px;font-size:10px;margin-left:6px">⏹ 停止</button>':'')+'</div><div class="th-body">'+(reasoning?esc(reasoning):'<span class="typing-dots"><span></span><span></span><span></span></span> 等待模型输出...')+'</div></div>'}if(generating&&!m.content&&!thinkH)bodyH='<span class="typing-dots"><span></span><span></span><span></span></span>';else if(generating)bodyH=thinkH+esc(m.content||'');else bodyH=thinkH+chatMdFmt(m.content||'',i);let patchBar='';if(!generating&&pc>0)patchBar='<div class="patch-detect"><span class="pd-info">🔧 '+pc+' 条补丁</span><button class="pd-exec" onclick="chatExecPatch('+i+')">▶ 执行</button><button class="pd-copy" onclick="chatCopyMsg('+i+')">📋</button></div>';const t=m.time?new Date(m.time).toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'}):'';const mdl=m.model?'<span style="color:#6fcf97">'+esc(m.model)+'</span>':'';const mutedTag=isMuted?'<span style="color:#f0c050;font-size:9px">🔇</span>':'';return'<div class="ch-msg '+m.role+(generating?' generating':'')+(isMuted?' muted':'')+'" id="chatMsg-'+i+'" oncontextmenu="chatShowCtxMenu(event,'+i+')"><div class="ch-av">'+(m.role==='user'?'👤':'🤖')+'</div><div class="ch-body"><div class="ch-hd"><span>'+t+'</span>'+mdl+mutedTag+'</div><div class="ch-ct" id="chatCt-'+i+'">'+bodyH+'</div>'+patchBar+'<div class="ch-acts"><button onclick="chatSendFrom('+i+')" title="从此发送">⬇️</button><button onclick="chatInsertAfter('+i+')" title="插入">➕</button><button onclick="chatCopyMsg('+i+')">📋</button><button onclick="chatEditMsg('+i+')">✏️</button><button class="wn" onclick="chatToggleMute('+i+')">'+(isMuted?'🔊':'🔇')+'</button><button onclick="chatDeleteMsg('+i+')">🗑️</button><button class="dn" onclick="chatDeleteAfter('+i+')" title="删除后续">✂️</button>'+(pc>0?'<button class="pri" onclick="chatExecPatch('+i+')">🔧</button>':'')+'</div></div></div>'}).join('');if(shouldScroll)chatScrollToBottom()}

//== chatShowCtxMenu ==//
function chatShowCtxMenu(e,msgIdx){e.preventDefault();chatHideCtxMenu();const m=chatMsgs[msgIdx];if(!m)return;const pc=m.role==='assistant'?chatDetectPatches(m.content):0;const isMuted=m.muted;let items='';items+='<div class="ch-ctx-item" onclick="chatHideCtxMenu();chatSendFrom('+msgIdx+')">⬇️ 从此发送</div>';items+='<div class="ch-ctx-item" onclick="chatHideCtxMenu();chatInsertAfter('+msgIdx+')">➕ 在后面插入</div>';items+='<div class="ch-ctx-item" onclick="chatHideCtxMenu();chatCopyMsg('+msgIdx+')">📋 复制原文</div>';items+='<div class="ch-ctx-item" onclick="chatHideCtxMenu();chatEditMsg('+msgIdx+')">✏️ 编辑</div>';items+='<div class="ch-ctx-item" onclick="chatHideCtxMenu();chatToggleMute('+msgIdx+')">'+(isMuted?'🔊 恢复':'🔇 屏蔽')+'</div>';if(pc>0)items+='<div class="ch-ctx-sep"></div><div class="ch-ctx-item primary" onclick="chatHideCtxMenu();chatExecPatch('+msgIdx+')">🔧 执行补丁 ('+pc+'条)</div>';items+='<div class="ch-ctx-sep"></div>';items+='<div class="ch-ctx-item danger" onclick="chatHideCtxMenu();chatDeleteMsg('+msgIdx+')">🗑️ 删除</div>';items+='<div class="ch-ctx-item danger" onclick="chatHideCtxMenu();chatDeleteAfter('+msgIdx+')">✂️ 删除后续</div>';const menu=document.createElement('div');menu.className='ch-ctx-menu';menu.innerHTML=items;menu.style.left=Math.min(e.clientX,window.innerWidth-180)+'px';menu.style.top=Math.min(e.clientY,window.innerHeight-300)+'px';document.body.appendChild(menu)}

//== chatHideCtxMenu ==//
function chatHideCtxMenu(){document.querySelectorAll('.ch-ctx-menu').forEach(m=>m.remove())}

//== chatDeleteAfter ==//
function chatDeleteAfter(msgIdx){const visible=chatVisibleMsgs();const vi=visible.findIndex(v=>v.i===msgIdx);if(vi===-1)return;const afterCount=visible.length-vi-1;if(afterCount<=0){toast('后面没有消息');return}if(!confirm('删除后面 '+afterCount+' 条消息？'))return;const now=new Date().toISOString();for(let j=vi+1;j<visible.length;j++){const idx=visible[j].i;if(!chatMsgs[idx].deletedAt){chatMsgs[idx].deletedAt=now;chatTouchMsg(chatMsgs[idx],now)}}renderChatMsgs();chatSaveMsgs();toast('✓ 已删除 '+afterCount+' 条')}

//== chatSaveOnly ==//
function chatSaveOnly(){const inp=document.getElementById('chatIn');const text=inp.value.trim();if(!text)return;const now=new Date().toISOString();chatMsgs.push(chatTouchMsg({id:Date.now().toString(36)+'s',role:'user',content:text,time:now},now));chatAutoScroll=true;inp.value='';inp.style.height='auto';renderChatMsgs();chatSaveMsgs();chatUpdateTokInfo();toast('✓ 已保存')}

//== chatSend ==//
async function chatSend(){const inp=document.getElementById('chatIn');const text=inp.value.trim();if(!text)return;if(!chatApiId||!chatModel){toast('请先选模型');return}const cfg=getAllApis().find(a=>a.id===chatApiId);if(!cfg){toast('API不存在');return}const now=new Date().toISOString();const userMsg=chatTouchMsg({id:Date.now().toString(36)+'u',role:'user',content:text,time:now},now);chatMsgs.push(userMsg);const aiMsg=chatTouchMsg({id:Date.now().toString(36)+'a',role:'assistant',content:'',time:new Date().toISOString(),model:chatModel});chatMsgs.push(aiMsg);chatAutoScroll=true;inp.value='';inp.style.height='auto';renderChatMsgs();chatUpdateTokInfo();chatExecReq(cfg,aiMsg,null,userMsg.id)}

//== chatBuildMsgs ==//
function chatBuildMsgs(untilIdx,excludeMsgId,includeUserMsgId){const code=document.getElementById('txA').value;let sys='';if(patchCfg.systemPrompt)sys+=patchCfg.systemPrompt+'\n\n';if(code)sys+='【当前代码】\n```html\n'+code+'\n```';const msgs=[];if(sys.trim())msgs.push({role:'system',content:sys});const skipIds=chatActiveSkipIds(excludeMsgId,includeUserMsgId);chatMsgs.forEach((m,idx)=>{if(untilIdx!==undefined&&untilIdx!==null&&idx>untilIdx)return;if(m.role==='system'||m.deletedAt||m.muted)return;if(skipIds.has(m.id))return;const role=m.role,content=m.content||'';if(!content.trim())return;const last=msgs[msgs.length-1];if(last&&last.role===role){last.content+=(last.content?'\n\n':'')+content}else{msgs.push({role,content})}});return msgs}

//== chatExecReq ==//
async function chatExecReq(cfg,aiMsg,untilIdx,userMsgId){const apiUrl=fixApiUrl(cfg.url),msgId=aiMsg.id;const abort=new AbortController();chatGenReqs[msgId]={abort,status:'generating',content:aiMsg.content||'',reasoningContent:aiMsg.reasoningContent||'',startTime:Date.now(),msgId,userMsgId:userMsgId||null,streamRAF:null,lastTick:0};const req=chatGenReqs[msgId];const msgs=chatBuildMsgs(untilIdx,msgId,userMsgId||null),body={model:chatModel,messages:msgs,stream:true};chatScheduleUpdate(msgId);try{const resp=await fetch(apiUrl,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+cfg.key},body:JSON.stringify(body),signal:abort.signal});if(!resp.ok){let em='HTTP '+resp.status;try{em=(await resp.json()).error?.message||em}catch(e){}throw new Error(em)}const rdr=resp.body.getReader(),dec=new TextDecoder();let buf='';while(true){const{done,value}=await rdr.read();if(done)break;if(!chatGenReqs[msgId])break;buf+=dec.decode(value,{stream:true});const lines=buf.split('\n');buf=lines.pop();for(const line of lines){const tr=line.trim();if(!tr||!tr.startsWith('data: '))continue;const d=tr.slice(6);if(d==='[DONE]')continue;try{const j=JSON.parse(d);const delta=j.choices?.[0]?.delta||{};const dl=delta.content||'';const rl=chatGetReasoningDelta(delta);const cur=chatGenReqs[msgId];if(!cur)break;if(dl||rl){if(dl)cur.content+=dl;if(rl)cur.reasoningContent+=rl;const mi=chatMsgs.findIndex(m=>m.id===msgId);if(mi>=0){chatMsgs[mi].content=cur.content;chatMsgs[mi].reasoningContent=cur.reasoningContent;chatTouchMsg(chatMsgs[mi])}chatScheduleUpdate(msgId)}}catch(e){}}}}catch(e){const cur=chatGenReqs[msgId];if(cur){if(e.name==='AbortError'){cur.content+=(cur.content?'\n\n':'')+'[已停止]';cur.status='stopped'}else{cur.content=cur.content?(cur.content+'\n\n❌ '+e.message):('❌ '+e.message);cur.status='failed';toast('❌ '+e.message.substring(0,80))}}}const cur=chatGenReqs[msgId];const mi=chatMsgs.findIndex(m=>m.id===msgId);if(cur&&mi>=0){chatMsgs[mi].content=cur.content;chatMsgs[mi].reasoningContent=cur.reasoningContent;chatTouchMsg(chatMsgs[mi])}chatFinalize(msgId)}

//== chatScheduleUpdate ==//
function chatScheduleUpdate(msgId){const req=chatGetReq(msgId);if(!req||req.streamRAF)return;req.streamRAF=requestAnimationFrame(()=>{const cur=chatGetReq(msgId);if(!cur)return;cur.streamRAF=null;const mi=chatMsgs.findIndex(m=>m.id===msgId),el=document.getElementById('chatCt-'+mi);if(el){const sec=cur.startTime?Math.floor((Date.now()-cur.startTime)/1000):0;const reasoning=cur.reasoningContent||'';let thinkH='<div class="ch-think'+(reasoning?'':' empty')+'" id="chatThink-'+mi+'"><div class="th-hd"><span>🤔 思考中</span><span class="th-time">'+sec+'s</span><button class="ch-stop-btn" onclick="chatStop(\''+escA(msgId)+'\')" style="padding:2px 8px;font-size:10px;margin-left:6px">⏹ 停止</button></div><div class="th-body">'+(reasoning?esc(reasoning):'<span class="typing-dots"><span></span><span></span><span></span></span> 等待模型输出...')+'</div></div>';el.style.whiteSpace='pre-wrap';el.innerHTML=thinkH+esc(cur.content||'')}if(chatAutoScroll)chatScrollToBottom()})}

//== chatStop ==//
function chatStop(msgId){if(msgId)chatGenReqs[msgId]?.abort?.abort();else Object.values(chatGenReqs||{}).forEach(r=>r?.abort?.abort())}

//== chatFinalize ==//
function chatFinalize(msgId){const req=chatGetReq(msgId);if(req?.streamRAF)cancelAnimationFrame(req.streamRAF);if(msgId)delete chatGenReqs[msgId];renderChatMsgs();chatSaveMsgs();chatUpdateTokInfo()}

//== chatExecPatch ==//
function chatExecPatch(msgIdx){const m=chatMsgs[msgIdx];if(!m?.content)return;const code=document.getElementById('txA').value;if(!code){toast('面板A无代码');return}document.getElementById('txA').value=code;document.getElementById('txB').value=m.content;_returnToChat=true;curMode='patch';runPatch();if(patchResultText){document.getElementById('txA').value=patchOriginalText}updateChatCodeInfo()}

//== chatInsertAfter ==//
function chatInsertAfter(i){showModal('➕ 在 #'+(i+1)+' 后插入','<div class="sv-field"><label>角色</label><div style="display:flex;gap:6px"><button class="tbtn" id="ciR_user" onclick="document.getElementById(\'ciRole\').value=\'user\';document.getElementById(\'ciR_user\').className=\'tbtn active\';document.getElementById(\'ciR_assistant\').className=\'tbtn\'" style="flex:1">👤 用户</button><button class="tbtn" id="ciR_assistant" onclick="document.getElementById(\'ciRole\').value=\'assistant\';document.getElementById(\'ciR_assistant\').className=\'tbtn active\';document.getElementById(\'ciR_user\').className=\'tbtn\'" style="flex:1">🤖 AI</button></div><input type="hidden" id="ciRole" value="user"></div><div class="sv-field"><label>内容</label><textarea id="ciContent" rows="5"></textarea></div>','<button class="tbtn" onclick="hideModal()">取消</button><button class="tbtn primary" onclick="chatDoInsert('+i+')">插入</button>')}

//== chatDoInsert ==//
function chatDoInsert(i){const role=document.getElementById('ciRole')?.value||'user';const content=document.getElementById('ciContent')?.value?.trim();if(!content){toast('请输入内容');return}chatMsgs.splice(i+1,0,chatTouchMsg({id:Date.now().toString(36)+'i',role,content,time:new Date().toISOString()}));hideModal();renderChatMsgs();chatSaveMsgs()}

//== chatToggleMute ==//
function chatToggleMute(i){if(!chatMsgs[i])return;chatMsgs[i].muted=!chatMsgs[i].muted;chatTouchMsg(chatMsgs[i]);renderChatMsgs();chatSaveMsgs();chatUpdateTokInfo();toast(chatMsgs[i].muted?'🔇 已屏蔽':'🔊 已恢复')}

//== chatSendFrom ==//
async function chatSendFrom(i){if(!chatApiId||!chatModel){toast('请先选模型');return}const cfg=getAllApis().find(a=>a.id===chatApiId);if(!cfg){toast('API不存在');return}const now=new Date().toISOString();const aiMsg=chatTouchMsg({id:Date.now().toString(36)+'a',role:'assistant',content:'',time:now,model:chatModel},now);chatMsgs.splice(i+1,0,aiMsg);chatAutoScroll=true;renderChatMsgs();chatExecReq(cfg,aiMsg,i,null)}

//== chatCopyMsg ==//
function chatCopyMsg(i){navigator.clipboard.writeText(chatMsgs[i]?.content||'').then(()=>toast('✓ 已复制'))}

//== chatEditMsg ==//
function chatEditMsg(i){const m=chatMsgs[i];if(!m)return;showModal('✏️ 编辑','<div class="sv-field"><label>内容</label><textarea id="chatEditTa" style="min-height:200px">'+esc(m.content||'')+'</textarea></div>','<button class="tbtn" onclick="hideModal()">取消</button><button class="tbtn primary" onclick="chatDoEditMsg('+i+')">保存</button>')}

//== chatDoEditMsg ==//
function chatDoEditMsg(i){if(!chatMsgs[i])return;chatMsgs[i].content=document.getElementById('chatEditTa')?.value||'';chatTouchMsg(chatMsgs[i]);hideModal();renderChatMsgs();chatSaveMsgs()}

//== chatDeleteMsg ==//
function chatDeleteMsg(i){if(!chatMsgs[i]||!confirm('删除？'))return;const now=new Date().toISOString();chatMsgs[i].deletedAt=now;chatTouchMsg(chatMsgs[i],now);renderChatMsgs();chatSaveMsgs()}

//== chatClear ==//
function chatClear(){if(!chatVisibleMsgs().length||!confirm('清空？'))return;Object.values(chatGenReqs||{}).forEach(r=>r?.abort?.abort());const now=new Date().toISOString();chatMsgs.forEach(m=>{if(!m.deletedAt){m.deletedAt=now;chatTouchMsg(m,now)}});renderChatMsgs();chatSaveMsgs();toast('✓')}

//== chatAttachDiff ==//
function chatAttachDiff(){if(!modHist.length){toast('无记录');return}const m=modHist[0];if(!m.codeBefore&&!m.codeAfter){toast('无diff');return}let dt='[最近修改: '+m.action+']\n';if(m.codeBefore&&m.codeAfter){const ops=myersDiff(m.codeBefore.split('\n'),m.codeAfter.split('\n'));const lines=[];ops.forEach(op=>{if(op.op==='del')lines.push('- '+m.codeBefore.split('\n')[op.idxA]);else if(op.op==='ins')lines.push('+ '+m.codeAfter.split('\n')[op.idxB])});dt+=(lines.length>200?lines.slice(0,200).concat(['...(共'+lines.length+'行差异)']):lines).join('\n')}const ta=document.getElementById('chatIn');ta.value=(ta.value?ta.value+'\n\n':'')+dt;chatAutoResize(ta);ta.focus();toast('✓ 已附加')}

//== chatAttachHistory ==//
function chatAttachHistory(){if(!modHist.length){toast('无记录');return}let text='[修改历史]\n';modHist.slice(0,5).forEach((m,i)=>{const t=m.time?new Date(m.time).toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit',second:'2-digit'}):'';text+='#'+(modHist.length-i)+' '+t+' '+m.action+(m.patchCount?' ('+m.okCount+'/'+m.patchCount+'✅)':'')+'\n'});const ta=document.getElementById('chatIn');ta.value=(ta.value?ta.value+'\n\n':'')+text;chatAutoResize(ta);ta.focus()}

//== chatAttachLog ==//
function chatAttachLog(){const parts=[];const rpt=buildPatchReportText();if(rpt)parts.push(rpt);if(patchReport.length>0&&patchMeta.time)parts.push(buildPatchLog());if(diffRows.length>0)parts.push(buildDiffLog());if(!parts.length){toast('无报告/日志');return}const ta=document.getElementById('chatIn');ta.value=(ta.value?ta.value+'\n\n':'')+parts.join('\n\n');chatAutoResize(ta);ta.focus();toast('✓ 已附加报告/日志')}

//== chatSaveMsgs ==//
async function chatSaveMsgs(){if(!curProjDirH)return;try{let disk=[];try{const old=await curProjDirH.getFileHandle('chat.json');const d=JSON.parse(await(await old.getFile()).text());disk=d.msgs||[]}catch(e){}const merged=chatMergeMsgs(disk,chatMsgs);const f=await curProjDirH.getFileHandle('chat.json',{create:true});const w=await f.createWritable();await w.write(JSON.stringify({msgs:merged,apiId:chatApiId,model:chatModel},null,2));await w.close();chatMsgs=merged;saveWinState({chatApiId:chatApiId,chatModel:chatModel})}catch(e){}}

//== chatLoadMsgs ==//
async function chatLoadMsgs(){chatMsgs=[];if(!curProjDirH)return;try{const f=await curProjDirH.getFileHandle('chat.json');const d=JSON.parse(await(await f.getFile()).text());chatMsgs=chatMergeMsgs([],d.msgs||[]);if(d.apiId){chatApiId=d.apiId;chatModel=d.model||'';saveWinState({chatApiId:chatApiId,chatModel:chatModel});updateChatApiUI()}}catch(e){chatMsgs=[]}}

//== chatHandleKey ==//
function chatHandleKey(e){if(e.key==='Enter'&&e.shiftKey){e.preventDefault();chatSaveOnly()}else if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();chatSend()}}

//== chatAutoResize ==//
function chatAutoResize(el){el.style.height='auto';el.style.height=Math.min(el.scrollHeight,120)+'px'}

//== chatEstimateTok ==//
function chatEstimateTok(){const code=document.getElementById('txA').value,inp=document.getElementById('chatIn')?.value||'';const ct=cntTok(code),st=cntTok(patchCfg.systemPrompt),ht=chatMsgs.reduce((s,m)=>s+(m.deletedAt||m.muted?0:cntTok((m.content||'')+(m.reasoningContent||''))),0),it=cntTok(inp);return{code:ct,sys:st,hist:ht,inp:it,total:ct+st+ht+it}}

//== chatUpdateTokInfo ==//
function chatUpdateTokInfo(){const el=document.getElementById('chatTokInfo');const t=chatEstimateTok();el.innerHTML='~<strong>'+(t.total/1000).toFixed(1)+'K</strong> tok | 代码:'+(t.code/1000).toFixed(1)+'K | 提示词:'+(t.sys/1000).toFixed(1)+'K | 对话:'+(t.hist/1000).toFixed(1)+'K | 输入:'+(t.inp/1000).toFixed(1)+'K'}

//== chatIsAtBottom ==//
function chatIsAtBottom(){const wrap=document.getElementById('chatMsgWrap');if(!wrap)return true;return wrap.scrollHeight-wrap.scrollTop-wrap.clientHeight<24}

//== chatScrollToBottom ==//
function chatScrollToBottom(){const wrap=document.getElementById('chatMsgWrap');if(!wrap)return;wrap.scrollTop=wrap.scrollHeight}

//== chatBindScroll ==//
function chatBindScroll(){setTimeout(()=>{const wrap=document.getElementById('chatMsgWrap');if(!wrap||wrap.dataset.boundScroll)return;wrap.dataset.boundScroll='1';wrap.addEventListener('scroll',()=>{chatAutoScroll=chatIsAtBottom()},{passive:true})},0)}
</script>
