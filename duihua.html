function tempAppendixMergeKey(ta){return[(ta.name||'').trim(),ta.content||'',String(normalizeDepth(ta.insertDepth))].join('\u0001')}
function mergeTempAppendicesForImport(localList,importList){
const out=syncClone(localList||[]),byId={},byKey={};
out.forEach((ta,i)=>{if(ta?.id)byId[ta.id]=i;byKey[tempAppendixMergeKey(ta)]=i});
(importList||[]).forEach(src=>{
const imp=syncClone(src||{});const exact=tempAppendixMergeKey(imp);
if(byKey[exact]!==undefined){out[byKey[exact]]={...out[byKey[exact]],...imp};return}
if(imp.id&&byId[imp.id]!==undefined){
const cur=out[byId[imp.id]];
if((cur.content||'')===(imp.content||'')){out[byId[imp.id]]={...cur,...imp};byKey[tempAppendixMergeKey(out[byId[imp.id]])]=byId[imp.id];return}
imp.id='ta_'+gid2()
}
out.push(imp);if(imp.id)byId[imp.id]=out.length-1;byKey[exact]=out.length-1
});
return out
}

}
function normalizeExistingGroupId(gid,fallback){
const fb=(fallback&&fallback!=='_default'&&groups.find(g=>g.id===fallback))?fallback:'_default';
if(!gid)return fb;
if(gid==='_default')return'_default';
return groups.find(g=>g.id===gid)?gid:fb
}
function resolveImportGroupId(gid,fallback){return normalizeExistingGroupId(gid,fallback)}
function applyImportedConvStateFields(target,ic,keys){
const ks=new Set(keys||[]);if(!target||!ic||!ks.size)return false;
let changed=false;const mark=part=>{const partName=convPartName(part);target.fieldClocks={...(target.fieldClocks||{})};target.fieldClocks[partName]=causalClockMerge(target.fieldClocks[partName],ic.fieldClocks?.[partName]);touchConv(target,partName);changed=true};
if(ks.has('name')){target.name=ic.name||target.name||'?';mark('meta')}
if(ks.has('pinned')){target.pinned=!!ic.pinned;mark('meta')}
if(ks.has('groupId')){target.groupId=resolveImportGroupId(ic.groupId,target.groupId||'_default');mark('meta')}
if(ks.has('convParams')){target.convParams=syncClone(ic.convParams||{});mark('params')}
if(ks.has('lockedModel')){target.lockedModel=syncClone(ic.lockedModel||null);mark('params')}
if(ks.has('materialConfig')){target.materialConfig=syncClone(ic.materialConfig||defMC());mark('materials')}
if(ks.has('foldGroups')){target.foldGroups=syncClone(ic.foldGroups||[]);mark('uiState')}
if(ks.has('foldedMsgIds')){target.foldedMsgIds=syncClone(ic.foldedMsgIds||[]);mark('uiState')}
if(ks.has('tempAppendices')){target.tempAppendices=mergeTempAppendicesForImport(target.tempAppendices||[],ic.tempAppendices||[]);mark('tempAppendices')}
if(changed){ensureConvTimestamps(target);target.updatedAt=[target.updatedAt,...CONV_TIME_FIELDS.map(k=>target[k])].filter(Boolean).sort().pop()||target.updatedAt}

}
function buildImportedConvPayload(ic,opts){
opts=opts||{};
const now=new Date().toISOString();
const c={id:opts.id||ic.id||gid2(),name:ic.name||'?',pinned:!!ic.pinned,order:opts.order??0,groupId:opts.groupId||ic.groupId||'_default',createdAt:ic.createdAt||now,updatedAt:ic.updatedAt||now};
if(ic._importOriginKey)c._importOriginKey=ic._importOriginKey;
applyImportedConvState(c,ic,{groupId:c.groupId});
if(!ic.updatedAt)touchConv(c,['content','meta','params','materials','uiState','tempAppendices'],now);

}

//== makeBranchName ==//
function makeBranchName(baseName,groupId){
const prefix=baseName+' (分支';
const exists=convList.filter(c=>(c.groupId||'_default')===(groupId||'_default')&&(c.name===baseName+' (分支)'||c.name.startsWith(prefix))).length;
return exists?baseName+' (分支'+(exists+1)+')':baseName+' (分支)'
}

//== branchOrderOffset ==//
function branchOrderOffset(baseName,groupId){
const prefix=baseName+' (分支';
const exists=convList.filter(c=>(c.groupId||'_default')===(groupId||'_default')&&(c.name===baseName+' (分支)'||c.name.startsWith(prefix))).length;
return (exists+1)/1000
}

//== normalizeGroupOrderMeta ==//
function normalizeGroupOrderMeta(gid,opts){
opts=opts||{};
sortConvList();
const items=convList.filter(c=>(c.groupId||'_default')===(gid||'_default'));
items.forEach((c,i)=>{c.order=i});
scheduleIndexSave(opts)
}

//== execClean ==//
async function execClean(){
const sc=document.getElementById('clnS').value;
const dq=document.getElementById('clnQ').checked;
const dz=document.getElementById('clnZ').checked;
if(!dq&&!dz)return;
let tc=0,fail=0;
async function cl(c){
if(!c?.messages)return{changed:0,saved:true};
const snap={messages:syncClone(c.messages||[]),updatedAt:c.updatedAt,contentUpdatedAt:c.contentUpdatedAt};
let ch=0;
c.messages.forEach(m=>{
let t=m.content||'';
const o=t;
if(dq)t=t.replace(/^(> ){2,}/gm,'');
if(dz)t=t.replace(/[\u200B\u200C\u200D\uFEFF\u00AD]/g,'');
if(t!==o){
m.content=t;
delete m._mdCache;
delete m._mdKey;
delete m._tok;
delete m._tokKey;
ch++
}
});
if(!ch)return{changed:0,saved:true};
touchConv(c,'content');
const saved=await saveConvF(c);
if(!saved){
c.messages=snap.messages;
c.updatedAt=snap.updatedAt;
c.contentUpdatedAt=snap.contentUpdatedAt;
return{changed:ch,saved:false}
}
return{changed:ch,saved:true}
}
if(sc==='current'){
if(curConv){
const r=await cl(curConv);
if(r.saved)tc+=r.changed;else fail++
}
}else{
for(const m of convList){
const c=m.id===curConvId&&curConv?curConv:await loadConvFull(m.id);
if(!c)continue;
const r=await cl(c);
if(r.saved)tc+=r.changed;else fail++
}
}
hideMo();
if(curConv)renderMsgs();
if(fail)toast(`⚠️ 清理 ${tc} 条，${fail} 个对话保存失败，失败项已回滚`);
else ok(`清理 ${tc} 条`)}

//== fmtCny ==//
function fmtCny(v){if(v===null||v===undefined||isNaN(v))return'--';if(v===0)return'0';return v<0.01&&v>0?v.toFixed(4):v<1?v.toFixed(3):v<100?v.toFixed(2):v.toFixed(1)}

//== getModelPrice ==//
function getModelPrice(apiId,model){if(!apiId||!model)return null;const p=priceTable[apiId+'||'+model];if(!p)return null;const b=String(p.billing||'').toLowerCase();if(b==='request'||b==='token')return p;if(b.includes('按量')||b.includes('token'))p.billing='token';else if(b.includes('按次')||b.includes('request')||b.includes('req')||b.includes('call'))p.billing='request';else if(p.inputPerM!=null||p.outputPerM!=null)p.billing='token';else if(p.perReq!=null)p.billing='request';return p}

//== estimateCost ==//
function estimateCost(apiId,model,inputTok,outputTok){const p=getModelPrice(apiId,model);if(!p)return null;if(p.billing==='request')return p.perReq||0;return(inputTok||0)/1e6*(p.inputPerM||0)+(outputTok||0)/1e6*(p.outputPerM||0)}

//== recordCostLog ==//
async function recordCostLog(cid,req){const conv=cid===curConvId&&curConv?curConv:null;const cfg=apiConfigs.find(c=>c.id===req.apiId);const p=getModelPrice(req.apiId,req.model);const u=req.usage||{};const inTok=u.prompt_tokens||req._inputTok||0;const outTok=u.completion_tokens||cntTok(req.content||'');const cacheHit=u.prompt_cache_hit_tokens||0;const cacheMiss=u.prompt_cache_miss_tokens||0;let cost=null,snap=null;if(p){snap={billing:p.billing};if(p.billing==='request'){cost=p.perReq||0;snap.perReq=p.perReq}else{if(cacheHit||cacheMiss){cost=cacheHit/1e6*(p.cacheReadPerM||p.inputPerM*0.02||0)+cacheMiss/1e6*(p.inputPerM||0)+outTok/1e6*(p.outputPerM||0)}else{cost=inTok/1e6*(p.inputPerM||0)+outTok/1e6*(p.outputPerM||0)}snap.inputPerM=p.inputPerM;snap.outputPerM=p.outputPerM;if(p.cacheReadPerM)snap.cacheReadPerM=p.cacheReadPerM}}const now=new Date();const entry={id:'cost_'+gid2(),time:now.toISOString(),day:fmtD(now),month:fmtD(now).slice(0,7),convId:cid,convName:conv?.name||'?',apiId:req.apiId,apiName:cfg?.name||'?',model:req.model,billing:p?.billing||null,inputTok:inTok,outputTok:outTok,totalTok:inTok+outTok,cacheHit,cacheMiss,cost,status:req.status||'completed',priceSnapshot:snap};costLogs.unshift(entry);const saved=await saveCostLogs();if(!saved){_syncLastError='费用日志已保留在内存，写盘失败，请重试';syncTrace('costLog.savePending',{id:entry.id,convId:cid});toast('⚠️ 费用日志已记录但尚未写入工作文件夹')}updateCostDisplay();return saved}

//== costLogStableId ==//
function costLogStableId(x){
const s=[x.time||'',x.convId||'',x.apiId||'',x.model||'',x.inputTok||0,x.outputTok||0,x.cost??'',x.status||''].join('|');
let h=2166136261;
for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}
return'cost_'+(h>>>0).toString(36)
}

if(cost!==null&&cost!==undefined&&cost!=='')cost=parseFloat(cost);
else cost=null;
if(cost!==null&&isNaN(cost))cost=null;
return{
id:item.id||costLogStableId({time:d.toISOString(),convId:item.convId||'',apiId:item.apiId||'',model:item.model||'',inputTok,outputTok,cost,status:item.status||'completed'}),
time:d.toISOString(),
day,
month,
convId:item.convId||'',
convName:item.convName||'?',
apiId:item.apiId||'',
apiName:item.apiName||'?',
model:item.model||'',
billing:item.billing||null,
inputTok,
outputTok,
totalTok,
cost,
status:item.status||'completed',
priceSnapshot:item.priceSnapshot||null,
source:item.source||'chatTool',
version:item.version||1
}
}

//== mergeCostLogs ==//
function mergeCostLogs(base,incoming){
const out=[],seen=new Set();
let added=0,skipped=0,invalid=0;
(base||[]).forEach(x=>{const n=normalizeCostLog(x);if(!n){invalid++;return}if(seen.has(n.id)){skipped++;return}seen.add(n.id);out.push(n)});
(incoming||[]).forEach(x=>{const n=normalizeCostLog(x);if(!n){invalid++;return}if(seen.has(n.id)){skipped++;return}seen.add(n.id);out.push(n);added++});
out.sort((a,b)=>new Date(b.time)-new Date(a.time));
return{items:out.slice(0,50000),added,skipped,invalid}
}

//== mergePriceTable ==//
function mergePriceTable(base,incoming){
const out={...(base||{})};
let added=0,updated=0,invalid=0;
Object.entries(incoming||{}).forEach(([k,p])=>{
if(!p||!p.apiId||!p.model){invalid++;return}
const key=p.apiId+'||'+p.model;
const isNew=!out[key];
out[key]={...p,updatedAt:new Date().toISOString()};
if(isNew)added++;else updated++;
});
return{items:out,added,updated,invalid}
}

//== getCostStats ==//
function getCostStats(period,apiFilter){const now=new Date(),td=fmtD(now),tm=td.slice(0,7);let fl=costLogs;if(period==='today')fl=fl.filter(l=>l.day===td);else if(period==='month')fl=fl.filter(l=>l.month===tm);else if(period==='lastMonth'){const lm=new Date(now.getFullYear(),now.getMonth()-1,1);const ls=fmtD(lm).slice(0,7);fl=fl.filter(l=>l.month===ls)}else if(period==='week'){const ws=fmtD(new Date(now-7*864e5));fl=fl.filter(l=>l.day>=ws)}else if(period==='30d'){const ws=fmtD(new Date(now-30*864e5));fl=fl.filter(l=>l.day>=ws)}if(apiFilter)fl=fl.filter(l=>l.apiId===apiFilter);const total=fl.reduce((s,l)=>s+(l.cost||0),0),count=fl.length;const bM={},bA={},bC={},bD={};fl.forEach(l=>{const mk=l.model||'?';if(!bM[mk])bM[mk]={model:mk,cost:0,count:0};bM[mk].cost+=(l.cost||0);bM[mk].count++;const ak=l.apiName||'?';if(!bA[ak])bA[ak]={apiName:ak,cost:0,count:0};bA[ak].cost+=(l.cost||0);bA[ak].count++;const ck=l.convId||'?';if(!bC[ck])bC[ck]={convName:l.convName||'?',cost:0,count:0};bC[ck].cost+=(l.cost||0);bC[ck].count++;const dk=l.day||'?';if(!bD[dk])bD[dk]={day:dk,cost:0,count:0};bD[dk].cost+=(l.cost||0);bD[dk].count++});return{total,count,byModel:Object.values(bM).sort((a,b)=>b.cost-a.cost),byApi:Object.values(bA).sort((a,b)=>b.cost-a.cost),byConv:Object.values(bC).sort((a,b)=>b.cost-a.cost),byDay:Object.values(bD).sort((a,b)=>a.day.localeCompare(b.day))}}

//== getLast30DaysCosts ==//
function getLast30DaysCosts(){const days=[];const now=new Date();for(let i=29;i>=0;i--)days.push(fmtD(new Date(now-i*864e5)));const bd={};costLogs.forEach(l=>{if(l.day&&l.cost){if(!bd[l.day])bd[l.day]=0;bd[l.day]+=(l.cost||0)}});return days.map(d=>({day:d,cost:bd[d]||0}))}

//== updateCostDisplay ==//
function updateCostDisplay(packTotalTok,attachTok){const el=document.getElementById('costInfo');if(!el)return;if(!costSettings.enabled){el.textContent='';el.style.display='none';return}el.style.display='';const tdy=getCostStats('today').total;let parts=['💰今日¥'+fmtCny(tdy)];if(curConv&&packTotalTok!==undefined){const{apiId:_a,model:_m}=getActiveModel(curConv);const p=getModelPrice(_a,_m);if(p){if(p.billing==='request')parts.push('本轮¥'+fmtCny(p.perReq)+'/次');else{const est=(packTotalTok+(attachTok||0))/1e6*(p.inputPerM||0)+costSettings.defaultOutputTok/1e6*(p.outputPerM||0);parts.push('~¥'+fmtCny(est))}}else parts.push('未配价')}el.textContent=parts.join(' | ')}

//== checkCostBeforeSend ==//
function checkCostBeforeSend(apiId,model,inputTok){if(!costSettings.enabled)return true;const p=getModelPrice(apiId,model);if(!p){if(costSettings.requireConfirmNoPrice)return confirm('当前模型未配置价格，无法估算费用。\n继续发送？');return true}const reasons=[];let estCost=0;const cfg=apiConfigs.find(c=>c.id===apiId);const apiNm=cfg?.name||'?';if(p.billing==='request'){estCost=p.perReq||0;if(estCost>costSettings.warnReqCost)reasons.push('单次¥'+fmtCny(estCost)+' > ¥'+costSettings.warnReqCost)}else{const outEst=costSettings.defaultOutputTok;estCost=inputTok/1e6*(p.inputPerM||0)+outEst/1e6*(p.outputPerM||0);if(inputTok>costSettings.warnTokenInput)reasons.push('输入'+Math.round(inputTok/1000)+'K tok > '+Math.round(costSettings.warnTokenInput/1000)+'K');if(estCost>costSettings.warnReqCost)reasons.push('预估¥'+fmtCny(estCost)+' > ¥'+costSettings.warnReqCost)}const ms=getCostStats('month');if(costSettings.monthlyBudget>0&&ms.total/costSettings.monthlyBudget>costSettings.warnMonthRatio)reasons.push('月预算'+Math.round(ms.total/costSettings.monthlyBudget*100)+'%');if(!reasons.length)return true;const billing=p.billing==='request'?'按次':'按量';let msg='⚠️ 费用提醒\n\n模型：'+model+'\n渠道：'+apiNm+'\n计费：'+billing+'\n';if(p.billing==='token')msg+='输入：'+inputTok.toLocaleString()+' tok → ¥'+fmtCny(inputTok/1e6*(p.inputPerM||0))+'\n预估输出：'+costSettings.defaultOutputTok+' tok → ¥'+fmtCny(costSettings.defaultOutputTok/1e6*(p.outputPerM||0))+'\n';msg+='预估总计：¥'+fmtCny(estCost)+'\n\n触发：'+reasons.join(' | ')+'\n本月已用：¥'+fmtCny(ms.total)+' / ¥'+costSettings.monthlyBudget;return confirm(msg)}

//== saveSyncSettings ==//
async function saveSyncSettings(){
const token=document.getElementById('syncToken').value.trim();
const repo=document.getElementById('syncRepo').value.trim();
const branch=document.getElementById('syncBranch').value.trim()||'main';
const deviceName=document.getElementById('syncDeviceName').value.trim();
const archiveEnabled=!!document.getElementById('syncArchiveEnabled')?.checked;

const archiveRunMode=document.getElementById('syncArchiveRunMode')?.value==='maintenance'?'maintenance':'main';
if(!token){toast('请填 Token');return}
if(!repo||!repo.includes('/')){toast('仓库格式: owner/repo');return}
if(!folderH){toast('请先选择工作文件夹');return}
const rootHandle=folderH,folderIdentity=_folderIdentityGen,loadGen=_folderLoadGen;
const guard=()=>folderH===rootHandle&&_folderIdentityGen===folderIdentity&&isFolderLoadCurrent(loadGen);
const oldConfig={...syncConfig};
const oldEnabled=syncEnabled,oldDetached=syncDetached,oldFolderLoaded=_syncFolderConfigLoaded,oldFolderIdentity=_syncFolderConfigIdentity;
const targetChanged=oldConfig.repo!==repo||(oldConfig.branch||'main')!==branch;
const connectionChanged=targetChanged||oldConfig.token!==token;
syncInvalidateSession('settings-save');
await syncAwaitSessionQuiescent();
if(!guard()){toast('工作文件夹已切换，未保存同步设置');return}
await persistSyncQueues();
const oldRuntime={
meta:JSON.parse(JSON.stringify(syncMeta)),dirty:{..._syncDirty},inflight:{..._syncInflightDirty},failed:{..._syncFailedForever},lastError:_syncLastError,status:_syncStatus
};
const restoreOld=()=>{
syncConfig=oldConfig;
syncMeta=oldRuntime.meta;
_syncDirty=oldRuntime.dirty;
_syncInflightDirty=oldRuntime.inflight;
_syncFailedForever=oldRuntime.failed;
_syncLastError=oldRuntime.lastError;
_syncStatus=oldRuntime.status;
syncEnabled=oldEnabled;
syncDetached=oldDetached;
_syncFolderConfigLoaded=oldFolderLoaded;
_syncFolderConfigIdentity=oldFolderIdentity;
_syncSessionTransitioning=false;
_syncSessionAbortController=new AbortController();
if(syncCanRun())syncStartPolling();
syncUpdateStatusBtn()
};
syncConfig={...oldConfig,token,repo,branch,workspaceId:oldConfig.workspaceId||('ws_'+gid2())};
if(connectionChanged){ghClearConditionalReadCache();_ghRate={limit:0,remaining:0,reset:0,pauseUntil:0}}
syncConfig.deviceName=deviceName||(isMobile?'手机':'电脑');

syncConfig.archiveRunMode=archiveRunMode;
if(!syncConfig.deviceId)syncConfig.deviceId='dev_'+gid2();
toast('测试连接中...');
const r=await ghApi('GET','/repos/'+repo,null,{timeout:15000,token,allowInactive:true});
if(!r.ok){restoreOld();toast('❌ '+r.error);return}
syncDetached=false;
syncConfig.detached=false;
_syncFolderConfigLoaded=true;
_syncFolderConfigIdentity=_folderIdentityGen;
try{
const persisted=await saveSyncConfigFile(rootHandle,guard);
if(!persisted)throw new Error('同步配置未写入工作文件夹');
if(!guard())throw new Error('同步设置保存期间切换了工作文件夹')
}catch(e){restoreOld();toast('❌ 同步设置保存失败: '+(e.message||e.name));return}
try{localStorage.setItem('syncConfig',JSON.stringify({...syncConfig,detached:false}))}catch(e){}
if(targetChanged){
syncResetRuntimeForFolder();
loadSyncMeta();
await loadSyncMetaFile(rootHandle,guard);
if(!guard())return;
try{await loadSyncQueuesIDB()}catch(e){_syncLastError='同步队列读取失败: '+(e.message||e.name)}
}
syncOpenSession();
syncRepairRetryableFailedQueue('saveSyncSettings');
syncStartPolling();
syncUpdateStatusBtn();
ensureSyncStatusBtnPoll();
hideMo();
toast((oldEnabled&&oldConfig.detached?'✅ 已重新连接：':'✅ 同步已启用：')+r.data.full_name)
}

_syncManualPushRunning=true;
_syncLastManualPushResult=null;

//== syncManualPull ==//
async function syncManualPull(){
if(!syncCanRun()){toast(syncInactiveHint('执行手动拉取'));return}
if(!folderH){toast('请先选择工作文件夹');return}
if(_syncStatus==='syncing'||_syncPollRunning){toast('后台同步正在进行，完成后可查看手动拉取进度');return}
if(!confirm('将从 GitHub 拉取最新数据。\n\n本地未推送的修改会保留为分支，绝不覆盖。继续？'))return;
const pullLease=syncAcquirePollLease('manual');
if(!pullLease){toast('已有同步任务开始运行，本次手动拉取未启动');return}
showMo('⬇️ 手动拉取',`<div style="text-align:center;padding:20px"><div id="pullStatus">准备中...</div><div class="prog-bar"><div class="prog-fill" id="pullFill" style="width:0%"></div></div><div class="prog-text" id="pullText">0%</div><div style="font-size:10px;color:var(--tx-m);margin-top:6px">可切到电脑后台；若浏览器暂停页面，返回后会继续检查</div></div>`,'');
await new Promise(r=>setTimeout(r,30));
 const upd=(txt,pct)=>{const s=document.getElementById('pullStatus'),f=document.getElementById('pullFill'),t=document.getElementById('pullText');const n=Math.max(0,Math.min(100,Math.round(pct)));if(s)s.textContent=txt;if(f)f.style.width=n+'%';if(t)t.textContent=n+'%'};
 _syncLastPullErrors=[];
 try{
  upd('读取远端配置...',3);
  const sharedResult=await syncPullSharedFiles(true,p=>{const pct=3+(p.current/Math.max(1,p.total))*27;upd(`配置 ${p.current}/${p.total}：${p.name}`,pct)});
  if(sharedResult?.cancelled)throw new Error('同步会话已失效或工作文件夹已切换');
  if(sharedResult&&!sharedResult.ok&&!sharedResult.errors?.length)throw new Error('共享文件拉取未完成');
  upd('读取远端对话索引...',32);
  delete syncMeta.fileSHAs['_index.json'];
  const indexResult=await syncCheckAndPullIncr(true,true,p=>{const pct=32+(p.current/Math.max(1,p.total))*63;upd(`对话 ${p.current}/${p.total}：${p.name}`,pct)});
  if(indexResult?.reset){
   hideMo();
   toast('☢️ 云端已重置，同步已断开；本地内容未被回滚');
   return
  }
  if(indexResult?.missing){
   hideMo();
   toast('ℹ️ 云端暂无索引；本地内容已保留，未自动清空');
   return
  }
  if(indexResult&&!indexResult.ok&&!indexResult.errors?.length)throw new Error('远端索引拉取未完成');
  upd('完成',100);
  const errors=[...new Set([...(sharedResult?.errors||[]),...(indexResult?.errors||[]),...(_syncLastPullErrors||[])])];
  setTimeout(()=>{
   hideMo();
   if(!errors.length){toast('✅ 手动拉取完成')}
   else{
    const errMsg=errors.slice(0,10).join('\n');
    showMo('拉取结果（含错误）',`<div style="padding:10px"><div style="color:var(--wn);margin-bottom:6px">⚠️ 拉取过程中有 ${errors.length} 个错误：</div><div style="font-size:11px;color:var(--tx-m);white-space:pre-wrap;max-height:300px;overflow-y:auto">${esc(errMsg)}${errors.length>10?'\n...(还有'+(errors.length-10)+'个)':''}</div></div>`,`<button class="mo-btn pri" onclick="hideMo()">关闭</button>`)
   }
  },300)
 }catch(e){hideMo();toast('❌ 拉取失败: '+(e.message||''))}
 finally{syncReleasePollLease(pullLease);syncSchedulePoll(syncNextPollDelay())}
}

//== doPriceImport ==//
async function doPriceImport(){const apiId=document.getElementById('piApi').value;const fmt=document.getElementById('piFmt').value;const text=document.getElementById('piText').value.trim();if(!apiId){toast('请选择API');return}if(!text){toast('请粘贴数据');return}const cfg=apiConfigs.find(c=>c.id===apiId);const apiName=cfg?.name||'?';let items=[];if(fmt==='json'){const r=parsePriceJSON(text);if(r.error){toast('解析失败: '+r.error);return}items=r.items}else{const r=parsePriceMarkdown(text);if(r.error){toast('解析失败: '+r.error);return}items=r.items}if(!items.length){toast('未解析到有效数据');return}const snap=captureConfigEditSnapshot();let added=0,updated=0;items.forEach(it=>{const k=apiId+'||'+it.model;const isNew=!priceTable[k];priceTable[k]={apiId,apiName,model:it.model,billing:it.billing,perReq:it.perReq!=null?it.perReq:null,inputPerM:it.inputPerM!=null?it.inputPerM:null,outputPerM:it.outputPerM!=null?it.outputPerM:null,cacheReadPerM:it.cacheReadPerM!=null?it.cacheReadPerM:null,cacheCreatePerM:it.cacheCreatePerM!=null?it.cacheCreatePerM:null,note:it.note||'',updatedAt:new Date().toISOString()};if(isNew)added++;else updated++});if(!await saveConfigEditOrRollback(snap,{failMsg:'⚠️ 价格表导入保存失败，已回滚'}))return;popMo(true);toast(`✓ 导入${items.length}条 (新增${added}, 更新${updated})`)}

//== parsePriceJSON ==//
function parsePriceJSON(text){try{const d=JSON.parse(text);const items=d.items||d;if(!Array.isArray(items))return{error:'需要items数组',items:[]};return{items:items.filter(it=>it.model&&it.billing).map(it=>{const br=String(it.billing||'').toLowerCase();let billing;if(br.includes('按量')||br.includes('token'))billing='token';else if(br.includes('按次')||br.includes('request')||br.includes('req')||br.includes('call'))billing='request';else if(it.inputPerM!=null||it.outputPerM!=null)billing='token';else if(it.perReq!=null)billing='request';else billing='request';return{model:String(it.model).trim(),billing,perReq:it.perReq!=null?parseFloat(it.perReq):null,inputPerM:it.inputPerM!=null?parseFloat(it.inputPerM):null,outputPerM:it.outputPerM!=null?parseFloat(it.outputPerM):null,cacheReadPerM:it.cacheReadPerM!=null?parseFloat(it.cacheReadPerM):null,cacheCreatePerM:it.cacheCreatePerM!=null?parseFloat(it.cacheCreatePerM):null,note:it.note||''}})}}catch(e){return{error:e.message,items:[]}}}

//== parsePriceMarkdown ==//
function parsePriceMarkdown(text){const lines=text.trim().split('\n').filter(l=>l.includes('|'));if(lines.length<3)return{error:'表格行数不足',items:[]};const parseCols=line=>{const c=line.split('|').map(s=>s.trim());if(c[0]==='')c.shift();if(c.length&&c[c.length-1]==='')c.pop();return c};const hdrs=parseCols(lines[0]);const findC=(...kw)=>hdrs.findIndex(h=>kw.some(k=>h.includes(k)));const mc=findC('模型','model','Model');const bc=findC('计费','billing','类型');const rc=findC('单次','per_req','按次');const ic=findC('输入','input','Input');const oc=findC('输出','output','补全','Output','completion');if(mc===-1)return{error:'未找到模型列',items:[]};const extractNum=s=>{if(!s||s==='—'||s==='-'||s.trim()==='—'||s.trim()==='-')return null;const m=s.match(/[\d.]+/);return m?parseFloat(m[0]):null};const items=[];for(let i=1;i<lines.length;i++){const raw=lines[i];if(raw.includes('---')||raw.includes(':--'))continue;const cols=parseCols(raw);if(cols.length<=mc)continue;const model=cols[mc]?.trim();if(!model)continue;const billingRaw=bc>=0&&cols[bc]?cols[bc].trim():'';const perReq=rc>=0&&cols[rc]?extractNum(cols[rc]):null;const inputP=ic>=0&&cols[ic]?extractNum(cols[ic]):null;const outputP=oc>=0&&cols[oc]?extractNum(cols[oc]):null;let billing='request';if(billingRaw.includes('按量')||billingRaw.toLowerCase().includes('token'))billing='token';else if(billingRaw.includes('按次')||billingRaw.toLowerCase().includes('request'))billing='request';else if(inputP!=null&&perReq==null)billing='token';else if(perReq!=null)billing='request';else continue;items.push({model,billing,perReq:billing==='request'?perReq:null,inputPerM:billing==='token'?inputP:null,outputPerM:billing==='token'?outputP:null})}return{items}}

//== saveMatUndo ==//
async function writeMatUndoSnapshot(pending){if(!pending)return true;const h=pending.h,guard=typeof pending.guard==='function'?pending.guard:()=>true,items=pending.items||[];const json=JSON.stringify({items});try{if(h&&guard()){await writeFileVerified(h,'mat_undo.json',json,'素材撤销',guard)}}catch(e){}try{if(guard())localStorage.setItem('matUndo',JSON.stringify(items))}catch(e){}return guard()}
async function flushMatUndoSave(){if(!_matUndoTimer&&!_matUndoPending)return true;clearTimeout(_matUndoTimer);_matUndoTimer=null;const pending=_matUndoPending;_matUndoPending=null;return await writeMatUndoSnapshot(pending)}
function saveMatUndo(){const h=folderH,gen=_folderLoadGen,guard=()=>folderH===h&&isFolderLoadCurrent(gen),items=JSON.parse(JSON.stringify(matUndoList));_matUndoPending={h,gen,guard,items};clearTimeout(_matUndoTimer);_matUndoTimer=setTimeout(async()=>{const pending=_matUndoPending;_matUndoPending=null;_matUndoTimer=null;await writeMatUndoSnapshot(pending)},1000)}

//== matRestoreItem ==//
async function matRestoreItem(i){
const item=matUndoList[i];
if(!item)return;
const snap=snapshotSharedMaterialState();
let successMsg='';

if(item.type==='edit'){
let obj=materials;
for(let j=0;j<item.path.length-1;j++)obj=obj[item.path[j]];
obj[item.path[item.path.length-1]]=item.oldValue;
successMsg='↩ 已恢复: '+item.label
}
else if(item.type==='delChar'){
const d=item.data;
materials.chars[d.name]=d.char;
materials.charOrder.splice(d.orderIdx,0,d.name);
d.rels.forEach(r=>{
materials.rels[r.key]=r.data;
if(!materials.relIndex.includes(r.key))materials.relIndex.push(r.key)
});
successMsg='↩ 已恢复角色: '+d.name
}
else if(item.type==='delRel'){
const d=item.data;
materials.rels[d.key]=d.data;
if(!materials.relIndex.includes(d.key))materials.relIndex.push(d.key);
successMsg='↩ 已恢复关系: '+d.key
}
else if(item.type==='delApp'){
const d=item.data;
materials.apps[d.name]=d.content;
materials.appOrder.splice(d.orderIdx,0,d.name);
if(d.groups){
Object.entries(d.groups).forEach(([gn,has])=>{
if(has&&materials.appGroups[gn]&&!materials.appGroups[gn].includes(d.name))materials.appGroups[gn].push(d.name)
})
}
successMsg='↩ 已恢复附录: '+d.name
}
else if(item.type==='delMeta'){
const d=item.data;
materials.metaPrompts[d.name]=d.content;
materials.metaOrder.splice(d.orderIdx,0,d.name);
successMsg='↩ 已恢复: '+d.name
}
else if(item.type==='rename'){
const d=item.data,on=d.oldName,nn=d.newName;
if(!materials.chars[nn]){
toast('角色不存在: '+nn);
matUndoList.splice(i,1);
hideMo();
return
}
if(materials.chars[on]){
toast('角色名冲突: '+on);
matUndoList.splice(i,1);
hideMo();
return
}
materials.chars[on]=materials.chars[nn];
delete materials.chars[nn];
materials.charOrder=materials.charOrder.map(c=>c===nn?on:c);
const newRI=[];
materials.relIndex.forEach(k=>{
const rel=materials.rels[k];
const nf=rel.from===nn?on:rel.from;
const nt=rel.to===nn?on:rel.to;
const nk=nf+'→'+nt;
delete materials.rels[k];
materials.rels[nk]={d:rel.d,from:nf,to:nt};
newRI.push(nk)
});
materials.relIndex=newRI;
if(editState.expandedChars.has(nn)){
editState.expandedChars.delete(nn);
editState.expandedChars.add(on)
}
successMsg='↩ 已恢复改名: '+nn+'→'+on
}

const saved=await saveMatsOrRollback(snap,{render:renderMatEditMode,failMsg:'⚠️ 撤销恢复保存失败，记录已保留'});
if(!saved)return;
matUndoList.splice(i,1);
hideMo();
renderMatEditMode();
toast(successMsg)
}

//== initMatEditor ==//

//== migrateLocalMeta ==//
async function migrateLocalMeta(){
if(!localMeta||!Object.keys(localMeta).length)return;
const snap=snapshotSharedMaterialState();
const oldLocalMeta=syncClone(localMeta);
Object.entries(localMeta).forEach(([k,v])=>{
materials.metaPrompts[k]=v;
if(!materials.metaOrder.includes(k))materials.metaOrder.push(k)
});
localMeta={};
const saved=await saveMatsOrRollback(snap,{render:renderMatEditMode,failMsg:'⚠️ 本地元提示词合并保存失败，已回滚'});
if(!saved){
localMeta=oldLocalMeta;
return
}
if(!saveLocal()){
localMeta=oldLocalMeta;
toast('⚠️ 本地元提示词已写入素材，但旧缓存标记清理失败');
return
}
toast('✓ 本地元提示词已合并到素材')
}

//== doSaveWBKw ==//
async function doSaveWBKw(){
const ta=document.getElementById('wbKwTa');if(!ta)return;
const snap=snapshotSharedMaterialState();
if(!wbKeywords.chars)wbKeywords.chars={};
const lines=ta.value.split('\n');
const sortedNames=[...materials.charOrder].sort((a,b)=>b.length-a.length);
let changed=0;
lines.forEach(line=>{
const raw=line.trim();if(!raw)return;
const matched=sortedNames.find(name=>raw===name||raw.startsWith(name+':')||raw.startsWith(name+'：'));
if(!matched)return;
const after=raw.substring(matched.length).replace(/^[:：]\s*/,'');
const kws=[...new Set(after.split(/[,，]/).map(s=>s.trim()).filter(s=>s))];
wbKeywords.chars[matched]=kws;changed++});
const saved=await saveWBKeywords();
if(!saved){
restoreSharedMaterialState(snap);
toast('⚠️ 触发词保存失败，已回滚');
return
}
hideMo();
toast('✓ 已更新 '+changed+' 个角色的触发词')}

materials.charOrder.forEach((cn,ci)=>{
const c=materials.chars[cn];
let outC=0,inC=0;
materials.relIndex.forEach(k=>{const rel=materials.rels[k];if(rel.from===cn)outC++;if(rel.to===cn)inC++});
const kws=c.keywords||[];const hasH=c.h&&c.h.trim();
const isExp=editState.expandedChars.has(cn);
const curTab=editState.charTabs[cn]||'profile';
let outRels=[],inRels=[];

//== matDoRenameChar ==//
async function matDoRenameChar(oldName){
const newName=document.getElementById('m_newcharname').value.trim();
if(!newName){toast('请输入名称');return}
if(newName===oldName){hideMo();return}
if(materials.chars[newName]){toast('已存在');return}

const snap=snapshotSharedMaterialState();
matRecordDel('rename','改名:'+oldName+'→'+newName,{oldName,newName});

materials.chars[newName]=materials.chars[oldName];
delete materials.chars[oldName];
materials.charOrder=materials.charOrder.map(c=>c===oldName?newName:c);

const newRelIndex=[];
materials.relIndex.forEach(k=>{
const rel=materials.rels[k];
const nf=rel.from===oldName?newName:rel.from;
const nt=rel.to===oldName?newName:rel.to;
const nk=nf+'→'+nt;
delete materials.rels[k];
materials.rels[nk]={d:rel.d,from:nf,to:nt};
newRelIndex.push(nk)
});
materials.relIndex=newRelIndex;

let keywordChanged=false;
if(wbKeywords.chars&&wbKeywords.chars[oldName]){
wbKeywords.chars[newName]=wbKeywords.chars[oldName];
delete wbKeywords.chars[oldName];
keywordChanged=true
}
if(editState.expandedChars.has(oldName)){
editState.expandedChars.delete(oldName);
editState.expandedChars.add(newName)
}

const saved=await saveMatsOrRollback(snap,{render:renderMatCharTree,failMsg:'⚠️ 角色重命名保存失败，已回滚'});
if(!saved)return;

let keywordSaved=true;
if(keywordChanged)keywordSaved=await saveWBKeywords();
hideMo();
renderMatCharTree();
toast(keywordSaved?'✓ 已改名':'⚠️ 角色已改名，但触发词文件保存失败；请稍后重试保存')}

//== matDelChar ==//
async function matDelChar(cn){
if(!confirm(`删除「${cn}」及所有关系？`))return;
const snap=snapshotSharedMaterialState();
const charData=JSON.parse(JSON.stringify(materials.chars[cn]));
const relData=[];
materials.relIndex.forEach(k=>{const rel=materials.rels[k];if(rel.from===cn||rel.to===cn)relData.push({key:k,data:JSON.parse(JSON.stringify(rel))})});
const orderIdx=materials.charOrder.indexOf(cn);
matRecordDel('delChar','角色:'+cn,{name:cn,char:charData,rels:relData,orderIdx});
delete materials.chars[cn];
materials.charOrder=materials.charOrder.filter(c=>c!==cn);
materials.relIndex=materials.relIndex.filter(k=>{if(k.includes(cn+'→')||k.includes('→'+cn)){delete materials.rels[k];return false}return true});
editState.expandedChars.delete(cn);
let keywordChanged=false;
if(wbKeywords.chars&&wbKeywords.chars[cn]){
delete wbKeywords.chars[cn];
keywordChanged=true
}
const saved=await saveMatsOrRollback(snap,{render:renderMatCharTree,failMsg:'⚠️ 角色删除保存失败，已回滚'});
if(!saved)return;
let keywordSaved=true;
if(keywordChanged)keywordSaved=await saveWBKeywords();
renderMatCharTree();
toast(keywordSaved?'✓ 已删除':'⚠️ 角色已删除，但触发词文件保存失败；请稍后重试保存')}

//== matSaveRelEditor ==//
async function matSaveRelEditor(fromChar){
const snap=snapshotSharedMaterialState();
const toChar=document.getElementById('m_target').value;
const fk=fromChar+'→'+toChar;
const rk=toChar+'→'+fromChar;
const fv=document.getElementById('m_forward').value.trim();
const rv=document.getElementById('m_reverse').value.trim();

if(fv){
if(!materials.rels[fk]){
materials.rels[fk]={d:fv,from:fromChar,to:toChar};
materials.relIndex.push(fk)
}else{
materials.rels[fk].d=fv
}
}else if(materials.rels[fk]){
delete materials.rels[fk];
materials.relIndex=materials.relIndex.filter(k=>k!==fk)
}

if(rv){
if(!materials.rels[rk]){
materials.rels[rk]={d:rv,from:toChar,to:fromChar};
materials.relIndex.push(rk)
}else{
materials.rels[rk].d=rv
}
}else if(materials.rels[rk]){
delete materials.rels[rk];
materials.relIndex=materials.relIndex.filter(k=>k!==rk)
}

const saved=await saveMatsOrRollback(snap,{render:renderMatCharTree,failMsg:'⚠️ 关系保存失败，已回滚'});
if(!saved)return;
renderMatCharTree();
matUpdateRelEditor(fromChar);
toast('✓ 已保存')
}

//== matDoRenameApp ==//
async function matDoRenameApp(old){
const nw=document.getElementById('m_newname').value.trim();
if(!nw){toast('请输入');return}
if(nw!==old&&materials.apps[nw]){toast('已存在');return}
const snap=snapshotSharedMaterialState();
if(nw!==old){
materials.apps[nw]=materials.apps[old];
delete materials.apps[old];
materials.appOrder=materials.appOrder.map(a=>a===old?nw:a);
materials.groupOrder.forEach(g=>{if(materials.appGroups[g])materials.appGroups[g]=materials.appGroups[g].map(a=>a===old?nw:a)});
materials.charOrder.forEach(cn=>{if(materials.chars[cn].spotlightApps)materials.chars[cn].spotlightApps=materials.chars[cn].spotlightApps.map(a=>a===old?nw:a)});
if(materials.appKeywords[old]){materials.appKeywords[nw]=materials.appKeywords[old];delete materials.appKeywords[old]}
}
const saved=await saveMatsOrRollback(snap,{render:renderMatAppList,failMsg:'⚠️ 附录重命名保存失败，已回滚'});
if(!saved)return;
hideMo();renderMatAppList();ok()}

//== matDelApp ==//
async function matDelApp(n){
if(!confirm(`删除附录「${n}」？`))return;
const snap=snapshotSharedMaterialState();
const orderIdx=materials.appOrder.indexOf(n);
const groupInfo={};
materials.groupOrder.forEach(gn=>{groupInfo[gn]=(materials.appGroups[gn]||[]).includes(n)});
matRecordDel('delApp','附录:'+n,{name:n,content:materials.apps[n],orderIdx,groups:groupInfo});
delete materials.apps[n];
materials.appOrder=materials.appOrder.filter(a=>a!==n);
materials.groupOrder.forEach(g=>{if(materials.appGroups[g])materials.appGroups[g]=materials.appGroups[g].filter(a=>a!==n)});
materials.charOrder.forEach(cn=>{if(materials.chars[cn].spotlightApps)materials.chars[cn].spotlightApps=materials.chars[cn].spotlightApps.filter(a=>a!==n)});
if(materials.appKeywords[n])delete materials.appKeywords[n];
const saved=await saveMatsOrRollback(snap,{render:renderMatAppList,failMsg:'⚠️ 附录删除保存失败，已回滚'});
if(!saved)return;
renderMatAppList();ok()}

//== matSetupDrag ==//
function matSetupDrag(container,type,orderArr,renderFn){
let dragSrcMat=null;
container.querySelectorAll('[data-idx]').forEach(el=>{
el.draggable=false;
const h=el.querySelector('.drag-handle');
if(h){
h.draggable=true;
h.onmousedown=e=>e.stopPropagation();
h.onclick=e=>e.stopPropagation();
h.ontouchstart=e=>e.stopPropagation();
h.ondragstart=function(e){
dragSrcMat=this.closest('[data-idx]');
if(!dragSrcMat)return;
dragSrcMat.classList.add('dragging');
e.dataTransfer.effectAllowed='move';
e.dataTransfer.setData('text/plain','')
}
}
el.ondragover=function(e){
e.preventDefault();
if(dragSrcMat&&dragSrcMat!==this)this.classList.add('drag-over')
};
el.ondragleave=function(){this.classList.remove('drag-over')};
el.ondrop=async function(e){
e.preventDefault();
this.classList.remove('drag-over');
if(!dragSrcMat||dragSrcMat===this)return;
const from=parseInt(dragSrcMat.dataset.idx);
const to=parseInt(this.dataset.idx);
if(isNaN(from)||isNaN(to))return;
const snap=snapshotSharedMaterialState();
const item=orderArr.splice(from,1)[0];
orderArr.splice(to,0,item);
const saved=await saveMatsOrRollback(snap,{render:renderFn,failMsg:'⚠️ 排序保存失败，已回滚'});
if(saved)renderFn()
};
el.ondragend=function(){
dragSrcMat=null;
document.querySelectorAll('.dragging,.drag-over').forEach(x=>x.classList.remove('dragging','drag-over'))
}
})}

function installSyncRemoteOperationTracking(){
const names=[
'ghApi','syncSmartWrite','syncPrepareMissingShaWrite','syncVaultRemoteConvConflict','syncVaultRemoteSharedConflict',
'syncFlushDirty','syncPullIndex','syncPullConv','syncCheckAndPullIncr','syncPullSharedFiles',
'syncRunArchive','syncMaintenanceArchiveTick','syncMaybeAutoArchive','syncManualArchive','syncListArchives',
'syncReadArchiveManifest','syncVerifyArchive','syncRestoreArchiveToTemp','syncCloudResetScan','syncCloudResetExecute',
'syncPollingTick','syncPullLocks','syncPushLocks','syncSetConvLock','syncReleaseConvLock','syncSetMatEditLock','syncReleaseMatEditLock',
'syncReadRemoteIndexFresh','syncPublishVaultConv','syncManualPush','syncManualPull'
];
names.forEach(name=>{
const fn=globalThis[name];
if(typeof fn!=='function'||fn._syncTracked)return;
const wrapped=syncTrackRemoteOperation(name,fn);
wrapped._syncTracked=true;
globalThis[name]=wrapped
})
}
installSyncRemoteOperationTracking();
window.onload=init;
