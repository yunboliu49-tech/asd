//== genMatCore ==//
function genMatCore(cfg,preMatApps){if(!cfg)return'';const sl=cfg.spotlight||[],ap=cfg.appear||[],mn=cfg.mention||[],ab=cfg.absent||[],hd=cfg.hidden||[];const det=[...sl,...ap].filter(n=>!hd.includes(n));let o='';const allM=materials.metaPrompts;const selM=Object.keys(cfg.metaPrompts||{}).filter(n=>cfg.metaPrompts[n]&&allM[n]);if(selM.length){o+='【系统设定】\n════════\n\n';selM.forEach(n=>{o+=(allM[n]||'')+'\n\n'})}if(preMatApps?.length)preMatApps.forEach(a=>{o+='◆ '+a.name+'\n'+a.content+'\n\n'});if(det.length){o+='【出场角色】\n════════\n\n';det.forEach(n=>{const c=materials.chars[n];if(!c)return;const p=c.g==='女'?'她':'他';o+='■ '+n+'\n'+(c.d||'').replace(/\{TA\}/g,p)+'\n';if(c.h?.trim()&&cfg.hToggles?.[n])o+='\n【H】\n'+c.h.replace(/\{TA\}/g,p)+'\n';o+='\n'})}if(!cfg.hideRel&&det.length>1){o+='【关系】\n════════\n\n';det.forEach(a=>{det.forEach(b=>{if(a!==b&&materials.rels[a+'→'+b])o+='▸ '+a+'→'+b+'\n'+(materials.rels[a+'→'+b].d||'').replace(/\{TA\}/g,materials.chars[b]?.g==='女'?'她':'他')+'\n\n'})})}if(!cfg.hideRel&&det.length&&mn.length){o+='【出场→提及】\n════════\n\n';det.forEach(a=>{mn.forEach(b=>{if(materials.rels[a+'→'+b])o+='▸ '+a+'→'+b+'\n'+(materials.rels[a+'→'+b].d||'').replace(/\{TA\}/g,materials.chars[b]?.g==='女'?'她':'他')+'\n\n'})})}if(mn.length){o+='【提及角色】\n════════\n\n';mn.forEach(n=>{const c=materials.chars[n];if(!c)return;o+='• '+n+'：'+(c.s||'').replace(/\{TA\}/g,c.g==='女'?'她':'他')+'\n'});o+='\n'}const abChars=ab.filter(n=>!hd.includes(n)&&materials.chars[n]);if(abChars.length){o+='【不出场角色】\n════════\n\n';abChars.forEach(n=>{const c=materials.chars[n];const s=c.s||'';if(!s.trim())return;o+='• '+n+'：'+s.replace(/\{TA\}/g,c.g==='女'?'她':'他')+'\n'});o+='\n'}return o}

//== isStoryBeforeCut ==//
function isStoryBeforeCut(story,cutIdx){if(cutIdx===null||cutIdx===undefined)return true;const ti=story.timeInfo;if(!ti)return true;let yid,sem;if(ti.type==='point'&&ti.point){yid=ti.point.yearId;sem=ti.point.semester}else if(ti.type==='range'&&ti.start){yid=ti.start.yearId;sem=ti.start.semester}else if(ti.type==='fuzzy'&&ti.fuzzyStart){yid=ti.fuzzyStart.yearId;sem=ti.fuzzyStart.semester}else return true;const idx=tlPointsChat.findIndex(p=>p.yearId===yid&&p.semester===sem);return idx===-1||idx<cutIdx}

//== getStoryOut ==//
function getStoryOut(story,cfg){const cr=story.characterRoles||{};const protagonists=new Set(materials.charOrder.filter(n=>materials.chars[n]?.protagonist));const chars=Object.keys(cr).filter(c=>cr[c]?.role&&cr[c].role!=='none'&&!protagonists.has(c));if(chars.length>0&&chars.every(c=>getCSt(cfg,c)==='hidden'))return'skip';const type=story.type||'main';const isPlot=type==='main'||type==='dlc';const isDaily=type==='daily';const isIntimate=type==='intimate';let result='brief';if(isPlot){if(chars.some(c=>{const us=getCSt(cfg,c),sr=cr[c]?.role;return(us==='spotlight'||us==='appear')&&(sr==='spotlight'||sr==='appear')}))result='detailed'}else if(isDaily){if(chars.some(c=>{const us=getCSt(cfg,c),sr=cr[c]?.role;return us==='spotlight'&&sr==='spotlight'}))result='detailed'}else if(isIntimate){if(chars.some(c=>{const us=getCSt(cfg,c),sr=cr[c]?.role;return us==='spotlight'&&sr==='spotlight'}))result='detailed';else if(chars.some(c=>cfg.hToggles?.[c]&&cr[c]?.h))result='detailed'}if(result==='brief'&&!story.brief?.trim())return'skip';if(result==='detailed'&&!story.detailed?.trim()&&!story.brief?.trim())return'skip';return result}

//== genStorySec ==//
function genStorySec(cfg){if(!storyData.stories?.length||cfg?.hideStory)return'';const cut=cfg?.timelineCutoffIdx;const years=(storyData.timelineYears||[]).sort((a,b)=>a.order-b.order);const yg={};years.forEach(y=>{yg[y.id]={name:y.name,order:y.order,stories:[]}});storyData.stories.forEach(s=>{if(!isStoryBeforeCut(s,cut))return;const out=getStoryOut(s,cfg);if(out==='skip')return;const ti=s.timeInfo?.point||s.timeInfo?.start||s.timeInfo?.fuzzyStart||{};if(yg[ti.yearId])yg[ti.yearId].stories.push({...s,_out:out})});const sorted=Object.entries(yg).filter(([,y])=>y.stories.length>0).sort((a,b)=>a[1].order-b[1].order);if(!sorted.length)return'';let o='【剧情时间线】\n════════\n\n';sorted.forEach(([,y])=>{o+=`### ${y.name}\n\n`;y.stories.sort((a,b)=>(a.order||0)-(b.order||0));y.stories.forEach(s=>{const cr=s.characterRoles||{};const chars=Object.keys(cr).filter(c=>cr[c]?.role&&cr[c].role!=='none');if(s._out==='detailed'){o+=`#### ${s.title}\n`;if(chars.length)o+=`角色：${chars.join('、')}\n`;o+='\n'+(s.detailed||s.brief||'')+'\n\n'}else{o+=`• ${s.title}：${s.brief||''}\n`}});o+='\n'});return o}

//== execReq ==//
async function execReq(cid,req){const cfg=apiConfigs.find(c=>c.id===req.apiId);if(!cfg){req.status='failed';req.content='❌ 未找到API配置';finalizeReq(cid,req);return}let conv=cid===curConvId&&curConv?curConv:await loadConvFull(cid);if(!conv){req.status='failed';req.content='❌ 无法加载对话';finalizeReq(cid,req);return}const ep=getEffectiveParams(conv);const pi=new Set((pendReqs[cid]||[]).filter(r=>r.status==='generating').map(r=>r.msgId));const cm=conv.messages.filter((m,i)=>i<=req.ctxIdx&&!pi.has(m.id)&&!m.muted);const am=buildApiMsgs(conv,cm,ep);req._inputTok=am.reduce((s,m)=>s+cntTok(m.content),0);const body={model:req.model,messages:am,stream:ep.stream};if(ep.temperature!==null&&!isNaN(ep.temperature))body.temperature=ep.temperature;if(ep.maxTokens&&ep.maxTokens>0)body.max_tokens=ep.maxTokens;if(ep.topP!==null&&ep.topP!==undefined&&!isNaN(ep.topP))body.top_p=ep.topP;if(ep.topK!==null&&ep.topK!==undefined&&!isNaN(ep.topK))body.top_k=ep.topK;if(ep.frequencyPenalty!==null&&ep.frequencyPenalty!==undefined&&!isNaN(ep.frequencyPenalty))body.frequency_penalty=ep.frequencyPenalty;if(ep.presencePenalty!==null&&ep.presencePenalty!==undefined&&!isNaN(ep.presencePenalty))body.presence_penalty=ep.presencePenalty;const excl=cfg.excludeParams||[];excl.forEach(p=>{delete body[p]});const apiUrl=fixApiUrl(cfg.url);try{const resp=await fetch(apiUrl,{method:'POST',headers:{'Content-Type':'application/json','Authorization':`Bearer ${cfg.key}`},body:JSON.stringify(body),signal:req.abort.signal});const ct=resp.headers.get('content-type')||'';if(!resp.ok){let em=`HTTP ${resp.status}`;try{if(ct.includes('json')){const ej=await resp.json();em=ej.error?.message||ej.message||em}else{em+=': '+(await resp.text()).substring(0,100).replace(/<[^>]+>/g,'').trim()}}catch(e){}throw new Error(em)}if(ep.stream){const rdr=resp.body.getReader();const dec=new TextDecoder();let sseBuffer='';while(true){const{done,value}=await rdr.read();if(done)break;sseBuffer+=dec.decode(value,{stream:true});const lines=sseBuffer.split('\n');sseBuffer=lines.pop();for(const line of lines){const trimmed=line.trim();if(!trimmed||!trimmed.startsWith('data: '))continue;const d=trimmed.slice(6);if(d==='[DONE]')continue;try{const j=JSON.parse(d);const dl=j.choices?.[0]?.delta||{};if(dl.content){if(!req.firstTokenTime)req.firstTokenTime=Date.now();if(req.reasoningStart&&!req.reasoningEnd)req.reasoningEnd=Date.now();req.content+=stripZW(dl.content);req.charCount=req.content.length}for(const f of ep.reasoningFields){if(dl[f]){if(!req.reasoningStart)req.reasoningStart=Date.now();req.reasoning+=dl[f];break}}if(j.usage)req.usage=j.usage}catch(e){}}scheduleStreamUpdate(cid,req);const savedLen=lastStreamSaveLen[req.msgId]||0;if(req.content.length-savedLen>=500){lastStreamSaveLen[req.msgId]=req.content.length;const cv=cid===curConvId&&curConv?curConv:await loadConvFull(cid);if(cv){const mg=cv.messages.find(m=>m.id===req.msgId);if(mg){mg.content=req.content;if(req.reasoning)mg.reasoning=req.reasoning;if(req.firstTokenTime)mg.firstTokenMs=req.firstTokenTime-req.startTime;cv.updatedAt=new Date().toISOString();saveConvF(cv)}}}}}else{let data;if(!ct.includes('json')){const txt=await resp.text();if(txt.trim().startsWith('<'))throw new Error('返回HTML');data=JSON.parse(txt)}else data=await resp.json();if(data.error)throw new Error(data.error.message||data.error.type||'API错误');req.content=stripZW(data.choices?.[0]?.message?.content||'');for(const f of ep.reasoningFields){if(data.choices?.[0]?.message?.[f]){req.reasoning=data.choices[0].message[f];break}}if(data.usage)req.usage=data.usage}if(!req.content?.trim()){req.content='⚠️ AI返回了空内容';req.status='failed'}else req.status='completed'}catch(e){if(e.name==='AbortError'){req.content+=(req.content?'\n\n':'')+'[已停止]';req.status='stopped'}else{if(req.content){req.content+='\n\n❌ '+e.message;req.status='stopped'}else{req.content=`❌ ${e.message}`;req.status='failed'}}}if(req.status==='failed')toast('❌ '+(req.content||'').substring(0,80));finalizeReq(cid,req);return}

//== callAuxModel ==//
async function callAuxModel(prompt,msgs,maxTok){
const aux=params.auxModel;if(!aux)return null;
const cfg=apiConfigs.find(c=>c.id===aux.apiId);if(!cfg)return null;
const ac=new AbortController();const timer=setTimeout(()=>ac.abort(),15000);
try{const apiUrl=fixApiUrl(cfg.url);const excl=cfg.excludeParams||[];const body2={model:aux.model,messages:[{role:'system',content:prompt},...msgs],max_tokens:maxTok||30,stream:false};excl.forEach(p=>{delete body2[p]});const r=await fetch(apiUrl,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+cfg.key},body:JSON.stringify(body2),signal:ac.signal});clearTimeout(timer);if(!r.ok)return null;const d=await r.json();return d.choices?.[0]?.message?.content?.trim()||null}catch(e){clearTimeout(timer);return null}}

//== autoNameConv ==//
async function autoNameConv(conv){
if(!conv||!params.auxModel)return;
const userMsg=conv.messages.find(m=>m.role==='user');
if(!userMsg?.content)return;
const uPv=(userMsg.content).substring(0,150);
const result=await callAuxModel('用8字以内中文概括主题，只输出标题，不要引号标点',[{role:'user',content:uPv}],30);
if(result&&result.length<=20&&result.length>=2){conv.name=result;conv.updatedAt=new Date().toISOString();await saveConvF(conv);renderConvList();if(curConvId===conv.id){document.getElementById('chTitle').textContent=conv.name;updateToolbarTitle()}}}

//== aiRenameConv ==//
async function aiRenameConv(id){
if(!params.auxModel){toast('请先在设置中配置辅助模型');return}
const conv=id===curConvId&&curConv?curConv:await loadConvFull(id);if(!conv)return;
const userMsg=conv.messages.find(m=>m.role==='user');
const aiMsg=[...conv.messages].reverse().find(m=>m.role==='assistant'&&m.content&&!m.content.startsWith('❌'));
if(!userMsg&&!aiMsg){toast('无消息');return}
toast('命名中...');
const uPv=(userMsg?.content||'').substring(0,200);const aPv=(aiMsg?.content||'').substring(0,200);
const result=await callAuxModel('用10字以内中文概括这段对话主题，只输出标题，不要引号和标点',[{role:'user',content:uPv},{role:'assistant',content:aPv}],30);
if(result&&result.length<=30&&result.length>=2){conv.name=result;conv.updatedAt=new Date().toISOString();await saveConvF(conv);if(curConvId===id){if(curConv)curConv.name=result;document.getElementById('chTitle').textContent=result;updateToolbarTitle()}renderConvList();toast('✓ '+result)}else toast('命名失败')}

//== aiSummarizeFG ==//
async function aiSummarizeFG(fgId,fullMode){
const fg0=curConv?.foldGroups?.find(g=>g.id===fgId);if(!fg0)return;
const cid=curConv.id;
const si=curConv.messages.findIndex(m=>m.id===fg0.startMsgId);
const ei=curConv.messages.findIndex(m=>m.id===fg0.endMsgId);
if(si===-1||ei===-1)return;
let excerpt;
if(fullMode){excerpt=curConv.messages.slice(si,ei+1).map(m=>(m.role==='user'?'用户':'AI')+': '+(m.content||'')).join('\n')}
else{excerpt=curConv.messages.slice(si,ei+1).map(m=>(m.role==='user'?'用户':'AI')+': '+(m.content||'').substring(0,200)).join('\n').substring(0,1500)}
hideMo();toast('后台生成概要中...');
const result=await callAuxModel('用2-3句中文概括以下对话的主要事件和进展，帮助作者快速回忆内容',[{role:'user',content:excerpt}],fullMode?500:200);
const conv=cid===curConvId&&curConv?curConv:await loadConvFull(cid);
const fg=conv?.foldGroups?.find(g=>g.id===fgId);
if(!fg)return;
if(result){fg.summary=result;conv.updatedAt=new Date().toISOString();await saveConvF(conv);if(cid===curConvId&&curConv){curConv=conv;renderMsgs();updateTokCnt()}toast('✓ 概要已生成')}else toast('生成失败')}

//== scheduleStreamUpdate ==//
function scheduleStreamUpdate(cid,req){streamDirty=true;if(streamRAF)return;streamRAF=requestAnimationFrame(()=>{streamRAF=null;if(!streamDirty)return;if(cid!==curConvId||!curConv){streamDirty=false;return}const mi=curConv.messages.findIndex(m=>m.id===req.msgId);if(mi===-1){streamDirty=false;return}curConv.messages[mi].content=req.content;if(req.reasoning){curConv.messages[mi].reasoning=req.reasoning;curConv.messages[mi].reasoningDuration=req.reasoningStart?((req.reasoningEnd||Date.now())-req.reasoningStart):0}if(req.firstTokenTime)curConv.messages[mi].firstTokenMs=req.firstTokenTime-req.startTime;if(foldMgr.isFolded(req.msgId)){streamDirty=false;const gfi=document.getElementById('gfi-'+req.msgId);if(gfi){const s=gfi.querySelector('strong');if(s)s.textContent=req.charCount.toLocaleString()}return}const el=document.getElementById('msg-'+mi);if(el){const sel=window.getSelection();let hasRealSel=false;if(sel&&sel.rangeCount>0&&!sel.isCollapsed){try{hasRealSel=el.contains(sel.anchorNode)||el.contains(sel.focusNode)}catch(e){}}if(hasRealSel){if(_streamRetryTimer)clearTimeout(_streamRetryTimer);_streamRetryTimer=setTimeout(()=>{_streamRetryTimer=null;if(req.status==='generating')scheduleStreamUpdate(cid,req)},200);return}streamDirty=false;const b=el.querySelector('.msg-body');const ep=getEffectiveParams(curConv);if(b)renderStreamContent(b,req.content,ep.parseContentTags,req.msgId);const fb=el.querySelector('.fold-btn');if(req.charCount>0){if(!fb){const nfb=document.createElement('button');nfb.className='fold-btn';nfb.textContent='▲ 折叠';nfb.onclick=()=>toggleGenFold(mi);const mbody=el.querySelector('.msg-body');if(mbody)mbody.after(nfb)}else fb.textContent='▲ 折叠'}const cc=el.querySelector('.msg-chars');if(cc)cc.textContent=req.charCount.toLocaleString()+'字';const rsnBlock=el.querySelector('[data-rsn=field]');if(rsnBlock){const rc=rsnBlock.querySelector('.rsn-ct');if(rc&&req.reasoning)rc.textContent=req.reasoning}if(req.reasoning&&!el.querySelector('[data-rsn=field]')){const rsnId=req.msgId+'_r';const rsnEl=document.createElement('div');rsnEl.className='rsn-block';rsnEl.setAttribute('data-rsn','field');rsnEl.innerHTML=`<div class="rsn-hdr" onclick="tglRsn('${rsnId}')"><span class="arr" id="ra-${rsnId}">▶</span><span>🧠</span></div><div class="rsn-ct" id="rc-${rsnId}">${esc(req.reasoning)}</div>`;const msgBody=el.querySelector('.msg-body');if(msgBody)msgBody.parentNode.insertBefore(rsnEl,msgBody)}}else streamDirty=false;if(autoScrollOn)scrBot()})}

async function updateMC(cid,mid,ct,rsn,dur,ftMs,usage){const conv=cid===curConvId&&curConv?curConv:await loadConvFull(cid);if(!conv)return;const msg=conv.messages.find(m=>m.id===mid);if(msg){msg.content=ct;if(rsn){msg.reasoning=rsn;msg.reasoningDuration=dur}if(ftMs)msg.firstTokenMs=ftMs;if(usage){msg.promptTokens=usage.prompt_tokens||0;msg.completionTokens=usage.completion_tokens||0;msg.cacheHitTokens=usage.prompt_cache_hit_tokens||0;msg.cacheMissTokens=usage.prompt_cache_miss_tokens||0}conv.updatedAt=new Date().toISOString();await saveConvF(conv)}if(cid===curConvId&&curConv){const m=curConv.messages.find(m=>m.id===mid);if(m){m.content=ct;if(rsn){m.reasoning=rsn;m.reasoningDuration=dur}if(ftMs)m.firstTokenMs=ftMs;if(usage){m.promptTokens=usage.prompt_tokens||0;m.completionTokens=usage.completion_tokens||0;m.cacheHitTokens=usage.prompt_cache_hit_tokens||0;m.cacheMissTokens=usage.prompt_cache_miss_tokens||0}}}}

//== execApiRefreshAll ==//
async function execApiRefreshAll(){
const btn=document.getElementById('apiRefExec'),cancel=document.getElementById('apiRefCancel'),area=document.getElementById('apiRefProgArea'),fill=document.getElementById('apiRefProgFill'),txt=document.getElementById('apiRefProgText');
if(btn)btn.disabled=true;if(cancel)cancel.disabled=true;if(area)area.style.display='block';
const result={total:apiConfigs.length,ok:0,fail:0,added:0,removed:0,failures:[],changed:[],staleStars:[]};
for(let i=0;i<apiConfigs.length;i++){
const cfg=apiConfigs[i];
if(txt)txt.textContent=i+'/'+apiConfigs.length+' · '+cfg.name;
const oldModels=[...(cfg.models||[])];
const r=await apiRefreshOne(cfg);
if(r.ok){
const newModels=r.models;
const oldSet=new Set(oldModels),newSet=new Set(newModels);
const add=newModels.filter(m=>!oldSet.has(m)).length;
const del=oldModels.filter(m=>!newSet.has(m)).length;
cfg.models=newModels;
result.ok++;result.added+=add;result.removed+=del;
if(add||del)result.changed.push({name:cfg.name,added:add,removed:del});
if(curApiId===cfg.id&&curModel&&!newSet.has(curModel))curModel=''
}else{
result.fail++;
result.failures.push({name:cfg.name,error:r.error||'未知错误'})
}
if(fill)fill.style.width=Math.round((i+1)/Math.max(apiConfigs.length,1)*100)+'%';
if(txt)txt.textContent=(i+1)+'/'+apiConfigs.length;
await new Promise(r=>setTimeout(r,0))
}
result.staleStars=starredModels.filter(s=>{const cfg=apiConfigs.find(c=>c.id===s.apiId);return!cfg||!cfg.models.includes(s.model)});
window._apiRefreshResult=result;
await saveCfg();renderApiSel();showApiRefreshResult(result)
}

//== apiRefreshOne ==//
async function apiRefreshOne(cfg){
try{
const headers={};
if(cfg.key)headers.Authorization='Bearer '+cfg.key;
const opt={headers};
if(window.AbortSignal&&AbortSignal.timeout)opt.signal=AbortSignal.timeout(30000);
const resp=await fetch(fixModelsUrl(cfg.url),opt);
if(!resp.ok)throw new Error('HTTP '+resp.status);
const data=await resp.json();
let arr=[];
if(Array.isArray(data.data))arr=data.data;
else if(Array.isArray(data.models))arr=data.models;
else if(Array.isArray(data))arr=data;
else throw new Error('未找到模型列表');
const models=[...new Set(arr.map(m=>typeof m==='string'?m:(m.id||m.model||m.name||'')).map(s=>String(s).trim()).filter(Boolean))];
if(!models.length)throw new Error('模型列表为空');
return{ok:true,models}
}catch(e){return{ok:false,error:e.name+': '+(e.message||'').substring(0,60)}}
}

if(result.staleStars.length)h+='<div style="padding:8px;background:var(--wn-soft);border:1px solid var(--mark-bg);border-radius:var(--r);margin-bottom:10px;font-size:12px;color:var(--wn)">⭐ 有 '+result.staleStars.length+' 个星标模型已失效</div>';
if(result.changed.length){h+='<div style="font-weight:600;font-size:12px;margin:8px 0 4px">变更API</div><div style="max-height:160px;overflow-y:auto">';result.changed.forEach(x=>{h+='<div style="display:flex;gap:8px;padding:5px 8px;background:var(--bg-t);border-radius:var(--r);margin-bottom:3px;font-size:12px"><span style="flex:1">'+esc(x.name)+'</span><span style="color:var(--ac)">+'+x.added+'</span><span style="color:var(--wn)">-'+x.removed+'</span></div>'});h+='</div>'}
if(result.failures.length){h+='<div style="font-weight:600;font-size:12px;margin:8px 0 4px;color:var(--dn)">失败API</div><div style="max-height:160px;overflow-y:auto">';result.failures.forEach(x=>{h+='<div style="padding:5px 8px;background:rgba(248,113,113,.08);border-radius:var(--r);margin-bottom:3px;font-size:12px"><div>'+esc(x.name)+'</div><div style="color:var(--tx-m);font-size:10px">'+esc(x.error)+'</div></div>'});h+='</div>'}
h+='</div>';
const staleBtn=result.staleStars.length?'<button class="mo-btn dn" onclick="apiCleanStaleStars()">删除失效星标</button>':'';
showMo('🔄 刷新完成',h,'<button class="mo-btn sec" onclick="showApiPanel()">返回API</button>'+staleBtn+'<button class="mo-btn pri" onclick="hideMo()">关闭</button>','compact')
}

//== apiCleanStaleStars ==//
function apiCleanStaleStars(){
const before=starredModels.length;
starredModels=starredModels.filter(s=>{const cfg=apiConfigs.find(c=>c.id===s.apiId);return cfg&&cfg.models.includes(s.model)});
const n=before-starredModels.length;
if(window._apiRefreshResult)window._apiRefreshResult.staleStars=[];
saveCfg();renderApiSel();toast('✓ 已删除 '+n+' 个失效星标');showApiPanel()
}

ton><button class="mo-btn pri" onclick="saveStarParams(${idx})">💾</button>`,'',showStarMgr)}

//== saveStarParams ==//
function saveStarParams(idx){const s=starredModels[idx];if(!s)return;const readV=(k,t)=>{const ud=document.getElementById('spd_'+k)?.checked;if(ud)return undefined;const inp=document.getElementById('sp_'+k);if(!inp)return undefined;if(t==='bool')return inp.value==='true';if(t==='number'){const v=inp.value.trim();return v===''?undefined:parseInt(v)}if(t==='float'){const v=inp.value.trim();return v===''?undefined:parseFloat(v)}return undefined};const np={};const t=readV('temperature','float');if(t!==undefined)np.temperature=t;const mx=readV('maxTokens','number');if(mx!==undefined)np.maxTokens=mx;const mi=readV('maxInput','number');if(mi!==undefined)np.maxInput=mi;const cx=readV('contextLimit','number');if(cx!==undefined)np.contextLimit=cx;const st=readV('stream','bool');if(st!==undefined)np.stream=st;const tp=readV('topP','float');if(tp!==undefined)np.topP=tp;const tk=readV('topK','number');if(tk!==undefined)np.topK=tk;const fp=readV('frequencyPenalty','float');if(fp!==undefined)np.frequencyPenalty=fp;const pp=readV('presencePenalty','float');if(pp!==undefined)np.presencePenalty=pp;s.params=Object.keys(np).length?np:undefined;saveCfg();popMo(true);ok()}

//== cntTok ==//
function cntTok(t){if(!t)return 0;if(Array.isArray(t)){return t.reduce((s,p)=>s+(p.type==='text'?cntTok(p.text||''):p.type==='image_url'?85:0),0)}if(typeof t!=='string')return 0;let tok=0;t.split(/([\u4e00-\u9fff\u3400-\u4dbf]+)/g).forEach(p=>{if(!p)return;if(/[\u4e00-\u9fff]/.test(p))tok+=Math.ceil(p.length*1.5);else p.split(/\s+/).filter(w=>w).forEach(w=>{tok+=w.length<=4?1:w.length<=10?2:Math.ceil(w.length/4)})});return Math.max(1,Math.round(tok))}

//== buildSelectedPack ==//
async function buildSelectedPack(opts){
opts=opts||{};
const ids=opts.ids||[...batchSel];
const targets=[];
const statusEl=document.getElementById('selPackStatus');
const progFill=document.getElementById('selPackProgFill');
for(let i=0;i<ids.length;i++){
const id=ids[i];
const c=id===curConvId&&curConv?curConv:await loadConvFull(id);
if(c)targets.push(c);
if((i%3===0||i===ids.length-1)&&(statusEl||progFill)){
if(statusEl)statusEl.textContent=`读取对话 ${i+1}/${ids.length}...`;
if(progFill)progFill.style.width=Math.round((i+1)/Math.max(ids.length,1)*70)+'%';
await new Promise(r=>setTimeout(r,0))
}}
if(!targets.length)throw new Error('没有可导出的对话');
const now=new Date();
const dev=isMobile?'PHONE':'PC';
const d={'_chatToolPackageType':'selected','_chatToolVersion':VER,'__exported_items':['conversations'],'__exported_at':now.toISOString(),'_selectedPackMeta':{device:dev,count:targets.length,includeImages:!!opts.includeImages},configVersion:13,'chat-sessions-list':[]};
const ct={version:VER,selectedPack:true,selectedAt:now.toISOString()};
if(opts.includeApi){ct.apiConfigs=apiConfigs;ct.curApiId=curApiId;ct.curModel=curModel}
if(opts.includeStars)ct.starredModels=starredModels;
if(opts.includeParams){ct.groups=groups;ct.params=params;ct.uiSettings=uiSettings;ct.shortcuts=shortcuts;ct.quickPhrases=quickPhrases;ct.localMeta=localMeta;ct.priceTable=priceTable;ct.costSettings=costSettings;ct.workspace=workspace}
if(opts.includeMaterials)ct.materials=materials;
if(opts.includeStory&&storyData.stories?.length)ct.storyData=storyData;
d._chatTool=ct;
if(opts.includeCost){
const idSet=new Set(targets.map(c=>c.id));
d._chatToolCostLogs={version:1,savedAt:now.toISOString(),scope:'selectedConversations',items:costLogs.filter(l=>idSet.has(l.convId))}
}
const _cbs=buildChatboxSettings();
if(opts.includeApi||opts.includeStars){
d.settings={providers:_cbs.providers,customProviders:_cbs.customProviders,favoritedModels:opts.includeStars?_cbs.favoritedModels:[]};
if(_cbs.sessionSettings.provider)d['chat-session-settings']=_cbs.sessionSettings
}
targets.forEach(conv=>{
d['chat-sessions-list'].push({id:conv.id,name:conv.name,starred:conv.pinned||false,type:'chat'});
const sp=genMatFull(conv.materialConfig);
const msgs=[];
if(sp)msgs.push({id:gid2(),role:'system',contentParts:[{type:'text',text:sp}]});
(conv.messages||[]).forEach(msg=>{
const cp=[];
if(msg.reasoning)cp.push({type:'reasoning',text:msg.reasoning,duration:msg.reasoningDuration||0});
cp.push({type:'text',text:msg.content||''});
if(opts.includeImages&&msg.images?.length)cp.push({type:'images',images:msg.images});
msgs.push({id:msg.id,role:msg.role,contentParts:cp,timestamp:msg.timestamp?new Date(msg.timestamp).getTime():Date.now(),model:msg.model||'',generating:false})
});
d[`session:${conv.id}`]={id:conv.id,name:conv.name,type:'chat',starred:conv.pinned||false,messages:msgs,messageForksHash:{},_chatTool:{materialConfig:conv.materialConfig,tempAppendices:conv.tempAppendices||[],groupId:conv.groupId||'_default',convParams:conv.convParams||{},foldGroups:conv.foldGroups||[],foldedMsgIds:conv.foldedMsgIds||[],lockedModel:conv.lockedModel||null,imagesStripped:!opts.includeImages}}
});
const safe=(opts.name||'选择包').replace(/[\/\\:*?"<>|]/g,'_').substring(0,60)||'选择包';
const pad=n=>String(n).padStart(2,'0');
const fileName=`chattool_selected_${dev}_${safe}_${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())}_${pad(now.getHours())}${pad(now.getMinutes())}.json`;
if(statusEl)statusEl.textContent='序列化...';
if(progFill)progFill.style.width='90%';
await new Promise(r=>setTimeout(r,0));
return{fileName,text:JSON.stringify(d,null,2),count:targets.length}
}

//== parseChatboxApi ==//
function parseChatboxApi(data){const apis=[];const providers=data.settings?.providers;const customProviders=data.settings?.customProviders;if(providers&&typeof providers==='object'){const nameMap={};(Array.isArray(customProviders)?customProviders:[]).forEach(cp=>{if(cp.id&&cp.name)nameMap[cp.id]=cp.name});Object.entries(providers).forEach(([pid,pdata])=>{if(pid==='chatbox-ai')return;if(!pdata.apiKey&&!pdata.apiHost)return;const displayName=nameMap[pid]||pid;const models=(pdata.models||[]).map(m=>typeof m==='string'?m:m.modelId).filter(m=>m);let host=(pdata.apiHost||'').trim().replace(/\/+$/,'');apis.push({id:gid2(),name:displayName,url:host,key:pdata.apiKey||'',models:models})})}if(!apis.length){if(data.openaiApiKey||data['openai.apiKey']){const key=data.openaiApiKey||data['openai.apiKey']||'';const host=data.openaiApiHost||data['openai.apiHost']||'https://api.openai.com';const model=data.openaiModel||data['openai.model']||'';if(key)apis.push({id:gid2(),name:'OpenAI',url:host,key:key,models:model?[model]:[]})}}return apis}

if(imgPart?.images)nm.images=imgPart.images;

//== cmpConvs ==//
function cmpConvs(ex,im){const eM=ex.messages||[],iM=im.messages||[];let da=0;const ml=Math.min(eM.length,iM.length);for(let i=0;i<ml;i++){if(eM[i].role!==iM[i].role||eM[i].content!==iM[i].content)break;da=i+1}if(da===eM.length&&da===iM.length)return'identical';if(da===eM.length&&iM.length>eM.length)return'superset';if(da===iM.length&&eM.length>iM.length)return'subset';if(da>0)return'diverged';return'different'}

//== makeBranchName ==//
function makeBranchName(baseName,groupId){
const prefix=baseName+' (分支';
const exists=convList.filter(c=>(c.groupId||'_default')===(groupId||'_default')&&(c.name===baseName+' (分支)'||c.name.startsWith(prefix))).length;
return exists?baseName+' (分支'+(exists+1)+')':baseName+' (分支)'
}

//== branchOrderOffset ==//
function branchOrderOffset(baseName,groupId){
const prefix=baseName+' (分支';
const exists=convList.filter(c=>(c.groupId||'_default')===(groupId||'_default')&&(c.name===baseName+' (分支)'||c.name.startsWith(prefix))).length;
return (exists+1)/1000
}

//== normalizeGroupOrderMeta ==//
function normalizeGroupOrderMeta(gid){
sortConvList();
const items=convList.filter(c=>(c.groupId||'_default')===(gid||'_default'));
items.forEach((c,i)=>{c.order=i});
scheduleIndexSave()
}

//== fmtCny ==//
function fmtCny(v){if(v===null||v===undefined||isNaN(v))return'--';if(v===0)return'0';return v<0.01&&v>0?v.toFixed(4):v<1?v.toFixed(3):v<100?v.toFixed(2):v.toFixed(1)}

//== getModelPrice ==//
function getModelPrice(apiId,model){if(!apiId||!model)return null;return priceTable[apiId+'||'+model]||null}

//== estimateCost ==//
function estimateCost(apiId,model,inputTok,outputTok){const p=getModelPrice(apiId,model);if(!p)return null;if(p.billing==='request')return p.perReq||0;return(inputTok||0)/1e6*(p.inputPerM||0)+(outputTok||0)/1e6*(p.outputPerM||0)}

//== recordCostLog ==//
function recordCostLog(cid,req){const conv=cid===curConvId&&curConv?curConv:null;const cfg=apiConfigs.find(c=>c.id===req.apiId);const p=getModelPrice(req.apiId,req.model);const u=req.usage||{};const inTok=u.prompt_tokens||req._inputTok||0;const outTok=u.completion_tokens||cntTok(req.content||'');const cacheHit=u.prompt_cache_hit_tokens||0;const cacheMiss=u.prompt_cache_miss_tokens||0;let cost=null,snap=null;if(p){snap={billing:p.billing};if(p.billing==='request'){cost=p.perReq||0;snap.perReq=p.perReq}else{if(cacheHit||cacheMiss){cost=cacheHit/1e6*(p.cacheReadPerM||p.inputPerM*0.02||0)+cacheMiss/1e6*(p.inputPerM||0)+outTok/1e6*(p.outputPerM||0)}else{cost=inTok/1e6*(p.inputPerM||0)+outTok/1e6*(p.outputPerM||0)}snap.inputPerM=p.inputPerM;snap.outputPerM=p.outputPerM;if(p.cacheReadPerM)snap.cacheReadPerM=p.cacheReadPerM}}const now=new Date();costLogs.unshift({id:'cost_'+gid2(),time:now.toISOString(),day:fmtD(now),month:fmtD(now).slice(0,7),convId:cid,convName:conv?.name||'?',apiId:req.apiId,apiName:cfg?.name||'?',model:req.model,billing:p?.billing||null,inputTok:inTok,outputTok:outTok,totalTok:inTok+outTok,cacheHit,cacheMiss,cost,status:req.status||'completed',priceSnapshot:snap});saveCostLogs();updateCostDisplay()}

//== costLogStableId ==//
function costLogStableId(x){
const s=[x.time||'',x.convId||'',x.apiId||'',x.model||'',x.inputTok||0,x.outputTok||0,x.cost??'',x.status||''].join('|');
let h=2166136261;
for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}
return'cost_'+(h>>>0).toString(36)
}

//== normalizeCostLog ==//
function normalizeCostLog(item){
if(!item||typeof item!=='object')return null;
const time=item.time||item.createdAt||item.timestamp||new Date().toISOString();
const d=new Date(time);
if(isNaN(d.getTime()))return null;
const day=item.day||fmtD(d);
const month=item.month||day.slice(0,7);
const inputTok=parseInt(item.inputTok||0)||0;
const outputTok=parseInt(item.outputTok||0)||0;
const totalTok=parseInt(item.totalTok||inputTok+outputTok)||0;
let cost=item.cost;
if(cost!==null&&cost!==undefined&&cost!=='')cost=parseFloat(cost);
else cost=null;
if(cost!==null&&isNaN(cost))cost=null;
return{
id:item.id||costLogStableId({time:d.toISOString(),convId:item.convId||'',apiId:item.apiId||'',model:item.model||'',inputTok,outputTok,cost,status:item.status||'completed'}),
time:d.toISOString(),
day,
month,
convId:item.convId||'',
convName:item.convName||'?',
apiId:item.apiId||'',
apiName:item.apiName||'?',
model:item.model||'',
billing:item.billing||null,
inputTok,
outputTok,
totalTok,
cost,
status:item.status||'completed',
priceSnapshot:item.priceSnapshot||null,
source:item.source||'chatTool',
version:item.version||1
}
}

//== mergeCostLogs ==//
function mergeCostLogs(base,incoming){
const out=[],seen=new Set();
let added=0,skipped=0,invalid=0;
(base||[]).forEach(x=>{const n=normalizeCostLog(x);if(!n){invalid++;return}if(seen.has(n.id)){skipped++;return}seen.add(n.id);out.push(n)});
(incoming||[]).forEach(x=>{const n=normalizeCostLog(x);if(!n){invalid++;return}if(seen.has(n.id)){skipped++;return}seen.add(n.id);out.push(n);added++});
out.sort((a,b)=>new Date(b.time)-new Date(a.time));
return{items:out.slice(0,50000),added,skipped,invalid}
}

//== mergePriceTable ==//
function mergePriceTable(base,incoming){
const out={...(base||{})};
let added=0,updated=0,invalid=0;
Object.entries(incoming||{}).forEach(([k,p])=>{
if(!p||!p.apiId||!p.model){invalid++;return}
const key=p.apiId+'||'+p.model;
const isNew=!out[key];
out[key]={...p,updatedAt:new Date().toISOString()};
if(isNew)added++;else updated++;
});
return{items:out,added,updated,invalid}
}

//== getCostStats ==//
function getCostStats(period,apiFilter){const now=new Date(),td=fmtD(now),tm=td.slice(0,7);let fl=costLogs;if(period==='today')fl=fl.filter(l=>l.day===td);else if(period==='month')fl=fl.filter(l=>l.month===tm);else if(period==='lastMonth'){const lm=new Date(now.getFullYear(),now.getMonth()-1,1);const ls=fmtD(lm).slice(0,7);fl=fl.filter(l=>l.month===ls)}else if(period==='week'){const ws=fmtD(new Date(now-7*864e5));fl=fl.filter(l=>l.day>=ws)}else if(period==='30d'){const ws=fmtD(new Date(now-30*864e5));fl=fl.filter(l=>l.day>=ws)}if(apiFilter)fl=fl.filter(l=>l.apiId===apiFilter);const total=fl.reduce((s,l)=>s+(l.cost||0),0),count=fl.length;const bM={},bA={},bC={},bD={};fl.forEach(l=>{const mk=l.model||'?';if(!bM[mk])bM[mk]={model:mk,cost:0,count:0};bM[mk].cost+=(l.cost||0);bM[mk].count++;const ak=l.apiName||'?';if(!bA[ak])bA[ak]={apiName:ak,cost:0,count:0};bA[ak].cost+=(l.cost||0);bA[ak].count++;const ck=l.convId||'?';if(!bC[ck])bC[ck]={convName:l.convName||'?',cost:0,count:0};bC[ck].cost+=(l.cost||0);bC[ck].count++;const dk=l.day||'?';if(!bD[dk])bD[dk]={day:dk,cost:0,count:0};bD[dk].cost+=(l.cost||0);bD[dk].count++});return{total,count,byModel:Object.values(bM).sort((a,b)=>b.cost-a.cost),byApi:Object.values(bA).sort((a,b)=>b.cost-a.cost),byConv:Object.values(bC).sort((a,b)=>b.cost-a.cost),byDay:Object.values(bD).sort((a,b)=>a.day.localeCompare(b.day))}}

//== getLast30DaysCosts ==//
function getLast30DaysCosts(){const days=[];const now=new Date();for(let i=29;i>=0;i--)days.push(fmtD(new Date(now-i*864e5)));const bd={};costLogs.forEach(l=>{if(l.day&&l.cost){if(!bd[l.day])bd[l.day]=0;bd[l.day]+=(l.cost||0)}});return days.map(d=>({day:d,cost:bd[d]||0}))}

//== updateCostDisplay ==//
function updateCostDisplay(packTotalTok,attachTok){const el=document.getElementById('costInfo');if(!el)return;if(!costSettings.enabled){el.textContent='';el.style.display='none';return}el.style.display='';const tdy=getCostStats('today').total;let parts=['💰今日¥'+fmtCny(tdy)];if(curConv&&packTotalTok!==undefined){const{apiId:_a,model:_m}=getActiveModel(curConv);const p=getModelPrice(_a,_m);if(p){if(p.billing==='request')parts.push('本轮¥'+fmtCny(p.perReq)+'/次');else{const est=(packTotalTok+(attachTok||0))/1e6*(p.inputPerM||0)+costSettings.defaultOutputTok/1e6*(p.outputPerM||0);parts.push('~¥'+fmtCny(est))}}else parts.push('未配价')}el.textContent=parts.join(' | ')}

//== checkCostBeforeSend ==//
function checkCostBeforeSend(apiId,model,inputTok){if(!costSettings.enabled)return true;const p=getModelPrice(apiId,model);if(!p){if(costSettings.requireConfirmNoPrice)return confirm('当前模型未配置价格，无法估算费用。\n继续发送？');return true}const reasons=[];let estCost=0;const cfg=apiConfigs.find(c=>c.id===apiId);const apiNm=cfg?.name||'?';if(p.billing==='request'){estCost=p.perReq||0;if(estCost>costSettings.warnReqCost)reasons.push('单次¥'+fmtCny(estCost)+' > ¥'+costSettings.warnReqCost)}else{const outEst=costSettings.defaultOutputTok;estCost=inputTok/1e6*(p.inputPerM||0)+outEst/1e6*(p.outputPerM||0);if(inputTok>costSettings.warnTokenInput)reasons.push('输入'+Math.round(inputTok/1000)+'K tok > '+Math.round(costSettings.warnTokenInput/1000)+'K');if(estCost>costSettings.warnReqCost)reasons.push('预估¥'+fmtCny(estCost)+' > ¥'+costSettings.warnReqCost)}const ms=getCostStats('month');if(costSettings.monthlyBudget>0&&ms.total/costSettings.monthlyBudget>costSettings.warnMonthRatio)reasons.push('月预算'+Math.round(ms.total/costSettings.monthlyBudget*100)+'%');if(!reasons.length)return true;const billing=p.billing==='request'?'按次':'按量';let msg='⚠️ 费用提醒\n\n模型：'+model+'\n渠道：'+apiNm+'\n计费：'+billing+'\n';if(p.billing==='token')msg+='输入：'+inputTok.toLocaleString()+' tok → ¥'+fmtCny(inputTok/1e6*(p.inputPerM||0))+'\n预估输出：'+costSettings.defaultOutputTok+' tok → ¥'+fmtCny(costSettings.defaultOutputTok/1e6*(p.outputPerM||0))+'\n';msg+='预估总计：¥'+fmtCny(estCost)+'\n\n触发：'+reasons.join(' | ')+'\n本月已用：¥'+fmtCny(ms.total)+' / ¥'+costSettings.monthlyBudget;return confirm(msg)}

//== showCostPanel ==//
function showCostPanel(){const tdy=getCostStats('today'),mth=getCostStats('month'),d30=getLast30DaysCosts();const maxD=Math.max(...d30.map(d=>d.cost),0.01);const budgetPct=costSettings.monthlyBudget>0?Math.min(mth.total/costSettings.monthlyBudget*100,150):0;const budgetColor=budgetPct>100?'var(--dn)':budgetPct>90?'var(--wn)':'var(--ac)';let h='';h+=`<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px"><div style="padding:10px;background:var(--bg-t);border-radius:var(--r);text-align:center"><div style="font-size:11px;color:var(--tx-m)">今日</div><div style="font-size:20px;font-weight:700;color:var(--ac)">¥${fmtCny(tdy.total)}</div><div style="font-size:11px;color:var(--tx-m)">${tdy.count}次请求</div></div><div style="padding:10px;background:var(--bg-t);border-radius:var(--r);text-align:center"><div style="font-size:11px;color:var(--tx-m)">本月</div><div style="font-size:20px;font-weight:700;color:${budgetColor}">¥${fmtCny(mth.total)}</div><div style="font-size:11px;color:var(--tx-m)">${mth.count}次 / 预算¥${costSettings.monthlyBudget}</div><div class="prog-bar" style="margin:4px 0 0"><div class="prog-fill" style="width:${Math.min(budgetPct,100)}%;background:${budgetColor}"></div></div></div></div>`;h+=`<div style="margin-bottom:12px"><div style="font-weight:600;font-size:13px;margin-bottom:6px">📊 近30天</div>`;d30.forEach(d=>{const pct=maxD>0?d.cost/maxD*100:0;const dl=d.day.slice(5);h+=`<div style="display:flex;align-items:center;gap:4px;margin-bottom:1px;font-size:11px"><span style="min-width:36px;color:var(--tx-m)">${dl}</span><div style="flex:1;height:14px;background:var(--bg-t);border-radius:2px;overflow:hidden"><div style="height:100%;width:${pct}%;background:var(--ac);border-radius:2px;min-width:${d.cost>0?'1px':'0'}"></div></div><span style="min-width:46px;text-align:right;color:${d.cost>0?'var(--tx-p)':'var(--tx-m)'}">¥${fmtCny(d.cost)}</span></div>`});h+=`</div>`;if(mth.byApi.length){h+=`<div style="margin-bottom:12px"><div style="font-weight:600;font-size:13px;margin-bottom:4px">渠道排行（本月）</div>`;mth.byApi.slice(0,10).forEach(a=>{h+=`<div style="display:flex;align-items:center;gap:6px;padding:4px 8px;font-size:12px"><span style="flex:1">${esc(a.apiName)}</span><span style="color:var(--tx-m)">${a.count}次</span><span style="font-weight:600;min-width:60px;text-align:right">¥${fmtCny(a.cost)}</span></div>`});h+=`</div>`}if(mth.byModel.length){h+=`<div style="margin-bottom:12px"><div style="font-weight:600;font-size:13px;margin-bottom:4px">模型排行（本月）</div><div style="max-height:200px;overflow-y:auto">`;mth.byModel.slice(0,20).forEach(m=>{h+=`<div style="display:flex;align-items:center;gap:6px;padding:3px 8px;font-size:11px"><span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(m.model)}</span><span style="color:var(--tx-m);flex-shrink:0">${m.count}次</span><span style="font-weight:600;min-width:55px;text-align:right;flex-shrink:0">¥${fmtCny(m.cost)}</span></div>`});h+=`</div></div>`}if(mth.byConv.length){h+=`<div style="margin-bottom:12px"><div style="font-weight:600;font-size:13px;margin-bottom:4px">对话排行（本月）</div><div style="max-height:180px;overflow-y:auto">`;mth.byConv.slice(0,15).forEach(c=>{h+=`<div style="display:flex;align-items:center;gap:6px;padding:3px 8px;font-size:11px"><span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(c.convName)}</span><span style="color:var(--tx-m);flex-shrink:0">${c.count}次</span><span style="font-weight:600;min-width:55px;text-align:right;flex-shrink:0">¥${fmtCny(c.cost)}</span></div>`});h+=`</div></div>`}h+=`<div style="margin-bottom:12px"><div style="font-weight:600;font-size:13px;margin-bottom:4px">最近请求</div><div style="max-height:200px;overflow-y:auto">`;costLogs.slice(0,50).forEach(l=>{const t=l.time?new Date(l.time).toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'}):'';const costStr=l.cost!==null?'¥'+fmtCny(l.cost):'未配价';const tokStr=l.totalTok?Math.round(l.totalTok/1000)+'k':'';const cacheStr=l.cacheHit?'💾'+Math.round(l.cacheHit/(l.cacheHit+(l.cacheMiss||1))*100)+'%':'';h+=`<div style="display:flex;align-items:center;gap:4px;padding:3px 6px;font-size:10px;border-bottom:1px solid var(--bd)"><span style="color:var(--tx-m);min-width:38px">${t}</span><span style="color:var(--tx-m);min-width:40px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(l.apiName||'')}</span><span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(l.model||'')}</span><span style="color:var(--ok);font-size:9px">${cacheStr}</span><span style="color:var(--tx-m)">${tokStr}</span><span style="font-weight:600;min-width:48px;text-align:right">${costStr}</span></div>`});h+=`</div></div>`;showMoFull('💰 费用统计',h,`<button class="mo-btn sec" onclick="hideMo();showPriceManager()">💲价格表</button><button class="mo-btn sec" onclick="showCostSettings()">⚙️设置</button><button class="mo-btn sec" onclick="exportCostLogs()">📤导出</button><button class="mo-btn sec" onclick="clearCostLogsConfirm()">🗑️清空</button><button class="mo-btn pri" onclick="hideMo()">关闭</button>`)}

//== showPriceManager ==//
function showPriceManager(){let h='<div style="display:flex;gap:4px;margin-bottom:10px;flex-wrap:wrap"><button class="mo-btn pri" onclick="showPriceImport()">📥 导入</button><button class="bbn" onclick="showUnpricedModels()">❓ 未配置</button></div>';const byApi={};Object.values(priceTable).forEach(p=>{if(!byApi[p.apiId])byApi[p.apiId]={name:p.apiName,items:[]};byApi[p.apiId].items.push(p)});apiConfigs.forEach(cfg=>{const items=byApi[cfg.id]?.items||[];const totalModels=cfg.models.length;h+=`<div style="margin-bottom:8px"><div style="font-weight:600;font-size:13px;padding:6px 8px;background:var(--bg-t);border-radius:var(--r);margin-bottom:4px;display:flex;align-items:center;gap:6px"><span style="flex:1">${esc(cfg.name)}</span><span style="font-size:11px;color:var(--tx-m)">${items.length}/${totalModels}</span><button class="bbn" onclick="addPriceEntry('${cfg.id}')" style="font-size:10px">+</button></div>`;if(items.length){h+=`<div style="max-height:200px;overflow-y:auto">`;items.sort((a,b)=>a.model.localeCompare(b.model)).forEach(p=>{const k=p.apiId+'||'+p.model;const ps=p.billing==='request'?'按次 ¥'+fmtCny(p.perReq):'按量 ¥'+fmtCny(p.inputPerM)+'/'+fmtCny(p.outputPerM);h+=`<div style="display:flex;align-items:center;gap:4px;padding:3px 8px;font-size:11px;border-bottom:1px solid var(--bd)"><span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${escA(p.model)}">${esc(p.model)}</span><span style="color:var(--tx-m);flex-shrink:0">${ps}</span><button class="bbn" onclick="editPrice('${escA(k)}')" style="font-size:9px;padding:1px 4px">✏️</button><button class="bbn" onclick="deletePrice('${escA(k)}')" style="font-size:9px;padding:1px 4px;color:var(--dn)">✕</button></div>`});h+=`</div>`}else h+=`<div style="color:var(--tx-m);font-size:12px;padding:8px;text-align:center">未配置</div>`;h+=`</div>`});showMoFull('💲 价格表管理',h,`<button class="mo-btn sec" onclick="hideMo();showCostPanel()">← 统计</button><button class="mo-btn pri" onclick="hideMo()">关闭</button>`)}

//== showPriceImport ==//
function showPriceImport(){const apiOpts=apiConfigs.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('');const ac='background:var(--ac);color:#fff;border-color:var(--ac)';pushMo('📥 导入价格表',`<div class="fg"><label>绑定到 API</label><select id="piApi">${apiOpts}</select></div><div class="fg"><label>格式</label><div id="piFmtGrp" style="display:flex;gap:4px"><button class="bbn" data-v="json" onclick="pickOpt('piFmtGrp','piFmt','json');document.getElementById('piHint').textContent='JSON: {items:[{model,billing,perReq/inputPerM/outputPerM}]}'" style="${ac}">JSON</button><button class="bbn" data-v="md" onclick="pickOpt('piFmtGrp','piFmt','md');document.getElementById('piHint').textContent='Markdown表格，需含模型、计费类型、单次价格、输入价格、输出价格列'">表格</button></div><input type="hidden" id="piFmt" value="json"></div><div style="font-size:11px;color:var(--tx-m);margin-bottom:4px" id="piHint">JSON: {items:[{model,billing,perReq/inputPerM/outputPerM}]}</div><div class="fg"><textarea id="piText" rows="12" placeholder="粘贴价格数据..." style="font-size:13px"></textarea></div>`,`<button class="mo-btn sec" onclick="popMo()">取消</button><button class="mo-btn pri" onclick="doPriceImport()">导入</button>`,'',showPriceManager)}

//== doPriceImport ==//
function doPriceImport(){const apiId=document.getElementById('piApi').value;const fmt=document.getElementById('piFmt').value;const text=document.getElementById('piText').value.trim();if(!apiId){toast('请选择API');return}if(!text){toast('请粘贴数据');return}const cfg=apiConfigs.find(c=>c.id===apiId);const apiName=cfg?.name||'?';let items=[];if(fmt==='json'){const r=parsePriceJSON(text);if(r.error){toast('解析失败: '+r.error);return}items=r.items}else{const r=parsePriceMarkdown(text);if(r.error){toast('解析失败: '+r.error);return}items=r.items}if(!items.length){toast('未解析到有效数据');return}let added=0,updated=0;items.forEach(it=>{const k=apiId+'||'+it.model;const isNew=!priceTable[k];priceTable[k]={apiId,apiName,model:it.model,billing:it.billing,perReq:it.perReq!=null?it.perReq:null,inputPerM:it.inputPerM!=null?it.inputPerM:null,outputPerM:it.outputPerM!=null?it.outputPerM:null,cacheReadPerM:it.cacheReadPerM!=null?it.cacheReadPerM:null,cacheCreatePerM:it.cacheCreatePerM!=null?it.cacheCreatePerM:null,note:it.note||'',updatedAt:new Date().toISOString()};if(isNew)added++;else updated++});saveCfg();popMo(true);toast(`✓ 导入${items.length}条 (新增${added}, 更新${updated})`)}

//== parsePriceJSON ==//
function parsePriceJSON(text){try{const d=JSON.parse(text);const items=d.items||d;if(!Array.isArray(items))return{error:'需要items数组',items:[]};return{items:items.filter(it=>it.model&&it.billing).map(it=>({model:String(it.model).trim(),billing:it.billing,perReq:it.perReq!=null?parseFloat(it.perReq):null,inputPerM:it.inputPerM!=null?parseFloat(it.inputPerM):null,outputPerM:it.outputPerM!=null?parseFloat(it.outputPerM):null,cacheReadPerM:it.cacheReadPerM!=null?parseFloat(it.cacheReadPerM):null,cacheCreatePerM:it.cacheCreatePerM!=null?parseFloat(it.cacheCreatePerM):null,note:it.note||''}))}}catch(e){return{error:e.message,items:[]}}}

//== parsePriceMarkdown ==//
function parsePriceMarkdown(text){const lines=text.trim().split('\n').filter(l=>l.includes('|'));if(lines.length<3)return{error:'表格行数不足',items:[]};const parseCols=line=>{const c=line.split('|').map(s=>s.trim());if(c[0]==='')c.shift();if(c.length&&c[c.length-1]==='')c.pop();return c};const hdrs=parseCols(lines[0]);const findC=(...kw)=>hdrs.findIndex(h=>kw.some(k=>h.includes(k)));const mc=findC('模型','model','Model');const bc=findC('计费','billing','类型');const rc=findC('单次','per_req','按次');const ic=findC('输入','input','Input');const oc=findC('输出','output','补全','Output','completion');if(mc===-1)return{error:'未找到模型列',items:[]};const extractNum=s=>{if(!s||s==='—'||s==='-'||s.trim()==='—'||s.trim()==='-')return null;const m=s.match(/[\d.]+/);return m?parseFloat(m[0]):null};const items=[];for(let i=1;i<lines.length;i++){const raw=lines[i];if(raw.includes('---')||raw.includes(':--'))continue;const cols=parseCols(raw);if(cols.length<=mc)continue;const model=cols[mc]?.trim();if(!model)continue;const billingRaw=bc>=0&&cols[bc]?cols[bc].trim():'';const perReq=rc>=0&&cols[rc]?extractNum(cols[rc]):null;const inputP=ic>=0&&cols[ic]?extractNum(cols[ic]):null;const outputP=oc>=0&&cols[oc]?extractNum(cols[oc]):null;let billing='request';if(billingRaw.includes('按量')||billingRaw.toLowerCase().includes('token'))billing='token';else if(billingRaw.includes('按次')||billingRaw.toLowerCase().includes('request'))billing='request';else if(inputP!=null&&perReq==null)billing='token';else if(perReq!=null)billing='request';else continue;items.push({model,billing,perReq:billing==='request'?perReq:null,inputPerM:billing==='token'?inputP:null,outputPerM:billing==='token'?outputP:null})}return{items}}

//== editPrice ==//
function editPrice(key){const p=priceTable[key];if(!p)return;const isReq=p.billing==='request';pushMo('✏️ 编辑价格',`<div class="fg"><label>模型</label><input type="text" value="${escA(p.model)}" disabled style="opacity:0.6"></div><div class="fg"><label>渠道: ${esc(p.apiName||'?')}</label></div><div class="fg"><label>计费类型</label><select id="epBilling"><option value="request" ${isReq?'selected':''}>按次</option><option value="token" ${!isReq?'selected':''}>按量</option></select></div><div class="fg"><label>按次价格(¥)</label><input type="text" id="epPerReq" value="${p.perReq||''}"></div><div class="fg"><label>输入价(¥/1M tok)</label><input type="text" id="epInput" value="${p.inputPerM||''}"></div><div class="fg"><label>输出价(¥/1M tok)</label><input type="text" id="epOutput" value="${p.outputPerM||''}"></div><div class="fg"><label>缓存读取(¥/1M tok)</label><input type="text" id="epCacheR" value="${p.cacheReadPerM||''}"></div><div class="fg"><label>缓存创建(¥/1M tok)</label><input type="text" id="epCacheC" value="${p.cacheCreatePerM||''}"></div><div class="fg"><label>备注</label><input type="text" id="epNote" value="${escA(p.note||'')}"></div>`,`<button class="mo-btn sec" onclick="popMo()">取消</button><button class="mo-btn pri" onclick="doEditPrice('${escA(key)}')">保存</button>`,'compact',showPriceManager)}

//== doEditPrice ==//
function doEditPrice(key){const p=priceTable[key];if(!p)return;p.billing=document.getElementById('epBilling').value;const pr=document.getElementById('epPerReq').value.trim();p.perReq=pr?parseFloat(pr):null;const ip=document.getElementById('epInput').value.trim();p.inputPerM=ip?parseFloat(ip):null;const op=document.getElementById('epOutput').value.trim();p.outputPerM=op?parseFloat(op):null;const cr=document.getElementById('epCacheR').value.trim();p.cacheReadPerM=cr?parseFloat(cr):null;const cc=document.getElementById('epCacheC').value.trim();p.cacheCreatePerM=cc?parseFloat(cc):null;p.note=document.getElementById('epNote').value.trim();p.updatedAt=new Date().toISOString();saveCfg();popMo(true);ok()}

//== addPriceEntry ==//
function addPriceEntry(apiId){const cfg=apiConfigs.find(c=>c.id===apiId);if(!cfg)return;const modelOpts=cfg.models.filter(m=>!priceTable[apiId+'||'+m]).map(m=>`<option value="${escA(m)}">${esc(m)}</option>`).join('');if(!modelOpts){toast('全部已配置');return}pushMo('+ 添加价格',`<div class="fg"><label>渠道: ${esc(cfg.name)}</label></div><div class="fg"><label>模型</label><select id="apModel" style="max-width:100%">${modelOpts}</select></div><div class="fg"><label>计费类型</label><select id="apBilling"><option value="request">按次</option><option value="token">按量</option></select></div><div class="fg"><label>按次价格(¥)</label><input type="text" id="apPerReq"></div><div class="fg"><label>输入价(¥/1M tok)</label><input type="text" id="apInput"></div><div class="fg"><label>输出价(¥/1M tok)</label><input type="text" id="apOutput"></div>`,`<button class="mo-btn sec" onclick="popMo()">取消</button><button class="mo-btn pri" onclick="doAddPriceEntry('${apiId}')">添加</button>`,'compact',showPriceManager)}

//== doAddPriceEntry ==//
function doAddPriceEntry(apiId){const model=document.getElementById('apModel').value;if(!model){toast('请选择模型');return}const cfg=apiConfigs.find(c=>c.id===apiId);const k=apiId+'||'+model;const billing=document.getElementById('apBilling').value;const pr=document.getElementById('apPerReq').value.trim();const ip=document.getElementById('apInput').value.trim();const op=document.getElementById('apOutput').value.trim();priceTable[k]={apiId,apiName:cfg?.name||'?',model,billing,perReq:pr?parseFloat(pr):null,inputPerM:ip?parseFloat(ip):null,outputPerM:op?parseFloat(op):null,cacheReadPerM:null,cacheCreatePerM:null,note:'',updatedAt:new Date().toISOString()};saveCfg();popMo(true);ok()}

//== deletePrice ==//
function deletePrice(key){if(!confirm('删除此价格配置？'))return;delete priceTable[key];saveCfg();showPriceManager();ok()}

//== showUnpricedModels ==//
function showUnpricedModels(){let h='';let total=0;apiConfigs.forEach(cfg=>{const unpriced=cfg.models.filter(m=>!priceTable[cfg.id+'||'+m]);if(!unpriced.length)return;total+=unpriced.length;h+=`<div style="margin-bottom:8px"><div style="font-weight:600;font-size:12px;padding:4px 8px;background:var(--bg-t);border-radius:var(--r)">${esc(cfg.name)} (${unpriced.length})</div><div style="max-height:200px;overflow-y:auto;font-size:11px">`;unpriced.forEach(m=>{h+=`<div style="display:flex;align-items:center;gap:4px;padding:2px 8px;border-bottom:1px solid var(--bd)"><span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(m)}</span></div>`});h+=`</div></div>`});if(!h)h='<div style="text-align:center;color:var(--ok);padding:20px">✅ 全部已配置</div>';pushMo(`❓ 未配置价格 (${total})`,h,`<button class="mo-btn pri" onclick="popMo()">返回</button>`,'',showPriceManager)}

//== showCostSettings ==//
function showCostSettings(){const cs=costSettings;pushMo('⚙️ 费用设置',`<div class="pr"><label>月预算(¥)</label><input type="number" id="csMonthly" value="${cs.monthlyBudget}"></div><div class="pr"><label>月预算提醒(%)</label><input type="number" id="csMonthR" value="${Math.round(cs.warnMonthRatio*100)}" min="50" max="100"></div><div class="pr"><label>单次费用提醒(¥)</label><input type="text" id="csWarnReq" value="${cs.warnReqCost}"></div><div class="pr"><label>按量输入提醒(K tok)</label><input type="number" id="csWarnTok" value="${Math.round(cs.warnTokenInput/1000)}"></div><div class="pr"><label>预估输出tok</label><input type="number" id="csDefOut" value="${cs.defaultOutputTok}"></div><div class="pr"><label style="display:flex;align-items:center;gap:6px"><input type="checkbox" id="csNoPrice" ${cs.requireConfirmNoPrice?'checked':''} style="width:16px;height:16px">未配价时确认</label></div>`,`<button class="mo-btn sec" onclick="popMo()">取消</button><button class="mo-btn pri" onclick="doSaveCostSettings()">保存</button>`,'compact',showCostPanel)}

//== doSaveCostSettings ==//
function doSaveCostSettings(){costSettings.monthlyBudget=parseFloat(document.getElementById('csMonthly').value)||500;costSettings.warnMonthRatio=(parseInt(document.getElementById('csMonthR').value)||90)/100;costSettings.warnReqCost=parseFloat(document.getElementById('csWarnReq').value)||2;costSettings.warnTokenInput=(parseInt(document.getElementById('csWarnTok').value)||100)*1000;costSettings.defaultOutputTok=parseInt(document.getElementById('csDefOut').value)||3000;costSettings.requireConfirmNoPrice=document.getElementById('csNoPrice').checked;saveCfg();popMo(true);ok()}

//== exportCostLogs ==//

//== matRestoreItem ==//
function matRestoreItem(i){const item=matUndoList[i];if(!item)return;
if(item.type==='edit'){let obj=materials;for(let j=0;j<item.path.length-1;j++)obj=obj[item.path[j]];obj[item.path[item.path.length-1]]=item.oldValue;saveMats();renderMatEditMode();toast('↩ 已恢复: '+item.label)}
else if(item.type==='delChar'){const d=item.data;materials.chars[d.name]=d.char;materials.charOrder.splice(d.orderIdx,0,d.name);d.rels.forEach(r=>{materials.rels[r.key]=r.data;if(!materials.relIndex.includes(r.key))materials.relIndex.push(r.key)});saveMats();renderMatEditMode();toast('↩ 已恢复角色: '+d.name)}
else if(item.type==='delRel'){const d=item.data;materials.rels[d.key]=d.data;if(!materials.relIndex.includes(d.key))materials.relIndex.push(d.key);saveMats();renderMatEditMode();toast('↩ 已恢复关系: '+d.key)}
else if(item.type==='delApp'){const d=item.data;materials.apps[d.name]=d.content;materials.appOrder.splice(d.orderIdx,0,d.name);if(d.groups){Object.entries(d.groups).forEach(([gn,has])=>{if(has&&materials.appGroups[gn]&&!materials.appGroups[gn].includes(d.name))materials.appGroups[gn].push(d.name)})}saveMats();renderMatEditMode();toast('↩ 已恢复附录: '+d.name)}
else if(item.type==='delMeta'){const d=item.data;materials.metaPrompts[d.name]=d.content;materials.metaOrder.splice(d.orderIdx,0,d.name);saveMats();renderMatEditMode();toast('↩ 已恢复: '+d.name)}
else if(item.type==='rename'){const d=item.data,on=d.oldName,nn=d.newName;if(!materials.chars[nn]){toast('角色不存在: '+nn);matUndoList.splice(i,1);hideMo();return}if(materials.chars[on]){toast('角色名冲突: '+on);matUndoList.splice(i,1);hideMo();return}materials.chars[on]=materials.chars[nn];delete materials.chars[nn];materials.charOrder=materials.charOrder.map(c=>c===nn?on:c);const newRI=[];materials.relIndex.forEach(k=>{const rel=materials.rels[k];const nf=rel.from===nn?on:rel.from;const nt=rel.to===nn?on:rel.to;const nk=nf+'→'+nt;delete materials.rels[k];materials.rels[nk]={d:rel.d,from:nf,to:nt};newRI.push(nk)});materials.relIndex=newRI;if(editState.expandedChars.has(nn)){editState.expandedChars.delete(nn);editState.expandedChars.add(on)}saveMats();renderMatEditMode();toast('↩ 已恢复改名: '+nn+'→'+on)}
matUndoList.splice(i,1);hideMo()}

const isExp=editState.expandedChars.has(cn);

//== matAddChar ==//

//== matDoAddChar ==//
function matDoAddChar(){const n=document.getElementById('m_name').value.trim();if(!n){toast('请输入名称');return}if(materials.chars[n]){toast('已存在');return}materials.chars[n]={d:document.getElementById('m_d').value,s:document.getElementById('m_s').value,h:document.getElementById('m_h').value,g:'',spotlightApps:[],keywords:[]};materials.charOrder.push(n);saveMats();hideMo();renderMatCharTree();ok()}

//== matRenameChar ==//
function matRenameChar(oldName){showMo('重命名角色',`<div class="fg"><label>新名称</label><input type="text" id="m_newcharname" value="${escA(oldName)}"></div>`,`<button class="mo-btn sec" onclick="hideMo()">取消</button><button class="mo-btn pri" onclick="matDoRenameChar('${escA(oldName)}')">保存</button>`,'compact')}

//== matDoRenameChar ==//
function matDoRenameChar(oldName){const newName=document.getElementById('m_newcharname').value.trim();if(!newName){toast('请输入名称');return}if(newName===oldName){hideMo();return}if(materials.chars[newName]){toast('已存在');return}matRecordDel('rename','改名:'+oldName+'→'+newName,{oldName,newName});materials.chars[newName]=materials.chars[oldName];delete materials.chars[oldName];materials.charOrder=materials.charOrder.map(c=>c===oldName?newName:c);const newRelIndex=[];materials.relIndex.forEach(k=>{const rel=materials.rels[k];const nf=rel.from===oldName?newName:rel.from;const nt=rel.to===oldName?newName:rel.to;const nk=nf+'→'+nt;delete materials.rels[k];materials.rels[nk]={d:rel.d,from:nf,to:nt};newRelIndex.push(nk)});materials.relIndex=newRelIndex;if(editState.expandedChars.has(oldName)){editState.expandedChars.delete(oldName);editState.expandedChars.add(newName)}saveMats();hideMo();renderMatCharTree();toast('✓ 已改名')}

//== matDelChar ==//
function matDelChar(cn){if(!confirm(`删除「${cn}」及所有关系？`))return;const charData=JSON.parse(JSON.stringify(materials.chars[cn]));const relData=[];materials.relIndex.forEach(k=>{const rel=materials.rels[k];if(rel.from===cn||rel.to===cn)relData.push({key:k,data:JSON.parse(JSON.stringify(rel))})});const orderIdx=materials.charOrder.indexOf(cn);matRecordDel('delChar','角色:'+cn,{name:cn,char:charData,rels:relData,orderIdx});delete materials.chars[cn];materials.charOrder=materials.charOrder.filter(c=>c!==cn);materials.relIndex=materials.relIndex.filter(k=>{if(k.includes(cn+'→')||k.includes('→'+cn)){delete materials.rels[k];return false}return true});editState.expandedChars.delete(cn);saveMats();renderMatCharTree();toast('✓ 已删除')}

//== matDelRel ==//
function matDelRel(key){if(!confirm(`删除关系「${key}」？`))return;matRecordDel('delRel','关系:'+key,{key,data:JSON.parse(JSON.stringify(materials.rels[key]))});delete materials.rels[key];materials.relIndex=materials.relIndex.filter(k=>k!==key);saveMats();renderMatCharTree()}

//== matGotoReverse ==//
function matGotoReverse(from,to){const reverseKey=to+'→'+from;if(materials.rels[reverseKey]){matJumpTo(to);setTimeout(()=>toast(`可查看 ${to}→${from}`),300)}else{if(confirm(`${to}→${from} 不存在，创建？`))matOpenRelEditor(to,from)}}

//== matJumpTo ==//
function matJumpTo(cn){const ci=materials.charOrder.indexOf(cn);if(ci<0)return;editState.expandedChars.clear();editState.expandedChars.add(cn);document.querySelectorAll('.tree-char-body').forEach(b=>b.classList.remove('show'));document.querySelectorAll('.arrow').forEach(a=>a.classList.remove('open'));document.getElementById('body_c'+ci)?.classList.add('show');document.getElementById('arrow_c'+ci)?.classList.add('open');document.getElementById('charBlock_'+ci)?.scrollIntoView({behavior:'smooth',block:'start'})}

//== matOpenRelEditor ==//
function matOpenRelEditor(fromChar,presetTo){const others=materials.charOrder.filter(c=>c!==fromChar);if(!others.length){toast('无其他角色');return}const defaultTo=presetTo||others[0];showMo('编辑关系',`<div class="fg"><label>对象</label><div style="display:flex;gap:15px;align-items:center"><strong>${esc(fromChar)}</strong><span style="font-size:24px">⇄</span><div style="flex:1;position:relative"><input type="hidden" id="m_target" value="${escA(defaultTo)}"><button class="csel-btn" onclick="document.getElementById('relTargetDD').classList.toggle('show')" style="width:100%;padding:8px 10px"><span id="relTargetTxt">${esc(defaultTo)}</span><span class="csel-arr">▼</span></button><div class="csel-dd" id="relTargetDD" style="position:absolute;width:100%">${others.map(c=>`<div class="csel-dd-item ${c===defaultTo?'active':''}" data-v="${escA(c)}" onclick="pickMoSel('relTargetDD','m_target','relTargetTxt','${escA(c)}','${escA(c)}',function(){matUpdateRelEditor('${escA(fromChar)}')})"><span class="cdd-nm">${esc(c)}</span></div>`).join('')}</div></div></div></div><div id="relEditorContent"></div>`,`<button class="mo-btn sec" onclick="hideMo()">关闭</button><button class="mo-btn pri" onclick="matSaveRelEditor('${escA(fromChar)}')">💾 保存</button>`);matUpdateRelEditor(fromChar)}

//== matUpdateRelEditor ==//
function matUpdateRelEditor(fromChar){const toChar=document.getElementById('m_target').value;const fk=fromChar+'→'+toChar,rk=toChar+'→'+fromChar;const fExists=!!materials.rels[fk],rExists=!!materials.rels[rk];document.getElementById('relEditorContent').innerHTML=`<div class="dual-rel-box"><div class="dual-rel-header"><span class="rel-direction">📤 ${esc(fromChar)} → ${esc(toChar)}</span><span class="status-tag ${fExists?'exists':'new'}">${fExists?'已有':'新建'}</span></div><div class="dual-rel-body"><textarea class="tree-textarea tree-textarea-md" id="m_forward">${esc(fExists?materials.rels[fk].d:'')}</textarea></div></div><div class="dual-rel-box"><div class="dual-rel-header"><span class="rel-direction">📥 ${esc(toChar)} → ${esc(fromChar)}</span><span class="status-tag ${rExists?'exists':'new'}">${rExists?'已有':'新建'}</span></div><div class="dual-rel-body"><textarea class="tree-textarea tree-textarea-md" id="m_reverse">${esc(rExists?materials.rels[rk].d:'')}</textarea></div></div>`}

//== matSaveRelEditor ==//
function matSaveRelEditor(fromChar){const toChar=document.getElementById('m_target').value;const fk=fromChar+'→'+toChar,rk=toChar+'→'+fromChar;const fv=document.getElementById('m_forward').value.trim(),rv=document.getElementById('m_reverse').value.trim();if(fv){if(!materials.rels[fk]){materials.rels[fk]={d:fv,from:fromChar,to:toChar};materials.relIndex.push(fk)}else materials.rels[fk].d=fv}else if(materials.rels[fk]){delete materials.rels[fk];materials.relIndex=materials.relIndex.filter(k=>k!==fk)}if(rv){if(!materials.rels[rk]){materials.rels[rk]={d:rv,from:toChar,to:fromChar};materials.relIndex.push(rk)}else materials.rels[rk].d=rv}else if(materials.rels[rk]){delete materials.rels[rk];materials.relIndex=materials.relIndex.filter(k=>k!==rk)}saveMats();renderMatCharTree();matUpdateRelEditor(fromChar);toast('✓ 已保存')}

const ct=materials.apps[n]||'';
const len=ct.length;const pv=ct.substring(0,40).replace(/\n/g,' ');
const kws=materials.appKeywords[n]||[];
const idx=materials.appOrder.indexOf(n);
let h=`<div class="mat-exp" data-idx="${idx}" data-name="${escA(n)}"><div class="mat-exp-hdr" onclick="matToggleExpApp('${escA(n)}')"><span class="drag-handle" onclick="sp()">⋮</span><span class="arrow${isExp?' open':''}">▶</span><span class="exp-idx">#${idx+1}</span><span class="exp-nm">${esc(n)}</span>`;
if(kws.length)h+=`<span class="exp-kws">${kws.map(k=>`<span class="exp-kw">${esc(k)}</span>`).join('')}</span>`;
h+=`<span class="exp-len">${len}字</span>`;
if(!isExp)h+=`<span class="exp-pv">${esc(pv)}</span>`;
h+=`<span class="exp-acts" onclick="sp()"><button class="bbn" style="font-size:11px" onclick="matRenameApp('${escA(n)}')">✏️</button><button class="bbn" style="font-size:11px;color:var(--dn);border-color:var(--dn)" onclick="matDelApp('${escA(n)}')">✕</button></span></div>`;
if(isExp){h+=`<div class="mat-exp-body show"><div class="mat-field"><div class="mat-field-lbl">🔑 关键词</div><div class="mat-kw-row">${kws.map(k=>`<span class="mat-kw-tag">${esc(k)} <span class="kw-x" onclick="matDelAppKwTag('${escA(n)}','${escA(k)}')">×</span></span>`).join('')}<span class="mat-kw-add"><input type="text" id="akw_${idx}" placeholder="添加" onkeydown="if(event.key==='Enter')matAddAppKwTag('${escA(n)}',${idx})"><button onclick="matAddAppKwTag('${escA(n)}',${idx})">+</button></span></div></div><div class="mat-field"><textarea class="mat-ta mat-ta-lg" id="app_${idx}">${esc(ct)}</textarea></div><div style="display:flex;gap:4px;justify-content:flex-end;margin-top:6px"><button class="bbn" style="font-size:11px;background:var(--ac);color:#fff;border-color:var(--ac)" onclick="matSaveAppInline('${escA(n)}',${idx})">💾 保存</button></div></div>`}
h+=`</div>`;return h}

//== matToggleSecBlock ==//
function matToggleSecBlock(secId){
editState.secCollapsed[secId]=!editState.secCollapsed[secId];
const body=document.getElementById('matSec'+secId.charAt(0).toUpperCase()+secId.slice(1));
const hdr=body?.previousElementSibling;
if(body)body.classList.toggle('show',!editState.secCollapsed[secId]);
if(hdr){const arrow=hdr.querySelector('.sec-arrow');if(arrow)arrow.classList.toggle('open',!editState.secCollapsed[secId])}}

//== matFilterChars ==//
function matFilterChars(kw){
kw=kw.toLowerCase();
document.querySelectorAll('#charTree .mat-char').forEach(el=>{
const nm=el.dataset.name||'';
el.style.display=(!kw||nm.toLowerCase().includes(kw))?'':'none'})}

//== matFilterApps ==//
function matFilterApps(kw){
kw=kw.toLowerCase();
document.querySelectorAll('#editAppList .mat-exp').forEach(el=>{
const nm=el.dataset.name||'';
el.style.display=(!kw||nm.toLowerCase().includes(kw))?'':'none'})}

//== matSwitchCharTab ==//
function matSwitchCharTab(ci,tab){
const cn=materials.charOrder[ci];if(!cn)return;
editState.charTabs[cn]=tab;
['profile','settings','relations'].forEach(t=>{
const pane=document.getElementById('tp_'+ci+'_'+t);
if(pane){pane.classList.toggle('show',t===tab);pane.style.display=t===tab?'block':'none'}});
const bar=document.querySelector('#body_c'+ci+' .mat-tab-bar');
if(bar)bar.querySelectorAll('.mat-tab').forEach(b=>b.classList.toggle('active',b.textContent.includes(tab==='profile'?'人设':tab==='settings'?'设定':'关系')))}

//== matToggleExpApp ==//
function matToggleExpApp(name){
if(editState.expandedApps.has(name)){
const idx=materials.appOrder.indexOf(name);
const ta=document.getElementById('app_'+idx);
if(ta&&ta.value!==(materials.apps[name]||'')){materials.apps[name]=ta.value}
editState.expandedApps.delete(name)}
else editState.expandedApps.add(name);
renderMatAppList()}

//== matToggleExpMeta ==//
function matToggleExpMeta(name){
if(editState.expandedMetas.has(name)){
const idx=materials.metaOrder.indexOf(name);
const ta=document.getElementById('meta_'+idx);
if(ta&&ta.value!==(materials.metaPrompts[name]||'')){materials.metaPrompts[name]=ta.value}
editState.expandedMetas.delete(name)}
else editState.expandedMetas.add(name);
renderMatMetaList()}

//== matToggleAppGrp ==//
function matToggleAppGrp(grpName){
editState.appGrpCollapsed[grpName]=!editState.appGrpCollapsed[grpName];
renderMatAppList()}

//== matSaveAppInline ==//
function matSaveAppInline(name,idx){
const ta=document.getElementById('app_'+idx);
if(ta){const old=materials.apps[name];if(ta.value!==old)matRecordEdit('附录:'+name,['apps',name],old);materials.apps[name]=ta.value}
saveMats();toast('✓ 已保存: '+name)}

//== matSaveMetaInline ==//
function matSaveMetaInline(name,idx){
const ta=document.getElementById('meta_'+idx);
if(ta){const old=materials.metaPrompts[name];if(ta.value!==old)matRecordEdit('元提示词:'+name,['metaPrompts',name],old);materials.metaPrompts[name]=ta.value}
saveMats();toast('✓ 已保存: '+name)}

//== matAddCharKwTag ==//
function matAddCharKwTag(name,ci){
const inp=document.getElementById('ckw_'+ci);if(!inp)return;
const v=inp.value.trim();if(!v)return;
if(!materials.chars[name].keywords)materials.chars[name].keywords=[];
if(!materials.chars[name].keywords.includes(v)){materials.chars[name].keywords.push(v);saveMats();renderMatCharTree();ok()}else toast('已存在')}

//== matDelCharKwTag ==//
function matDelCharKwTag(name,kw){
if(!materials.chars[name])return;
materials.chars[name].keywords=(materials.chars[name].keywords||[]).filter(k=>k!==kw);
saveMats();renderMatCharTree()}

//== matAddAppKwTag ==//
function matAddAppKwTag(name,idx){
const inp=document.getElementById('akw_'+idx);if(!inp)return;
const v=inp.value.trim();if(!v)return;
if(!materials.appKeywords[name])materials.appKeywords[name]=[];
if(!materials.appKeywords[name].includes(v)){materials.appKeywords[name].push(v);saveMats();renderMatAppList();ok()}else toast('已存在')}

//== matDelAppKwTag ==//
function matDelAppKwTag(name,kw){
if(!materials.appKeywords[name])return;
materials.appKeywords[name]=materials.appKeywords[name].filter(k=>k!==kw);
if(!materials.appKeywords[name].length)delete materials.appKeywords[name];
saveMats();renderMatAppList()}

//== matSetCharGender ==//
function matSetCharGender(name,g,btn){
materials.chars[name].g=g;
btn.parentElement.querySelectorAll('.tg-btn').forEach(b=>b.classList.remove('active'));
btn.classList.add('active');_matDirty=true}

//== matSetProtag ==//
function matSetProtag(name,v,btn){
materials.chars[name].protagonist=v;
btn.parentElement.querySelectorAll('.tg-btn').forEach(b=>b.classList.remove('active'));
btn.classList.add('active');_matDirty=true}

//== matToggleSpotChip ==//
function matToggleSpotChip(chip,charName,appName){
const c=materials.chars[charName];if(!c)return;
if(!c.spotlightApps)c.spotlightApps=[];
const idx=c.spotlightApps.indexOf(appName);
if(idx>=0){c.spotlightApps.splice(idx,1);chip.classList.remove('checked');chip.textContent=appName}
else{c.spotlightApps.push(appName);chip.classList.add('checked');chip.textContent='✓ '+appName}
_matDirty=true}

//== matManageAppGroups ==//
function matManageAppGroups(){
let h='<div style="font-size:12px;color:var(--tx-m);margin-bottom:8px">管理附录分组</div>';
materials.groupOrder.forEach((gn,i)=>{
const ms=(materials.appGroups[gn]||[]).filter(a=>materials.appOrder.includes(a));
h+=`<div style="padding:8px;background:var(--bg-t);border-radius:var(--r);margin-bottom:4px;display:flex;align-items:center;gap:6px"><span style="flex:1;font-weight:600;font-size:13px">${esc(gn)} (${ms.length})</span><button class="bbn" onclick="matRenameAppGroup(${i})">✏️</button><button class="bbn" style="color:var(--dn)" onclick="matDelAppGroup(${i})">✕</button></div>`});
h+=`<div style="margin-top:8px;display:flex;gap:4px"><input type="text" id="newGrpNm" placeholder="新分组名..." style="flex:1;padding:5px 8px;background:var(--bg-t);border:1px solid var(--bd);border-radius:var(--r);color:var(--tx-p);font-size:13px"><button class="bbn" style="background:var(--ac);color:#fff;border-color:var(--ac)" onclick="matDoAddAppGroup()">+</button></div>`;
showMo('📁 附录分组',h,`<button class="mo-btn sec" onclick="hideMo()">关闭</button>`)}

//== matDoAddAppGroup ==//
function matDoAddAppGroup(){
const n=document.getElementById('newGrpNm')?.value?.trim();if(!n)return;
if(materials.groupOrder.includes(n)){toast('已存在');return}
materials.groupOrder.push(n);materials.appGroups[n]=[];
saveMats();matManageAppGroups();renderMatAppList();ok()}

//== matRenameAppGroup ==//
function matRenameAppGroup(i){
const old=materials.groupOrder[i];const nn=prompt('新名称：',old);
if(!nn?.trim()||nn.trim()===old)return;
materials.appGroups[nn.trim()]=materials.appGroups[old]||[];
delete materials.appGroups[old];
materials.groupOrder[i]=nn.trim();
saveMats();matManageAppGroups();renderMatAppList();ok()}

//== matDelAppGroup ==//
function matDelAppGroup(i){
const gn=materials.groupOrder[i];
delete materials.appGroups[gn];
materials.groupOrder.splice(i,1);
saveMats();matManageAppGroups();renderMatAppList();ok()}


//== matAddApp ==//
function matAddApp(){showMo('新增附录',`<div class="fg"><label>标题</label><input type="text" id="m_name"></div><div class="fg"><label>内容</label><textarea id="m_content" rows="10"></textarea></div>`,`<button class="mo-btn sec" onclick="hideMo()">取消</button><button class="mo-btn pri" onclick="matDoAddApp()">保存</button>`)}

//== matDoAddApp ==//
function matDoAddApp(){const n=document.getElementById('m_name').value.trim();if(!n){toast('请输入');return}if(materials.apps[n]){toast('已存在');return}materials.apps[n]=document.getElementById('m_content').value;materials.appOrder.push(n);saveMats();hideMo();renderMatAppList();ok()}

//== matEditApp ==//
function matEditApp(n){showMo('编辑: '+n,`<div class="fg"><label>内容</label><textarea id="m_content" rows="12">${esc(materials.apps[n]||'')}</textarea></div>`,`<button class="mo-btn sec" onclick="hideMo()">取消</button><button class="mo-btn pri" onclick="matDoEditApp('${escA(n)}')">保存</button>`)}

//== matDoEditApp ==//
function matDoEditApp(n){const oldVal=materials.apps[n];const newVal=document.getElementById('m_content').value;if(newVal!==oldVal)matRecordEdit('附录:'+n,['apps',n],oldVal);materials.apps[n]=newVal;saveMats();hideMo();ok()}

//== matRenameApp ==//
function matRenameApp(old){showMo('重命名',`<div class="fg"><label>新标题</label><input type="text" id="m_newname" value="${escA(old)}"></div>`,`<button class="mo-btn sec" onclick="hideMo()">取消</button><button class="mo-btn pri" onclick="matDoRenameApp('${escA(old)}')">保存</button>`,'compact')}

//== matDoRenameApp ==//
function matDoRenameApp(old){const nw=document.getElementById('m_newname').value.trim();if(!nw){toast('请输入');return}if(nw!==old&&materials.apps[nw]){toast('已存在');return}if(nw!==old){materials.apps[nw]=materials.apps[old];delete materials.apps[old];materials.appOrder=materials.appOrder.map(a=>a===old?nw:a);materials.groupOrder.forEach(g=>{if(materials.appGroups[g])materials.appGroups[g]=materials.appGroups[g].map(a=>a===old?nw:a)});materials.charOrder.forEach(cn=>{if(materials.chars[cn].spotlightApps)materials.chars[cn].spotlightApps=materials.chars[cn].spotlightApps.map(a=>a===old?nw:a)});if(materials.appKeywords[old]){materials.appKeywords[nw]=materials.appKeywords[old];delete materials.appKeywords[old]}}saveMats();hideMo();renderMatAppList();ok()}

//== matDelApp ==//
function matDelApp(n){if(!confirm(`删除附录「${n}」？`))return;const orderIdx=materials.appOrder.indexOf(n);const groupInfo={};materials.groupOrder.forEach(gn=>{groupInfo[gn]=(materials.appGroups[gn]||[]).includes(n)});matRecordDel('delApp','附录:'+n,{name:n,content:materials.apps[n],orderIdx,groups:groupInfo});delete materials.apps[n];materials.appOrder=materials.appOrder.filter(a=>a!==n);materials.groupOrder.forEach(g=>{if(materials.appGroups[g])materials.appGroups[g]=materials.appGroups[g].filter(a=>a!==n)});materials.charOrder.forEach(cn=>{if(materials.chars[cn].spotlightApps)materials.chars[cn].spotlightApps=materials.chars[cn].spotlightApps.filter(a=>a!==n)});if(materials.appKeywords[n])delete materials.appKeywords[n];saveMats();renderMatAppList();ok()}

//== matSetupDrag ==//
function matSetupDrag(container,type,orderArr,renderFn){let dragSrcMat=null;container.querySelectorAll('[data-idx]').forEach(el=>{el.draggable=false;const h=el.querySelector('.drag-handle');if(h){h.draggable=true;h.onmousedown=e=>e.stopPropagation();h.onclick=e=>e.stopPropagation();h.ontouchstart=e=>e.stopPropagation();h.ondragstart=function(e){dragSrcMat=this.closest('[data-idx]');if(!dragSrcMat)return;dragSrcMat.classList.add('dragging');e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain','')}};el.ondragover=function(e){e.preventDefault();if(dragSrcMat&&dragSrcMat!==this)this.classList.add('drag-over')};el.ondragleave=function(){this.classList.remove('drag-over')};el.ondrop=function(e){e.preventDefault();this.classList.remove('drag-over');if(dragSrcMat&&dragSrcMat!==this){const from=parseInt(dragSrcMat.dataset.idx),to=parseInt(this.dataset.idx);if(!isNaN(from)&&!isNaN(to)){const item=orderArr.splice(from,1)[0];orderArr.splice(to,0,item);saveMats();renderFn()}}};el.ondragend=function(){dragSrcMat=null;document.querySelectorAll('.dragging,.drag-over').forEach(x=>x.classList.remove('dragging','drag-over'))}})}

// ==================== 启动区 ====================
window.onload=init;
</script>
</body>
</html>
