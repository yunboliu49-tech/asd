/*== 工作台 ==*/
.ws-pop{position:fixed;right:32px;top:50%;transform:translateY(-50%);width:min(320px,88vw);max-height:min(520px,78vh);background:var(--bg-s);border:1px solid var(--bd);border-radius:var(--r);box-shadow:0 8px 28px rgba(0,0,0,.45);z-index:80;display:none;overflow:hidden}
.ws-pop.show{display:flex;flex-direction:column}
.ws-pop-h{display:flex;align-items:center;gap:8px;padding:8px 10px;border-bottom:1px solid var(--bd);font-size:var(--bs);font-weight:700}
.ws-pop-h span{flex:1}
.ws-pop-list{overflow-y:auto;padding:5px;max-height:360px}
.ws-pop-empty{padding:18px 10px;text-align:center;color:var(--tx-m);font-size:calc(var(--fs) - 2px)}
.ws-pop-item{display:flex;align-items:center;gap:6px;padding:7px 8px;border-radius:var(--r);cursor:pointer;border:1px solid transparent;margin-bottom:3px;background:var(--bg-t);user-select:none}
.ws-pop-item:hover{border-color:var(--ac-border,var(--ac));background:var(--ac-soft)}
.ws-pop-item.active{border-color:var(--ac-border,var(--ac));background:var(--ac-soft)}
.ws-pop-item.dragging,.ws-mgr-item.dragging{opacity:.45}
.ws-pop-item.drag-over,.ws-mgr-item.drag-over{box-shadow:0 -3px 0 0 var(--ac) inset}
.ws-pop-main{flex:1;min-width:0}
.ws-pop-title{font-size:calc(var(--fs) - 1px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.ws-pop-sub{font-size:11px;color:var(--tx-m);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.ws-badge{font-size:12px;flex-shrink:0;width:20px;text-align:center}
.ws-badge.auto{color:var(--tx-m)}
.ws-badge.active{color:var(--wn)}
.ws-badge.manual{color:var(--ac)}
.ws-dot{width:7px;height:7px;border-radius:50%;background:var(--tx-m);flex-shrink:0;opacity:.55}
.ws-dot.gen{background:var(--wn);opacity:1;animation:pulse 1s infinite}
.ws-pop-ftr{display:flex;gap:4px;flex-wrap:wrap;padding:7px;border-top:1px solid var(--bd);background:var(--bg-s)}
.ws-mini-btn{padding:4px 8px;background:var(--bg-t);border:1px solid var(--bd);border-radius:var(--r);color:var(--tx-s);cursor:pointer;font-size:12px;white-space:nowrap}
.ws-mini-btn:hover{border-color:var(--ac);color:var(--tx-p);background:var(--ac-soft)}
.ws-mark{font-size:11px;color:var(--wn);flex-shrink:0}
.ws-remove{display:none;padding:1px 5px;background:transparent;border:1px solid transparent;border-radius:var(--r);color:var(--tx-m);cursor:pointer;font-size:12px;flex-shrink:0}
.conv-item:hover .ws-remove,.conv-item.active .ws-remove{display:block}
.ws-remove:hover{border-color:var(--dn);color:var(--dn);background:var(--dn-soft)}
.ws-sb-entry{width:100%;margin-bottom:5px;padding:7px;background:var(--bg-t);border:1px solid var(--bd);border-radius:var(--r);color:var(--tx-p);cursor:pointer;font-size:var(--bs);text-align:center}
.ws-sb-entry:hover{border-color:var(--ac);background:var(--ac-soft)}
.ws-mgr-item{display:flex;align-items:center;gap:8px;padding:8px 10px;background:var(--bg-t);border:1px solid var(--bd);border-radius:var(--r);margin-bottom:4px;cursor:grab}
.ws-mgr-main{flex:1;min-width:0}
.ws-mgr-title{font-size:calc(var(--fs) - 1px);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ws-mgr-sub{font-size:11px;color:var(--tx-m);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ws-mgr-acts{display:flex;gap:3px;flex-wrap:wrap;justify-content:flex-end}
.ws-search-row{display:flex;gap:6px;margin:8px 0}
.ws-search-row input{flex:1;padding:7px 9px;background:var(--bg-t);border:1px solid var(--bd);border-radius:var(--r);color:var(--tx-p);font-size:var(--fs)}
.ws-search-result{display:flex;align-items:center;gap:8px;padding:7px 9px;background:var(--bg-t);border-radius:var(--r);margin-bottom:3px;font-size:13px}
.ws-search-result .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ws-swipe{position:relative;overflow:hidden;border-radius:var(--r);margin-bottom:3px}
.ws-swipe-main{position:relative;z-index:2;transition:transform .18s ease;background:var(--bg-s);border-radius:var(--r)}
.ws-swipe.open .ws-swipe-main{transform:translateX(-64px)}
.ws-swipe-del{position:absolute;right:0;top:0;bottom:0;width:64px;background:var(--dn);color:#fff;border:none;border-radius:0 var(--r) var(--r) 0;font-size:13px;cursor:pointer;z-index:1}
.ws-swipe-del:active{filter:brightness(.9)}
.ws-swipe .ws-pop-item{margin-bottom:0}
@media(max-width:768px){.ws-pop{right:28px;top:auto;bottom:calc(90px + var(--safe-b));transform:none;max-height:60vh}.ws-pop-title{font-size:13px}.ws-pop-sub{font-size:10px}}
/*== UI细化：低刺激状态与统计栏 ==*/
:root{--ac:#8aa99a;--ach:#9ab8aa;--ac-bg:#26342f;--ac-border:#587769;--avatar-user-bg:#26342f;--avatar-user-fg:#b8d0c5;--avatar-ai-bg:#2b302b;--avatar-ai-fg:#c4c8bd;--avatar-sys-bg:#3a3022;--avatar-sys-fg:#dcc08b}

*{box-sizing:border-box;margin:0;padding:0}
html,body{overscroll-behavior:none}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;font-size:var(--fs);background:var(--bg-p);color:var(--tx-p);height:100vh;height:100dvh;overflow:hidden;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.app{display:flex;height:100%;flex-direction:column}
::-webkit-scrollbar{width:14px;height:14px}::-webkit-scrollbar-track{background:rgba(255,255,255,0.03)}::-webkit-scrollbar-thumb{background:var(--tx-m);border-radius:7px;border:3px solid transparent;background-clip:content-box;min-height:40px}::-webkit-scrollbar-thumb:hover{background:var(--tx-s);border:2px solid transparent;background-clip:content-box}
.toolbar{background:var(--bg-s);border-bottom:1px solid var(--bd);padding:8px 16px;padding-top:calc(8px + var(--safe-t));display:flex;align-items:center;gap:10px;flex-shrink:0}
.toolbar-title{font-weight:600;font-size:var(--ts);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;max-width:200px;cursor:pointer}

.tb{padding:5px 14px;background:var(--bg-t);border:1px solid var(--bd);border-radius:var(--r);color:var(--tx-s);cursor:pointer;font-size:var(--bs);white-space:nowrap;flex-shrink:0}.tb:hover{background:var(--bd);color:var(--tx-p)}.tb:active{transform:scale(.96)}.tb.pri{background:var(--ac);color:#fff;border-color:var(--ac)}
.tb.fld-ok{color:var(--ok);border-color:var(--ok)}

.t-right{margin-left:auto;display:flex;gap:6px;align-items:center;flex-shrink:0}

.pend-b{background:var(--wn);color:#000;padding:2px 7px;border-radius:8px;font-size:11px;font-weight:600;display:none}
.menu-btn{display:none;padding:8px 12px;background:var(--bg-t);border:1px solid var(--bd);border-radius:var(--r);color:var(--tx-p);cursor:pointer;font-size:18px}
.dk{display:flex;gap:6px;align-items:center}
.main-c{display:flex;flex:1;overflow:hidden;min-height:0}
.sidebar{width:var(--sw);min-width:200px;max-width:400px;background:var(--bg-s);border-right:1px solid var(--bd);display:flex;flex-direction:column;flex-shrink:0}
.sb-hdr{padding:6px 8px;border-bottom:1px solid var(--bd);flex-shrink:0;display:flex;gap:4px}

.sb-tabs{display:flex;border-bottom:1px solid var(--bd);flex-shrink:0}

.conv-list{flex:1;overflow-y:auto;padding:3px;-webkit-overflow-scrolling:touch;min-height:0;overscroll-behavior:contain}

.pin-div{padding:1px 10px;font-size:9px;color:var(--tx-m);border-bottom:1px dashed var(--bd);margin-bottom:1px;user-select:none}

function syncTraceKey(){return 'syncTrace_'+syncWorkspaceStorageSuffix()}

function syncTraceQueueCounts(){return{dirty:Object.keys(_syncDirty||{}).length,failed:Object.keys(_syncFailedForever||{}).length}}
function syncTraceClean(v,depth){
if(depth>3)return'[depth]';
if(v===undefined)return undefined;
if(v===null||typeof v==='number'||typeof v==='boolean')return v;
if(typeof v==='string')return v.length>240?v.slice(0,240)+'…':v;
if(Array.isArray(v))return v.slice(0,20).map(x=>syncTraceClean(x,depth+1));
if(typeof v==='object'){const out={};Object.entries(v).forEach(([k,val])=>{if(/token|content|body|raw|base64|password|secret/i.test(k))return;if(/sha/i.test(k))out[k]=syncTraceShortSha(val);else out[k]=syncTraceClean(val,depth+1)});return out}
return String(v)
}

function syncGhRateState(needed){
const known=Number(_ghRate.limit||0)>0&&Number.isFinite(Number(_ghRate.remaining));

const paused=!!(_ghRate.pauseUntil&&Date.now()<_ghRate.pauseUntil);
const reset=_ghRate.reset||0,pauseUntil=_ghRate.pauseUntil||0;

}
function syncGhRateTime(ts){return ts?new Date(ts).toLocaleString('zh-CN'):'未知时间'}

function syncQueueKey(){return 'syncQueue_'+syncWorkspaceStorageSuffix()}
function persistSyncQueues(opts){
const requireAll=!!opts?.requireAll;
const payload={dirty:{..._syncInflightDirty,..._syncDirty},failed:_syncFailedForever,savedAt:new Date().toISOString()};
let localOk=false;
try{localStorage.setItem(syncQueueKey(),JSON.stringify(payload));localOk=true}catch(e){_syncLastError='同步队列本地缓存保存失败: '+(e.message||e.name);syncTrace('queue.persist.localStorageError',{error:e.message||e.name})}
if(!_folderIDB){if(!localOk)syncTrace('queue.persist.unavailable',{reason:'localStorage and IndexedDB unavailable'});return Promise.resolve(localOk)}
return new Promise(resolve=>{
try{
const tx=_folderIDB.transaction('handles','readwrite');
const req=tx.objectStore('handles').put(payload,syncQueueKey());
let done=false;
const finish=ok=>{if(done)return;done=true;if(!ok){_syncLastError='同步队列 IndexedDB 保存失败';syncTrace('queue.persist.indexedDbError',{localFallback:localOk})}resolve(requireAll?(ok&&localOk):(ok||localOk))};
req.onsuccess=()=>finish(true);
req.onerror=()=>finish(false);
tx.onabort=()=>finish(false)
}catch(e){_syncLastError='同步队列 IndexedDB 保存失败: '+(e.message||e.name);syncTrace('queue.persist.indexedDbError',{error:e.message||e.name,localFallback:localOk});resolve(localOk)}
})
}
function syncReconcileQueueSnapshots(localPayload,idbPayload,currentDirty,currentFailed){
 const selected=new Map();
 const add=(queue,status,rank)=>Object.entries(queue||{}).forEach(([path,item])=>{
  if(!path||!item||typeof item!=='object')return;
  const time=Number(item.time||0),prev=selected.get(path);
  if(!prev||time>prev.time||(time===prev.time&&rank>=prev.rank))selected.set(path,{status,item,time,rank})
 });

function loadSyncQueuesIDB(){

async function ghApi(method,path,body,opts){

const prevMutation=_ghMutationQueue;

await prevMutation;

mutationRelease();

return{ok:false,status:0,error:'同步会话已切换，已取消远端写入',staleSession:true}
}
const waitMs=Math.max(0,1000-(Date.now()-_ghLastMutationAt));
if(waitMs)await new Promise(r=>setTimeout(r,waitMs))
 if(!allowInactive&&!targetCurrent()){
mutationRelease();
mutationRelease=null;
return{ok:false,status:0,error:'同步会话已切换，已取消远端写入',staleSession:true}
}
}
const headers={'Authorization':'token '+authToken,'Accept':'application/vnd.github.v3+json'};
if(method==='GET'&&opts.etagKey&&opts.useEtag!==false&&_ghEtags[opts.etagKey])headers['If-None-Match']=_ghEtags[opts.etagKey];
if(body&&!(body instanceof ArrayBuffer))headers['Content-Type']='application/json';
const fetchOpts={method,headers};
if(body)fetchOpts.body=typeof body==='string'?body:body instanceof ArrayBuffer?body:JSON.stringify(body);
const timeoutMs=opts.timeout||30000;
try{
const signals=[];
if(timeoutMs&&AbortSignal.timeout)signals.push(AbortSignal.timeout(timeoutMs));
 if(!allowInactive)signals.push(target.abortController.signal);

else if(signals.length>1&&AbortSignal.any)fetchOpts.signal=AbortSignal.any(signals)
}catch(e){}
try{
const resp=await fetch('https://api.github.com'+path,fetchOpts);
 if(!allowInactive&&!targetCurrent())return staleResult();
const responseEtag=resp.headers.get('etag')||'';

const rateLimit=Number(rateLimitRaw||0),rateRemaining=Number(rateRemainingRaw||0),rateReset=Number(rateResetRaw||0);
if(rateLimitRaw!==null&&rateLimit)_ghRate.limit=rateLimit;if(rateRemainingRaw!==null&&Number.isFinite(rateRemaining))_ghRate.remaining=rateRemaining;if(rateResetRaw!==null&&rateReset)_ghRate.reset=rateReset*1000;
const retryAfter=Number(resp.headers.get('retry-after')||0);
if((resp.status===403||resp.status===429)&&(retryAfter||_ghRate.remaining===0)){_ghRate.pauseUntil=retryAfter?Date.now()+retryAfter*1000:Math.max(Date.now()+60000,_ghRate.reset||0);syncTrace('github.rate.limited',{status:resp.status,remaining:_ghRate.remaining,reset:_ghRate.reset,pauseUntil:_ghRate.pauseUntil})}
if(resp.status===304)return{ok:true,status:304,notModified:true,data:null,etag:responseEtag||_ghEtags[opts.etagKey]||''};
if(resp.status===401)return{ok:false,status:401,error:'Token无效或过期'};
if(resp.status===404)return{ok:false,status:404,error:'未找到'};
if(resp.status===409)return{ok:false,status:409,error:'冲突(SHA不匹配)'};
if(!resp.ok&&resp.status!==201&&resp.status!==204){
let em='HTTP '+resp.status;
 try{const j=await resp.json();if(!allowInactive&&!targetCurrent())return staleResult();em=(j.message||em)+(j.errors?' | '+JSON.stringify(j.errors):'')}catch(e){if(!allowInactive&&!targetCurrent())return staleResult()}
 if(!allowInactive&&!targetCurrent())return staleResult();
 return{ok:false,status:resp.status,error:em}}
if(resp.status===204)return{ok:true,status:204,data:null,etag:responseEtag};

async function ghReadFile(path,target){
target=target||syncCaptureRemoteTarget();
const etagKey=(target.repo+'@'+target.branch+'#'+target.workspaceId)+':'+path;
const canUseCachedEtag=!!syncMeta.fileSHAs[path]&&!!_ghEtags[etagKey]&&_ghFileReadCache.has(etagKey);
const r=await ghApi('GET','/repos/'+target.repo+'/contents/'+encodeURIComponent(path).replace(/%2F/g,'/')+'?ref='+target.branch,null,{etagKey,useEtag:canUseCachedEtag,target});
if(!r.ok)return{ok:false,error:r.error,status:r.status};
if(r.notModified){const cached=ghCachedFileRead(etagKey,path);return cached||await ghReadFileFresh(path,target)}
const d=r.data;
if(d.encoding==='base64'&&d.content){
try{const text=decodeURIComponent(escape(atob(d.content.replace(/\n/g,''))));const out={ok:true,content:text,sha:d.sha,size:d.size};ghRememberFileRead(etagKey,r.etag,out);return out}
catch(e){return{ok:false,error:'解码失败',status:200}}}
if(d.size>1024*1024){const out=await ghReadBlob(d.sha,target);if(out.ok)ghRememberFileRead(etagKey,r.etag,out);return out}
return{ok:false,error:'无法解码',status:200}}

catch(e){return{ok:false,error:'解码失败',status:200}}}

//== ghWriteBlob ==//
async function ghWriteBlob(path,content,message,knownSha,target){
target=target||syncCaptureRemoteTarget();
const blobR=await ghApi('POST','/repos/'+target.repo+'/git/blobs',{content:btoa(unescape(encodeURIComponent(content))),encoding:'base64'}, {target});
if(!blobR.ok)return{ok:false,error:'创建Blob失败: '+blobR.error};
const blobSha=blobR.data.sha;
// 先等一下让上一次的 ref 更新传播完成
await new Promise(r=>setTimeout(r,800));
for(let attempt=0;attempt<10;attempt++){
const headR=await ghApi('GET','/repos/'+target.repo+'/git/ref/heads/'+target.branch,null,{target});
if(!headR.ok)return{ok:false,error:'获取HEAD失败: '+headR.error};
const baseCommit=headR.data.object.sha;
const treeR=await ghApi('GET','/repos/'+target.repo+'/git/commits/'+baseCommit,null,{target});
if(!treeR.ok)return{ok:false,error:'获取commit失败: '+treeR.error};
const newTreeR=await ghApi('POST','/repos/'+target.repo+'/git/trees',{base_tree:treeR.data.tree.sha,tree:[{path:path,mode:'100644',type:'blob',sha:blobSha}]},{target});
if(!newTreeR.ok)return{ok:false,error:'创建tree失败: '+newTreeR.error};
const commitR=await ghApi('POST','/repos/'+target.repo+'/git/commits',{message:message||'update '+path,tree:newTreeR.data.sha,parents:[baseCommit]},{target});
if(!commitR.ok)return{ok:false,error:'创建commit失败: '+commitR.error};
const refR=await ghApi('PATCH','/repos/'+target.repo+'/git/refs/heads/'+target.branch,{sha:commitR.data.sha},{target});
if(refR.ok){
// 成功后再等一下让 ref 传播，避免下次 Blob 读到旧值
await new Promise(r=>setTimeout(r,600));
return{ok:true,sha:blobSha}
}
if(attempt<9){
const wait=Math.min(500+attempt*500,4000);
await new Promise(r=>setTimeout(r,wait));
continue
}
return{ok:false,error:'更新ref失败(10次重试)：'+(refR.error||'')+' status='+refR.status}
}
}

async function gitBlobSha(content){
const encoder=new TextEncoder();
const contentBytes=encoder.encode(content);
const header=encoder.encode('blob '+contentBytes.length+'\0');
const combined=new Uint8Array(header.length+contentBytes.length);
combined.set(header,0);
combined.set(contentBytes,header.length);
const hashBuf=await crypto.subtle.digest('SHA-1',combined);
return Array.from(new Uint8Array(hashBuf)).map(b=>b.toString(16).padStart(2,'0')).join('')}

let _vaultHydrateSeq=0,_vaultHydrateDoneSeq=-1,_vaultHydratePromise=null,_vaultHydratePromiseKey='';

async function hydrateConflictVaultMetasFromFiles(opts){
opts=opts||{};
const h=opts.rootHandle||folderH,gen=opts.generation??_folderLoadGen,guard=typeof opts.guard==='function'?opts.guard:()=>folderH===h&&isFolderLoadCurrent(gen);

let touched=0,done=0;
try{
const cd=await h.getDirectoryHandle('conversations');
if(!guard())return false;

for(const m of list){
if(!guard())return false;
try{
const dir=await cd.getDirectoryHandle(m._dir||getGrpDir(m.groupId||'_default'));
const fn=m._fn||('conv_'+m.id+'.json');
const raw=await(await(await dir.getFileHandle(fn)).getFile()).text();
if(!guard())return false;

}catch(e){}

if(opts.onProgress)try{opts.onProgress(done,list.length)}catch(e){}

}

function scheduleVaultHydrate(opts){

const h=opts.rootHandle||folderH,gen=opts.generation??_folderLoadGen,guard=typeof opts.guard==='function'?opts.guard:()=>folderH===h&&isFolderLoadCurrent(gen);

const key=(h.name||'folder')+'|'+gen+'|'+_vaultHydrateSeq;

const delay=opts.delay??(curTab==='vault'?0:800);
_vaultHydratePromiseKey=key;

async function syncPullIndex(silent,remoteTarget){
remoteTarget=remoteTarget||syncCaptureRemoteTarget();
if(!syncCanRun())return{ok:false,error:syncInactiveHint('拉取远端索引')};
if(!folderH)return{ok:false,error:'未连接文件夹'};
try{
const idxR=await ghReadFile('_index.json',remoteTarget);
if(!syncRemoteTargetCurrent(remoteTarget))return{ok:false,error:'工作文件夹或同步目标已切换，旧索引拉取已取消',staleSession:true};
if(!idxR.ok){

if(!silent)toast('拉取索引失败: '+idxR.error);
return{ok:false,error:idxR.error,status:idxR.status}
}
if(idxR.notModified)return{ok:true,changed:false,idx:null};

}

//== restoreImagesFromLocal ==//
function restoreImagesFromLocal(remoteConv,localConv){
// 若远端不是剥离版，直接返回
if(!remoteConv._imagesStripped)return remoteConv;
if(!localConv||!localConv.messages)return remoteConv;
// 建立本地消息 id → 图片数据 的映射
const localImgMap={};
localConv.messages.forEach(m=>{
if(m.images&&m.images.length){
// 每张图带 base64（本地完整版）
const imgs=m.images.filter(img=>img.base64);
if(imgs.length)localImgMap[m.id]=imgs
}
});
if(!Object.keys(localImgMap).length)return remoteConv;
// 遍历远端消息，把剥离版图片恢复成完整版
(remoteConv.messages||[]).forEach(m=>{
if(!m.images||!m.images.length)return;
const localImgs=localImgMap[m.id];
if(!localImgs)return;
// 按顺序对应：远端第 i 张 ← 本地第 i 张
m.images=m.images.map((rImg,i)=>{
if(!rImg._stripped)return rImg;
const lImg=localImgs[i];
if(!lImg)return rImg;
// 用本地图片补齐，保留远端可能改过的元信息
return{...lImg,name:rImg.name||lImg.name}
})
});
delete remoteConv._imagesStripped;
return remoteConv
}

const SYNC_CLOUD_RESET_ROOT_FILES=['config.json','materials.json','wb_keywords.json','stories.json','cost_logs.json','_locks.json'];

function syncCloudResetAllowedPath(path){return path==='_index.json'||SYNC_CLOUD_RESET_ROOT_FILES.includes(path)||path.startsWith('conversations/')}
async function syncCloudResetScan(remoteTarget){
if(!syncCanRun())throw new Error(syncInactiveHint('清空云端'));
remoteTarget=remoteTarget||syncCaptureRemoteTarget();
const head=await ghGetBranchHead(remoteTarget);if(!head.ok)throw new Error('读取分支失败: '+(head.error||head.status));
const commit=await ghGetCommit(head.sha,remoteTarget);if(!commit.ok)throw new Error('读取 commit 失败: '+(commit.error||commit.status));
const treeR=await ghGetRecursiveTree(commit.treeSha,remoteTarget);if(!treeR.ok)throw new Error('读取 tree 失败: '+(treeR.error||treeR.status));
if(treeR.truncated)throw new Error('仓库文件树过大，GitHub 返回 truncated；为避免漏删，已停止。请换专用同步仓库或人工清理后再试。');
const allFiles=(treeR.tree||[]).filter(x=>x&&x.type==='blob'&&x.path);
const targets=allFiles.filter(x=>syncCloudResetAllowedPath(x.path)&&!x.path.startsWith('_archives/')).map(x=>({path:x.path,sha:x.sha,size:x.size||0,mode:x.mode||'100644',type:'blob'}));
const have=new Set(targets.map(t=>t.path));
const missing=['_index.json',...SYNC_CLOUD_RESET_ROOT_FILES].filter(p=>!have.has(p));
let oldIndexRaw='',oldIndexSha=null;const idx=targets.find(t=>t.path==='_index.json');
if(idx){oldIndexSha=idx.sha;try{const br=await ghReadBlob(idx.sha,remoteTarget);if(br.ok)oldIndexRaw=br.content||''}catch(e){}}
targets.sort((a,b)=>a.path.localeCompare(b.path));
const totalBytes=targets.reduce((s,t)=>s+(t.size||0),0);
return{time:new Date().toISOString(),repo:remoteTarget.repo,branch:remoteTarget.branch,headSha:head.sha,baseTreeSha:commit.treeSha,targets,missing,errors:[],oldIndexRaw,oldIndexSha,totalBytes,truncated:false,remoteTarget}
}

function syncSchedulePoll(delay){
if(!syncCanRun())return;
const due=Date.now()+Math.max(500,delay||0);

if(_syncPollTimer)clearTimeout(_syncPollTimer);
_syncPollDueAt=due;
_syncPollTimer=setTimeout(syncPollingTick,Math.max(0,due-Date.now()))
}
function syncNextPollDelay(){
if(document.hidden)return 5*60*1000;
if(_ghRate.pauseUntil>Date.now())return Math.max(5000,_ghRate.pauseUntil-Date.now()+1000);
if(_ghRate.limit&&_ghRate.remaining<Math.max(300,_ghRate.limit*0.1))return 5*60*1000;
if(Date.now()-_syncLastActivityAt<2*60*1000)return 8000;
if(_syncNoChangeStreak<4)return 20000;
if(_syncNoChangeStreak<12)return 45000;
return 90000
}

async function syncPullLocks(remoteTarget){

return{ok:false,error:r.error};
}

}catch(e){return{ok:false,error:e.message}}
}

//== syncSetConvLock ==//
async function syncSetConvLock(convId){
if(!syncCanRun()||!convId)return;
if(!SYNC_REMOTE_LOCKS)return;
 const remoteTarget=syncCaptureRemoteTarget();
 try{
const r=await syncPullLocks(remoteTarget);
if(!r.ok)return;
const locks=r.locks;
if(!locks.convLocks)locks.convLocks={};
const now=Date.now();
const LOCK_TIMEOUT=5*60*1000;
const existing=locks.convLocks[convId];
if(existing&&existing.deviceId!==syncConfig.deviceId){
const lockT=new Date(existing.time||0).getTime();
if(now-lockT<LOCK_TIMEOUT){
toast('ℹ️ 此对话最近被 '+(existing.deviceName||'其他设备')+' 编辑')
}
}
locks.convLocks[convId]={deviceId:syncConfig.deviceId,deviceName:syncConfig.deviceName||'未命名设备',time:new Date().toISOString()};
Object.keys(locks.convLocks).forEach(cid=>{
const t=new Date(locks.convLocks[cid].time||0).getTime();
if(now-t>LOCK_TIMEOUT*2)delete locks.convLocks[cid]
});
const wr=await syncPushLocks(locks,r.sha,remoteTarget);
if(!wr.ok&&wr.status===409){await new Promise(r=>setTimeout(r,300));return await syncSetConvLock(convId)}
}catch(e){console.warn('[sync] set conv lock failed:',e)}
}

//== syncReleaseConvLock ==//
async function syncReleaseConvLock(convId){
if(!syncCanRun()||!convId)return;
if(!SYNC_REMOTE_LOCKS)return;
try{
const r=await syncPullLocks();
if(!r.ok)return;
const locks=r.locks;
if(!locks.convLocks||!locks.convLocks[convId])return;
if(locks.convLocks[convId].deviceId!==syncConfig.deviceId)return;
delete locks.convLocks[convId];
const wr=await syncPushLocks(locks,r.sha);
if(!wr.ok&&wr.status===409){await new Promise(r=>setTimeout(r,300));return await syncReleaseConvLock(convId)}
}catch(e){console.warn('[sync] release conv lock failed:',e)}
}

const r=await syncPullLocks();
if(!r.ok)return;
const locks=r.locks;
const now=Date.now();
const LOCK_TIMEOUT=5*60*1000;
const existing=locks.matEditLock;
if(existing&&existing.deviceId!==syncConfig.deviceId){
const lockT=new Date(existing.time||0).getTime();
if(now-lockT<LOCK_TIMEOUT){
toast('ℹ️ 素材正在被 '+(existing.deviceName||'其他设备')+' 编辑')
}
}
locks.matEditLock={deviceId:syncConfig.deviceId,deviceName:syncConfig.deviceName||'未命名设备',time:new Date().toISOString()};
const wr=await syncPushLocks(locks,r.sha);
if(!wr.ok&&wr.status===409){await new Promise(r=>setTimeout(r,300));return await syncSetMatEditLock()}
}catch(e){console.warn('[sync] set mat lock failed:',e)}
}

//== syncReleaseMatEditLock ==//
async function syncReleaseMatEditLock(){
if(!syncCanRun())return;
if(!SYNC_REMOTE_LOCKS)return;
try{
const r=await syncPullLocks();
if(!r.ok)return;
const locks=r.locks;
if(!locks.matEditLock||locks.matEditLock.deviceId!==syncConfig.deviceId)return;
locks.matEditLock=null;
const wr=await syncPushLocks(locks,r.sha);
if(!wr.ok&&wr.status===409){await new Promise(r=>setTimeout(r,300));return await syncReleaseMatEditLock()}
}catch(e){console.warn('[sync] release mat lock failed:',e)}
}

upd(15,'扫描 active 对话文件...');
for await(const de of cd.values()){
if(de.kind!=='directory'||de.name==='_trash'||de.name===INDEX_OPS_DIR)continue;

for await(const fe of dir.values()){if(fe.kind==='file'&&fe.name.endsWith('.json')&&fe.name!=='_index.json')await addFile(report.activeFiles,'active',de.name,fe.name,await dir.getFileHandle(fe.name))}

try{const td=await folderH.getDirectoryHandle('_trash');for await(const fe of td.values()){if(fe.kind==='file'&&fe.name.endsWith('.json'))await addFile(report.trashFiles,'root-trash','_trash',fe.name,await td.getFileHandle(fe.name))}}catch(e){}
try{const ctd=await cd.getDirectoryHandle('_trash');for await(const fe of ctd.values()){if(fe.kind==='file'&&fe.name.endsWith('.json'))await addFile(report.trashFiles,'conversations-trash','conversations/_trash',fe.name,await ctd.getFileHandle(fe.name))}}catch(e){}
upd(75,'对比 index 与文件...');
const activeById=new Map(),trashById=new Map();
report.activeFiles.forEach(f=>{if(f.id)activeById.set(f.id,f)});
report.trashFiles.forEach(f=>{if(f.id&&!trashById.has(f.id))trashById.set(f.id,f)});
const convIds=new Set(convList.map(c=>c.id));
const trashIds=new Set(trashList.map(t=>t.id));
convList.forEach(c=>{if(c?.id&&!activeById.has(c.id))report.issues.missingFile.push(c)});
report.activeFiles.forEach(f=>{if(f.id&&!convIds.has(f.id))report.issues.missingIndex.push(f);if(f.deletedAt||f.deletedFrom)report.issues.activeDeletedFlag.push(f);if(f.id&&trashById.has(f.id))report.issues.activeTrashDuplicate.push({active:f,trash:trashById.get(f.id)})});
report.trashFiles.forEach(f=>{if(f.id&&!trashIds.has(f.id))report.issues.trashMissingIndex.push(f)});
const buckets={};
report.trashFiles.forEach(f=>{const k=auditMinuteKey(f.deletedAt);if(!k)return;(buckets[k]||(buckets[k]=[])).push(f)});
Object.entries(buckets).filter(([,arr])=>arr.length>=3).sort((a,b)=>b[1].length-a[1].length).slice(0,12).forEach(([minute,items])=>report.issues.recentTrashBursts.push({minute,count:items.length,items:items.slice(0,20)}));

_lastLocalAudit=report;

const card=(label,n,color)=>`<div style="padding:8px;background:var(--bg-t);border-radius:var(--r)"><div style="color:var(--tx-m);font-size:11px">${label}</div><div style="font-size:18px;font-weight:700;color:${color||'var(--tx-p)'}">${n}</div></div>`;

html+=card('active 文件',report.summary.activeFiles,'var(--ok)')+card('_trash 文件',report.summary.trashFiles,'var(--tx-p)')+card('index 指向缺文件',report.summary.missingFile,report.summary.missingFile?'var(--dn)':'var(--ok)')+card('active 带 deletedAt',report.summary.activeDeletedFlag,report.summary.activeDeletedFlag?'var(--wn)':'var(--ok)')+card('active/trash 同 id',report.summary.activeTrashDuplicate,report.summary.activeTrashDuplicate?'var(--wn)':'var(--ok)')+card('近期批量删除波峰',report.summary.recentTrashBursts,report.summary.recentTrashBursts?'var(--wn)':'var(--ok)');
html+='</div>';
const listIssue=(title,arr,fmt)=>{if(!arr.length)return'';return`<div class="ss"><div class="ss-t">${title} (${arr.length})</div><div style="max-height:160px;overflow:auto;font-size:11px;line-height:1.45">${arr.slice(0,20).map(fmt).join('')}</div>${arr.length>20?'<div style="font-size:11px;color:var(--tx-m)">仅显示前20项，完整内容请下载 JSON。</div>':''}</div>`};
html+=listIssue('⚠️ index 指向缺失文件',report.issues.missingFile,x=>`<div>• ${esc(auditItemLabel(x))} <span style="color:var(--tx-m)">${esc((x._dir||'?')+'/'+(x._fn||'?'))}</span></div>`);
html+=listIssue('⚠️ active 文件残留 deletedAt',report.issues.activeDeletedFlag,x=>`<div>• ${esc(auditItemLabel(x))} <span style="color:var(--tx-m)">deletedAt=${esc(x.deletedAt)}</span></div>`);
html+=listIssue('⚠️ active 与 _trash 同 id',report.issues.activeTrashDuplicate,x=>`<div>• ${esc(x.active.name||x.active.id)} <span style="color:var(--tx-m)">active ${x.active.msgCount}条 / trash ${x.trash.msgCount}条</span></div>`);

showMoFull('🧪 本地数据审计',html,`<button class="mo-btn sec" onclick="dl('chattool-local-audit-'+fmtD(new Date())+'.json',JSON.stringify(_lastLocalAudit,null,2),'application/json')">下载JSON</button><button class="mo-btn pri" onclick="hideMo()">关闭</button>`);

}

let _lastSyncPreview=null;
async function syncReadRemoteIndexFresh(){
const r=await ghApi('GET','/repos/'+syncConfig.repo+'/contents/_index.json?ref='+syncConfig.branch,null,{useEtag:false,timeout:30000});
if(!r.ok)return{ok:false,error:r.error,status:r.status};
const d=r.data;
if(!d||d.type!=='file')return{ok:false,error:'远端 _index.json 不是文件'};
let content='';
if(d.encoding==='base64'&&d.content)content=decodeURIComponent(escape(atob(d.content.replace(/\n/g,''))));
else if(d.size>1024*1024){const b=await ghReadBlob(d.sha);if(!b.ok)return b;content=b.content}
else return{ok:false,error:'无法解码远端索引'};
try{return{ok:true,idx:JSON.parse(content),sha:d.sha,size:d.size}}catch(e){return{ok:false,error:'远端索引 JSON 解析失败: '+(e.message||e.name)}}
}
function syncPreviewItemLabel(x){return esc((x.name||'?')+' · '+(x.msgCount||0)+'条 · '+(x.updatedAt||x.deletedAt||'无时间'))}
function syncPreviewList(title,items,kind){
if(!items.length)return'';
const tone=kind==='danger'?'var(--dn)':kind==='warn'?'var(--wn)':kind==='ok'?'var(--ok)':'var(--tx-p)';
let h=`<div style="margin-top:10px"><div style="font-weight:700;color:${tone};margin-bottom:4px">${title}（${items.length}）</div><div style="max-height:150px;overflow:auto;font-size:11px;line-height:1.45">`;
items.slice(0,30).forEach(x=>{h+=`<div style="padding:3px 0;border-bottom:1px solid var(--bd)">${syncPreviewItemLabel(x)}</div>`});
if(items.length>30)h+=`<div style="color:var(--tx-m);padding-top:4px">…还有 ${items.length-30} 项，下载 JSON 看完整清单</div>`;
return h+'</div></div>'
}
async function runSyncSafetyPreview(){
if(!syncCanRun()){toast(syncInactiveHint('运行同步预检'));return}
if(!folderH){toast('请先选择工作文件夹');return}
showMo('🔍 同步安全预检',`<div style="padding:18px;text-align:center"><div id="syncPreviewStatus">读取 GitHub 远端索引...</div><div class="prog-bar"><div class="prog-fill" style="width:20%"></div></div><div class="prog-text">只读预览，不会上传、下载、删除或恢复</div></div>`,'');
await new Promise(r=>setTimeout(r,30));
try{
const rr=await syncReadRemoteIndexFresh();
if(!rr.ok){hideMo();toast('同步预检失败: '+(rr.error||'无法读取远端索引'));return}
const remoteItems=syncRemoteIndexItems(rr.idx.items||[]);
const remoteTrash=syncRemoteTrashItems(rr.idx.trash||[],new Set(remoteItems.map(it=>it.id)));
const remoteScopeOut=syncRemoteScopeOutItems(rr.idx.outOfScope||rr.idx.scopeOut||[],new Set(remoteItems.map(it=>it.id)));
const remoteMap={};remoteItems.forEach(it=>{remoteMap[it.id]=it});
const remoteTrashMap={};remoteTrash.forEach(t=>{remoteTrashMap[t.id]=t});
const remoteScopeOutMap={};remoteScopeOut.forEach(s=>{remoteScopeOutMap[s.id]=s});
const localMap={};convList.forEach(c=>{if(syncInDomain(c))localMap[c.id]=c});
const allLocalMap={};convList.forEach(c=>{if(c&&!isConflictVaultConv(c))allLocalMap[c.id]=c});
const lastSyncT=syncMeta.lastSyncAt?new Date(syncMeta.lastSyncAt).getTime():0;
const report={time:new Date().toISOString(),version:VER,remoteSha:rr.sha,summary:{localActive:Object.keys(localMap).length,remoteActive:remoteItems.length,remoteTombstones:remoteTrash.length,remoteAdd:0,remoteUpdate:0,remoteFieldMerge:0,remoteConflictBranch:0,remoteUpdateUnknown:0,remoteReenterMerge:0,remoteReenterConflict:0,remoteScopeExit:0,remoteScopeExitLocalNewerText:0,localKeepAndRepairRemoteIndex:0,remoteTombstoneLocalNewerKept:0,remoteTombstoneWouldMoveToTrash:0,remoteTombstoneConflictBranch:0,remoteTombstoneSkippedLocalDirty:0,remoteTombstoneUnknownLocal:0,localConflictVault:convList.filter(isConflictVaultConv).length},items:{remoteAdd:[],remoteUpdate:[],remoteFieldMerge:[],remoteConflictBranch:[],remoteUpdateUnknown:[],remoteReenterMerge:[],remoteReenterConflict:[],remoteScopeExit:[],remoteScopeExitLocalNewerText:[],localKeepAndRepairRemoteIndex:[],remoteTombstoneLocalNewerKept:[],remoteTombstoneWouldMoveToTrash:[],remoteTombstoneConflictBranch:[],remoteTombstoneSkippedLocalDirty:[],remoteTombstoneUnknownLocal:[]}};
for(const rIt of remoteItems){
const local=localMap[rIt.id];
if(!local){
const localAny=allLocalMap[rIt.id];
if(localAny&&!syncInDomain(localAny)){
const item={...rIt,localUpdatedAt:localAny.updatedAt,localPinned:!!localAny.pinned,reason:'远端重新进入同步域，本地已有普通同 id'};
try{
const p=syncIndexItemPath(rIt);
const localFull=localAny.id===curConvId&&curConv?curConv:await loadConvFull(localAny.id);
const rrConv=await ghReadFileFresh(p);
if(rrConv.ok&&localFull){
const remoteFull=restoreImagesFromLocal(JSON.parse(rrConv.content),localFull);
if(rIt.pinned){remoteFull.pinned=true;delete remoteFull._syncScopeExitedAt}
const fm=syncMergeConvsByField(localFull,remoteFull);
if(fm)report.items.remoteReenterMerge.push({...item,mergeRelation:fm.relation,mergeBase:fm.baseSide,willRequeueUpload:!!fm.needsUpload});
else report.items.remoteReenterConflict.push({...item,reason:'本地普通与远端星标正文分叉或不同'})
}else report.items.remoteUpdateUnknown.push({...item,error:rrConv.error||'本地全文读取失败'})
}catch(e){report.items.remoteUpdateUnknown.push({...item,error:e.message||e.name})}
continue
}
report.items.remoteAdd.push(rIt);continue}
const localT=new Date(local.updatedAt||0).getTime(),remoteT=new Date(rIt.updatedAt||0).getTime();
if(remoteT>localT){
const item={...rIt,localUpdatedAt:local.updatedAt};
try{
const p=syncIndexItemPath(rIt);
const localFull=local.id===curConvId&&curConv?curConv:await loadConvFull(local.id);
const rrConv=await ghReadFileFresh(p);
if(rrConv.ok&&localFull){
const remoteFull=restoreImagesFromLocal(JSON.parse(rrConv.content),localFull);
const fm=syncMergeConvsByField(localFull,remoteFull);
if(fm)report.items.remoteFieldMerge.push({...item,mergeRelation:fm.relation,mergeBase:fm.baseSide,willRequeueUpload:!!fm.needsUpload});
else report.items.remoteConflictBranch.push({...item,reason:'正文分叉或不同'})
}else report.items.remoteUpdateUnknown.push({...item,error:rrConv.error||'本地全文读取失败'})
}catch(e){report.items.remoteUpdateUnknown.push({...item,error:e.message||e.name})}
report.items.remoteUpdate.push(item)
if(report.items.remoteUpdate.length%5===0)await new Promise(r=>setTimeout(r,0))
}
}
for(const lc of Object.values(localMap)){
const so=remoteScopeOutMap[lc.id];if(!so||remoteMap[lc.id])continue;
const scopeT=syncTs(so.scopeExitedAt),metaT=syncTs(lc.metaUpdatedAt||lc.updatedAt);
if(scopeT&&metaT<=scopeT+1000){
const item={...lc,scopeExitedAt:so.scopeExitedAt,byName:so.byName};
if(syncTs(lc.contentUpdatedAt)>scopeT+1000)report.items.remoteScopeExitLocalNewerText.push({...item,reason:'本机正文晚于退出同步域记录，拉取会保留为本地普通且不上传'});
else report.items.remoteScopeExit.push(item)
}
}
for(const lc of Object.values(localMap)){
if(remoteMap[lc.id]||remoteTrashMap[lc.id])continue;
const so=remoteScopeOutMap[lc.id];if(so&&syncTs(lc.metaUpdatedAt||lc.updatedAt)<=syncTs(so.scopeExitedAt)+1000)continue;
const p=syncIndexItemPath(lc);
if(syncMeta.fileSHAs[p]&&!_syncDirty[p]&&!_syncFailedForever[p])report.items.localKeepAndRepairRemoteIndex.push(lc)
}
for(const t of remoteTrash){

if(!lc){report.items.remoteTombstoneUnknownLocal.push(t);continue}
const p=syncIndexItemPath(lc);
if(!syncMeta.fileSHAs[p])continue;

if(!tombT||localT>tombT+1000)report.items.remoteTombstoneLocalNewerKept.push({...lc,deletedAt:t.deletedAt,deletedByName:t.deletedByName,reason:'本地更新时间晚于远端删除记录'});
else if(localT>lastSyncT+1000)report.items.remoteTombstoneConflictBranch.push({...lc,deletedAt:t.deletedAt,deletedByName:t.deletedByName});
else report.items.remoteTombstoneWouldMoveToTrash.push({...lc,deletedAt:t.deletedAt,deletedByName:t.deletedByName})
}
Object.keys(report.items).forEach(k=>{report.summary[k]=report.items[k].length});
_lastSyncPreview=report;

h+=`<div style="padding:8px;background:var(--bg-t);border-radius:var(--r)"><div style="color:var(--tx-m)">更新将冲突分支</div><strong style="color:${report.summary.remoteConflictBranch?'var(--dn)':'var(--ok)'}">${report.summary.remoteConflictBranch}</strong></div>`;

function syncFailureActionHint(p,i){
  const e=String(i?.error||'');
  if(syncGhRateLimitedStatus(i?.status)||e.includes('额度')||e.includes('rate')){
    return'GitHub 额度/限流：队列会保留，等额度恢复后点“全部重试”，不会丢本地改动。'
  }
  if(syncIsSharedFilePath(p)){
    return'共享文件冲突：点“全部重试”会先把远端版本备份到本地 _sync_conflicts，再上传本地版本；想先看远端可下载诊断或手动拉取。'
  }
  if(p.startsWith('conversations/')){
    return'对话冲突：重试会先做字段级安全合成；无法合成时生成本地冲突保险箱，不会静默覆盖。'
  }
  if(p==='_index.json'){
    return'索引冲突：重试会按 tombstone / outOfScope / 活动列表规则重新合并，不把“远端缺失”当删除。'
  }
  if(p==='cost_logs.json'){
    return'费用日志会按条目合并；重试不会直接丢日志。'
  }
  if(e.includes('token')||e.includes('401')||e.includes('403')){
    return'认证或权限问题：请先检查同步设置里的 token / repo 权限，再重试。'
  }
  return'可先下载同步诊断；确认仓库和网络正常后点“全部重试”。'
}
async function syncResolveSharedUseRemote(path){
 if(!syncIsSharedFilePath(path)||!_syncFailedForever[path])return;
 if(!confirm('采用远端 '+path+'？本地当前版本会先备份到 _sync_conflicts，之后可手动找回。'))return;
 const context=syncCaptureOperationContext(),h=context.rootHandle,guard=context.guard;
 let releaseWriter;
 const myTurn=new Promise(resolve=>{releaseWriter=resolve}),previousWriter=_syncQueue;
 _syncQueue=myTurn;
 let failed=null,dirty=null,inflight=null,queuesCleared=false,remoteApplied=false;
 const restoreSnapshot=()=>{
  if(dirty&&!_syncDirty[path])_syncDirty[path]=dirty;
  if(inflight&&!_syncInflightDirty[path])_syncInflightDirty[path]=inflight;
  if(failed&&!_syncFailedForever[path])_syncFailedForever[path]=failed
 };
 try{
  await previousWriter;
  if(!guard()){toast('⏹️ 工作文件夹或同步目标已切换，未采用远端');return}
  failed=_syncFailedForever[path];dirty=_syncDirty[path];inflight=_syncInflightDirty[path];
  if(!failed){toast('ℹ️ 该失败项已由其他同步任务处理');return}
  const localText=await readSharedFileText(path,h,guard);
  if(localText==null||!guard()){toast('❌ 无法读取本地 '+path+'，未作修改');return}
  const backup=await syncVaultLocalSharedConflict(path,localText,'user-adopt-remote');
  if(!guard()){toast('⏹️ 工作文件夹或同步目标已切换，未采用远端');return}
  if(!backup.ok){toast('❌ 本地备份失败，未采用远端: '+backup.error);return}
  if(_syncFailedForever[path]===failed)delete _syncFailedForever[path];
  if(_syncDirty[path]===dirty)delete _syncDirty[path];
  if(_syncInflightDirty[path]===inflight)delete _syncInflightDirty[path];
  queuesCleared=true;
  if(!await persistSyncQueues({requireAll:true}))throw new Error('无法可靠保存队列清理状态，未采用远端');
  if(!guard())throw new Error('工作文件夹或同步目标已切换');
  const result=await syncPullSharedFiles(true,null,{onlyPath:path,forceRemotePath:path});
  if(!guard()||!result.ok||result.updated!==1)throw new Error(result.errors?.[0]||(result.missing?'远端文件不存在':'远端文件未应用'));
  remoteApplied=true;
  if(!await persistSyncQueues({requireAll:true})){
   syncDetached=true;saveSyncConfig();syncStopPolling();syncUpdateStatusBtn();
   throw new Error('远端已应用，但队列终态持久化失败；同步已自动断开，请保留诊断')
  }
  saveSyncMeta(false);toast('✓ 已采用远端 '+path+'；本地旧版已备份');showSyncFailedQueue()
 }catch(e){
  if(guard()&&queuesCleared&&!remoteApplied){restoreSnapshot();await persistSyncQueues({requireAll:true})}
  toast(remoteApplied?'❌ '+(e.message||e.name):'❌ 采用远端失败，原队列已保留: '+(e.message||e.name));showSyncFailedQueue()
 }finally{releaseWriter()}
}

  let h='<div style="font-size:12px;line-height:1.55;margin-bottom:10px;color:var(--tx-m)">这里不是死胡同：失败项会保留本地内容。你可以先看原因，再选择重试、手动拉取或下载诊断给自己留证据。</div>';
  if(!entries.length){
    h+='<div style="padding:14px;background:var(--bg-t);border-radius:var(--r);color:var(--ok)">当前没有永久失败项。</div>'
  }else{

      h+='<div style="padding:10px;background:var(--bg-t);border-radius:var(--r);margin-bottom:8px;border-left:3px solid var(--dn)">';

      h+='<div style="margin-top:4px;color:var(--dn);font-size:11px;white-space:pre-wrap">'+esc(String(i?.error||'未知失败').slice(0,240))+'</div>';
       h+='<div style="margin-top:6px;color:var(--tx-m);font-size:11px">'+esc(syncFailureActionHint(p,i))+'</div>';
       if(syncIsSharedFilePath(p))h+='<button class="ws-mini-btn" style="margin-top:6px" onclick="syncResolveSharedUseRemote('+JSON.stringify(p).replace(/"/g,'&quot;')+')">采用远端（先备份本地）</button>';
      h+='</div>'
    })
  }
  showMoFull(
    '🧯 同步失败处理',
    h,
    '<button class="mo-btn sec" onclick="syncDownloadDiagnostic()">下载诊断</button><button class="mo-btn sec" onclick="hideMo();syncManualPull()">手动拉取</button><button class="mo-btn pri" onclick="hideMo();syncRetryFailed()">全部重试</button><button class="mo-btn sec" onclick="hideMo();showCloudMaintenance()">返回</button>'
  )
}

const generatingN=Object.values(pendReqs||{}).reduce((n,list)=>n+(list||[]).filter(r=>r.status==='generating').length,0);
const dirtyPaths=Object.keys(_syncDirty).slice(0,8),failedPaths=Object.keys(_syncFailedForever).slice(0,8);
const lastSync=syncMeta.lastSyncAt?fmtAgo(syncMeta.lastSyncAt):'从未';

function syncConfigFilePayload(){

function syncMetaFilePayload(){

}
function syncMetaStamp(m){
return Math.max(new Date(m?.savedAt||0).getTime()||0,new Date(m?.lastSyncAt||0).getTime()||0,new Date(m?.lastArchiveAt||0).getTime()||0)
}
function syncApplyMetaCandidate(c){
if(!c||c.repo!==syncConfig.repo||(c.branch||'main')!==(syncConfig.branch||'main'))return false;
if(c.workspaceId&&c.workspaceId!==syncConfig.workspaceId)return false;
const cand={lastSyncAt:c.lastSyncAt||'',fileSHAs:c.fileSHAs&&typeof c.fileSHAs==='object'?c.fileSHAs:{},sharedHashes:c.sharedHashes&&typeof c.sharedHashes==='object'?c.sharedHashes:{},lastArchiveAt:c.lastArchiveAt||'',lastSeenCloudResetAt:c.lastSeenCloudResetAt||'',savedAt:c.savedAt||''};
syncEnsureMetaShape();
const empty=!Object.keys(syncMeta.fileSHAs||{}).length&&!Object.keys(syncMeta.sharedHashes||{}).length&&!syncMeta.lastSyncAt;
if(empty||syncMetaStamp(cand)>syncMetaStamp(syncMeta)){syncMeta=cand;syncEnsureMetaShape();try{localStorage.setItem(syncMetaKey(),JSON.stringify(syncMeta))}catch(e){};return true}

}

//== copyText ==//
function copyText(text){
const raw=String(text??'');
const fallback=()=>{
const ta=document.createElement('textarea');
ta.value=raw;ta.style.cssText='position:fixed;left:-9999px;top:-9999px;opacity:0';
document.body.appendChild(ta);ta.select();
try{document.execCommand('copy')}catch(e){}
document.body.removeChild(ta);
return Promise.resolve()
};
if(navigator.clipboard&&navigator.clipboard.writeText)return navigator.clipboard.writeText(raw).catch(()=>fallback());
return fallback()
}

//== stripContentTags ==//
function stripContentTags(text){
if(!text)return'';
const tags=(typeof params!=='undefined'?params.contentTags:null)||['think','thinking'];
let r=text;
tags.forEach(tag=>{
r=r.replace(new RegExp('<'+tag+'>[\\s\\S]*?</'+tag+'>','gi'),'');
r=r.replace(new RegExp('<'+tag+'>[\\s\\S]*$','gi'),'')
});
return r.replace(/^\s+/,'')}

function ext(t,l){const m=t.match(new RegExp('〖'+l+'〗([\\s\\S]*?)(?=〖|$)'));return m?m[1].trim():''}

//== extL ==//
function extL(t,l){const m=t.match(new RegExp('(?:^|\\n)\\s*'+l+'[:：]([^\\n]+)'));return m?m[1].split(/[,，]/).map(s=>s.trim()).filter(s=>s):[]}

//== parseMat ==//
function parseMat(txt){
materials.chars={};materials.charOrder=[];materials.rels={};materials.relIndex=[];
materials.apps={};materials.appOrder=[];materials.appGroups={};materials.groupOrder=[];
materials.metaPrompts={};materials.metaOrder=[];materials.appKeywords={};
[...txt.matchAll(/【元提示词[:：](.+?)】([\s\S]*?)(?=【(?:角色|关系|预设|附录|附录组|元提示词)[:：]|={3,}[\s]*【|$)/g)].forEach(m=>{const n=m[1].trim(),c=m[2].trim().replace(/[\s]*={3,}[\s]*$/,'').trim();if(!materials.metaOrder.includes(n)){materials.metaOrder.push(n);materials.metaPrompts[n]=c}});
[...txt.matchAll(/【附录组[:：](.+?)】成员[:：](.+)/g)].forEach(m=>{const n=m[1].trim(),ms=m[2].split(/[,，]/).map(s=>s.trim()).filter(s=>s);if(!materials.groupOrder.includes(n)){materials.groupOrder.push(n);materials.appGroups[n]=ms}});
[...txt.matchAll(/【附录[:：](.+?)】([\s\S]*?)(?=【(?:角色|关系|预设|附录|附录组|元提示词)[:：]|={3,}[\s]*【|$)/g)].forEach(m=>{const n=m[1].trim();let c=m[2].trim().replace(/[\s]*={3,}[\s]*$/,'').trim();let kws=[];const kwM=c.match(/^〖关键词〗\s*\n?(.+)/m);if(kwM){kws=kwM[1].split(/[,，]/).map(s=>s.trim()).filter(s=>s);c=c.replace(/〖关键词〗\s*\n?.+\n?/,'').trim()}if(!materials.appOrder.includes(n)){materials.appOrder.push(n);materials.apps[n]=c;if(kws.length)materials.appKeywords[n]=kws}});
txt.split(/={3,}/).forEach(b=>{b=b.trim();if(!b)return;let m;if(m=b.match(/【角色[:：](.+?)】/)){const n=m[1].trim();if(!materials.charOrder.includes(n)){materials.charOrder.push(n);materials.chars[n]={d:ext(b,'详细人设'),s:ext(b,'简要人设'),h:ext(b,'H人设'),g:ext(b,'性别')||'女',spotlightApps:extL(b,'聚光灯附录')||[],keywords:extL(b,'关键词')||[],protagonist:/^主角[:：]\s*是\s*$/m.test(b)}}}else if(m=b.match(/【关系[:：](.+?)→(.+?)】/)){const k=m[1].trim()+'→'+m[2].trim();if(!materials.relIndex.includes(k)){materials.relIndex.push(k);materials.rels[k]={d:ext(b,'详细')||ext(b,'简要')||'',from:m[1].trim(),to:m[2].trim()}}}})}

//== analyzeMaterialsMerge ==//
function analyzeMaterialsMerge(local,imp){
const ef=m=>{if(!m.chars)m.chars={};if(!m.charOrder)m.charOrder=[];if(!m.rels)m.rels={};if(!m.relIndex)m.relIndex=[];if(!m.apps)m.apps={};if(!m.appOrder)m.appOrder=[];if(!m.appGroups)m.appGroups={};if(!m.groupOrder)m.groupOrder=[];if(!m.metaPrompts)m.metaPrompts={};if(!m.metaOrder)m.metaOrder=[];if(!m.appKeywords)m.appKeywords={}};
ef(local);ef(imp);
const r={chars:{added:[],same:[],conflict:[]},apps:{added:[],same:[],conflict:[]},meta:{added:[],same:[],conflict:[]},rels:{added:[],same:[],conflict:[]},localOnly:{chars:[],apps:[],meta:[],rels:[]},hasConflict:false};
imp.charOrder.forEach(n=>{const ic=imp.chars[n];if(!ic)return;const lc=local.chars[n];if(!lc){r.chars.added.push({name:n});return}if(lc.d===ic.d&&lc.s===ic.s&&lc.h===ic.h)r.chars.same.push(n);else{r.chars.conflict.push({name:n});r.hasConflict=true}});
local.charOrder.forEach(n=>{if(!imp.chars[n])r.localOnly.chars.push(n)});
imp.appOrder.forEach(n=>{const ic=imp.apps[n];if(ic===undefined)return;const lc=local.apps[n];if(lc===undefined){r.apps.added.push({name:n});return}if(lc===ic)r.apps.same.push(n);else{r.apps.conflict.push({name:n});r.hasConflict=true}});
local.appOrder.forEach(n=>{if(imp.apps[n]===undefined)r.localOnly.apps.push(n)});
imp.metaOrder.forEach(n=>{const ic=imp.metaPrompts[n];if(ic===undefined)return;const lc=local.metaPrompts[n];if(lc===undefined){r.meta.added.push({name:n});return}if(lc===ic)r.meta.same.push(n);else{r.meta.conflict.push({name:n});r.hasConflict=true}});
local.metaOrder.forEach(n=>{if(imp.metaPrompts[n]===undefined)r.localOnly.meta.push(n)});
imp.relIndex.forEach(k=>{const ir=imp.rels[k];if(!ir)return;const lr=local.rels[k];if(!lr){r.rels.added.push({key:k});return}if(lr.d===ir.d)r.rels.same.push(k);else{r.rels.conflict.push({key:k});r.hasConflict=true}});
local.relIndex.forEach(k=>{if(!imp.rels[k])r.localOnly.rels.push(k)});
return r}

//== executeMaterialsMerge ==//
function executeMaterialsMerge(analysis,decisions,imp){
const dc=v=>JSON.parse(JSON.stringify(v));
analysis.chars.added.forEach(({name})=>{materials.chars[name]=dc(imp.chars[name]);if(!materials.charOrder.includes(name))materials.charOrder.push(name)});
analysis.chars.conflict.forEach(({name})=>{if((decisions.chars||{})[name]==='imported'){const ic=dc(imp.chars[name]);materials.chars[name]=ic}});
analysis.apps.added.forEach(({name})=>{materials.apps[name]=imp.apps[name];if(!materials.appOrder.includes(name))materials.appOrder.push(name);if(imp.appKeywords?.[name])materials.appKeywords[name]=[...imp.appKeywords[name]]});
analysis.apps.conflict.forEach(({name})=>{if((decisions.apps||{})[name]==='imported'){materials.apps[name]=imp.apps[name];if(imp.appKeywords?.[name])materials.appKeywords[name]=[...imp.appKeywords[name]];else delete materials.appKeywords[name]}});
analysis.meta.added.forEach(({name})=>{materials.metaPrompts[name]=imp.metaPrompts[name];if(!materials.metaOrder.includes(name))materials.metaOrder.push(name)});
analysis.meta.conflict.forEach(({name})=>{if((decisions.meta||{})[name]==='imported')materials.metaPrompts[name]=imp.metaPrompts[name]});
analysis.rels.added.forEach(({key})=>{materials.rels[key]=dc(imp.rels[key]);if(!materials.relIndex.includes(key))materials.relIndex.push(key)});
analysis.rels.conflict.forEach(({key})=>{if((decisions.rels||{})[key]==='imported')materials.rels[key]=dc(imp.rels[key])});
(imp.groupOrder||[]).forEach(gn=>{if(!materials.groupOrder.includes(gn)){materials.groupOrder.push(gn);materials.appGroups[gn]=imp.appGroups[gn]||[]}else{const local=materials.appGroups[gn]||[];(imp.appGroups[gn]||[]).forEach(a=>{if(!local.includes(a)&&materials.appOrder.includes(a))local.push(a)});materials.appGroups[gn]=local}});
materials._savedAt=new Date().toISOString()}

//== buildTxt ==//
function buildTxt(){
if(!materials.apps)materials.apps={};
if(!materials.appKeywords)materials.appKeywords={};
if(!materials.charOrder)materials.charOrder=[];
if(!materials.appOrder)materials.appOrder=[];
if(!materials.relIndex)materials.relIndex=[];
if(!materials.metaOrder)materials.metaOrder=[];
if(!materials.groupOrder)materials.groupOrder=[];
if(!materials.metaPrompts)materials.metaPrompts={};
if(!materials.rels)materials.rels={};
if(!materials.chars)materials.chars={};
if(!materials.appGroups)materials.appGroups={};
let lines=[];
materials.metaOrder.forEach(n=>{if(!materials.metaPrompts[n])return;lines.push('【元提示词:'+n+'】');lines.push(materials.metaPrompts[n]);lines.push('================')});
materials.charOrder.forEach(n=>{const c=materials.chars[n];lines.push('【角色:'+n+'】');if(c.keywords?.length)lines.push('关键词:'+c.keywords.join(','));lines.push('〖性别〗');lines.push(c.g||'女');lines.push('〖详细人设〗');lines.push(c.d||'');lines.push('〖简要人设〗');lines.push(c.s||'');if(c.h&&c.h.trim()){lines.push('〖H人设〗');lines.push(c.h)}if(c.protagonist)lines.push('主角:是');if(c.spotlightApps?.length)lines.push('聚光灯附录:'+c.spotlightApps.join(','));lines.push('================')});
materials.relIndex.forEach(k=>{const rel=materials.rels[k];lines.push('【关系:'+k+'】');lines.push('〖详细〗');lines.push(rel.d||'');lines.push('================')});
materials.appOrder.forEach(n=>{lines.push('【附录:'+n+'】');if(materials.appKeywords[n]?.length)lines.push('〖关键词〗\n'+materials.appKeywords[n].join(','));lines.push(materials.apps[n]||'');lines.push('================')});
materials.groupOrder.forEach(n=>{if(materials.appGroups[n]?.length){lines.push('【附录组:'+n+'】成员:'+materials.appGroups[n].join(','));lines.push('================')}});
return lines.join('\n')}

//== getEffectiveParams ==//
function getEffectiveParams(conv){
const cp=conv?.convParams||{};
const mp=getModelParams();
const pick=v=>v!==null&&v!==undefined&&v!=='';
const minNum=(...vals)=>{
const arr=vals.filter(pick).map(v=>Number(v)).filter(v=>!isNaN(v));
return arr.length?Math.min(...arr):undefined
};
const pickFirst=(...vals)=>{
for(const v of vals){if(pick(v))return v}
return undefined
};
return{
temperature:pickFirst(mp.temperature,cp.temperature,params.temperature),
maxTokens:minNum(mp.maxTokens,cp.maxTokens,params.maxTokens),
contextLimit:pickFirst(mp.contextLimit,cp.contextLimit,params.contextLimit),

}

function splitContentTags2(text){

const tags=(params.contentTags)||['think','thinking'];
let thinks=[],r=text;
tags.forEach(tag=>{
r=r.replace(new RegExp('<'+tag+'>([\\s\\S]*?)</'+tag+'>','gi'),(m,c)=>{thinks.push(c.trim());return''});

//== saveCfg ==//
async function saveCfg(rootHandle,guard){
const h=rootHandle||folderH,gen=_folderLoadGen,still=typeof guard==='function'?guard:()=>folderH===h&&isFolderLoadCurrent(gen);
if(h&&!still())return false;
touchChangedConfigFields();
const localSaved=saveLocal();
if(!h){if(localSaved)rememberConfigBaseline();return !!localSaved}
const path='config.json';
bumpSharedLocalRevision(path);
_syncSharedLocalWrites[path]=(_syncSharedLocalWrites[path]||0)+1;
syncTrace('shared.localWrite.begin',{path,count:_syncSharedLocalWrites[path],revision:sharedLocalRevision(path)});
try{
const result=await withResourceLock('shared:config.json',async()=>{
if(!still())return null;
touchChangedConfigFields();
const configSnapshot=syncClone(syncBuildConfigData());
const cfgJson=JSON.stringify(configSnapshot,null,2);
const f=await h.getFileHandle(path,{create:true});
await writeHandleVerified(f,cfgJson,'配置',still);
if(!still())return null;
return{configSnapshot,cfgJson}
});
if(result&&still()){
const{configSnapshot,cfgJson}=result;
saveLocal();
rememberConfigBaseline(configSnapshot);
if(syncHasConfig())syncMarkDirty(path,cfgJson,'sync: config')
}
return !!result
}catch(e){toast('⚠️ 配置保存失败: '+e.name+': '+(e.message||'').substring(0,40));return false}
finally{
_syncSharedLocalWrites[path]=Math.max(0,(_syncSharedLocalWrites[path]||1)-1);
if(!_syncSharedLocalWrites[path])delete _syncSharedLocalWrites[path];
syncTrace('shared.localWrite.end',{path,remaining:_syncSharedLocalWrites[path]||0})
}
}

async function backupCorruptConfigText(h,raw,guard){
const still=typeof guard==='function'?guard:()=>true;
if(!h||!still())return'';
const dir=await h.getDirectoryHandle('_corrupt_backups',{create:true});
const stamp=new Date().toISOString().replace(/[:.]/g,'-');
const name='config-corrupt-'+stamp+'.json.txt';
const f=await dir.getFileHandle(name,{create:true});
await writeHandleVerified(f,String(raw||''),'损坏配置备份',still);
return'_corrupt_backups/'+name
}
async function loadCfgFile(rootHandle,guard){
const h=rootHandle||folderH,still=typeof guard==='function'?guard:()=>true;
if(!h||!still())return false;
let f,raw='';
try{
f=await h.getFileHandle('config.json')
}catch(e){
if(e?.name==='NotFoundError')return false;
toast('⚠️ 配置文件无法读取，已阻止自动覆盖: '+(e.message||e.name));
return true
}
try{
raw=await(await f.getFile()).text();
const c=JSON.parse(raw);
if(!still())return false;
const cfgRisks=syncPulledConfigEraseRisk(c);
if(cfgRisks.length){
toast('⚠️ 已跳过会清空本机 '+cfgRisks.join('、')+' 的配置文件');
if(syncHasConfig())syncMarkDirty('config.json',syncSerializeCurrentConfig(),'sync: repair unsafe empty local config',true);
saveLocal();
rememberConfigBaseline();
return true
}
syncApplyConfigFields(c);
if(!c.groups?.length)groups=[{id:'_default',name:'默认',order:0,color:null,collapsed:false}];
if(c.localMeta)localMeta=c.localMeta;
if(params){if(!params.contentTags||!params.contentTags.length)params.contentTags=['think','thinking'];if(params.parseContentTags===undefined)params.parseContentTags=true}
if(!workspace.items)workspace.items=[];
saveLocal();
rememberConfigBaseline();
return true
}catch(e){
if(!still())return true;
let backup='';
try{backup=await backupCorruptConfigText(h,raw,still)}catch(be){syncTrace('config.corruptBackup.error',{error:be.message||be.name})}
toast('⚠️ config.json 已损坏，已阻止覆盖'+(backup?'；原文备份到 '+backup:'；原文件保持不变'));
syncTrace('config.corrupt.blocked',{backup,error:e.message||e.name});
return true
}}

//== acquireConvLock ==//
function acquireConvLock(convId){
if(!convId||!folderH)return true;
releaseConvLock();
const key='convLock_'+folderH.name+'_'+convId;
const now=Date.now();
try{
const cur=JSON.parse(localStorage.getItem(key)||'null');
if(cur&&cur.id!==INSTANCE_ID&&now-(cur.t||0)<8000)return false;
}catch(e){}
localStorage.setItem(key,JSON.stringify({id:INSTANCE_ID,t:now}));
_convLockId=convId;
if(_convLockTimer)clearInterval(_convLockTimer);
_convLockTimer=setInterval(()=>touchConvLock(),2000);
return true
}

}

}

function initFolderIDB(){return new Promise(resolve=>{try{const req=indexedDB.open('ChatToolFolderDB',1);req.onupgradeneeded=e=>{e.target.result.createObjectStore('handles')};req.onsuccess=e=>{_folderIDB=e.target.result;resolve()};req.onerror=()=>resolve()}catch(e){resolve()}})}

//== saveFolderHandleIDB ==//
function saveFolderHandleIDB(handle){
if(!_folderIDB){
toast('⚠️ 文件夹记忆失败：IndexedDB 未初始化');
console.warn('[folder-handle] IndexedDB not ready');
return
}
try{
const tx=_folderIDB.transaction('handles','readwrite');
const store=tx.objectStore('handles');
const req=store.put(handle,'folderH');
let done=false;
req.onsuccess=()=>{done=true;console.log('[folder-handle] saved:',handle?.name||'folder')};
req.onerror=e=>{
done=true;
const err=e.target.error;
console.error('[folder-handle] save request failed:',err);
toast('⚠️ 文件夹记忆失败：'+(err?.name||'IndexedDB错误')+(err?.message?': '+err.message.substring(0,40):''))
};
tx.oncomplete=()=>{
if(!done)console.log('[folder-handle] saved by transaction:',handle?.name||'folder')
};
tx.onerror=e=>{
const err=e.target.error;
console.error('[folder-handle] save transaction failed:',err);
toast('⚠️ 文件夹记忆失败：'+(err?.name||'事务错误')+(err?.message?': '+err.message.substring(0,40):''))
};
tx.onabort=e=>{
const err=e.target.error;
console.error('[folder-handle] save transaction aborted:',err);
toast('⚠️ 文件夹记忆失败：IndexedDB 事务被中止'+(err?.name?' '+err.name:''))
}
}catch(e){
console.error('[folder-handle] save threw:',e);
toast('⚠️ 文件夹记忆失败：'+e.name+(e.message?': '+e.message.substring(0,40):''))
}
}

}

async function readMatVersionBundle(rootHandle,guard){
const out={};
if(!rootHandle||!guard||!guard())return out;
try{
const vd=await rootHandle.getDirectoryHandle('mat_versions');
assertExportFolderStillCurrent(guard);

const pf=await vd.getFileHandle('_projects.json');
const projectText=await(await pf.getFile()).text();
assertExportFolderStillCurrent(guard);
out.matProjects=JSON.parse(projectText);

out.matVersionFiles={};
for await(const en of vd.values()){

return out
}

async function loadExportTargets(metas,opts){
opts=opts||{};
const targets=[];
const total=metas.length;
const statusEl=opts.statusEl||null;
const progFill=opts.progFill||null;
const progressMax=opts.progressMax||70;
for(let i=0;i<total;i++){
assertExportFolderStillCurrent(opts.guard);
const id=metas[i].id;
const c=id===curConvId&&curConv&&curConv.id===id
?curConv
:await loadConvFull(id,{rootHandle:opts.rootHandle,generation:opts.generation,guard:opts.guard});
assertExportFolderStillCurrent(opts.guard);
if(c&&!isConflictVaultConv(c)&&!c.deletedAt)targets.push(c);
if((i%3===0||i===total-1)&&(statusEl||progFill)){
if(statusEl)statusEl.textContent=`读取对话 ${i+1}/${total}...`;
if(progFill)progFill.style.width=Math.round((i+1)/Math.max(total,1)*progressMax)+'%';
await new Promise(r=>setTimeout(r,0))
}
}
return targets
}

async function moveConvFile(cid,fg,tg2,opts){

   if(syncHashText(verifySource)!==sourceHash||verifySource!==sourceRaw)throw new Error('源对话在移动期间发生修改，已保留原文件');
   if(m){m._dir=newDir;m._fn=loc.fn}
   const indexSaved=await saveIndex({skipSync:true,rootHandle:h,guard,authoritativeActiveIds:[cid]});
   if(!indexSaved){if(m){m._dir=loc.dirName;m._fn=loc.fn}throw new Error('索引提交失败，源文件与目标副本均保留')}

   return true

 })
}

async function withResourceLock(name,fn){
const lockName='chattool:'+((folderH&&folderH.name)||'none')+':'+name;
if(navigator.locks&&navigator.locks.request)return navigator.locks.request(lockName,{mode:'exclusive'},fn);
const key='resourceLock_'+lockName,token=INSTANCE_ID+'_'+gid2(),deadline=Date.now()+10000,leaseMs=30000;
while(Date.now()<deadline){
let cur=null;try{cur=JSON.parse(localStorage.getItem(key)||'null')}catch(e){}
if(!cur||Date.now()-(cur.t||0)>leaseMs){
 let acquired=false,heartbeat=null;
 try{
  localStorage.setItem(key,JSON.stringify({token,t:Date.now()}));
  await new Promise(r=>setTimeout(r,30));
  const chk=JSON.parse(localStorage.getItem(key)||'null');
  if(chk&&chk.token===token){
   acquired=true;
   heartbeat=setInterval(()=>{try{const own=JSON.parse(localStorage.getItem(key)||'null');if(own&&own.token===token)localStorage.setItem(key,JSON.stringify({token,t:Date.now()}))}catch(e){}},5000);
   return await fn()
  }
 }catch(e){
  if(acquired)throw e
 }finally{
  if(heartbeat)clearInterval(heartbeat);
  if(acquired){try{const end=JSON.parse(localStorage.getItem(key)||'null');if(end&&end.token===token)localStorage.removeItem(key)}catch(e){}}
 }
}
await new Promise(r=>setTimeout(r,80+Math.random()*120))
}
throw new Error('等待共享资源锁超时: '+name)
}

function indexAggregateClock(it){let out={};Object.values(it?.fieldClocks||{}).forEach(c=>{out=causalClockMerge(out,c)});return out}
function chooseIndexMeta(old,next){
if(!old)return next;
if(old.stateHash&&next.stateHash&&old.stateHash===next.stateHash)return syncTs(next.updatedAt)>=syncTs(old.updatedAt)?next:old;
const oc=indexAggregateClock(old),nc=indexAggregateClock(next);
if(Object.keys(oc).length&&Object.keys(nc).length){const cmp=causalClockCompare(nc,oc);if(cmp===1)return next;if(cmp===-1)return old}
return syncTs(next.updatedAt)>=syncTs(old.updatedAt)?next:old
}
function indexTrashWinsActive(t,a){
 const proof=t?.deletionProof;
 if(proof){
  if(proof.stateHash&&a?.stateHash&&proof.stateHash===a.stateHash)return true;
  const seenOps=new Set(proof.messageOpIds||[]),seenMutations=new Set(proof.mutationIds||[]);
  if((a?.messageOpIds||[]).some(id=>id&&!seenOps.has(id)))return false;
  if((a?.mutationIds||[]).some(id=>id&&!seenMutations.has(id)))return false;
  const cmp=causalClockCompare(indexAggregateClock(a),Object.values(proof.fieldClocks||{}).reduce((out,c)=>causalClockMerge(out,c),{}));
  if(cmp===1||cmp===2)return false
  // A stale index entry must not resurrect an active file whose durable state
  // is older or simply unknown.  Only explicit newer evidence (ops, mutation
  // ids, clocks, or a later timestamp) is allowed to beat the tombstone.
  if(syncTs(a?.updatedAt)>syncTs(t?.deletedAt))return false;
  return true
 }
return syncTs(t?.deletedAt)>=syncTs(a?.updatedAt)
}

 const diskBase={items:opts.replaceActive?[]:(disk?.items||[]),trash:opts.replaceTrashAll?[]:(disk?.trash||[]),outOfScope:disk?.outOfScope||disk?.scopeOut||[]};
 const effectiveDelta=indexEffectiveDelta(opts);
 const authoritativeActiveIds=effectiveDelta.active;
 const authoritativeTrashIds=effectiveDelta.trash;

 const purgeTrashPayloadEvents=Array.isArray(opts.purgeTrashPayloadEvents)?opts.purgeTrashPayloadEvents.filter(e=>e&&e.id):[];

 if(authoritativeActiveIds.size){
  const localActiveById=new Map(localItems.filter(it=>authoritativeActiveIds.has(it.id)).map(it=>[it.id,it]));
  for(const id of authoritativeActiveIds)if(!localActiveById.has(id))throw new Error('索引活动项事务缺少本地元数据: '+id);
  merged.items=merged.items.filter(it=>!authoritativeActiveIds.has(it.id));

  localActiveById.forEach(it=>merged.items.push(it))
 }
 if(authoritativeTrashIds.size){
  const localTrashById=new Map(localTrash.filter(t=>authoritativeTrashIds.has(t.id)).map(t=>[t.id,t]));
  for(const id of authoritativeTrashIds)if(!localTrashById.has(id))throw new Error('索引回收站事务缺少删除证明: '+id);

 }
 if(removeTrashIds.size)merged.trash=merged.trash.filter(t=>!removeTrashIds.has(t.id));
 if(purgeTrashPayloadEvents.length){
  const purgedAt=new Date().toISOString();
  merged.trash=merged.trash.map(t=>purgeTrashPayloadEvents.some(event=>trashPayloadEventMatches(t,event))?{...t,_fn:null,_dir:null,_payloadPurged:true,_payloadPurgedAt:t._payloadPurgedAt||purgedAt}:t)
 }

 let createdCanonicalIndex=false;
 if(!f){

 try{

 }catch(writeErr){
  if(createdCanonicalIndex){
   try{await cd.removeEntry('_index.json');syncTrace('index.firstWrite.cleanup',{reason:writeErr.message||writeErr.name})}
   catch(cleanupErr){syncTrace('index.firstWrite.cleanupFailed',{error:cleanupErr.message||cleanupErr.name})}
  }
  throw writeErr
 }
if(!guard())return false;
 if(indexRuntimeStateToken(convList.map(convIndexMeta),trashList)===runtimeToken){
 convList=merged.items;
normalizeAllConflictVaults();
trashList=merged.trash;
sortConvList()
 }else{
  syncTrace('index.runtimeChangedDuringWrite',{items:convList.length,trash:trashList.length});
  const beforeActive=new Map(localItems.map(x=>[x.id,indexRuntimeStateToken([x],[])]));
  const beforeTrash=new Map(localTrash.map(x=>[x.id,indexRuntimeStateToken([],[x])]));
  const afterItems=convList.map(convIndexMeta),afterTrash=trashList.map(x=>({...x}));

  const afterTrashMap=new Map(afterTrash.map(x=>[x.id,indexRuntimeStateToken([],[x])]));
  const changedActive=afterItems.filter(x=>beforeActive.get(x.id)!==afterActive.get(x.id)).map(x=>x.id);

  scheduleIndexSave({skipSync:!!opts.skipSync,rootHandle:h,guard,authoritativeActiveIds:changedActive,authoritativeTrashIds:changedTrash,removeTrashIds:removedTrash})
 }
 if(syncHasConfig()&&!opts.skipSync){
const idxOnly=JSON.stringify(syncBuildRemoteIndexData(merged.items,merged.trash,merged.outOfScope),null,2);
  syncMarkDirty('_index.json',idxOnly,'sync: index')
 }
 indexClearPendingForOptions({authoritativeActiveIds:[...authoritativeActiveIds],authoritativeTrashIds:[...authoritativeTrashIds],removeTrashIds:[...removeTrashIds]},pendingSeqAtStart);
 return true
})
}catch(e){
console.error('[index] save failed:',e);
toast('⚠️ 索引保存失败，文件本体未删除: '+(e.message||e.name));

//== scheduleIndexSave ==//
function indexQueuePendingDelta(opts){
 opts=opts||{};
 const add=(kind,values)=>{if(Array.isArray(values))values.filter(Boolean).forEach(id=>{
  _indexPendingSeq++;
  _indexPendingOps.set(id,{kind,seq:_indexPendingSeq});
  _indexPendingDelta.active.delete(id);_indexPendingDelta.trash.delete(id);_indexPendingDelta.removeTrash.delete(id);
  _indexPendingDelta[kind].add(id)
 })};
 add('active',opts.authoritativeActiveIds);
 add('trash',opts.authoritativeTrashIds);
 add('removeTrash',opts.removeTrashIds);
 if(Array.isArray(opts.clearIndexIntents))opts.clearIndexIntents.filter(Boolean).forEach(name=>_indexPendingDelta.clearIntents.add(name));
 if(!Array.isArray(opts.authoritativeActiveIds)&&!Array.isArray(opts.authoritativeTrashIds)&&!Array.isArray(opts.removeTrashIds))_indexPendingFull=true
}
function indexTakePendingDelta(){
 const batch={
  authoritativeActiveIds:[..._indexPendingDelta.active],
  authoritativeTrashIds:[..._indexPendingDelta.trash],
  removeTrashIds:[..._indexPendingDelta.removeTrash],
  clearIndexIntents:[..._indexPendingDelta.clearIntents],
  full:_indexPendingFull,
  ops:[..._indexPendingOps.entries()].map(([id,v])=>({id,...v}))
 };
 _indexPendingDelta={active:new Set(),trash:new Set(),removeTrash:new Set(),clearIntents:new Set()};
 _indexPendingOps=new Map();
 _indexPendingFull=false;
 return batch
}
function indexRestorePendingDelta(batch){
 if(!batch)return;
 const currentSeq=new Map(_indexPendingOps);
 const ops=batch.ops&&batch.ops.length?batch.ops:[
  ...(batch.authoritativeActiveIds||[]).map(id=>({id,kind:'active',seq:0})),
  ...(batch.authoritativeTrashIds||[]).map(id=>({id,kind:'trash',seq:0})),
  ...(batch.removeTrashIds||[]).map(id=>({id,kind:'removeTrash',seq:0}))
 ];
 ops.forEach(op=>{
  const cur=currentSeq.get(op.id);
  if(cur&&cur.seq>op.seq)return;
  indexQueuePendingDelta({[op.kind==='active'?'authoritativeActiveIds':op.kind==='trash'?'authoritativeTrashIds':'removeTrashIds']:[op.id]})
 });
 (batch.clearIndexIntents||[]).forEach(name=>_indexPendingDelta.clearIntents.add(name));
 if(batch.full)_indexPendingFull=true
}
function indexClearPendingForOptions(opts,maxSeq){
 const ids=[...(opts?.authoritativeActiveIds||[]),...(opts?.authoritativeTrashIds||[]),...(opts?.removeTrashIds||[])];
 ids.forEach(id=>{
  const op=_indexPendingOps.get(id);
  if(!op||maxSeq===undefined||op.seq<=maxSeq){_indexPendingOps.delete(id);_indexPendingDelta.active.delete(id);_indexPendingDelta.trash.delete(id);_indexPendingDelta.removeTrash.delete(id)}
 })
}
function indexEffectiveDelta(opts){
 const active=new Set(),trash=new Set(),removeTrash=new Set();
 _indexPendingOps.forEach((op,id)=>{if(op.kind==='active')active.add(id);else if(op.kind==='trash')trash.add(id);else if(op.kind==='removeTrash')removeTrash.add(id)});
 const apply=(set,values)=>{if(Array.isArray(values))values.filter(Boolean).forEach(id=>{active.delete(id);trash.delete(id);removeTrash.delete(id);set.add(id)})};
 // removeTrash only removes deletion history; an explicit final active/trash
 // state for the same id is authoritative and must win in the same commit.
 apply(removeTrash,opts?.removeTrashIds);apply(trash,opts?.authoritativeTrashIds);apply(active,opts?.authoritativeActiveIds);
 return{active,trash,removeTrash}
}
function indexHasPendingDelta(){return _indexPendingFull||_indexPendingDelta.active.size||_indexPendingDelta.trash.size||_indexPendingDelta.removeTrash.size||_indexPendingDelta.clearIntents.size}
async function flushScheduledIndexSave(){
 if(_indexTimer){clearTimeout(_indexTimer);_indexTimer=null}
 if(!indexHasPendingDelta()&&!_indexNeedsSync)return true;
 const target=_indexPendingTarget||{h:folderH,gen:_folderLoadGen};
 const h=target.h,gen=target.gen,guard=target.guard||(()=>folderH===h&&isFolderLoadCurrent(gen));
 const shouldSync=_indexNeedsSync,batch=indexTakePendingDelta();
 _indexNeedsSync=false;_indexPendingTarget=null;
 if(!h||!guard()){
  indexRestorePendingDelta(batch);
  if(shouldSync)_indexNeedsSync=true;
  return false
 }
 const saveOpts={skipSync:!shouldSync,rootHandle:h,guard};
 if(!batch.full)Object.assign(saveOpts,batch);
 const saved=await saveIndex(saveOpts);
 if(saved){
  _indexRetryCount=0;
  for(const name of batch.clearIndexIntents||[]){try{if(!await clearActiveIndexIntent({name},h,guard))syncTrace('index.intent.cleanupPending',{file:name})}catch(e){syncTrace('index.intent.cleanupError',{file:name,error:e.message||e.name})}}
  return true
 }
 if(guard()){
  indexRestorePendingDelta(batch);
  if(shouldSync)_indexNeedsSync=true;
  _indexPendingTarget={h,gen,guard};
  _indexRetryCount=Math.min(6,_indexRetryCount+1);
  if(_indexRetryCount<=3){
   const delay=500*Math.pow(2,_indexRetryCount-1);
   _indexTimer=setTimeout(()=>{_indexTimer=null;flushScheduledIndexSave()},delay)
  }
 }
 return false
}
function scheduleIndexSave(opts){
 opts=opts||{};
 const h=opts.rootHandle||folderH,gen=opts.generation??_folderLoadGen,guard=typeof opts.guard==='function'?opts.guard:()=>folderH===h&&isFolderLoadCurrent(gen);
 if(!_indexPendingTarget)_indexPendingTarget={h,gen,guard};
 else if(_indexPendingTarget.h!==h){syncTrace('index.pendingTargetMismatch',{from:_indexPendingTarget.h?.name||'',to:h?.name||''});return false}
 if(!opts.skipSync)_indexNeedsSync=true;
 indexQueuePendingDelta(opts);
 if(_indexTimer)clearTimeout(_indexTimer);
 _indexTimer=setTimeout(()=>{_indexTimer=null;flushScheduledIndexSave()},500);
 return true
}

async function migrateFlat(cd,guard){
  const still=typeof guard==='function'?guard:()=>true;
  if(!still())return;

  const dd=await cd.getDirectoryHandle('_default',{create:true});
  const files=[];
  for await(const en of cd.values()){
    if(!still())return;
    if(en.kind==='file'&&en.name.endsWith('.json')&&en.name!=='_index.json')files.push(en)
  }

  for(const f of files){
    if(!still())return;
    try{
      const ct=await(await f.getFile()).text();
      if(!still())return;
      const nf=await dd.getFileHandle(f.name,{create:true});
      await writeHandleVerified(nf,ct,'旧格式迁移: '+f.name,still);
      if(!still())return;
      await cd.removeEntry(f.name)
    }catch(e){
      if(still())console.warn('[migrateFlat] keep original:',f.name,e.name||e.message)
    }
  }
}

function scheduleDeferredConvResave(conv,opts){
opts=opts||{};
if(!conv?.id)return false;
const h=opts.rootHandle||folderH,gen=opts.generation??_folderLoadGen,identity=opts.folderIdentity??_folderIdentityGen;
const guard=typeof opts.guard==='function'?opts.guard:()=>folderH===h&&isFolderLoadCurrent(gen)&&_folderIdentityGen===identity;
const key=identity+'|'+conv.id;
let state=_deferredConvResaves.get(key);
if(state){state.conv=conv;state.dirty=true;return true}
state={key,conv,h,gen,identity,guard,dirty:true,running:false,timer:null,attempts:0};
_deferredConvResaves.set(key,state);
const arm=delay=>{
 if(state.timer||state.running)return;
 state.timer=setTimeout(async()=>{
  state.timer=null;
  if(!state.guard()){_deferredConvResaves.delete(key);return}
  state.running=true;state.dirty=false;
  const saved=await saveConvF(state.conv,{rootHandle:state.h,generation:state.gen,folderIdentity:state.identity,guard:state.guard,mutationKind:'deferred-resave'});
  state.running=false;
  if(saved)state.attempts=0;else state.attempts++;
  if(state.dirty||(state.attempts>0&&state.attempts<3))arm(state.attempts?500*state.attempts:0);
  else{
   _deferredConvResaves.delete(key);
   if(!saved&&state.guard()){
    _syncLastError='对话最新修改后台补存失败: '+(state.conv.name||state.conv.id);
    syncTrace('conv.deferredResave.failed',{convId:state.conv.id,attempts:state.attempts});
    toast('⚠️ 对话最新修改尚未写盘，请重试保存')
   }
  }
 },delay)
};
arm(0);
return true
}

//== batchMoveToTrash ==//
async function batchMoveToTrash(ids,onProgress){
const h=folderH,gen=_folderLoadGen,guard=()=>folderH===h&&isFolderLoadCurrent(gen);
if(!h||!guard()||!ids.length)return{done:0,failed:0};
let processed=0,deleted=0,failed=0,consecutiveFail=0;
for(const id of ids){
if(!guard()){failed+=ids.length-processed;break}
const exists=!!convList.find(c=>c.id===id);
const okDelete=!exists||await moveToTrash(id,{rootHandle:h,guard,generation:gen});
if(okDelete){if(exists)deleted++;consecutiveFail=0}else{failed++;consecutiveFail++}
processed++;
if(onProgress&&(processed%2===0||processed===ids.length))onProgress(processed,ids.length,failed);
if(processed%3===0)await new Promise(r=>setTimeout(r,0));
if(consecutiveFail>=3&&ids.length>3){failed+=ids.length-processed;toast('⚠️ 连续 3 个删除失败，已停止批量操作以保护历史文件夹');break}
}
if(onProgress)onProgress(ids.length,ids.length,failed);
return{done:deleted,failed}
}

async function saveMsgTrashFile(rootHandle,extGuard){
const h=rootHandle||folderH,gen=_folderLoadGen,guard=typeof extGuard==='function'?extGuard:()=>folderH===h&&isFolderLoadCurrent(gen);
let overflow=[];
if(msgTrashData.length>500){overflow=overflow.concat(msgTrashData.slice(500));msgTrashData=msgTrashData.slice(0,500)}
let size=0;try{size=JSON.stringify(msgTrashData).length}catch(e){}
while(size>5*1024*1024&&msgTrashData.length>0){overflow.push(msgTrashData.pop());try{size=JSON.stringify(msgTrashData).length}catch(e){break}}
if(overflow.length){try{await backupMsgTrashOverflow(overflow,'auto-trim',h,guard)}catch(e){console.warn('[msg-trash] overflow backup failed, preserving items in memory:',e);msgTrashData=msgTrashData.concat(overflow)}}
if(h&&guard()){try{const saved=await writeJsonFileVerified(h,'msg_trash.json',{items:msgTrashData,_savedAt:new Date().toISOString()},'消息回收站',guard);if(!saved)return false}catch(e){return false}}

return !h||guard()
}

async function restoreMsgTrash(i,toOriginal){
if(!curConv){toast('请先选择对话');return}
const m=msgTrashData[i];
if(!m)return;
 const op=captureConversationOperation(curConv),conv=op.conv,source=syncClone(m);
 let insertIdx=conv.messages.length;
 if(toOriginal&&source.convId===op.id){
 const beforeIdx=source.originalBeforeId?conv.messages.findIndex(x=>x.id===source.originalBeforeId):-1;
 const afterIdx=source.originalAfterId?conv.messages.findIndex(x=>x.id===source.originalAfterId):-1;
 if(beforeIdx>=0&&afterIdx>=0&&beforeIdx<afterIdx)insertIdx=beforeIdx+1;
 else if(beforeIdx>=0&&afterIdx<0)insertIdx=beforeIdx+1;
 else if(afterIdx>=0&&beforeIdx<0)insertIdx=afterIdx;
 else if(source.originalIdx!=null)insertIdx=Math.min(source.originalIdx,conv.messages.length)
 }
const restored=source;
delete restored.convName;
delete restored.convId;
delete restored.deletedAt;
 delete restored.originalIdx;
 delete restored.originalBeforeId;
 delete restored.originalAfterId;
delete restored._origIdx;
if(!restored.id||conv.messages.some(x=>x.id===restored.id))restored.id=gid2();
restored.role=restored.role||'user';
restored.content=restored.content||'';
if(!restored.timestamp)restored.timestamp=new Date().toISOString();

const snap=snapshotMessageMutationState(conv);
unmarkMsgDeleted(conv,[source,restored]);
conv.messages.splice(insertIdx,0,restored);
recordRestoreOp(conv,restored,insertIdx);
touchConv(conv,'content');

const saved=await saveConvF(conv,{rootHandle:op.rootHandle,generation:op.generation,guard:()=>op.folderCurrent()});
if(!saved){
restoreMessageMutationState(conv,snap,{restoreFold:op.uiCurrent()});
toast('❌ 恢复失败，消息仍在回收站');
return
}

if(op.uiCurrent()){renderMsgs();scrBot();updateTokCnt()}
ok('已插入到#'+(insertIdx+1))
}
