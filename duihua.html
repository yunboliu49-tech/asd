.mat-char-hdr:hover,.mat-exp-hdr:hover{background:var(--ac-soft)}

.ctx-i.wn{color:var(--wn)}
.star-btn{background:var(--wn-soft)}
.param-btn.custom{color:var(--ac);border-color:var(--ac)}
/*== 工作台 ==*/
.ws-pop{position:fixed;right:32px;top:50%;transform:translateY(-50%);width:min(320px,88vw);max-height:min(520px,78vh);background:var(--bg-s);border:1px solid var(--bd);border-radius:var(--r);box-shadow:0 8px 28px rgba(0,0,0,.45);z-index:80;display:none;overflow:hidden}
.ws-pop.show{display:flex;flex-direction:column}
.ws-pop-h{display:flex;align-items:center;gap:8px;padding:8px 10px;border-bottom:1px solid var(--bd);font-size:var(--bs);font-weight:700}
.ws-pop-h span{flex:1}
.ws-pop-list{overflow-y:auto;padding:5px;max-height:360px}
.ws-pop-empty{padding:18px 10px;text-align:center;color:var(--tx-m);font-size:calc(var(--fs) - 2px)}
.ws-pop-item{display:flex;align-items:center;gap:6px;padding:7px 8px;border-radius:var(--r);cursor:pointer;border:1px solid transparent;margin-bottom:3px;background:var(--bg-t);user-select:none}
.ws-pop-item:hover{border-color:var(--ac-border,var(--ac));background:var(--ac-soft)}
.ws-pop-item.active{border-color:var(--ac-border,var(--ac));background:var(--ac-soft)}
.ws-pop-item.dragging,.ws-mgr-item.dragging{opacity:.45}
.ws-pop-item.drag-over,.ws-mgr-item.drag-over{box-shadow:0 -3px 0 0 var(--ac) inset}
.ws-pop-main{flex:1;min-width:0}
.ws-pop-title{font-size:calc(var(--fs) - 1px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.ws-pop-sub{font-size:11px;color:var(--tx-m);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.ws-badge{font-size:12px;flex-shrink:0;width:20px;text-align:center}
.ws-badge.auto{color:var(--tx-m)}
.ws-badge.active{color:var(--wn)}
.ws-badge.manual{color:var(--ac)}
.ws-dot{width:7px;height:7px;border-radius:50%;background:var(--tx-m);flex-shrink:0;opacity:.55}
.ws-dot.gen{background:var(--wn);opacity:1;animation:pulse 1s infinite}
.ws-pop-ftr{display:flex;gap:4px;flex-wrap:wrap;padding:7px;border-top:1px solid var(--bd);background:var(--bg-s)}
.ws-mini-btn{padding:4px 8px;background:var(--bg-t);border:1px solid var(--bd);border-radius:var(--r);color:var(--tx-s);cursor:pointer;font-size:12px;white-space:nowrap}
.ws-mini-btn:hover{border-color:var(--ac);color:var(--tx-p);background:var(--ac-soft)}
.ws-mark{font-size:11px;color:var(--wn);flex-shrink:0}
.ws-remove{display:none;padding:1px 5px;background:transparent;border:1px solid transparent;border-radius:var(--r);color:var(--tx-m);cursor:pointer;font-size:12px;flex-shrink:0}
.conv-item:hover .ws-remove,.conv-item.active .ws-remove{display:block}
.ws-remove:hover{border-color:var(--dn);color:var(--dn);background:var(--dn-soft)}
.ws-sb-entry{width:100%;margin-bottom:5px;padding:7px;background:var(--bg-t);border:1px solid var(--bd);border-radius:var(--r);color:var(--tx-p);cursor:pointer;font-size:var(--bs);text-align:center}
.ws-sb-entry:hover{border-color:var(--ac);background:var(--ac-soft)}
.ws-mgr-item{display:flex;align-items:center;gap:8px;padding:8px 10px;background:var(--bg-t);border:1px solid var(--bd);border-radius:var(--r);margin-bottom:4px;cursor:grab}
.ws-mgr-main{flex:1;min-width:0}
.ws-mgr-title{font-size:calc(var(--fs) - 1px);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ws-mgr-sub{font-size:11px;color:var(--tx-m);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ws-mgr-acts{display:flex;gap:3px;flex-wrap:wrap;justify-content:flex-end}
.ws-search-row{display:flex;gap:6px;margin:8px 0}
.ws-search-row input{flex:1;padding:7px 9px;background:var(--bg-t);border:1px solid var(--bd);border-radius:var(--r);color:var(--tx-p);font-size:var(--fs)}
.ws-search-result{display:flex;align-items:center;gap:8px;padding:7px 9px;background:var(--bg-t);border-radius:var(--r);margin-bottom:3px;font-size:13px}
.ws-search-result .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ws-swipe{position:relative;overflow:hidden;border-radius:var(--r);margin-bottom:3px}
.ws-swipe-main{position:relative;z-index:2;transition:transform .18s ease;background:var(--bg-s);border-radius:var(--r)}
.ws-swipe.open .ws-swipe-main{transform:translateX(-64px)}
.ws-swipe-del{position:absolute;right:0;top:0;bottom:0;width:64px;background:var(--dn);color:#fff;border:none;border-radius:0 var(--r) var(--r) 0;font-size:13px;cursor:pointer;z-index:1}
.ws-swipe-del:active{filter:brightness(.9)}
.ws-swipe .ws-pop-item{margin-bottom:0}
@media(max-width:768px){.ws-pop{right:28px;top:auto;bottom:calc(90px + var(--safe-b));transform:none;max-height:60vh}.ws-pop-title{font-size:13px}.ws-pop-sub{font-size:10px}}
/*== UI细化：低刺激状态与统计栏 ==*/
:root{--ac:#8aa99a;--ach:#9ab8aa;--ac-bg:#26342f;--ac-border:#587769;--avatar-user-bg:#26342f;--avatar-user-fg:#b8d0c5;--avatar-ai-bg:#2b302b;--avatar-ai-fg:#c4c8bd;--avatar-sys-bg:#3a3022;--avatar-sys-fg:#dcc08b}

.tb.pri,.new-btn,.sb2.pri{background:var(--ac-bg);color:var(--tx-p);border-color:var(--ac-border)}
.tb.pri:hover,.new-btn:hover,.sb2.pri:hover{background:var(--ac-soft);border-color:var(--ac);color:var(--tx-p)}
.mob-send{background:var(--ac-bg);border:1px solid var(--ac-border)}
.mob-attach{background:var(--bg-t);border:1px solid var(--bd)}
.mat-b{background:var(--bg-t);color:var(--tx-p);border:1px solid var(--ac-border);padding:3px 8px;border-radius:8px;font-size:12px;cursor:pointer;white-space:nowrap}
.mat-b.empty{background:transparent;color:var(--tx-m);border-color:var(--bd)}
.input-info{font-size:calc(var(--fs) - 2px);color:var(--tx-s);align-items:center;flex-wrap:wrap;line-height:1.5}
.tok-lnk,.stat-lnk,.ctx-lnk{cursor:pointer;text-decoration:none;color:var(--tx-s);padding:1px 2px;border-radius:2px}
.tok-lnk:hover,.stat-lnk:hover,.ctx-lnk:hover{color:var(--ac);background:var(--ac-soft)}
.message.user .msg-av{background:var(--avatar-user-bg);color:var(--avatar-user-fg);border:1px solid var(--ac-border)}

.stop-bar{background:var(--wn-soft);border-color:var(--wn)}
.stop-hdr .t-cnt{color:var(--wn)}
.stop-hdr .stop-all{background:var(--bg-t);color:var(--wn);border:1px solid var(--wn);box-shadow:none}
.stop-hdr .stop-all:hover{background:var(--wn-soft)}
.stop-task{background:var(--bg-t);border:1px solid var(--bd)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{overscroll-behavior:none}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;font-size:var(--fs);background:var(--bg-p);color:var(--tx-p);height:100vh;height:100dvh;overflow:hidden;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.app{display:flex;height:100%;flex-direction:column}
::-webkit-scrollbar{width:14px;height:14px}::-webkit-scrollbar-track{background:rgba(255,255,255,0.03)}::-webkit-scrollbar-thumb{background:var(--tx-m);border-radius:7px;border:3px solid transparent;background-clip:content-box;min-height:40px}::-webkit-scrollbar-thumb:hover{background:var(--tx-s);border:2px solid transparent;background-clip:content-box}
.toolbar{background:var(--bg-s);border-bottom:1px solid var(--bd);padding:8px 16px;padding-top:calc(8px + var(--safe-t));display:flex;align-items:center;gap:10px;flex-shrink:0}
.toolbar-title{font-weight:600;font-size:var(--ts);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;max-width:200px;cursor:pointer}
.toolbar-title:hover{color:var(--ac)}
.tb{padding:5px 14px;background:var(--bg-t);border:1px solid var(--bd);border-radius:var(--r);color:var(--tx-s);cursor:pointer;font-size:var(--bs);white-space:nowrap;flex-shrink:0}.tb:hover{background:var(--bd);color:var(--tx-p)}.tb:active{transform:scale(.96)}.tb.pri{background:var(--ac);color:#fff;border-color:var(--ac)}
.tb.fld-ok{color:var(--ok);border-color:var(--ok)}
.tb.mat-mode{background:var(--mat-accent);color:#fff;border-color:var(--mat-accent)}
.t-right{margin-left:auto;display:flex;gap:6px;align-items:center;flex-shrink:0}
.fld-st{font-size:12px;color:var(--tx-m);max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.fld-st.on{color:var(--ok)}
.pend-b{background:var(--wn);color:#000;padding:2px 7px;border-radius:8px;font-size:11px;font-weight:600;display:none}
.menu-btn{display:none;padding:8px 12px;background:var(--bg-t);border:1px solid var(--bd);border-radius:var(--r);color:var(--tx-p);cursor:pointer;font-size:18px}
.dk{display:flex;gap:6px;align-items:center}
.main-c{display:flex;flex:1;overflow:hidden;min-height:0}
.sidebar{width:var(--sw);min-width:200px;max-width:400px;background:var(--bg-s);border-right:1px solid var(--bd);display:flex;flex-direction:column;flex-shrink:0}
.sb-hdr{padding:6px 8px;border-bottom:1px solid var(--bd);flex-shrink:0;display:flex;gap:4px}
.sb-hdr input{flex:1;padding:5px 8px;background:var(--bg-t);border:1px solid var(--bd);border-radius:var(--r);color:var(--tx-p);font-size:13px}
.sb-tabs{display:flex;border-bottom:1px solid var(--bd);flex-shrink:0}
.sb-tab{flex:1;padding:6px;text-align:center;cursor:pointer;font-size:var(--bs);color:var(--tx-m);border-bottom:2px solid transparent}.sb-tab:hover{color:var(--tx-p)}.sb-tab.active{color:var(--ac);border-bottom-color:var(--ac)}
.conv-list{flex:1;overflow-y:auto;padding:3px;-webkit-overflow-scrolling:touch;min-height:0;overscroll-behavior:contain}
.conv-wrap{position:relative;flex:1;min-height:0;display:flex}
.sb-scroll-nav{position:absolute;right:2px;top:50%;transform:translateY(calc(-50% - 10px));display:flex;flex-direction:column;gap:2px;z-index:5;opacity:0.5}
.sb-scroll-nav:hover{opacity:0.9}
.sb-scroll-nav button{width:24px;height:52px;background:var(--bg-s);border:1px solid var(--bd);border-radius:var(--r);color:var(--tx-p);cursor:pointer;font-size:14px;padding:0;font-weight:600}
.sb-scroll-nav button:hover{background:var(--ac);color:#fff;border-color:var(--ac)}
.sb-scroll-nav button:active{transform:scale(.9)}
.grp-hdr{display:flex;align-items:center;gap:5px;padding:4px 8px;cursor:pointer;font-size:12px;color:var(--tx-s);font-weight:600;border-bottom:1px solid var(--bd);user-select:none;position:sticky;top:0;z-index:6;background:var(--bg-s);border-top:2px solid var(--bg-s)}.grp-hdr:hover{color:var(--tx-p);background:var(--bg-t)}
.grp-hdr .arr{font-size:9px;transition:transform .15s;color:var(--tx-m)}.grp-hdr .arr.open{transform:rotate(90deg)}
.grp-hdr .g-nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.grp-hdr .g-cnt{color:var(--tx-m);font-size:11px;font-weight:400}
.grp-hdr .g-more{padding:1px 5px;background:transparent;border:none;color:var(--tx-m);cursor:pointer;font-size:12px;border-radius:var(--r);display:none}.grp-hdr:hover .g-more{display:block}.grp-hdr .g-more:hover{background:var(--bd);color:var(--tx-p)}
.grp-hdr.drag-over-bot{border-bottom:2px solid var(--ac)}
.grp-body{}.grp-body.collapsed{display:none}
.conv-item{padding:5px 10px;border-radius:var(--r);cursor:pointer;display:flex;align-items:center;gap:5px;position:relative;user-select:none;border:2px solid transparent;margin-bottom:1px;font-family:"SimSun","Noto Serif SC","Songti SC",serif}
.conv-item:hover{background:var(--bg-t)}.conv-item.active{background:var(--ac);color:#fff}
.conv-item .pin-i{font-size:10px;color:var(--wn);flex-shrink:0}.conv-item.active .pin-i{color:#fff}
.conv-item .c-name{flex:1;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.3}
.conv-item .gen-dot{width:7px;height:7px;background:var(--ok);border-radius:50%;animation:pulse 1s infinite;flex-shrink:0}.conv-item.active .gen-dot{background:#fff}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.conv-item .c-more{display:none;padding:1px 5px;background:transparent;border:none;color:inherit;cursor:pointer;font-size:13px;border-radius:var(--r);flex-shrink:0}.conv-item:hover .c-more,.conv-item.active .c-more{display:block}.conv-item .c-more:hover{background:rgba(255,255,255,.15)}
.conv-item.drag-over-top{border-top:2px solid var(--ac)}.conv-item.drag-over-bot{border-bottom:2px solid var(--ac)}.conv-item.dragging{opacity:.4}
.conv-item .c-cb{width:16px;height:16px;accent-color:var(--ac);flex-shrink:0;cursor:pointer}
.pin-div{padding:1px 10px;font-size:9px;color:var(--tx-m);border-bottom:1px dashed var(--bd);margin-bottom:1px;user-select:none}
.sb-ftr{padding:6px 8px;border-top:1px solid var(--bd);flex-shrink:0}
.mob-btns{display:none}

//== esc ==//
function esc(s){return s?String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'):''}

//== escA ==//
function escA(s){return s?String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'):''}

//== gid2 ==//
function gid2(){return Date.now().toString(36)+Math.random().toString(36).substr(2,6)}

//== fmtTime ==//
function fmtTime(iso){return iso?new Date(iso).toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'}):''}

//== fmtD ==//
function fmtD(d){return d.toISOString().slice(0,10)}

//== dl ==//
function dl(n,ct,type){const b=new Blob([ct],{type:type+';charset=utf-8'});const u=URL.createObjectURL(b);const a=document.createElement('a');a.href=u;a.download=n;a.style.display='none';document.body.appendChild(a);a.click();setTimeout(()=>{document.body.removeChild(a);URL.revokeObjectURL(u)},1000)}

//== toast ==//
function toast(msg){document.querySelectorAll('.toast').forEach(t=>t.remove());const t=document.createElement('div');t.className='toast';t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),2500)}

//== copyText ==//
function copyText(text){
const raw=String(text??'');
const fallback=()=>{
const ta=document.createElement('textarea');
ta.value=raw;ta.style.cssText='position:fixed;left:-9999px;top:-9999px;opacity:0';
document.body.appendChild(ta);ta.select();
try{document.execCommand('copy')}catch(e){}
document.body.removeChild(ta);
return Promise.resolve()
};
if(navigator.clipboard&&navigator.clipboard.writeText)return navigator.clipboard.writeText(raw).catch(()=>fallback());
return fallback()
}

//== roleIcon ==//
function roleIcon(role){return role==='user'?'👤':role==='system'?'⚙️':'🤖'}

//== msgPreview ==//
function msgPreview(content,maxLen){return(content||'').trimStart().split('\n')[0].substring(0,maxLen||60)}

//== stripZW ==//
function stripZW(s){return s?s.replace(/[\u200B\u200C\u200D\uFEFF\u00AD]/g,''):''}

//== stripContentTags ==//
function stripContentTags(text){
if(!text)return'';
const tags=(typeof params!=='undefined'?params.contentTags:null)||['think','thinking'];
let r=text;
tags.forEach(tag=>{
r=r.replace(new RegExp('<'+tag+'>[\\s\\S]*?</'+tag+'>','gi'),'');
r=r.replace(new RegExp('<'+tag+'>[\\s\\S]*$','gi'),'')
});
return r.replace(/^\s+/,'')}

//== showMo ==//
function showMo(title,body,footer,cls){moStack=[];document.getElementById('moTitle').textContent=title;document.getElementById('moBody').innerHTML=body;document.getElementById('moFtr').innerHTML=footer||'';document.getElementById('moBox').className='mo-box'+(cls?' '+cls:'');document.getElementById('modal').classList.add('show')}

//== showMoFull ==//
function showMoFull(t,b,f){showMo(t,b,f,'full')}

//== showMoCompact ==//
function showMoCompact(t,b,f){showMo(t,b,f,'compact')}

//== pushMo ==//
function pushMo(title,body,footer,cls,parentRefresh){
if(document.getElementById('modal').classList.contains('show')){
moStack.push({
title:document.getElementById('moTitle').textContent,
body:document.getElementById('moBody').innerHTML,
footer:document.getElementById('moFtr').innerHTML,
cls:document.getElementById('moBox').className.replace('mo-box','').trim(),
scrollTop:document.getElementById('moBody').scrollTop,
refresh:parentRefresh||null
})}
document.getElementById('moTitle').textContent=title;
document.getElementById('moBody').innerHTML=body;
document.getElementById('moFtr').innerHTML=footer||'';
document.getElementById('moBox').className='mo-box'+(cls?' '+cls:'');
document.getElementById('modal').classList.add('show')}

//== popMo ==//
function popMo(needRefresh){
if(!moStack.length){hideMo();return}
const prev=moStack.pop();
if(needRefresh&&prev.refresh){
const savedStack=[...moStack];
prev.refresh();
moStack=savedStack;
setTimeout(()=>{document.getElementById('moBody').scrollTop=prev.scrollTop},60)
}else{
document.getElementById('moTitle').textContent=prev.title;
document.getElementById('moBody').innerHTML=prev.body;
document.getElementById('moFtr').innerHTML=prev.footer;
document.getElementById('moBox').className='mo-box'+(prev.cls?' '+prev.cls:'');
setTimeout(()=>{document.getElementById('moBody').scrollTop=prev.scrollTop},0)
}}

//== pickOpt ==//
function pickOpt(gid,hid,val){const g=document.getElementById(gid);if(!g)return;g.querySelectorAll('[data-v]').forEach(b=>{if(b.dataset.v===val){b.style.background='var(--ac)';b.style.color='#fff';b.style.borderColor='var(--ac)'}else{b.style.background='';b.style.color='';b.style.borderColor=''}});const h=document.getElementById(hid);if(h)h.value=val}

//== pickMoSel ==//
function pickMoSel(ddId,hidId,txtId,val,label,cb){document.getElementById(ddId)?.classList.remove('show');const h=document.getElementById(hidId);if(h)h.value=val;const t=document.getElementById(txtId);if(t)t.textContent=label;const dd=document.getElementById(ddId);if(dd)dd.querySelectorAll('.csel-dd-item').forEach(el=>el.classList.toggle('active',el.dataset.v===val));if(cb)cb()}

//== moClose ==//

//== hideMo ==//
function hideMo(){if(typeof saveMgrCache==='function')saveMgrCache();moStack=[];document.getElementById('modal').classList.remove('show');if(typeof editingSC!=='undefined')editingSC=null}
let _moDownOnOverlay=false;
document.getElementById('modal').addEventListener('mousedown',function(e){_moDownOnOverlay=e.target===this});
document.getElementById('modal').addEventListener('touchstart',function(e){_moDownOnOverlay=e.target===this},{passive:true});
document.getElementById('modal').addEventListener('click',function(e){if(e.target===this&&_moDownOnOverlay){if(moStack.length)popMo();else hideMo()}_moDownOnOverlay=false});

//== ext ==//
function ext(t,l){const m=t.match(new RegExp('〖'+l+'〗([\\s\\S]*?)(?=〖|$)'));return m?m[1].trim():''}

//== extL ==//
function extL(t,l){const m=t.match(new RegExp('(?:^|\\n)\\s*'+l+'[:：]([^\\n]+)'));return m?m[1].split(/[,，]/).map(s=>s.trim()).filter(s=>s):[]}

//== parseMat ==//
function parseMat(txt){
materials.chars={};materials.charOrder=[];materials.rels={};materials.relIndex=[];
materials.apps={};materials.appOrder=[];materials.appGroups={};materials.groupOrder=[];
materials.metaPrompts={};materials.metaOrder=[];materials.appKeywords={};
[...txt.matchAll(/【元提示词[:：](.+?)】([\s\S]*?)(?=【(?:角色|关系|预设|附录|附录组|元提示词)[:：]|={3,}[\s]*【|$)/g)].forEach(m=>{const n=m[1].trim(),c=m[2].trim().replace(/[\s]*={3,}[\s]*$/,'').trim();if(!materials.metaOrder.includes(n)){materials.metaOrder.push(n);materials.metaPrompts[n]=c}});
[...txt.matchAll(/【附录组[:：](.+?)】成员[:：](.+)/g)].forEach(m=>{const n=m[1].trim(),ms=m[2].split(/[,，]/).map(s=>s.trim()).filter(s=>s);if(!materials.groupOrder.includes(n)){materials.groupOrder.push(n);materials.appGroups[n]=ms}});
[...txt.matchAll(/【附录[:：](.+?)】([\s\S]*?)(?=【(?:角色|关系|预设|附录|附录组|元提示词)[:：]|={3,}[\s]*【|$)/g)].forEach(m=>{const n=m[1].trim();let c=m[2].trim().replace(/[\s]*={3,}[\s]*$/,'').trim();let kws=[];const kwM=c.match(/^〖关键词〗\s*\n?(.+)/m);if(kwM){kws=kwM[1].split(/[,，]/).map(s=>s.trim()).filter(s=>s);c=c.replace(/〖关键词〗\s*\n?.+\n?/,'').trim()}if(!materials.appOrder.includes(n)){materials.appOrder.push(n);materials.apps[n]=c;if(kws.length)materials.appKeywords[n]=kws}});
txt.split(/={3,}/).forEach(b=>{b=b.trim();if(!b)return;let m;if(m=b.match(/【角色[:：](.+?)】/)){const n=m[1].trim();if(!materials.charOrder.includes(n)){materials.charOrder.push(n);materials.chars[n]={d:ext(b,'详细人设'),s:ext(b,'简要人设'),h:ext(b,'H人设'),g:ext(b,'性别')||'女',spotlightApps:extL(b,'聚光灯附录')||[],keywords:extL(b,'关键词')||[],protagonist:/^主角[:：]\s*是\s*$/m.test(b)}}}else if(m=b.match(/【关系[:：](.+?)→(.+?)】/)){const k=m[1].trim()+'→'+m[2].trim();if(!materials.relIndex.includes(k)){materials.relIndex.push(k);materials.rels[k]={d:ext(b,'详细')||ext(b,'简要')||'',from:m[1].trim(),to:m[2].trim()}}}})}

//== saveMats ==//
async function saveMats(){
if(isWriteBlocked('素材保存'))return;
materials._savedAt=new Date().toISOString();
try{localStorage.setItem('matCache',JSON.stringify(materials))}catch(e){}
if(!folderH)return;
try{const f=await folderH.getFileHandle('materials.json',{create:true});const w=await f.createWritable();await w.write(JSON.stringify(materials,null,2));await w.close()}catch(e){toast('⚠️ 素材保存失败: '+e.name+': '+(e.message||'').substring(0,40))}}

//== loadMatCache ==//
function loadMatCache(){try{const d=localStorage.getItem('matCache');if(d){const p=JSON.parse(d);if(p.chars){materials=p;ensureMatFields();return true}}}catch(e){}return false}

//== ensureMatFields ==//
function ensureMatFields(){if(!materials.chars)materials.chars={};if(!materials.charOrder)materials.charOrder=[];if(!materials.rels)materials.rels={};if(!materials.relIndex)materials.relIndex=[];if(!materials.apps)materials.apps={};if(!materials.appOrder)materials.appOrder=[];if(!materials.appGroups)materials.appGroups={};if(!materials.groupOrder)materials.groupOrder=[];if(!materials.metaPrompts)materials.metaPrompts={};if(!materials.metaOrder)materials.metaOrder=[];if(!materials.appKeywords)materials.appKeywords={}}

//== analyzeMaterialsMerge ==//
function analyzeMaterialsMerge(local,imp){
const ef=m=>{if(!m.chars)m.chars={};if(!m.charOrder)m.charOrder=[];if(!m.rels)m.rels={};if(!m.relIndex)m.relIndex=[];if(!m.apps)m.apps={};if(!m.appOrder)m.appOrder=[];if(!m.appGroups)m.appGroups={};if(!m.groupOrder)m.groupOrder=[];if(!m.metaPrompts)m.metaPrompts={};if(!m.metaOrder)m.metaOrder=[];if(!m.appKeywords)m.appKeywords={}};
ef(local);ef(imp);
const r={chars:{added:[],same:[],conflict:[]},apps:{added:[],same:[],conflict:[]},meta:{added:[],same:[],conflict:[]},rels:{added:[],same:[],conflict:[]},localOnly:{chars:[],apps:[],meta:[],rels:[]},hasConflict:false};
imp.charOrder.forEach(n=>{const ic=imp.chars[n];if(!ic)return;const lc=local.chars[n];if(!lc){r.chars.added.push({name:n});return}if(lc.d===ic.d&&lc.s===ic.s&&lc.h===ic.h)r.chars.same.push(n);else{r.chars.conflict.push({name:n});r.hasConflict=true}});
local.charOrder.forEach(n=>{if(!imp.chars[n])r.localOnly.chars.push(n)});
imp.appOrder.forEach(n=>{const ic=imp.apps[n];if(ic===undefined)return;const lc=local.apps[n];if(lc===undefined){r.apps.added.push({name:n});return}if(lc===ic)r.apps.same.push(n);else{r.apps.conflict.push({name:n});r.hasConflict=true}});
local.appOrder.forEach(n=>{if(imp.apps[n]===undefined)r.localOnly.apps.push(n)});
imp.metaOrder.forEach(n=>{const ic=imp.metaPrompts[n];if(ic===undefined)return;const lc=local.metaPrompts[n];if(lc===undefined){r.meta.added.push({name:n});return}if(lc===ic)r.meta.same.push(n);else{r.meta.conflict.push({name:n});r.hasConflict=true}});
local.metaOrder.forEach(n=>{if(imp.metaPrompts[n]===undefined)r.localOnly.meta.push(n)});
imp.relIndex.forEach(k=>{const ir=imp.rels[k];if(!ir)return;const lr=local.rels[k];if(!lr){r.rels.added.push({key:k});return}if(lr.d===ir.d)r.rels.same.push(k);else{r.rels.conflict.push({key:k});r.hasConflict=true}});
local.relIndex.forEach(k=>{if(!imp.rels[k])r.localOnly.rels.push(k)});
return r}

//== showMaterialsMergeUI ==//
function showMaterialsMergeUI(analysis,imp){
return new Promise(resolve=>{
window._mmResolve=resolve;window._mmAnalysis=analysis;window._mmImp=imp;
const at=analysis;
const addN=at.chars.added.length+at.apps.added.length+at.meta.added.length+at.rels.added.length;
const sameN=at.chars.same.length+at.apps.same.length+at.meta.same.length+at.rels.same.length;
const confN=at.chars.conflict.length+at.apps.conflict.length+at.meta.conflict.length+at.rels.conflict.length;
const loN=at.localOnly.chars.length+at.localOnly.apps.length+at.localOnly.meta.length+at.localOnly.rels.length;
let h='<div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:12px">';
h+=`<div style="padding:8px;background:var(--ok-soft);border-radius:var(--r);text-align:center"><div style="font-size:11px;color:var(--tx-m)">🟢 新增</div><div style="font-size:18px;font-weight:700;color:var(--ok)">${addN}</div></div>`;
h+=`<div style="padding:8px;background:var(--wn-soft);border-radius:var(--r);text-align:center"><div style="font-size:11px;color:var(--tx-m)">🟡 冲突</div><div style="font-size:18px;font-weight:700;color:var(--wn)">${confN}</div></div>`;
h+=`<div style="padding:8px;background:var(--bg-t);border-radius:var(--r);text-align:center"><div style="font-size:11px;color:var(--tx-m)">⚪ 相同</div><div style="font-size:18px;font-weight:700">${sameN}</div></div>`;
h+=`<div style="padding:8px;background:var(--bg-t);border-radius:var(--r);text-align:center"><div style="font-size:11px;color:var(--tx-m)">🔵 仅本地</div><div style="font-size:18px;font-weight:700">${loN}</div></div></div>`;
if(addN){h+=`<div style="margin-bottom:10px;padding:8px;background:var(--ok-soft);border-radius:var(--r);border-left:3px solid var(--ok)"><div style="font-weight:600;margin-bottom:4px;font-size:13px">🟢 将新增 (${addN})</div><div style="font-size:12px;color:var(--tx-s)">`;if(at.chars.added.length)h+='角色: '+at.chars.added.map(x=>esc(x.name)).join('、')+'<br>';if(at.apps.added.length)h+='附录: '+at.apps.added.map(x=>esc(x.name)).join('、')+'<br>';if(at.meta.added.length)h+='元提示词: '+at.meta.added.map(x=>esc(x.name)).join('、')+'<br>';if(at.rels.added.length)h+='关系: '+at.rels.added.map(x=>esc(x.key)).join('、');h+='</div></div>'}

//== executeMaterialsMerge ==//
function executeMaterialsMerge(analysis,decisions,imp){
const dc=v=>JSON.parse(JSON.stringify(v));
analysis.chars.added.forEach(({name})=>{materials.chars[name]=dc(imp.chars[name]);if(!materials.charOrder.includes(name))materials.charOrder.push(name)});
analysis.chars.conflict.forEach(({name})=>{if((decisions.chars||{})[name]==='imported'){const ic=dc(imp.chars[name]);materials.chars[name]=ic}});
analysis.apps.added.forEach(({name})=>{materials.apps[name]=imp.apps[name];if(!materials.appOrder.includes(name))materials.appOrder.push(name);if(imp.appKeywords?.[name])materials.appKeywords[name]=[...imp.appKeywords[name]]});
analysis.apps.conflict.forEach(({name})=>{if((decisions.apps||{})[name]==='imported'){materials.apps[name]=imp.apps[name];if(imp.appKeywords?.[name])materials.appKeywords[name]=[...imp.appKeywords[name]];else delete materials.appKeywords[name]}});
analysis.meta.added.forEach(({name})=>{materials.metaPrompts[name]=imp.metaPrompts[name];if(!materials.metaOrder.includes(name))materials.metaOrder.push(name)});
analysis.meta.conflict.forEach(({name})=>{if((decisions.meta||{})[name]==='imported')materials.metaPrompts[name]=imp.metaPrompts[name]});
analysis.rels.added.forEach(({key})=>{materials.rels[key]=dc(imp.rels[key]);if(!materials.relIndex.includes(key))materials.relIndex.push(key)});
analysis.rels.conflict.forEach(({key})=>{if((decisions.rels||{})[key]==='imported')materials.rels[key]=dc(imp.rels[key])});
(imp.groupOrder||[]).forEach(gn=>{if(!materials.groupOrder.includes(gn)){materials.groupOrder.push(gn);materials.appGroups[gn]=imp.appGroups[gn]||[]}else{const local=materials.appGroups[gn]||[];(imp.appGroups[gn]||[]).forEach(a=>{if(!local.includes(a)&&materials.appOrder.includes(a))local.push(a)});materials.appGroups[gn]=local}});
materials._savedAt=new Date().toISOString()}

//== buildTxt ==//
function buildTxt(){
if(!materials.apps)materials.apps={};
if(!materials.appKeywords)materials.appKeywords={};
if(!materials.charOrder)materials.charOrder=[];
if(!materials.appOrder)materials.appOrder=[];
if(!materials.relIndex)materials.relIndex=[];
if(!materials.metaOrder)materials.metaOrder=[];
if(!materials.groupOrder)materials.groupOrder=[];
if(!materials.metaPrompts)materials.metaPrompts={};
if(!materials.rels)materials.rels={};
if(!materials.chars)materials.chars={};
if(!materials.appGroups)materials.appGroups={};
let lines=[];
materials.metaOrder.forEach(n=>{if(!materials.metaPrompts[n])return;lines.push('【元提示词:'+n+'】');lines.push(materials.metaPrompts[n]);lines.push('================')});
materials.charOrder.forEach(n=>{const c=materials.chars[n];lines.push('【角色:'+n+'】');if(c.keywords?.length)lines.push('关键词:'+c.keywords.join(','));lines.push('〖性别〗');lines.push(c.g||'女');lines.push('〖详细人设〗');lines.push(c.d||'');lines.push('〖简要人设〗');lines.push(c.s||'');if(c.h&&c.h.trim()){lines.push('〖H人设〗');lines.push(c.h)}if(c.protagonist)lines.push('主角:是');if(c.spotlightApps?.length)lines.push('聚光灯附录:'+c.spotlightApps.join(','));lines.push('================')});
materials.relIndex.forEach(k=>{const rel=materials.rels[k];lines.push('【关系:'+k+'】');lines.push('〖详细〗');lines.push(rel.d||'');lines.push('================')});
materials.appOrder.forEach(n=>{lines.push('【附录:'+n+'】');if(materials.appKeywords[n]?.length)lines.push('〖关键词〗\n'+materials.appKeywords[n].join(','));lines.push(materials.apps[n]||'');lines.push('================')});
materials.groupOrder.forEach(n=>{if(materials.appGroups[n]?.length){lines.push('【附录组:'+n+'】成员:'+materials.appGroups[n].join(','));lines.push('================')}});
return lines.join('\n')}

//== getEffectiveParams ==//
function getEffectiveParams(conv){
const cp=conv?.convParams||{};
const mp=getModelParams();
const pick=v=>v!==null&&v!==undefined&&v!=='';
const minNum=(...vals)=>{
const arr=vals.filter(pick).map(v=>Number(v)).filter(v=>!isNaN(v));
return arr.length?Math.min(...arr):undefined
};
const pickFirst=(...vals)=>{
for(const v of vals){if(pick(v))return v}
return undefined
};
return{
temperature:pickFirst(mp.temperature,cp.temperature,params.temperature),
maxTokens:minNum(mp.maxTokens,cp.maxTokens,params.maxTokens),
contextLimit:pickFirst(mp.contextLimit,cp.contextLimit,params.contextLimit),
maxInput:minNum(mp.maxInput,cp.maxInput,params.maxInput),
stream:pickFirst(mp.stream,cp.stream,params.stream),
truncateHint:params.truncateHint,
reasoningFields:params.reasoningFields,
contentTags:params.contentTags||['think','thinking'],
parseContentTags:pickFirst(mp.parseContentTags,cp.parseContentTags,params.parseContentTags),
topP:pickFirst(mp.topP,cp.topP,params.top_p),
topK:pickFirst(mp.topK,cp.topK,params.top_k),
frequencyPenalty:pickFirst(mp.frequencyPenalty,cp.frequencyPenalty,params.frequency_penalty),
presencePenalty:pickFirst(mp.presencePenalty,cp.presencePenalty,params.presence_penalty),
mergeSameRole:pickFirst(mp.mergeSameRole,cp.mergeSameRole,params.mergeSameRole)
}
}

const si=conv.messages.findIndex(m=>m.id===fg.startMsgId),ei=conv.messages.findIndex(m=>m.id===fg.endMsgId);

}});
return{mutedIds,summaryByStartId,summaryTok}
}

//== startWorkspaceLock ==//
function startWorkspaceLock(){
stopWorkspaceLock(false);
if(!folderH)return true;
_lockKey=getFolderLockKey();
const now=Date.now();
let cur=null;
try{cur=JSON.parse(localStorage.getItem(_lockKey)||'null')}catch(e){}
if(cur&&cur.id!==INSTANCE_ID&&now-(cur.t||0)<8000){
setReadOnlyMode(true,cur);

}

}

//== touchWorkspaceLock ==//
function touchWorkspaceLock(){
if(!_lockKey||writeLocked)return;
try{
const now=Date.now();
let cur=null;
try{cur=JSON.parse(localStorage.getItem(_lockKey)||'null')}catch(e){}
if(cur&&cur.id!==INSTANCE_ID&&now-(cur.t||0)<8000){

return
}

}catch(e){}
}

}

//== saveFolderHandleIDB ==//
function saveFolderHandleIDB(handle){
if(!_folderIDB){
toast('⚠️ 文件夹记忆失败：IndexedDB 未初始化');
console.warn('[folder-handle] IndexedDB not ready');
return
}
try{
const tx=_folderIDB.transaction('handles','readwrite');
const store=tx.objectStore('handles');
const req=store.put(handle,'folderH');
let done=false;
req.onsuccess=()=>{done=true;console.log('[folder-handle] saved:',handle?.name||'folder')};
req.onerror=e=>{
done=true;
const err=e.target.error;
console.error('[folder-handle] save request failed:',err);
toast('⚠️ 文件夹记忆失败：'+(err?.name||'IndexedDB错误')+(err?.message?': '+err.message.substring(0,40):''))
};
tx.oncomplete=()=>{
if(!done)console.log('[folder-handle] saved by transaction:',handle?.name||'folder')
};
tx.onerror=e=>{
const err=e.target.error;
console.error('[folder-handle] save transaction failed:',err);
toast('⚠️ 文件夹记忆失败：'+(err?.name||'事务错误')+(err?.message?': '+err.message.substring(0,40):''))
};
tx.onabort=e=>{
const err=e.target.error;
console.error('[folder-handle] save transaction aborted:',err);
toast('⚠️ 文件夹记忆失败：IndexedDB 事务被中止'+(err?.name?' '+err.name:''))
}
}catch(e){
console.error('[folder-handle] save threw:',e);
toast('⚠️ 文件夹记忆失败：'+e.name+(e.message?': '+e.message.substring(0,40):''))
}
}

//== getMoveFolderReady ==//
async function getMoveFolderReady(){

}
try{

}
}

//== buildChatboxSettings ==//
function buildChatboxSettings(){
const customProviders=[];const providers={};const favoritedModels=[];
apiConfigs.forEach(cfg=>{
const pid=cfg.id.startsWith('custom-provider-')?cfg.id:'custom-provider-'+cfg.id;
customProviders.push({id:pid,name:cfg.name,type:'openai',isCustom:true});
const host=(cfg.url||'').trim().replace(/\/+$/,'').replace(/\/chat\/completions\/?$/,'').replace(/\/v\d+\/?$/,'');
providers[pid]={apiKey:cfg.key||'',apiHost:host,models:cfg.models.map(m=>({modelId:m,type:'chat'})),useProxy:false}
});
starredModels.forEach(s=>{
const cfg=apiConfigs.find(c=>c.id===s.apiId);
if(!cfg)return;
const pid=s.apiId.startsWith('custom-provider-')?s.apiId:'custom-provider-'+s.apiId;
favoritedModels.push({provider:pid,model:s.model})
});
const sessionSettings={};
if(curApiId&&curModel){
const pid=curApiId.startsWith('custom-provider-')?curApiId:'custom-provider-'+curApiId;
sessionSettings.provider=pid;sessionSettings.modelId=curModel
}
return{customProviders,providers,favoritedModels,sessionSettings}
}

//== buildMovePack ==//
async function buildMovePack(){
const targets=[];
const total=convList.length;
const statusEl=document.getElementById('mvStatus');
const progFill=document.querySelector('#modal .prog-fill');
for(let i=0;i<total;i++){
const m=convList[i];
const c=m.id===curConvId&&curConv?curConv:await loadConvFull(m.id);
if(c)targets.push(c);
if(i%3===0||i===total-1){
const pct=Math.round((i+1)/total*80);
if(statusEl)statusEl.textContent=`打包对话 ${i+1}/${total}...`;
if(progFill)progFill.style.width=pct+'%';
await new Promise(r=>setTimeout(r,0))
}
}
if(!targets.length)throw new Error('无对话可导出');
if(statusEl)statusEl.textContent='生成JSON...';
if(progFill)progFill.style.width='85%';
await new Promise(r=>setTimeout(r,0));
const d={'__exported_items':['conversations'],'__exported_at':new Date().toISOString(),configVersion:13,'chat-sessions-list':[]};
const ct={version:VER,apiConfigs,starredModels,groups,params,uiSettings,shortcuts,curApiId,curModel,quickPhrases,localMeta,priceTable,costSettings,materials,storyData};
if(folderH){
try{
const vd=await folderH.getDirectoryHandle('mat_versions');
const pf=await vd.getFileHandle('_projects.json');
ct.matProjects=JSON.parse(await(await pf.getFile()).text());
ct.matVersionFiles={};
for await(const en of vd.values()){
if(en.kind==='file'&&en.name.endsWith('.txt'))ct.matVersionFiles[en.name]=await(await en.getFile()).text()
}
}catch(e){}
}
d._chatTool=ct;
d._chatToolCostLogs={version:1,savedAt:new Date().toISOString(),items:costLogs};
const _cbs=buildChatboxSettings();
d.settings={providers:_cbs.providers,customProviders:_cbs.customProviders,favoritedModels:_cbs.favoritedModels};
if(_cbs.sessionSettings.provider)d['chat-session-settings']=_cbs.sessionSettings;
targets.forEach(conv=>{
d['chat-sessions-list'].push({id:conv.id,name:conv.name,starred:conv.pinned||false,type:'chat'});
const sp=genMatFull(conv.materialConfig);
const msgs=[];
if(sp)msgs.push({id:gid2(),role:'system',contentParts:[{type:'text',text:sp}]});
(conv.messages||[]).forEach(msg=>{
const cp=[];
if(msg.reasoning)cp.push({type:'reasoning',text:msg.reasoning,duration:msg.reasoningDuration||0});
cp.push({type:'text',text:msg.content||''});
if(msg.images?.length)cp.push({type:'images',images:msg.images});
msgs.push({id:msg.id,role:msg.role,contentParts:cp,timestamp:msg.timestamp?new Date(msg.timestamp).getTime():Date.now(),model:msg.model||'',generating:false})
});
d[`session:${conv.id}`]={id:conv.id,name:conv.name,type:'chat',starred:conv.pinned||false,messages:msgs,messageForksHash:{},_chatTool:{materialConfig:conv.materialConfig,tempAppendices:conv.tempAppendices||[],groupId:conv.groupId||'_default',convParams:conv.convParams||{},foldGroups:conv.foldGroups||[],foldedMsgIds:conv.foldedMsgIds||[],lockedModel:conv.lockedModel||null}}
});
if(statusEl)statusEl.textContent='序列化...';
if(progFill)progFill.style.width='92%';
await new Promise(r=>setTimeout(r,0));
return{fileName:getMovePackFileName(),text:JSON.stringify(d,null,2)}
}

//== exportMovePack ==//
async function exportMovePack(){
try{
if(!folderH&&!convList.length){toast('请先连接/导入数据');return}
showMo('🚚 生成搬家包',`<div style="text-align:center;padding:20px"><div id="mvStatus">正在打包全部对话、设置、素材、剧情和费用日志...</div><div class="prog-bar"><div class="prog-fill" style="width:45%"></div></div></div>`,'');
await new Promise(r=>setTimeout(r,30));
const pack=await buildMovePack();
// 手机端：share(.txt) → 普通下载
if(isMobile){
if(navigator.share){
const shareName=pack.fileName.replace(/\.json$/,'.txt');
const file=new File([pack.text],shareName,{type:'text/plain'});
if(!navigator.canShare||navigator.canShare({files:[file]})){
hideMo();
try{
await navigator.share({title:'ChatTool搬家包',files:[file]});
toast('✅ 搬家包已分享');
return
}catch(e){
if(e.name==='AbortError'){toast('已取消');return}
}
}
}
hideMo();
dl(pack.fileName,pack.text,'application/json');
toast('✓ 已下载搬家包');
return
}
// 桌面端：写入搬家文件夹 → 普通下载
const ready=await getMoveFolderReady();
if(!ready.ok){
hideMo();
downloadMovePack(pack.fileName,pack.text,ready.reason||'无法写入搬家文件夹');
return
}
try{
const f=await ready.handle.getFileHandle(pack.fileName,{create:true});
const w=await f.createWritable();
await w.write(pack.text);
await w.close();
hideMo();
toast('✓ 搬家包已导出到：'+ready.handle.name+'/'+pack.fileName)
}catch(e){
hideMo();
downloadMovePack(pack.fileName,pack.text,'写入搬家文件夹失败：'+e.name+(e.message?': '+e.message.substring(0,50):''))
}
}catch(e){

//== migrateFlat ==//
async function migrateFlat(cd){if(isWriteBlocked('旧格式迁移'))return;const dd=await cd.getDirectoryHandle('_default',{create:true});const files=[];for await(const en of cd.values()){if(en.kind==='file'&&en.name.endsWith('.json')&&en.name!=='_index.json')files.push(en)}for(const f of files){try{const ct=await(await f.getFile()).text();const nf=await dd.getFileHandle(f.name,{create:true});const w=await nf.createWritable();await w.write(ct);await w.close();await cd.removeEntry(f.name)}catch(e){}}}

//== sortConvList ==//
function sortConvList(){const go=id=>{const g=groups.find(g=>g.id===id);return g?.order??999};convList.sort((a,b)=>{const ga=go(a.groupId||'_default'),gb=go(b.groupId||'_default');if(ga!==gb)return ga-gb;if(a.pinned&&!b.pinned)return-1;if(!a.pinned&&b.pinned)return 1;return(a.order??999)-(b.order??999)})}

//== loadConvFull ==//
async function loadConvFull(id){if(!folderH)return null;const m=convList.find(c=>c.id===id);if(!m)return null;for(let attempt=0;attempt<3;attempt++){try{if(attempt>0){_dirHandleCache={};const perm=await folderH.queryPermission({mode:'readwrite'});if(perm!=='granted'){const req=await folderH.requestPermission({mode:'readwrite'});if(req!=='granted'){toast('❌ 文件夹权限已失效');return null}}await new Promise(r=>setTimeout(r,200*(attempt+1)))}const cd=await folderH.getDirectoryHandle('conversations');const dir=await cd.getDirectoryHandle(m._dir||getGrpDir(m.groupId||'_default'));return JSON.parse(await(await(await dir.getFileHandle(m._fn)).getFile()).text())}catch(e){if(attempt===2){toast('⚠️ 读取对话失败: '+e.name+': '+(e.message||'').substring(0,40));return null}}}return null}

//== saveConvF ==//
async function saveConvF(conv){
if(isWriteBlocked('对话保存'))return false;
if(!folderH||!conv){if(!folderH)toast('请先选择文件夹');return false}
let resolve;const myTurn=new Promise(r=>{resolve=r});
const prevQueue=_saveQueue;_saveQueue=myTurn;

//== _doSaveConvF ==//
async function _doSaveConvF(conv){
const gid=conv.groupId||'_default';const dn=getGrpDir(gid);const fn=`conv_${conv.id}.json`;
let jsonStr;
try{jsonStr=JSON.stringify(conv,(k,v)=>k.startsWith('_')?undefined:v)}catch(e){toast('保存失败: 序列化错误');return false}
for(let attempt=0;attempt<3;attempt++){
let w=null;
try{
if(attempt>0){const perm=await folderH.queryPermission({mode:'readwrite'});if(perm!=='granted'){const req=await folderH.requestPermission({mode:'readwrite'});if(req!=='granted'){toast('❌ 文件夹权限已失效');return false}}}
let cd=_dirHandleCache['_root_conv'];
if(!cd){cd=await folderH.getDirectoryHandle('conversations',{create:true});_dirHandleCache['_root_conv']=cd}
const cacheKey='_sub_'+dn;let dir=_dirHandleCache[cacheKey];
if(!dir){dir=await cd.getDirectoryHandle(dn,{create:true});_dirHandleCache[cacheKey]=dir}
const f=await dir.getFileHandle(fn,{create:true});
w=await f.createWritable();await w.write(jsonStr);await w.close();w=null;
const meta={name:conv.name,pinned:conv.pinned,order:conv.order,msgCount:conv.messages?.length||0,updatedAt:conv.updatedAt,groupId:gid,_fn:fn,_dir:dn};
const i=convList.findIndex(c=>c.id===conv.id);
if(i>=0)Object.assign(convList[i],meta);else convList.push({id:conv.id,...meta});
scheduleIndexSave();return true
}catch(e){
if(w){try{await w.abort()}catch(ae){}}
if(attempt<2){_dirHandleCache={};await new Promise(r=>setTimeout(r,200*(attempt+1)))}
else{toast('❌ 保存失败: '+e.name+': '+(e.message||'').substring(0,40));return false}
}}return false}

//== moveToTrash ==//
async function moveToTrash(id){if(isWriteBlocked('删除对话'))return false;if(!folderH)return false;const m=convList.find(c=>c.id===id);if(!m)return;cancelConvReqs(id);try{const cd=await folderH.getDirectoryHandle('conversations');const dir=await cd.getDirectoryHandle(m._dir||getGrpDir(m.groupId||'_default'));const td=await folderH.getDirectoryHandle('_trash',{create:true});const fh=await dir.getFileHandle(m._fn);const d=JSON.parse(await(await fh.getFile()).text());d.deletedAt=new Date().toISOString();d.deletedFrom=m.groupId||'_default';const tf=await td.getFileHandle(m._fn,{create:true});const w=await tf.createWritable();await w.write(JSON.stringify(d,null,2));await w.close();await dir.removeEntry(m._fn);convList=convList.filter(c=>c.id!==id);trashList.push({id:d.id,name:d.name,msgCount:d.messages?.length||0,deletedAt:d.deletedAt,_fn:m._fn});scheduleIndexSave();return true}catch(e){toast('❌ 删除失败: '+e.name+': '+(e.message||'').substring(0,40));return false}}

//== batchMoveToTrash ==//
async function batchMoveToTrash(ids,onProgress){if(isWriteBlocked('批量删除对话'))return{done:0,failed:ids?.length||0};if(!folderH||!ids.length)return{done:0,failed:0};const cd=await folderH.getDirectoryHandle('conversations');const td=await folderH.getDirectoryHandle('_trash',{create:true});const dirCache={};const now=new Date().toISOString();let done=0,failed=0;const deletedIds=new Set();for(const id of ids){const m=convList.find(c=>c.id===id);if(!m){done++;if(onProgress)onProgress(done,ids.length,failed);continue}cancelConvReqs(id);try{const dn=m._dir||getGrpDir(m.groupId||'_default');if(!dirCache[dn])dirCache[dn]=await cd.getDirectoryHandle(dn);const dir=dirCache[dn];const fh=await dir.getFileHandle(m._fn);const raw=await(await fh.getFile()).text();let out;if(raw.trimStart().startsWith('{')){out='{"deletedAt":'+JSON.stringify(now)+',"deletedFrom":'+JSON.stringify(m.groupId||'_default')+','+raw.trimStart().substring(1)}else out=raw;const tf=await td.getFileHandle(m._fn,{create:true});const w=await tf.createWritable();await w.write(out);await w.close();await dir.removeEntry(m._fn);deletedIds.add(id);trashList.push({id:m.id,name:m.name,msgCount:m.msgCount||0,deletedAt:now,_fn:m._fn})}catch(e){failed++}done++;if(onProgress&&(done%5===0||done===ids.length))onProgress(done,ids.length,failed);if(done%5===0)await new Promise(r=>setTimeout(r,0))}convList=convList.filter(c=>!deletedIds.has(c.id));scheduleIndexSave();return{done:done-failed,failed}}

//== restoreTrash ==//

//== showDupCheck ==//
async function showDupCheck(){if(!folderH){toast('请先选择文件夹');return}showMo('🔍 查重','<div style="text-align:center;padding:20px"><div id="dupStatus">初筛...</div><div class="prog-bar"><div class="prog-fill" id="dupProgFill" style="width:0%"></div></div><div class="prog-text" id="dupProgText">0%</div></div>','');await new Promise(r=>setTimeout(r,30));const dupUpd=(txt,pct)=>{const s=document.getElementById('dupStatus'),f=document.getElementById('dupProgFill'),t=document.getElementById('dupProgText');if(s)s.textContent=txt;if(f)f.style.width=pct+'%';if(t)t.textContent=Math.round(pct)+'%'};const buckets={};convList.forEach(c=>{const key=c.name+'||'+c.msgCount;if(!buckets[key])buckets[key]=[];buckets[key].push(c)});const candidates=Object.values(buckets).filter(g=>g.length>=2);if(!candidates.length){showMo('🔍 查重','<div style="text-align:center;padding:30px;color:var(--tx-m)">✅ 无重复</div>',`<button class="mo-btn pri" onclick="hideMo()">关闭</button>`,'compact');return}dupUpd(`精确比对 ${candidates.length} 组...`,20);const dupGroups=[];let checked=0;for(const group of candidates){const loaded=[];for(const meta of group){const full=meta.id===curConvId&&curConv?curConv:await loadConvFull(meta.id);if(full)loaded.push({meta,full})}const used=new Set();for(let i=0;i<loaded.length;i++){if(used.has(i))continue;const identicals=[loaded[i]];for(let j=i+1;j<loaded.length;j++){if(used.has(j))continue;if(areConvsIdentical(loaded[i].full,loaded[j].full)){identicals.push(loaded[j]);used.add(j)}}if(identicals.length>=2)dupGroups.push({name:loaded[i].meta.name,msgCount:loaded[i].meta.msgCount,items:identicals})}checked++;dupUpd(`${checked}/${candidates.length}`,20+checked/candidates.length*70);await new Promise(r=>setTimeout(r,0))}if(!dupGroups.length){showMo('🔍 查重','<div style="text-align:center;padding:30px;color:var(--tx-m)">✅ 无完全重复</div>',`<button class="mo-btn pri" onclick="hideMo()">关闭</button>`,'compact');return}let totalDup=dupGroups.reduce((s,g)=>s+g.items.length-1,0);let html=`<div style="margin-bottom:10px;font-size:12px;color:var(--tx-m)">${dupGroups.length} 组重复，可清理 ${totalDup} 个</div>`;dupGroups.forEach((g,gi)=>{html+=`<div style="margin-bottom:12px;padding:10px;background:var(--bg-t);border-radius:var(--r);border-left:3px solid var(--wn)"><div style="font-weight:600;margin-bottom:6px;font-size:13px">${esc(g.name)} (${g.msgCount}条, ${g.items.length}份)</div>`;g.items.forEach((item,ii)=>{const gName=groups.find(gr=>gr.id===(item.meta.groupId||'_default'))?.name||'默认';const date=item.meta.updatedAt?new Date(item.meta.updatedAt).toLocaleDateString('zh-CN'):'';html+=`<label style="display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:var(--r);cursor:pointer;margin-bottom:3px;${ii===0?'background:rgba(74,222,128,.1);border:1px solid rgba(74,222,128,.3)':'background:var(--bg-s)'}"><input type="radio" name="dup_${gi}" value="${item.meta.id}" ${ii===0?'checked':''} style="width:16px;height:16px;accent-color:var(--ok)"><div style="flex:1"><div style="font-size:12px">${esc(item.meta.id.substring(0,8))}...</div><div style="font-size:10px;color:var(--tx-m)">${esc(gName)} · ${date}</div></div></label>`});html+=`</div>`});window._dupGroups=dupGroups;showMoFull('🔍 查重结果',html,`<button class="mo-btn sec" onclick="hideMo()">取消</button><button class="mo-btn dn" onclick="execDupMerge()">🗑️ 清理(删${totalDup}个)</button>`)}

//== execDupMerge ==//
async function execDupMerge(){const dupGroups=window._dupGroups;if(!dupGroups?.length)return;const keepIds=new Set();dupGroups.forEach((g,gi)=>{const sel=document.querySelector(`input[name="dup_${gi}"]:checked`);if(sel)keepIds.add(sel.value)});const delIds=[];dupGroups.forEach(g=>{g.items.forEach(item=>{if(!keepIds.has(item.meta.id))delIds.push(item.meta.id)})});if(!delIds.length){hideMo();toast('无需删除');return}showMo('🗑️ 清理中',`<div style="text-align:center;padding:20px"><div class="prog-bar"><div class="prog-fill" id="dupDelFill" style="width:0%"></div></div><div class="prog-text" id="dupDelText">0/${delIds.length}</div></div>`,'');const needNewConv=delIds.includes(curConvId);if(needNewConv){curConv=null;curConvId=null}const{done,failed}=await batchMoveToTrash(delIds,(d,t,f)=>{const fe=document.getElementById('dupDelFill'),te=document.getElementById('dupDelText');if(fe)fe.style.width=Math.round(d/t*100)+'%';if(te)te.textContent=`${d}/${t}`});if(!curConvId&&convList.length>0)await selectConv(convList[0].id);else if(!convList.length)renderMsgs();renderConvList();hideMo();ok(`已清理${done}个${failed?' ('+failed+'失败)':''}`)}

ass="c-name" ${batchRangeMode&&batchRangeFirst===c.id?'style="outline:2px solid var(--wn);outline-offset:2px;border-radius:var(--r)"':''}>${esc(c.name)}</span>${hg?'<span class="gen-dot"></span>':''}${ws&&!batchMode?`<button class="ws-remove" title="移出工作台" onclick="sp();workspaceRemove('${c.id}')">×</button>`:''}${batchMode?'':`<button class="c-more" onclick="sp();showConvCtx(event.clientX,event.clientY,'${c.id}')">⋯</button>`}</div>`};if(pinned.length&&unpinned.length){const pc=pinnedCollapsed[g.id];html+=`<div class="pin-div" onclick="tglPinCol('${g.id}')" style="cursor:pointer;user-select:none;position:sticky;top:25px;z-index:5;background:var(--bg-s);padding:4px 10px;font-size:12px;margin:0;border-top:1px solid var(--bg-s)">${pc?'▶':'▼'} ⭐ 置顶(${pinned.length})</div>`;if(!pc)pinned.forEach(c=>{html+=ri(c)});html+='<div class="pin-div" data-sep="1">──</div>';unpinned.forEach(c=>{html+=ri(c)})}else gc.forEach(c=>{html+=ri(c)});html+='</div>'});el.innerHTML=html||'<div style="text-align:center;color:var(--tx-m);padding:20px">无对话</div>'}

//== initWorkspace ==//

workspace.autoHours=workspace.autoHours||6;workspace.activeHours=workspace.activeHours||24;workspace.items.forEach((it,i)=>{if(it.order===undefined)it.order=i;if(!it.mode)it.mode='auto';if(!it.addedAt)it.addedAt=new Date().toISOString();if(!it.lastUsedAt)it.lastUsedAt=it.addedAt});

//== touchWorkspace ==//
function touchWorkspace(id,source){
if(!id)return;
if(!workspace.items)workspace.items=[];
const now=new Date().toISOString();
let it=getWSItem(id);
if(!it){const maxO=workspace.items.reduce((m,x)=>Math.max(m,x.order??0),-1);it={id,mode:source==='manual'?'manual':'auto',addedAt:now,lastUsedAt:now,order:maxO+1};workspace.items.push(it)}
else{it.lastUsedAt=now;if(source==='workspace'&&it.mode==='auto')it.mode='active';if(source==='manual')it.mode='manual'}
saveWorkspace(false);
if(_wsPopOpen)renderWorkspacePop();
updateConvListActive()
}

//== cleanupWorkspace ==//
function cleanupWorkspace(doSave){
if(!workspace.items)return;
const now=Date.now();let changed=false;
const hasConv=id=>!folderH||!convList.length||convList.some(c=>c.id===id);
workspace.items=workspace.items.filter(it=>{
if(!hasConv(it.id)){changed=true;return false}
if(pendReqs[it.id]?.some(r=>r.status==='generating')){it.lastUsedAt=new Date().toISOString();return true}
const last=new Date(it.lastUsedAt||it.addedAt||0).getTime()||0;
if(it.mode==='auto'&&now-last>workspace.autoHours*3600*1000){changed=true;return false}
if(it.mode==='active'&&now-last>workspace.activeHours*3600*1000){changed=true;return false}
return true});
workspace.items.sort((a,b)=>(a.order??0)-(b.order??0)).forEach((it,i)=>it.order=i);
workspace.lastCleanAt=now;
if(changed&&doSave!==false)saveWorkspace(true);
return changed
}

//== setupWorkspaceSwipe ==//
function setupWorkspaceSwipe(container){
if(!container||!isMobile)return;
container.querySelectorAll('.ws-swipe').forEach(w=>{
let sx=0,sy=0,dx=0,dy=0,swiping=false,moved=false;
const main=w.querySelector('.ws-swipe-main');
w.addEventListener('touchstart',e=>{
const t=e.touches[0];sx=t.clientX;sy=t.clientY;dx=0;dy=0;swiping=false;moved=false;
if(_wsSwipeOpenId&&_wsSwipeOpenId!==w.dataset.id){_wsSwipeOpenId=null;container.querySelectorAll('.ws-swipe.open').forEach(x=>x.classList.remove('open'))}
},{passive:true});
w.addEventListener('touchmove',e=>{
const t=e.touches[0];dx=t.clientX-sx;dy=t.clientY-sy;
if(!swiping&&Math.abs(dx)>18&&Math.abs(dx)>Math.abs(dy)*1.4)swiping=true;
if(!swiping)return;
moved=true;e.preventDefault();
const base=w.classList.contains('open')?-64:0;
let x=Math.max(-72,Math.min(0,base+dx));
if(main)main.style.transform='translateX('+x+'px)'
},{passive:false});
w.addEventListener('touchend',()=>{
if(!swiping){if(_wsSwipeOpenId&&Math.abs(dx)<6&&Math.abs(dy)<6){_wsSwipeOpenId=null;container.querySelectorAll('.ws-swipe.open').forEach(x=>x.classList.remove('open'))}return}
if(main)main.style.transform='';
if(dx<-35){container.querySelectorAll('.ws-swipe.open').forEach(x=>{if(x!==w)x.classList.remove('open')});w.classList.add('open');_wsSwipeOpenId=w.dataset.id}
else if(dx>25){w.classList.remove('open');if(_wsSwipeOpenId===w.dataset.id)_wsSwipeOpenId=null}
else{w.classList.toggle('open',_wsSwipeOpenId===w.dataset.id)}
if(moved){_wsSwipeMoved=true;setTimeout(()=>{_wsSwipeMoved=false},350)}
},{passive:true})
})
}

//== mdFmt ==//
function mdFmt(s){
if(!s)return'';
const slots=[];
let work=s;
if(uiSettings.enableKatex){
work=work.replace(/\\\[([\s\S]*?)\\\]/g,function(m,tex){return '$$'+tex+'$$'});
work=work.replace(/\\\(([^\n]*?)\\\)/g,function(m,tex){return '$'+tex+'$'});
}
const fence='`'.repeat(3);
const cbRx=new RegExp('(^|\\n)[ \\t]*'+fence+'([^\\r\\n`]*)\\r?\\n([\\s\\S]*?)\\n[ \\t]*'+fence+'[ \\t]*(?=\\n|$)','g');
work=work.replace(cbRx,function(m,p1,lang,code){
const id=slots.length;
slots.push({html:'<pre style="position:relative"><code>'+esc(code)+'</code><button class="pre-cp" onclick="copyPre(this)"><span class="cp-icon">📋</span><span class="cp-text">复制</span></button></pre>'});
return p1+'\uE000'+id+'\uE001'
});
if(uiSettings.enableKatex&&window.katex){
work=work.replace(/(?<!\$)\$\$([\s\S]+?)\$\$(?!\$)/g,function(m,tex){
if(!tex.trim())return m;
const id=slots.length;
let html=null;
try{html=katex.renderToString(tex,{displayMode:true,throwOnError:true,output:'html',strict:'ignore'})}catch(e){}
slots.push({html:html||('<div class="fallback-block">'+esc(m)+'</div>')});
return '\uE000'+id+'\uE001'
})
}
work=work.replace(/``([^\r\n]+?)``/g,function(m,code){
const id=slots.length;
slots.push({html:'<code>'+esc(code.replace(/^ | $/g,''))+'</code>'});
return '\uE000'+id+'\uE001'
});
work=work.replace(/`([^`\r\n]+)`/g,function(m,code){
const id=slots.length;
slots.push({html:'<code>'+esc(code)+'</code>'});
return '\uE000'+id+'\uE001'
});
if(uiSettings.enableKatex&&window.katex){
work=work.replace(/\$([^\$\n]{1,200}?)\$/g,function(m,tex){
if(/^\d/.test(tex))return m;
if(!tex.trim())return m;
const id=slots.length;
let html=null;
try{html=katex.renderToString(tex,{displayMode:false,throwOnError:true,output:'html',strict:'ignore'})}catch(e){}
slots.push({html:html||('<span class="fallback-inline">'+esc(m)+'</span>')});
return '\uE000'+id+'\uE001'
})
}
work=esc(work);
work=work.replace(/^[ \t]*(\*{3,}|-{3,}|_{3,})[ \t]*$/gm,'<hr style="border:none;border-top:1px solid var(--bd);margin:8px 0">');
work=work.replace(/^(#{1,6})\s+(.+)$/gm,function(m,h,t){
const lv=h.length,sizes=['1.25em','1.15em','1.05em','1em','0.95em','0.9em'];
return '<div style="font-weight:700;font-size:'+sizes[lv-1]+';margin:2px 0 1px">'+t+'</div>'
});
work=work.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');
work=work.replace(/(?<!\*)\*([^*\n]+)\*(?!\*)/g,'<em>$1</em>');
work=work.replace(/\n/g,'<br>');
work=work.replace(/\uE000(\d+)\uE001/g,function(m,id){return slots[parseInt(id)].html});
return work
}

//== renderMd ==//
function renderMd(t,parseContentTags,msgId){
if(!t)return'';
if(parseContentTags===false)return mdFmt(t);
const tags=params.contentTags||['think','thinking'];
const forbidden=[];
const fence='`'.repeat(3);
const cbRx=new RegExp('(^|\\n)[ \\t]*'+fence+'[^\\r\\n`]*\\r?\\n[\\s\\S]*?\\n[ \\t]*'+fence+'[ \\t]*(?=\\n|$)','g');
let m;
while((m=cbRx.exec(t))!==null){forbidden.push([m.index,m.index+m[0].length])}
const dbRx=/``[^\r\n]+?``/g;
while((m=dbRx.exec(t))!==null){const idx=m.index;if(!forbidden.some(r=>idx>=r[0]&&idx<r[1]))forbidden.push([idx,idx+m[0].length])}
const sbRx=/`[^`\r\n]+`/g;
while((m=sbRx.exec(t))!==null){const idx=m.index;if(!forbidden.some(r=>idx>=r[0]&&idx<r[1]))forbidden.push([idx,idx+m[0].length])}
const inFb=p=>forbidden.some(r=>p>=r[0]&&p<r[1]);
const findOutside=(needle,from)=>{let f=from;while(f<t.length){const idx=t.indexOf(needle,f);if(idx===-1)return -1;if(!inFb(idx))return idx;f=idx+needle.length}return -1};
const parts=[];let cursor=0,ti=0;
while(cursor<t.length){
let earliest=-1,eTag='';
for(const tag of tags){const idx=findOutside('<'+tag+'>',cursor);if(idx!==-1&&(earliest===-1||idx<earliest)){earliest=idx;eTag=tag}}
if(earliest===-1){parts.push({type:'text',content:t.substring(cursor)});break}
if(earliest>cursor)parts.push({type:'text',content:t.substring(cursor,earliest)});
const oTag='<'+eTag+'>',cTag='</'+eTag+'>';
const cIdx=findOutside(cTag,earliest+oTag.length);
if(cIdx===-1){parts.push({type:'rsn',content:t.substring(earliest+oTag.length)});cursor=t.length}
else{parts.push({type:'rsn',content:t.substring(earliest+oTag.length,cIdx)});cursor=cIdx+cTag.length}
}
parts.forEach((p,pi)=>{
if(p.type==='rsn')p.content=p.content.replace(/^\s+/,'').replace(/\s+$/,'');
if(p.type==='text'&&pi>0&&parts[pi-1].type==='rsn')p.content=p.content.replace(/^\n+/,'')
});
if(!parts.some(p=>p.type==='rsn'))return mdFmt(t);
let out='';
parts.forEach(p=>{
if(p.type==='rsn'){
const rsnId=msgId+'_t'+ti++;
const rsnExp=expandedRsn.has(rsnId);
out+='<div class="rsn-block"><div class="rsn-hdr" onclick="sp();tglRsn(\''+rsnId+'\')"><span class="arr'+(rsnExp?' open':'')+'" id="ra-'+rsnId+'">▶</span><span>🧠 (内嵌)</span><button class="mb" onclick="sp();copyRsn(\''+rsnId+'\')" style="margin-left:auto;font-size:10px">📋</button></div><div class="rsn-ct'+(rsnExp?' show':'')+'" id="rc-'+rsnId+'">'+esc(p.content)+'</div></div>'
}else{out+=mdFmt(p.content)}
});
return out
}

else if(cc>thr&&!isG){const mdKey=msg.content+'||'+(ep.parseContentTags!==false?'1':'0');let fullHtml;if(msg._mdKey===mdKey&&msg._mdCache)fullHtml=msg._mdCache;else{fullHtml=renderMd(msg.content,ep.parseContentTags,msg.id);msg._mdCache=fullHtml;msg._mdKey=mdKey}const rawPv=stripContentTags((msg.content||'').trimStart());const pvText=rawPv.substring(0,pvChars).replace(/\n{2,}/g,'\n');const pvH=pvl*1.6;let pvStubs='';const tags=params.contentTags||['think','thinking'];tags.forEach(tag=>{if(msg.content.indexOf('<'+tag+'>')!==-1){pvStubs+=`<div class="rsn-block" style="margin-bottom:4px"><div class="rsn-hdr" onclick="toggleMsgFold(${i})" style="cursor:pointer"><span class="arr">▶</span><span>🧠 (内嵌)</span></div></div>`}});body=`<div class="fold-full" style="${fd?'display:none':''}">${fullHtml}</div><div class="fold-preview-wrap" style="${fd?'':'display:none;'}max-height:${pvH}em;overflow:hidden;position:relative">${pvStubs}${mdFmt(esc(pvText))}<div class="fold-mask"></div></div>`}
else{if(isG){body=renderMd(msg.content,ep.parseContentTags,msg.id)}else{const mdKey=msg.content+'||'+(ep.parseContentTags!==false?'1':'0');if(msg._mdKey===mdKey&&msg._mdCache)body=msg._mdCache;else{body=renderMd(msg.content,ep.parseContentTags,msg.id);msg._mdCache=body;msg._mdKey=mdKey}}}
let fb='';if(isG&&cc>0){fb=`<button class="fold-btn" onclick="toggleGenFold(${i})">${isGenFolded?`▼ 展开 (${cc.toLocaleString()}字)`:'▲ 折叠'}</button>`}else if(cc>thr&&!isG){fb=`<button class="fold-btn" onclick="toggleFold(this,${i})">${fd?`▼ 展开全文 (${cc.toLocaleString()}字)`:'▲ 收起'}</button>`}
const hdParts=[`<span class="msg-idx">#${i+1}</span>`];
if(isM)hdParts.push('<span class="msg-muted-b">🔇</span>');
if(msg.model&&uiSettings.showModelInfo!==false){const apiNm=msg.apiName?esc(msg.apiName)+'/':'';hdParts.push(`<span class="msg-model">${apiNm}${esc(msg.model)}</span>`)}
hdParts.push(`<span class="msg-time">${fmtTime(msg.timestamp)}</span>`);

const showFtr=msg.role==='assistant'&&!isG&&cc>thr;
let ftrH='';if(showFtr){const parts=[];if(msg.model&&uiSettings.showModelInfo!==false){const a2=msg.apiName?esc(msg.apiName)+'/':'';parts.push(`<span>${a2}${esc(msg.model)}</span>`)}parts.push(`<span>${cc.toLocaleString()}字</span>`);parts.push(`<span>${fmtTime(msg.timestamp)}</span>`);if(msg.firstTokenMs)parts.push(`<span>首字${(msg.firstTokenMs/1000).toFixed(1)}s</span>`);if(msg.cacheHitTokens||msg.promptTokens){const ht=msg.cacheHitTokens||0,pt=msg.promptTokens||0;const pct=pt>0?Math.round(ht/pt*100):0;parts.push(`<span title="缓存${ht.toLocaleString()}/${pt.toLocaleString()} tok">💾${pct}%</span>`)}ftrH=`<div class="msg-ftr"${fd?' style="display:none"':''}>${parts.join('')}</div>`}
return`<div class="message ${msg.role} ${isG?'generating':''} ${isM?'muted':''} ${isFailed?'failed':''}" id="msg-${i}"><div class="msg-av">${roleIcon(msg.role)}</div><div class="msg-ct"><div class="msg-hd">${hdParts.join('')}</div>${isGenFolded?'':rH}${isGenFolded?'':imgHtml}<div class="msg-body" style="white-space:pre-wrap;${isGenFolded?'display:none':''}">${isGenFolded?'':body}</div>${isGenFolded?`<div class="gen-fold-info" id="gfi-${msg.id}">⏳ <strong>${cc.toLocaleString()}</strong> 字</div>`:''}${fb}${ftrH}<div class="msg-acts"><button class="mb pri" onclick="sendUpTo(${i})">⬇️发送</button><button class="mb" onclick="insertAfter(${i})">➕插入</button><button class="mb" onclick="editMsg(${i})">✏️编辑</button><button class="mb" onclick="copyMsg(${i})">📋复制</button><button class="mb ${isM?'wn':''}" onclick="toggleMute(${i})">${isM?'🔊':'🔇'}</button><span style="display:inline-flex;gap:3px"><button class="mb ${cfmSt.id==='msg-'+i?'cf':'dn'}" onclick="cfmDel('msg-${i}',()=>delMsg(${i}))">${cfmSt.id==='msg-'+i?'确认?':'🗑️'}</button><button class="mb dn" onclick="delAfter(${i})">🗑️后续</button></span></div></div></div>`}

//== createFoldGroup ==//
async function createFoldGroup(startIdx,endIdx,name,summary){
if(!curConv||startIdx<0||endIdx>=curConv.messages.length||startIdx>endIdx)return null;
if(!name){showMo('📁 创建折叠组',`<div class="fg"><label>名称</label><input type="text" id="fgNewNm" placeholder="输入组名..."></div>`,`<button class="mo-btn sec" onclick="hideMo()">取消</button>${params.auxModel?`<button class="mo-btn sec" onclick="aiFGNameAndSummary(${startIdx},${endIdx},false)">🤖快速</button><button class="mo-btn sec" onclick="aiFGNameAndSummary(${startIdx},${endIdx},true)">🤖全量</button>`:''}<button class="mo-btn pri" onclick="doCreateFG(${startIdx},${endIdx})">创建</button>`,'compact');setTimeout(()=>document.getElementById('fgNewNm')?.focus(),50);return null}
if(!curConv.foldGroups)curConv.foldGroups=[];
const sId=curConv.messages[startIdx].id,eId=curConv.messages[endIdx].id;
const overlap=curConv.foldGroups.some(fg=>{const si=curConv.messages.findIndex(m=>m.id===fg.startMsgId);const ei=curConv.messages.findIndex(m=>m.id===fg.endMsgId);if(si===-1||ei===-1)return false;return!(endIdx<si||startIdx>ei)});
if(overlap){toast('与已有折叠组重叠');return null}
const id='fg_'+gid2();
curConv.foldGroups.push({id,name,summary:summary||'',startMsgId:sId,endMsgId:eId,collapsed:true,muted:false});
curConv.updatedAt=new Date().toISOString();await saveConvF(curConv);renderMsgs();toast('✓ 已创建');return id}

//== aiFGNameAndSummary ==//
async function aiFGNameAndSummary(si,ei,fullMode){

const cid=curConv.id;
let excerpt;
if(fullMode){excerpt=curConv.messages.slice(si,ei+1).map(m=>(m.role==='user'?'用户':'AI')+': '+(m.content||'')).join('\n')}
else{excerpt=curConv.messages.slice(si,ei+1).map(m=>(m.role==='user'?'用户':'AI')+': '+(m.content||'').substring(0,200)).join('\n').substring(0,1500)}
const fgId=await createFoldGroup(si,ei,'⏳命名中...','');
if(!fgId)return;
hideMo();toast('后台生成折叠组概要中...');
const result=await callAuxModel('根据以下对话，返回JSON格式：{"name":"8字以内的标题","summary":"2-3句概括主要事件和进展"}。只输出JSON，不要其他内容。',[{role:'user',content:excerpt}],fullMode?500:250);

const fg=conv.foldGroups.find(g=>g.id===fgId);
if(!fg)return;
if(result){try{const clean=result.replace(/```json\s*/g,'').replace(/```\s*/g,'').trim();const j=JSON.parse(clean);if(j.name)fg.name=String(j.name).substring(0,30);if(j.summary)fg.summary=String(j.summary)}catch(e){fg.name=result.substring(0,20);fg.summary=''}}else{fg.name='未命名折叠组';toast('AI命名失败，可手动编辑')}
conv.updatedAt=new Date().toISOString();await saveConvF(conv);
if(cid===curConvId&&curConv){curConv=conv;renderMsgs();updateTokCnt()}
if(result)toast('✓ 折叠组概要已生成')}

Object.entries(byMsg).forEach(([mi,indices])=>{const msg=curConv.messages[parseInt(mi)];if(!msg)return;indices.sort((a,b)=>b-a);const ek=kw.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');indices.forEach(ci=>{const before=msg.content.substring(0,ci);const after=msg.content.substring(ci);msg.content=before+after.replace(new RegExp(ek,caseS?'':'i'),rp);total++});delete msg._mdCache;delete msg._mdKey});

//== mgrDoSearch ==//
async function mgrDoSearch(){
saveMgrCache();const kw=mgrCache.kw;const scope=mgrCache.scope;const roles=mgrCache.roles;const caseS=mgrCache.caseS;
frMatches=[];frMatchesAll=[];frSel.clear();mgrSearchCur=0;
if(!kw){renderMgrList();return}
if(scope==='all'){frSearching=true;frSearchAbort=false;renderMgrList();const info=document.getElementById('mgrSrInfo');
for(let ci=0;ci<convList.length;ci++){if(frSearchAbort){frSearching=false;renderMgrList();return}
const m2=convList[ci];const c=m2.id===curConvId&&curConv?curConv:await loadConvFull(m2.id);if(!c)continue;
const matches=[];c.messages?.forEach((msg,mi)=>{if(!roles.includes(msg.role))return;const ct=msg.content||'';const ek=kw.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');const rx=new RegExp(ek,caseS?'g':'gi');let mt;rx.lastIndex=0;while((mt=rx.exec(ct))!==null){matches.push({msgIdx:mi,charIdx:mt.index,role:msg.role,snippet:exSnip(ct,kw,30,mt.index)})}});
if(matches.length)frMatchesAll.push({convId:c.id,convName:c.name,matches});
if(ci%5===0&&info){info.textContent=`搜索 ${ci+1}/${convList.length}...`;await new Promise(r=>setTimeout(r,0))}}
frSearching=false;let idx=0;frMatchesAll.forEach(r=>r.matches.forEach(m=>{frSel.add(idx);m._frIdx=idx;idx++}));
if(info){let total=0;frMatchesAll.forEach(r=>total+=r.matches.length);info.textContent=`找到 ${total} 处 (${frMatchesAll.length} 个对话)`}
renderMgrList();return}
if(!curConv)return;const ek=kw.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');const rx=new RegExp(ek,caseS?'g':'gi');
const muteChecks=mgrCache;
curConv.messages.forEach((msg,mi)=>{if(!roles.includes(msg.role))return;if(msg.muted&&!muteChecks.showMuted)return;if(!msg.muted&&!muteChecks.showUnmuted)return;
const ct=msg.content||'';let mt;rx.lastIndex=0;while((mt=rx.exec(ct))!==null){frMatches.push({msgIdx:mi,charIdx:mt.index,snippet:exSnip(ct,kw,30,mt.index)})}});
frMatches.forEach((m,i)=>{frSel.add(i)});
const info=document.getElementById('mgrSrInfo');if(info)info.textContent=`找到 ${frMatches.length} 处`;
renderMgrList();updateMgrOpsVis()}

//== scrollToKeyword ==//
function scrollToKeyword(msgIdx,kw,charIdx){
const el=document.getElementById('msg-'+msgIdx);if(!el)return;
const msg=curConv?.messages?.[msgIdx];
if(msg&&foldMgr.isFolded(msg.id))toggleMsgFold(msgIdx);
const body=el.querySelector('.msg-body');
if(!body){el.scrollIntoView({behavior:'smooth',block:'center'});el.style.outline='2px solid var(--ac)';el.style.outlineOffset='3px';setTimeout(()=>{el.style.outline='';el.style.outlineOffset=''},2500);return}
const walker=document.createTreeWalker(body,NodeFilter.SHOW_TEXT);
const nodes=[];let fullText='';let node;
while(node=walker.nextNode()){nodes.push({node,start:fullText.length});fullText+=node.textContent}
const kwLower=kw.toLowerCase(),ftLower=fullText.toLowerCase();
let bestPos=-1;
if(charIdx!=null&&charIdx>=0){let pos=-1,bestDist=Infinity;while(true){pos=ftLower.indexOf(kwLower,pos+1);if(pos===-1)break;const dist=Math.abs(pos-charIdx);if(dist<bestDist){bestDist=dist;bestPos=pos}}}
else{bestPos=ftLower.indexOf(kwLower)}
if(bestPos===-1){el.scrollIntoView({behavior:'smooth',block:'center'});el.style.outline='2px solid var(--ac)';el.style.outlineOffset='3px';setTimeout(()=>{el.style.outline='';el.style.outlineOffset=''},2500);return}
let startNode=null,startOff=0,endNode=null,endOff=0;
for(let i=0;i<nodes.length;i++){const n=nodes[i],nEnd=n.start+n.node.textContent.length;if(!startNode&&bestPos<nEnd){startNode=n.node;startOff=bestPos-n.start}if(bestPos+kw.length<=nEnd){endNode=n.node;endOff=bestPos+kw.length-n.start;break}}
if(!startNode||!endNode){el.scrollIntoView({behavior:'smooth',block:'center'});return}
try{const range=document.createRange();range.setStart(startNode,Math.min(startOff,startNode.textContent.length));range.setEnd(endNode,Math.min(endOff,endNode.textContent.length));const rect=range.getBoundingClientRect();const container=document.getElementById('msgsC');const cRect=container.getBoundingClientRect();container.scrollTop+=rect.top-cRect.top-cRect.height/3;try{const mark=document.createElement('mark');mark.style.cssText='background:rgba(251,191,36,.5);color:inherit;border-radius:2px;padding:0 1px';range.surroundContents(mark);setTimeout(()=>{try{if(mark.parentNode)mark.outerHTML=mark.innerHTML}catch(e2){}},2500)}catch(e2){el.style.outline='2px solid var(--ac)';el.style.outlineOffset='3px';setTimeout(()=>{el.style.outline='';el.style.outlineOffset=''},2500)}}catch(e){el.scrollIntoView({behavior:'smooth',block:'center'})}}

//== handleInputPaste ==//
function handleInputPaste(e){
const items=e.clipboardData?.items;
if(!items)return;
// 检测图片
for(const item of items){
if(item.type.startsWith('image/')){
e.preventDefault();
const file=item.getAsFile();
if(file)addImageAttachment(file);
return
}}
// 大文本转附件
const thr=uiSettings.attachThreshold!=null?uiSettings.attachThreshold:3000;

//== addImageAttachment ==//
function addImageAttachment(file){
if(!file||!file.type.startsWith('image/'))return;
const reader=new FileReader();
reader.onerror=function(){toast('❌ 读取图片失败')};
reader.onload=async function(){
const dataUrl=reader.result;
if(!dataUrl||typeof dataUrl!=='string'){toast('❌ 读取图片失败');return}
const img=new Image();
try{
img.src=dataUrl;
if(img.decode){await img.decode()}
else{await new Promise((res,rej)=>{img.onload=res;img.onerror=()=>rej(new Error('decode failed'));setTimeout(()=>{if(!img.complete)rej(new Error('decode timeout'))},10000)})}
}catch(e){toast('❌ 图片解码失败，可能是不支持的格式');return}
const ow=img.naturalWidth||img.width,oh=img.naturalHeight||img.height;
if(!ow||!oh){toast('❌ 图片尺寸异常');return}
const MAX_SIDE=2576;
const MAX_MP=3750000;
const JPEG_Q=0.92;
let w=ow,h=oh;
let needResize=false;
if(w>MAX_SIDE||h>MAX_SIDE){
if(w>h){h=Math.round(h*MAX_SIDE/w);w=MAX_SIDE}
else{w=Math.round(w*MAX_SIDE/h);h=MAX_SIDE}
needResize=true
}
if(w*h>MAX_MP){
const scale=Math.sqrt(MAX_MP/(w*h));
w=Math.round(w*scale);h=Math.round(h*scale);
needResize=true
}
const origMime=(file.type||'').toLowerCase();
const safeMime=origMime==='image/png'||origMime==='image/jpeg'||origMime==='image/webp'||origMime==='image/gif';
const isGif=origMime==='image/gif';
let outUrl=null,outMime=origMime||'image/png';
if(!needResize&&safeMime&&!isGif){
outUrl=dataUrl;
outMime=origMime
}else if(isGif&&!needResize){
outUrl=dataUrl;outMime='image/gif'
}else{
try{
const canvas=document.createElement('canvas');
canvas.width=w;canvas.height=h;
const ctx2=canvas.getContext('2d');
if(!ctx2)throw new Error('no canvas ctx');
ctx2.imageSmoothingEnabled=true;
ctx2.imageSmoothingQuality='high';
ctx2.fillStyle='#fff';
ctx2.fillRect(0,0,w,h);
ctx2.drawImage(img,0,0,w,h);
let useMime='image/jpeg';
if(origMime==='image/png'){useMime='image/png'}
const encoded=canvas.toDataURL(useMime,useMime==='image/jpeg'?JPEG_Q:undefined);
if(!encoded||encoded.length<200){throw new Error('encode failed')}
outUrl=encoded;
outMime=useMime
}catch(e){
outUrl=dataUrl;
outMime=origMime||'image/png';
needResize=false
}}
const commaIdx=outUrl.indexOf(',');
const base64=commaIdx>=0?outUrl.substring(commaIdx+1):'';
if(!base64){toast('❌ 图片处理失败');return}
inputAttachments.push({
id:gid2(),
type:'image',
base64,
mimeType:outMime,
dataUrl:outUrl,
width:w,
height:h,
name:file.name||'image',
size:Math.round(base64.length*3/4)
});
renderAttachBar();
updateTokCnt();
toast('📷 已添加图片'+(needResize?' (已压缩)':''))
};
try{reader.readAsDataURL(file)}catch(e){toast('❌ 读取图片失败: '+e.name)}}

//== downloadMsgImage ==//
function downloadMsgImage(msgIdx,imgIdx){
const msg=curConv?.messages?.[msgIdx];
if(!msg?.images?.[imgIdx])return;
const img=msg.images[imgIdx];
const ext=img.mimeType.split('/')[1]||'png';
const name=(img.name||'image').replace(/\.[^.]+$/,'')+'.'+ext;
const bin=atob(img.base64);
const arr=new Uint8Array(bin.length);
for(let i=0;i<bin.length;i++)arr[i]=bin.charCodeAt(i);
const blob=new Blob([arr],{type:img.mimeType});
const url=URL.createObjectURL(blob);
const a=document.createElement('a');
a.href=url;a.download=name;a.click();
setTimeout(()=>URL.revokeObjectURL(url),1000);
toast('✓ 已下载')}

//== copyMsgImage ==//
async function copyMsgImage(msgIdx,imgIdx){
const msg=curConv?.messages?.[msgIdx];
if(!msg?.images?.[imgIdx])return;
const img=msg.images[imgIdx];
try{
const bin=atob(img.base64);
const arr=new Uint8Array(bin.length);
for(let i=0;i<bin.length;i++)arr[i]=bin.charCodeAt(i);
const blob=new Blob([arr],{type:'image/png'});
await navigator.clipboard.write([new ClipboardItem({'image/png':blob})]);
toast('✓ 已复制图片')
}catch(e){toast('复制失败: '+e.message)}}

//== fmtImgSize ==//
function fmtImgSize(base64Len){
const bytes=Math.round(base64Len*3/4);
if(bytes<1024)return bytes+'B';
if(bytes<1024*1024)return(bytes/1024).toFixed(1)+'KB';
return(bytes/1024/1024).toFixed(2)+'MB'}

//== buildImageContent ==//
function buildImageContent(msg){
if(!msg.images?.length)return msg.content||'';
const detail=(uiSettings.imageDetail)||'auto';
const parts=[];
if(msg.content&&msg.content.trim()&&msg.content!=='[图片]'&&!msg.content.startsWith('[图片: '))parts.push({type:'text',text:msg.content});
msg.images.forEach(img=>{
const url=img.dataUrl||('data:'+(img.mimeType||'image/png')+';base64,'+img.base64);
parts.push({type:'image_url',image_url:{url,detail}})
});
if(!parts.some(p=>p.type==='text'))parts.unshift({type:'text',text:'(图片)'});
return parts
}

//== applyWorldBook ==//
function applyWorldBook(cfg,msgs){
if(cfg.worldBook===false)return cfg;
const last=msgs[msgs.length-1];
if(!last?.content)return cfg;
const text=last.content.toLowerCase();
const nc=JSON.parse(JSON.stringify(cfg));
materials.charOrder.forEach(name=>{
const c=materials.chars[name];
const st=getCSt(nc,name);
if(st==='spotlight'||st==='appear')return;
if(nc.hidden?.includes(name))return;
const allKw=[];
if(name.length>=2)allKw.push(name.toLowerCase());
(c.keywords||[]).forEach(k=>{if(k)allKw.push(k.toLowerCase())});
if(!allKw.length)return;
if(allKw.some(kw=>text.includes(kw))){
['mention','absent'].forEach(s=>{nc[s]=(nc[s]||[]).filter(n=>n!==name)});
if(!nc.appear)nc.appear=[];
nc.appear.push(name)}});
Object.entries(materials.appKeywords||{}).forEach(([appName,kws])=>{
if(!kws?.length)return;
if(nc.apps?.[appName])return;
if(kws.some(kw=>text.includes(kw.toLowerCase()))){
if(!nc.apps)nc.apps={};
nc.apps[appName]=true}});
return nc}

//== getWBActivations ==//
function getWBActivations(msgs){
const last=msgs?.[msgs.length-1];
if(!last?.content)return'';
const text=last.content.toLowerCase();
const act=[];
materials.charOrder.forEach(name=>{
const c=materials.chars[name];
const allKw=[];
if(name.length>=2)allKw.push(name.toLowerCase());
(c.keywords||[]).forEach(k=>{if(k)allKw.push(k.toLowerCase())});
if(allKw.some(kw=>text.includes(kw)))act.push('c:'+name)});
Object.entries(materials.appKeywords||{}).forEach(([appName,kws])=>{
if(kws?.some(kw=>text.includes(kw.toLowerCase())))act.push('a:'+appName)});
return act.sort().join(',')}

const am=[];

const sysItems=[],nonItems0=[];
items.forEach(x=>{const m=x.msg;if(fgMuted.has(m.id)||m.muted)return;if(m.role==='system')sysItems.push(x);else nonItems0.push(x)});
let nonItems=[...nonItems0],reasonA=[];

let maxInputTr=0;
if(ep.maxInput&&ep.maxInput>0){
const ft=cntTok(sp)+dpA.reduce((s,a)=>s+cntTok(a.content),0)+sysItems.reduce((s,x)=>s+cntTok(x.msg.content),0)+fgInfo.summaryTok;
const bg=ep.maxInput-ft;
if(bg>0){let u=0;const inc=[];for(let i=nonItems.length-1;i>=0;i--){const m=nonItems[i].msg;const mt=cntTok(m.content);if(u+mt>bg)break;u+=mt;inc.unshift(nonItems[i])}maxInputTr=nonItems.length-inc.length;nonItems=inc;if(maxInputTr>0)reasonA.push('最大输入 token 限制')}
}
const incSet=new Set(nonItems.map(x=>x.msg.id));
const mL=[];

const m=x.msg,sm=fgSum[m.id];
if(sm)mL.push({role:'system',content:sm.content});

else{const ct=ep.parseContentTags&&m.role==='assistant'?stripContentTags(m.content):m.content;mL.push({role:m.role,content:ct})}
}
});
const totalNonSys=nonItems0.length,includedNonSys=nonItems.length,truncatedCount=totalNonSys-includedNonSys;
if(maxInputTr>0&&ep.truncateHint)am.push({role:'system',content:`[已省略${maxInputTr}条较早记录]`});
dpA.sort((a,b)=>b.depth-a.depth);
dpA.forEach(a=>{const idx=Math.max(0,mL.length-a.depth);mL.splice(idx,0,{role:'system',content:`[附录:${a.name}]\n${a.content}`})});
am.push(...mL);
am.forEach(m=>{if(typeof m.content==='string')m.content=stripZW(m.content)});
const apiMsgs=ep.mergeSameRole!==false?mergeApiTurns(am):am;

let prevIdx=null;if(startIdx!==null){const prev=nonItems0.filter(x=>x.idx<startIdx).pop();prevIdx=prev?prev.idx:null}
const matTok=cntTok(sp),storyTok=cntTok(storyText),tempTok=(conv.tempAppendices||[]).filter(t=>t.enabled).reduce((s,t)=>s+cntTok(t.content),0),foldTok=fgInfo.summaryTok;
const sysTok=sysItems.reduce((s,x)=>s+cntTok(x.msg.content),0);
const ctxTok=nonItems.reduce((s,x)=>{const m=x.msg;const ct=ep.parseContentTags&&m.role==='assistant'?stripContentTags(m.content):m.content;return s+cntTok(ct)},0);
const totalTok=apiMsgs.reduce((s,m)=>s+cntTok(m.content),0);
return{apiMsgs,matText:sp,storyText,matTok,storyTok,tempTok,foldTok,sysTok,ctxTok,inputTok,totalTok,totalNonSys,includedNonSys,startIdx,endIdx,prevIdx,truncatedCount,reason:reasonA.join(' + '),hasCut:truncatedCount>0}
}

//== mergeApiTurns ==//
function mergeApiTurns(msgs){
const out=[];
const sep='\n\n[消息分隔]\n\n';
(msgs||[]).forEach(m=>{
if(!m)return;
const role=m.role||'user';
const content=m.content||'';
const hasImg=Array.isArray(content);
const last=out[out.length-1];
if(!hasImg&&(role==='user'||role==='assistant')&&last&&last.role===role&&!Array.isArray(last.content)){
if(typeof last.content==='string')last.content=last.content+sep+content;
else last.content=content;
}else{
out.push({role,content})
}});
return out
}
