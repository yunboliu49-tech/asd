async function renameGroup(gid){
  if(gid==='_default'){toast('不能改默认组');return}
  const g=groups.find(g=>g.id===gid);
  if(!g)return;

  const raw=prompt('新名称：',g.name);
  const newName=raw?.trim();
  if(!newName||newName===g.name)return;

  await withResourceLock('groups',async()=>{
    const h=folderH,gen=_folderLoadGen,guard=()=>folderH===h&&isFolderLoadCurrent(gen);
    const groupSnapshot=syncClone(groups);
    const oldDir=getGrpDir(gid),newDir=g.dir||sanitizeDir(newName);
    const clash=groups.find(x=>x.id!==gid&&getGrpDir(x.id)===newDir);
    if(clash){
      toast('❌ 该名称会与分组「'+clash.name+'」使用同一目录，请换一个名称');
      return
    }

    if(oldDir===newDir){
      const configSnap=captureConfigEditSnapshot();
      g.name=newName;
      if(!await saveConfigEditOrRollback(configSnap,{rootHandle:h,guard,render:renderConvList,failMsg:'⚠️ 分组名称保存失败，已回滚'}))return;
      renderConvList();
      toast('仅更新显示名称，文件目录未变');
      return
    }

    if(!h){
      const configSnap=captureConfigEditSnapshot();
      g.name=newName;
      g.dir=newDir;
      if(!await saveConfigEditOrRollback(configSnap,{render:renderConvList,failMsg:'⚠️ 分组名称保存失败，已回滚'}))return;
      renderConvList();
      return
    }

    const oldName=g.name,oldDirProp=g.dir;
    let copiedFiles=[],cleanupLeftovers=false;
    try{
      if(!guard())throw new Error('已切换工作文件夹，改名已取消');
      const cd=await h.getDirectoryHandle('conversations',{create:true});
      const src=await cd.getDirectoryHandle(oldDir);
      let dst=null;
      try{
        dst=await cd.getDirectoryHandle(newDir);
        let occupied=false;
        for await(const en of dst.values()){
          occupied=true;
          break
        }
        if(occupied){
          toast('❌ 目标目录已存在文件，为避免覆盖已中止改名');
          return
        }
      }catch(e){
        if(e.name!=='NotFoundError')throw e;
        dst=await cd.getDirectoryHandle(newDir,{create:true})
      }

      const files=[];
      for await(const en of src.values()){
        if(en.kind==='file')files.push(en)
      }
      for(const en of files){
        if(!guard())throw new Error('已切换工作文件夹，改名已取消');
const ct=await(await en.getFile()).text();
const nf=await dst.getFileHandle(en.name,{create:true});
await writeHandleVerified(nf,ct,'复制: '+en.name,guard);
copiedFiles.push(en.name)
      }

      const affected=convList
        .filter(c=>(c._dir||getGrpDir(c.groupId||'_default'))===oldDir)
        .map(c=>({id:c.id,fn:c._fn,wasInDomain:syncInDomain(c)}));

      g.name=newName;
      g.dir=newDir;
      affected.forEach(x=>{
        const m=convList.find(c=>c.id===x.id);
        if(m)m._dir=newDir
      });
      _dirHandleCache={};

      for(const x of affected){
        if(!guard())throw new Error('已切换工作文件夹，改名已取消');
        const c=await loadConvFull(x.id,{rootHandle:h,guard,generation:gen});
        if(c){
          const saved=await saveConvF(c,{rootHandle:h,guard,generation:gen});
          if(!saved)throw new Error('保存对话索引失败: '+x.id)
        }
      }

      const cfgSaved=await saveCfg(h,guard);
      if(!cfgSaved)throw new Error('配置保存失败');
      const idxSaved=await saveIndex({rootHandle:h,guard});
      if(!idxSaved)throw new Error('索引保存失败');

      if(!guard())throw new Error('已切换工作文件夹，旧目录清理已取消');
      for(const fn of copiedFiles){
        try{await src.removeEntry(fn)}
        catch(e){cleanupLeftovers=true}
      }
      try{
        let hasAny=false;
        for await(const en of src.values()){
          hasAny=true;
          break
        }
        if(hasAny)cleanupLeftovers=true;
        else await cd.removeEntry(oldDir)
      }catch(e){
        if(e.name!=='NotFoundError')cleanupLeftovers=true
      }

      affected.forEach(x=>{
        if(guard()&&syncHasConfig()&&x.wasInDomain&&x.fn){
           syncMarkDelete('conversations/'+oldDir+'/'+x.fn,'sync: group rename',{expectedSha:syncMeta.fileSHAs['conversations/'+oldDir+'/'+x.fn]||null,expectedId:x.id})
        }
      });
      renderConvList();
      toast('分组已安全改名');
      if(cleanupLeftovers){
        setTimeout(()=>showIndexMaintenanceAfterOrphans('分组已改名；旧目录仍有未清理文件或子目录，已保留为安全副本。'),100)
      }
    }catch(e){
      g.name=oldName;
      g.dir=oldDirProp;
      convList.forEach(c=>{
        if(c._dir===newDir)c._dir=oldDir
      });
      _dirHandleCache={};
      toast('⚠️ 改名中止，旧目录未删除；如看到重复文件可运行索引维护: '+(e.message||e.name))
    }
  })
}

//== doDeleteGroup ==//
async function doDeleteGroup(gid,withConvs,dirName){
  await withResourceLock('groups',async()=>{
    const h=folderH,gen=_folderLoadGen,guard=()=>folderH===h&&isFolderLoadCurrent(gen);
    const groupSnapshot=syncClone(groups);
    const gc=convList.filter(c=>(c.groupId||'_default')===gid);
    let failed=0;

    if(withConvs){
      for(const c of gc){
        if(!guard()){failed++;break}
        const ok2=await moveToTrash(c.id,{rootHandle:h,guard,generation:gen});
        if(!ok2)failed++
      }
    }else{
      for(const c of gc){
        if(!guard()){failed++;break}
        try{
          const ok2=await moveConvToGrp(c.id,'_default',{rootHandle:h,guard,generation:gen});
          if(!ok2)failed++
        }catch(e){
          failed++
        }
      }
    }

    if(failed>0||!guard()){
      toast('⚠️ 有 '+failed+' 个对话移动失败，已中止删除分组目录（数据保留）');
      renderConvList();
      return
    }

    let keepGroupForOrphans=false;
    if(h&&guard()){
      try{
        const cd=await h.getDirectoryHandle('conversations');
        if(!guard())throw new Error('已切换工作文件夹');
        const dir=await cd.getDirectoryHandle(dirName);
        let hasAny=false;
        for await(const en of dir.values()){
          hasAny=true;
          break
        }
        if(hasAny)keepGroupForOrphans=true;
        else await cd.removeEntry(dirName)
      }catch(e){
        if(e.name!=='NotFoundError'){
          keepGroupForOrphans=true;
          toast('⚠️ 旧目录检查/删除失败，分组记录已保留: '+e.name)
        }
      }
    }

    if(!keepGroupForOrphans)groups=groups.filter(g2=>g2.id!==gid);
    _dirHandleCache={};
    const cfgSaved=await saveCfg(h,guard);
    const indexSaved=cfgSaved&&await saveIndex({rootHandle:h,guard});
    if(!cfgSaved||!indexSaved){
      groups=groupSnapshot;
      const rollbackSaved=cfgSaved?await saveCfg(h,guard):saveLocal();
      if(!rollbackSaved)syncTrace('group.delete.rollbackConfigFailed',{groupId:gid});
      renderConvList();
      toast(rollbackSaved?'⚠️ 分组数据已安全移动，但配置或索引提交失败；分组记录暂未确认删除':'❌ 分组索引提交失败，且分组配置回滚保存失败；请不要关闭页面并检查工作文件夹');
      return
    }
    renderConvList();

    if(curConvId&&!convList.find(c=>c.id===curConvId)){
      curConv=null;
      curConvId=null;
      if(convList.length>0)await selectConv(convList[0].id);
      else renderMsgs()
    }

    ok();
    if(keepGroupForOrphans){
      showIndexMaintenanceAfterOrphans('已处理索引中的对话；旧目录仍有未索引文件，分组记录和目录已保留。')
    }
  })
}

//== areConvsIdentical ==//
function areConvsIdentical(a,b){const ma=a.messages||[],mb=b.messages||[];if(ma.length!==mb.length)return false;for(let i=0;i<ma.length;i++){if(ma[i].role!==mb[i].role||ma[i].content!==mb[i].content)return false}return true}

//== convMsgSig ==//
function convMsgSig(msg){
let s=msg.role+'\u0001'+(msg.content||'');
if(msg.images&&msg.images.length){s+='\u0002img:'+msg.images.map(im=>(im.base64?im.base64.length:0)+'x'+(im.width||0)+'x'+(im.height||0)+(im.mimeType||'')).join(',')}
return s}
function convMsgRichSig(msg){return[convMsgSig(msg),msg.reasoning||'',msg.reasoningDuration||0,msg.model||'',msg.apiName||'',msg.muted?'1':'0'].join('\\u0004')}

function syncMessagesSameIdentity(a,b){
if(!a||!b)return false;
if(a.id&&b.id)return a.id===b.id&&convMsgSig(a)===convMsgSig(b);
return convMsgSig(a)===convMsgSig(b)
}
function syncConvMessageRelation(a,b){
const ma=a?.messages||[],mb=b?.messages||[],la=ma.length,lb=mb.length,ml=Math.min(la,lb);
let common=0;
for(let i=0;i<ml;i++){if(syncMessagesSameIdentity(ma[i],mb[i]))common++;else break}
if(common===la&&common===lb)return{type:'identical',common};
if(common===la&&lb>la)return{type:'superset',common};
if(common===lb&&la>lb)return{type:'subset',common};
if(common>0)return{type:'diverged',common};
return{type:'different',common}
}
function syncConvIdentityList(conv){return(conv?.messages||[]).map(m=>(m?.id?('id:'+m.id):'legacy')+'#'+convMsgSig(m||{}))}

//== convSigList ==//
function convSigList(conv){return(conv.messages||[]).map(convMsgSig)}
function convRichSigList(conv){return(conv.messages||[]).map(convMsgRichSig)}

//== cmpConvsByContent ==//
function cmpConvsByContent(sa,sb){
const la=sa.length,lb=sb.length,ml=Math.min(la,lb);
let common=0;
for(let i=0;i<ml;i++){if(sa[i]===sb[i])common++;else break}
if(common===la&&common===lb)return{type:'identical',common};
if(common===la&&lb>la)return{type:'superset',common};
if(common===lb&&la>lb)return{type:'subset',common};
if(common>0)return{type:'diverged',common};
return{type:'different',common}}

//== chooseBestKeep ==//
function chooseBestKeep(items){
let best=items[0];
items.forEach(it=>{
if(it===best)return;
const a=it.meta,b=best.meta;
const aCur=a.id===curConvId,bCur=b.id===curConvId;
if(aCur!==bCur){if(aCur)best=it;return}
if(!!a.pinned!==!!b.pinned){if(a.pinned)best=it;return}
const aLen=a.msgCount||0,bLen=b.msgCount||0;
if(aLen!==bLen){if(aLen>bLen)best=it;return}
const at=new Date(a.updatedAt||0).getTime(),bt=new Date(b.updatedAt||0).getTime();
if(at!==bt){if(at>bt)best=it;return}
});
return best}

//== showDupCheck ==//
async function showDupCheck(){
if(!folderH){toast('请先选择文件夹');return}
showMo('🔍 内容去重','<div style="text-align:center;padding:20px"><div id="dupStatus">加载对话...</div><div class="prog-bar"><div class="prog-fill" id="dupProgFill" style="width:0%"></div></div><div class="prog-text" id="dupProgText">0%</div></div>','');
await new Promise(r=>setTimeout(r,30));
const dupUpd=(txt,pct)=>{const s=document.getElementById('dupStatus'),f=document.getElementById('dupProgFill'),t=document.getElementById('dupProgText');if(s)s.textContent=txt;if(f)f.style.width=pct+'%';if(t)t.textContent=Math.round(pct)+'%'};
const dupCandidates=convList.filter(c=>!isConflictVaultConv(c)&&!c.deletedAt);
const total=dupCandidates.length;
if(total<2){showMo('🔍 内容去重','<div style="text-align:center;padding:30px;color:var(--tx-m)">对话太少，无需查重</div>',`<button class="mo-btn pri" onclick="hideMo()">关闭</button>`,'compact');return}
const recs=[];
for(let i=0;i<total;i++){
const meta=dupCandidates[i];
const full=meta.id===curConvId&&curConv?curConv:await loadConvFull(meta.id);
if(full){const sig=convRichSigList(full);recs.push({meta,sig,len:sig.length,fullKey:sig.join('\u0003')})}
if(i%5===0||i===total-1){dupUpd(`加载对话 ${i+1}/${total}...`,Math.round((i+1)/total*45));await new Promise(r=>setTimeout(r,0))}
}
const valid=recs.filter(r=>r.len>0);
dupUpd('归并完全重复...',50);await new Promise(r=>setTimeout(r,0));
// 1. 完全重复：按 fullKey 分桶
const exactBuckets={};
valid.forEach(r=>{if(!exactBuckets[r.fullKey])exactBuckets[r.fullKey]=[];exactBuckets[r.fullKey].push(r)});
const exactGroups=[];const consumed=new Set();
Object.values(exactBuckets).forEach(arr=>{if(arr.length>=2){exactGroups.push(arr.map(r=>({meta:r.meta,rec:r})));arr.forEach(r=>consumed.add(r.meta.id))}});
// 2. 子集重复：剩余对话里，A 是 B 的完整前缀
dupUpd('检测子集重复...',62);await new Promise(r=>setTimeout(r,0));
const remain=valid.filter(r=>!consumed.has(r.meta.id));
// 用首条签名分桶，缩小比较范围
const firstBuckets={};
remain.forEach(r=>{const k=r.sig[0];if(!firstBuckets[k])firstBuckets[k]=[];firstBuckets[k].push(r)});
const subsetGroups=[];const inSubset=new Set();
Object.values(firstBuckets).forEach(arr=>{
if(arr.length<2)return;
arr.sort((a,b)=>b.len-a.len);
for(let i=0;i<arr.length;i++){
const a=arr[i];if(inSubset.has(a.meta.id))continue;
const grp=[a];
for(let j=i+1;j<arr.length;j++){
const b=arr[j];if(inSubset.has(b.meta.id))continue;
// b 更短，判断 b 是否为 a 的前缀
let pref=true;for(let k=0;k<b.len;k++){if(b.sig[k]!==a.sig[k]){pref=false;break}}
if(pref&&b.len<a.len)grp.push(b)
}
if(grp.length>=2){grp.forEach(r=>inSubset.add(r.meta.id));subsetGroups.push(grp.map(r=>({meta:r.meta,rec:r})))}
}});
// 3. 疑似分支：剩余里有共同前缀但分叉
dupUpd('检测疑似分支...',76);await new Promise(r=>setTimeout(r,0));
const rem2=remain.filter(r=>!inSubset.has(r.meta.id));
const branchGroups=[];const inBranch=new Set();
Object.values(firstBuckets).forEach(arr0=>{
const arr=arr0.filter(r=>!inSubset.has(r.meta.id)&&!consumed.has(r.meta.id));
if(arr.length<2)return;
for(let i=0;i<arr.length;i++){
const a=arr[i];if(inBranch.has(a.meta.id))continue;
const grp=[a];
for(let j=i+1;j<arr.length;j++){
const b=arr[j];if(inBranch.has(b.meta.id))continue;
const r=cmpConvsByContent(a.sig,b.sig);
if(r.type==='diverged'){
const minLen=Math.min(a.len,b.len);
if(r.common>=3||(r.common>=2&&r.common/minLen>=0.5))grp.push(b)
}
}
if(grp.length>=2){grp.forEach(r=>inBranch.add(r.meta.id));branchGroups.push(grp.map(r=>({meta:r.meta,rec:r,common:0})))}
}});
dupUpd('生成结果...',92);await new Promise(r=>setTimeout(r,0));
if(!exactGroups.length&&!subsetGroups.length&&!branchGroups.length){showMo('🔍 内容去重','<div style="text-align:center;padding:30px;color:var(--ok)">✅ 没有发现重复或可合并的对话</div>',`<button class="mo-btn pri" onclick="hideMo()">关闭</button>`,'compact');return}
// 给每组算默认保留
const mkGroup=(items,type)=>{const keep=chooseBestKeep(items);return{type,items,keepId:keep.meta.id}};
const safeGroups=[...exactGroups.map(g=>mkGroup(g,'exact')),...subsetGroups.map(g=>mkGroup(g,'subset'))];
const brGroups=branchGroups.map(g=>mkGroup(g,'branch'));
window._dupSafe=safeGroups;window._dupBranch=brGroups;
const grpName=gid=>groups.find(gr=>gr.id===(gid||'_default'))?.name||'默认';
const safeDelCount=safeGroups.reduce((s,g)=>s+g.items.length-1,0);
let html='';
html+=`<div style="margin-bottom:10px;font-size:12px;color:var(--tx-m)">忽略标题，按消息内容比对。完全重复和子集重复可安全清理；疑似分支需手动判断。</div>`;
if(safeGroups.length){
html+=`<div style="font-weight:700;font-size:14px;margin:8px 0;color:var(--ok)">✅ 可安全清理 (${safeGroups.length}组，删${safeDelCount}个)</div>`;
safeGroups.forEach((g,gi)=>{
const tag=g.type==='exact'?'完全重复':'子集重复';
const cnt=g.items[0].rec?.len||g.items[0].meta.msgCount||0;
html+=`<div style="margin-bottom:10px;padding:10px;background:var(--bg-t);border-radius:var(--r);border-left:3px solid var(--ok)"><div style="font-weight:600;margin-bottom:6px;font-size:13px">${tag} · ${g.items.length}份</div>`;
g.items.sort((a,b)=>(b.meta.msgCount||0)-(a.meta.msgCount||0));
g.items.forEach(item=>{
const checked=item.meta.id===g.keepId;
const gName=grpName(item.meta.groupId);
const date=item.meta.updatedAt?new Date(item.meta.updatedAt).toLocaleDateString('zh-CN'):'';
html+=`<label style="display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:var(--r);cursor:pointer;margin-bottom:3px;${checked?'background:var(--ok-soft);border:1px solid var(--ok)':'background:var(--bg-s)'}"><input type="radio" name="dupsafe_${gi}" value="${item.meta.id}" ${checked?'checked':''} style="width:16px;height:16px;accent-color:var(--ok)"><div style="flex:1;min-width:0"><div style="font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${item.meta.id===curConvId?'📍 ':''}${item.meta.pinned?'⭐ ':''}${esc(item.meta.name)}</div><div style="font-size:10px;color:var(--tx-m)">${esc(gName)} · ${item.meta.msgCount||0}条 · ${date}</div></div></label>`});
html+=`<div style="font-size:10px;color:var(--tx-m);margin-top:2px">◎ 选中=保留，其余移至回收站</div></div>`});
}
if(brGroups.length){
html+=`<div style="font-weight:700;font-size:14px;margin:14px 0 8px;color:var(--wn)">⚠️ 疑似分支 (${brGroups.length}组，默认不处理)</div>`;

brGroups.forEach((g,gi)=>{

g.items.sort((a,b)=>(b.meta.msgCount||0)-(a.meta.msgCount||0));

}

//== saveWorkspace ==//
function saveWorkspace(now){
clearTimeout(_wsSaveTimer);
_wsSaveTimer=null;
const h=folderH,gen=_folderLoadGen,guard=()=>folderH===h&&isFolderLoadCurrent(gen);
const pending={rootHandle:h,generation:gen,guard};
_wsSavePending=pending;
const fn=async()=>{
if(_wsSavePending!==pending)return false;
_wsSavePending=null;_wsSaveTimer=null;
if(!guard())return false;
return await saveCfg(h,guard)
};
if(now)return fn();
_wsSaveTimer=setTimeout(()=>{fn().catch(e=>{_syncLastError='工作台配置保存失败: '+(e.message||e.name);syncTrace('workspace.save.error',{error:e.message||e.name})})},600)
}
async function flushWorkspaceSave(){
if(!_wsSavePending)return true;
clearTimeout(_wsSaveTimer);_wsSaveTimer=null;
const pending=_wsSavePending;_wsSavePending=null;
if(!pending.guard())return false;
return await saveCfg(pending.rootHandle,pending.guard)
}

//== touchWorkspace ==//
function touchWorkspace(id,source){
if(!id)return;
if(!workspace.items)workspace.items=[];
const now=new Date().toISOString();
let it=getWSItem(id);
if(!it){const maxO=workspace.items.reduce((m,x)=>Math.max(m,x.order??0),-1);it={id,mode:source==='manual'?'manual':'auto',addedAt:now,lastUsedAt:now,order:maxO+1};workspace.items.push(it)}
else{it.lastUsedAt=now;if(source==='workspace'&&it.mode==='auto')it.mode='active';if(source==='manual')it.mode='manual'}
saveWorkspace(false);
if(_wsPopOpen)renderWorkspacePop();
updateConvListActive()
}

//== cleanupWorkspace ==//
function cleanupWorkspace(doSave){
if(!workspace.items)return;
const now=Date.now();let changed=false;
const hasConv=id=>!folderH||!convList.length||convList.some(c=>c.id===id);
workspace.items=workspace.items.filter(it=>{
if(!hasConv(it.id)){changed=true;return false}
if(pendReqs[it.id]?.some(r=>r.status==='generating')){it.lastUsedAt=new Date().toISOString();return true}
const last=new Date(it.lastUsedAt||it.addedAt||0).getTime()||0;
if(it.mode==='auto'&&now-last>workspace.autoHours*3600*1000){changed=true;return false}
if(it.mode==='active'&&now-last>workspace.activeHours*3600*1000){changed=true;return false}
return true});
workspace.items.sort((a,b)=>(a.order??0)-(b.order??0)).forEach((it,i)=>it.order=i);
workspace.lastCleanAt=now;
if(changed&&doSave!==false)saveWorkspace(true);
return changed
}

//== cleanEmptyGroups ==//
async function cleanEmptyGroups(){
  const h=folderH,gen=_folderLoadGen,guard=()=>folderH===h&&isFolderLoadCurrent(gen);
  const counts={};
  convList.forEach(c=>{
    const g=c.groupId||'_default';
    counts[g]=(counts[g]||0)+1
  });
  const empties=groups.filter(g=>g.id!=='_default'&&!(counts[g.id]||0));
  if(!empties.length){toast('没有空组');return}
  if(!confirm('将删除 '+empties.length+' 个空分组？'))return;

  const groupSnapshot=syncClone(groups);
  const removedIds=new Set();
  let skipped=0;
  for(const g of empties){
    if(h&&!guard()){
      toast('⚠️ 已切换工作文件夹，清理空组已停止');
      break
    }
    const dirName=getGrpDir(g.id);
    if(h&&guard()){
      try{
        const cd=await h.getDirectoryHandle('conversations');
        const dir=await cd.getDirectoryHandle(dirName);
        let hasAny=false;
        for await(const en of dir.values()){
          hasAny=true;
          break
        }
        if(hasAny){skipped++;continue}
        await cd.removeEntry(dirName)
      }catch(e){
        if(e.name!=='NotFoundError'){skipped++;continue}
      }
    }
    removedIds.add(g.id)
  }

  groups=groups.filter(g=>!removedIds.has(g.id));
  _dirHandleCache={};
  const cfgSaved=await saveCfg(h,guard);
  if(!cfgSaved){
    groups=groupSnapshot;
    saveLocal();
    renderConvList();
    toast('⚠️ 空分组配置保存失败，分组列表已回滚；已删除的空目录会在后续使用时自动重建');
    return
  }
  renderConvList();
  hideMo();
  if(skipped)setTimeout(()=>showIndexMaintenanceAfterOrphans('有 '+skipped+' 个空分组目录实际不为空，已跳过删除。'),100);
  else setTimeout(showGroupManager,100);
  toast('✓ 已清理 '+removedIds.size+' 个空组'+(skipped?'，跳过 '+skipped+' 个非空目录':''))
}

//== setupWorkspaceSwipe ==//
function setupWorkspaceSwipe(container){
if(!container||!isMobile)return;
container.querySelectorAll('.ws-swipe').forEach(w=>{
let sx=0,sy=0,dx=0,dy=0,swiping=false,moved=false;
const main=w.querySelector('.ws-swipe-main');
w.addEventListener('touchstart',e=>{
const t=e.touches[0];sx=t.clientX;sy=t.clientY;dx=0;dy=0;swiping=false;moved=false;
if(_wsSwipeOpenId&&_wsSwipeOpenId!==w.dataset.id){_wsSwipeOpenId=null;container.querySelectorAll('.ws-swipe.open').forEach(x=>x.classList.remove('open'))}
},{passive:true});
w.addEventListener('touchmove',e=>{
const t=e.touches[0];dx=t.clientX-sx;dy=t.clientY-sy;
if(!swiping&&Math.abs(dx)>18&&Math.abs(dx)>Math.abs(dy)*1.4)swiping=true;
if(!swiping)return;
moved=true;e.preventDefault();
const base=w.classList.contains('open')?-64:0;
let x=Math.max(-72,Math.min(0,base+dx));
if(main)main.style.transform='translateX('+x+'px)'
},{passive:false});
w.addEventListener('touchend',()=>{
if(!swiping){if(_wsSwipeOpenId&&Math.abs(dx)<6&&Math.abs(dy)<6){_wsSwipeOpenId=null;container.querySelectorAll('.ws-swipe.open').forEach(x=>x.classList.remove('open'))}return}
if(main)main.style.transform='';
if(dx<-35){container.querySelectorAll('.ws-swipe.open').forEach(x=>{if(x!==w)x.classList.remove('open')});w.classList.add('open');_wsSwipeOpenId=w.dataset.id}
else if(dx>25){w.classList.remove('open');if(_wsSwipeOpenId===w.dataset.id)_wsSwipeOpenId=null}
else{w.classList.toggle('open',_wsSwipeOpenId===w.dataset.id)}
if(moved){_wsSwipeMoved=true;setTimeout(()=>{_wsSwipeMoved=false},350)}
},{passive:true})
})
}

//== mdFmt ==//
function mdFmt(s){
if(!s)return'';
const slots=[];
let work=s;
if(uiSettings.enableKatex){
work=work.replace(/\\\[([\s\S]*?)\\\]/g,function(m,tex){return '$$'+tex+'$$'});
work=work.replace(/\\\(([^\n]*?)\\\)/g,function(m,tex){return '$'+tex+'$'});
}
const fence='`'.repeat(3);
const cbRx=new RegExp('(^|\\n)[ \\t]*'+fence+'([^\\r\\n`]*)\\r?\\n([\\s\\S]*?)\\n[ \\t]*'+fence+'[ \\t]*(?=\\n|$)','g');
work=work.replace(cbRx,function(m,p1,lang,code){
const id=slots.length;
slots.push({html:'<pre style="position:relative"><code>'+esc(code)+'</code><button class="pre-cp" onclick="copyPre(this)"><span class="cp-icon">📋</span><span class="cp-text">复制</span></button></pre>'});
return p1+'\uE000'+id+'\uE001'
});
if(uiSettings.enableKatex&&window.katex){
work=work.replace(/(?<!\$)\$\$([\s\S]+?)\$\$(?!\$)/g,function(m,tex){
if(!tex.trim())return m;
const id=slots.length;
let html=null;
html=katexCached(tex,true);
slots.push({html:html||('<div class="fallback-block">'+esc(m)+'</div>')});
return '\uE000'+id+'\uE001'
})
}
work=work.replace(/``([^\r\n]+?)``/g,function(m,code){
const id=slots.length;
slots.push({html:'<code>'+esc(code.replace(/^ | $/g,''))+'</code>'});
return '\uE000'+id+'\uE001'
});
work=work.replace(/`([^`\r\n]+)`/g,function(m,code){
const id=slots.length;
slots.push({html:'<code>'+esc(code)+'</code>'});
return '\uE000'+id+'\uE001'
});
if(uiSettings.enableKatex&&window.katex){
work=work.replace(/\$([^\$\n]{1,200}?)\$/g,function(m,tex){
if(!tex.trim())return m;
const id=slots.length;
let html=null;
html=katexCached(tex,false);
slots.push({html:html||('<span class="fallback-inline">'+esc(m)+'</span>')});
return '\uE000'+id+'\uE001'
})
}
work=work.replace(/(\n|^)([ \t]*\|[^\n]+\|[ \t]*\n[ \t]*\|[ \t]*:?-+:?[ \t]*(?:\|[ \t]*:?-+:?[ \t]*)*\|[ \t]*\n(?:[ \t]*\|[^\n]+\|[ \t]*(?:\n|$))+)/g,function(m,prefix,block){
const lines=block.split('\n').filter(l=>l.trim());
if(lines.length<3)return m;
const parseCells=line=>{
let s=line.trim();
if(s.startsWith('|'))s=s.substring(1);
if(s.endsWith('|'))s=s.substring(0,s.length-1);
return s.split(/(?<!\\)\|/).map(c=>c.trim().replace(/\\\|/g,'|'));
};
const sepCells=parseCells(lines[1]);
if(!sepCells.length||!sepCells.every(c=>/^:?-+:?$/.test(c)))return m;
const headers=parseCells(lines[0]);
if(headers.length!==sepCells.length)return m;
const aligns=sepCells.map(c=>{
const l=c.startsWith(':'),r=c.endsWith(':');
if(l&&r)return 'center';
if(r)return 'right';
if(l)return 'left';
return null;
});
const rows=[];
for(let i=2;i<lines.length;i++){
const cells=parseCells(lines[i]);
while(cells.length<headers.length)cells.push('');
if(cells.length>headers.length)cells.length=headers.length;
rows.push(cells);
}
if(!rows.length)return m;
const renderCell=txt=>{
const parts=txt.split(/(\uE000\d+\uE001)/g);
return parts.map(p=>{
const mt=p.match(/^\uE000(\d+)\uE001$/);
if(mt)return slots[parseInt(mt[1])]?.html||'';
let r=esc(p);
r=r.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');
r=r.replace(/(?<!\*)\*([^*\n]+)\*(?!\*)/g,'<em>$1</em>');
return r;
}).join('');
};
let html='<div style="overflow-x:auto;margin:6px 0;-webkit-overflow-scrolling:touch"><table style="border-collapse:collapse;font-size:13px"><thead><tr>';
headers.forEach((h,i)=>{
const align=aligns[i]?' style="border:1px solid var(--bd);padding:6px 10px;font-weight:600;background:var(--bg-t);text-align:'+aligns[i]+'"':' style="border:1px solid var(--bd);padding:6px 10px;font-weight:600;background:var(--bg-t)"';
html+='<th'+align+'>'+renderCell(h)+'</th>';
});
html+='</tr></thead><tbody>';
rows.forEach((row,ri)=>{
html+='<tr'+(ri%2?' style="background:rgba(128,128,128,.06)"':'')+'>';
row.forEach((c,ci)=>{
const align=aligns[ci]?' style="border:1px solid var(--bd);padding:6px 10px;text-align:'+aligns[ci]+'"':' style="border:1px solid var(--bd);padding:6px 10px"';
html+='<td'+align+'>'+renderCell(c)+'</td>';
});
html+='</tr>';
});
html+='</tbody></table></div>';
const id=slots.length;
slots.push({html});
return prefix+'\uE000'+id+'\uE001\n';
});
work=esc(work);
work=work.replace(/^[ \t]*(\*{3,}|-{3,}|_{3,})[ \t]*$/gm,'<hr style="border:none;border-top:1px solid var(--bd);margin:8px 0">');
work=work.replace(/^(#{1,6})\s+(.+)$/gm,function(m,h,t){
const lv=h.length,sizes=['1.25em','1.15em','1.05em','1em','0.95em','0.9em'];
return '<div style="font-weight:700;font-size:'+sizes[lv-1]+';margin:2px 0 1px">'+t+'</div>'
});
work=work.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');
work=work.replace(/(?<!\*)\*([^*\n]+)\*(?!\*)/g,'<em>$1</em>');
work=work.replace(/\n/g,'<br>');
work=work.replace(/\uE000(\d+)\uE001/g,function(m,id){return slots[parseInt(id)].html});
return work
}

//== renderMd ==//
function renderMd(t,parseContentTags,msgId){
if(!t)return'';
if(parseContentTags===false)return mdFmt(t);
const tags=params.contentTags||['think','thinking'];
const forbidden=[];
const fence='`'.repeat(3);
const cbRx=new RegExp('(^|\\n)[ \\t]*'+fence+'[^\\r\\n`]*\\r?\\n[\\s\\S]*?\\n[ \\t]*'+fence+'[ \\t]*(?=\\n|$)','g');
let m;
while((m=cbRx.exec(t))!==null){forbidden.push([m.index,m.index+m[0].length])}
const dbRx=/``[^\r\n]+?``/g;
while((m=dbRx.exec(t))!==null){const idx=m.index;if(!forbidden.some(r=>idx>=r[0]&&idx<r[1]))forbidden.push([idx,idx+m[0].length])}
const sbRx=/`[^`\r\n]+`/g;
while((m=sbRx.exec(t))!==null){const idx=m.index;if(!forbidden.some(r=>idx>=r[0]&&idx<r[1]))forbidden.push([idx,idx+m[0].length])}
const inFb=p=>forbidden.some(r=>p>=r[0]&&p<r[1]);
const findOutside=(needle,from)=>{let f=from;while(f<t.length){const idx=t.indexOf(needle,f);if(idx===-1)return -1;if(!inFb(idx))return idx;f=idx+needle.length}return -1};
const parts=[];let cursor=0,ti=0;
while(cursor<t.length){
let earliest=-1,eTag='';
for(const tag of tags){const idx=findOutside('<'+tag+'>',cursor);if(idx!==-1&&(earliest===-1||idx<earliest)){earliest=idx;eTag=tag}}
if(earliest===-1){parts.push({type:'text',content:t.substring(cursor)});break}
if(earliest>cursor)parts.push({type:'text',content:t.substring(cursor,earliest)});
const oTag='<'+eTag+'>',cTag='</'+eTag+'>';
const cIdx=findOutside(cTag,earliest+oTag.length);
if(cIdx===-1){parts.push({type:'rsn',content:t.substring(earliest+oTag.length)});cursor=t.length}
else{parts.push({type:'rsn',content:t.substring(earliest+oTag.length,cIdx)});cursor=cIdx+cTag.length}
}
parts.forEach((p,pi)=>{
if(p.type==='rsn')p.content=p.content.replace(/^\s+/,'').replace(/\s+$/,'');
if(p.type==='text'){
if(parts[pi+1]?.type==='rsn'){if(!p.content.trim())p.content='';else p.content=p.content.replace(/[ \t\r\n]+$/,'')}
if(pi>0&&parts[pi-1].type==='rsn')p.content=p.content.replace(/^\s+/,'')
}
});
if(!parts.some(p=>p.type==='rsn'))return mdFmt(t);
let out='';
parts.forEach(p=>{
if(p.type==='rsn'){
const rsnId=msgId+'_t'+ti++;
const rsnExp=expandedRsn.has(rsnId);
out+='<div class="rsn-block"><div class="rsn-hdr" onclick="sp();tglRsn(\''+rsnId+'\')"><span class="arr'+(rsnExp?' open':'')+'" id="ra-'+rsnId+'">▶</span><span>🧠 (内嵌)</span><button class="mb" onclick="sp();copyRsn(\''+rsnId+'\')" style="margin-left:auto;font-size:10px">📋</button></div><div class="rsn-ct'+(rsnExp?' show':'')+'" id="rc-'+rsnId+'">'+esc(p.content)+'</div></div>'
}else{out+=mdFmt(p.content)}
});
return out
}

//== smartFoldPreviewText ==//
function previewIsEscapedAt(s,idx){let n=0;for(let i=idx-1;i>=0&&s[i]==='\\';i--)n++;return n%2===1}
function previewFindClose(s,from,close,limit,inline){for(let i=from;i<limit;i++){if(inline&&(s[i]==='\n'||s[i]==='\r'))return-2;if(s.startsWith(close,i)&&!previewIsEscapedAt(s,i))return i+close.length}return-1}
function previewOpenMathAtCut(s,cut,limit){let i=0;while(i<cut){if(s.startsWith('$$',i)&&!previewIsEscapedAt(s,i)){const e=previewFindClose(s,i+2,'$$',limit,false);if(e===-1||e>cut)return{start:i,end:e};i=e;continue}if(s[i]==='$'&&s[i+1]!=='$'&&!previewIsEscapedAt(s,i)){const e=previewFindClose(s,i+1,'$',limit,true);if(e===-2){i++;continue}if(e===-1||e>cut)return{start:i,end:e};if(e!==-1){i=e;continue}}if(s.startsWith('\\[',i)&&!previewIsEscapedAt(s,i)){const e=previewFindClose(s,i+2,'\\]',limit,false);if(e===-1||e>cut)return{start:i,end:e};i=e;continue}if(s.startsWith('\\(',i)&&!previewIsEscapedAt(s,i)){const e=previewFindClose(s,i+2,'\\)',limit,true);if(e===-2){i++;continue}if(e===-1||e>cut)return{start:i,end:e};if(e!==-1){i=e;continue}}i++}return null}
function smartFoldPreviewText(text,maxChars){
const s=text||'',base=Math.min(maxChars||0,s.length);
if(s.length<=base)return s.replace(/\n{2,}/g,'\n');
const look=Math.min(s.length,base+600),span=previewOpenMathAtCut(s,base,look);
let end=base;

//== delMsg ==//
function snapshotMessageMutationState(conv){
return{
 name:conv.name,
 messages:syncClone(conv.messages||[]),
foldGroups:syncClone(conv.foldGroups||[]),
messageTombstones:syncClone(conv.messageTombstones||[]),
messageOps:syncClone(conv.messageOps||[]),
localMutations:syncClone(conv.localMutations||[]),
 updatedAt:conv.updatedAt,
 contentUpdatedAt:conv.contentUpdatedAt,
 metaUpdatedAt:conv.metaUpdatedAt,
 uiStateUpdatedAt:conv.uiStateUpdatedAt,
 fieldClocks:syncClone(conv.fieldClocks||{}),
 pendingMutationParts:syncClone(conv._pendingMutationParts||null),
 foldedIds:[...foldMgr._folded],
foldDirty:_foldDirty
}
}

function restoreMessageMutationState(conv,snap,opts){
 opts=opts||{};
 conv.name=snap.name;
 conv.messages=syncClone(snap.messages||[]);
conv.foldGroups=syncClone(snap.foldGroups||[]);
conv.messageTombstones=syncClone(snap.messageTombstones||[]);
conv.messageOps=syncClone(snap.messageOps||[]);
conv.localMutations=syncClone(snap.localMutations||[]);
 conv.updatedAt=snap.updatedAt;
 conv.contentUpdatedAt=snap.contentUpdatedAt;
 conv.metaUpdatedAt=snap.metaUpdatedAt;
 conv.uiStateUpdatedAt=snap.uiStateUpdatedAt;
 conv.fieldClocks=syncClone(snap.fieldClocks||{});
 if(snap.pendingMutationParts)conv._pendingMutationParts=syncClone(snap.pendingMutationParts);else delete conv._pendingMutationParts;
 if(opts.restoreFold!==false){foldMgr._folded=new Set(snap.foldedIds||[]);_foldDirty=!!snap.foldDirty}
}

function snapshotMessagesForRemoval(conv,indices){
 const messages=conv?.messages||[],ordered=[...new Set(indices||[])].filter(i=>Number.isInteger(i)&&i>=0&&i<messages.length).sort((a,b)=>a-b);
 const removedSet=new Set(ordered),nearest=(start,step)=>{for(let i=start;i>=0&&i<messages.length;i+=step)if(!removedSet.has(i))return messages[i]?.id||'';return''};
 return ordered.map(i=>({...messages[i],_origIdx:i,_beforeId:nearest(i-1,-1),_afterId:nearest(i+1,1)}))
}

function pruneFoldGroupsAfterMessageRemoval(conv){
if(!conv.foldGroups)return;
conv.foldGroups=conv.foldGroups.filter(fg=>{
const si=conv.messages.findIndex(m=>m.id===fg.startMsgId);
const ei=conv.messages.findIndex(m=>m.id===fg.endMsgId);
if(si===-1&&ei===-1)return false;
if(si===-1)fg.startMsgId=conv.messages[0]?.id;
if(ei===-1)fg.endMsgId=conv.messages[conv.messages.length-1]?.id;
return true
})
}

async function delMsg(i){
const conv=curConv,convId=curConvId,h=folderH,gen=_folderLoadGen;
const folderGuard=()=>folderH===h&&isFolderLoadCurrent(gen),stillCurrent=()=>folderGuard()&&curConv===conv&&curConvId===convId;
const msg=conv?.messages?.[i];
if(!msg)return;
const mid=msg.id;
 const removed=snapshotMessagesForRemoval(conv,[i]);
const anchor=scrollAnchor(new Set([mid]));
const snap=snapshotMessageMutationState(conv);
const trashed=await addToMsgTrash(removed,conv.name,conv.id);
if(!trashed){toast('❌ 消息回收站保存失败，未删除消息');return}
if(!stillCurrent()){syncTrace('message.delete.cancelAfterTrash',{convId,index:i});return}
markMsgDeleted(conv,removed);
foldMgr.clean([mid]);
conv.messages.splice(i,1);
pruneFoldGroupsAfterMessageRemoval(conv);
touchConv(conv,'content');
cfmSt.id=null;
const saved=await saveConvF(conv,{rootHandle:h,generation:gen,guard:folderGuard});
if(!saved){
restoreMessageMutationState(conv,snap);
toast('❌ 删除失败，消息已保留');
return
}
if(!stillCurrent())return;
renderMsgs();
scrollRestore(anchor);
updateTokCnt()
}

//== createFoldGroup ==//
async function createFoldGroup(startIdx,endIdx,name,summary){
if(!curConv||startIdx<0||endIdx>=curConv.messages.length||startIdx>endIdx)return null;
if(!name){showMo('📁 创建折叠组',`<div class="fg"><label>名称</label><input type="text" id="fgNewNm" placeholder="输入组名..."></div>`,`<button class="mo-btn sec" onclick="hideMo()">取消</button>${params.auxModel?`<button class="mo-btn sec" onclick="aiFGNameAndSummary(${startIdx},${endIdx},false)">🤖快速</button><button class="mo-btn sec" onclick="aiFGNameAndSummary(${startIdx},${endIdx},true)">🤖全量</button>`:''}<button class="mo-btn pri" onclick="doCreateFG(${startIdx},${endIdx})">创建</button>`,'compact');setTimeout(()=>document.getElementById('fgNewNm')?.focus(),50);return null}
if(!curConv.foldGroups)curConv.foldGroups=[];
const sId=curConv.messages[startIdx].id,eId=curConv.messages[endIdx].id;
const overlap=curConv.foldGroups.some(fg=>{const si=curConv.messages.findIndex(m=>m.id===fg.startMsgId);const ei=curConv.messages.findIndex(m=>m.id===fg.endMsgId);if(si===-1||ei===-1)return false;return!(endIdx<si||startIdx>ei)});
if(overlap){toast('与已有折叠组重叠');return null}
const id='fg_'+gid2();
const group={id,name,summary:summary||'',startMsgId:sId,endMsgId:eId,collapsed:true,muted:false};
const saved=await optimisticConvSave(curConv,{
snapshot:snapshotMessageMutationState,
restore:restoreMessageMutationState,
mutate:conv=>{conv.foldGroups.push(group)},
touch:'uiState',
failMsg:'⚠️ 保存失败，折叠组未创建'
});
if(!saved)return null;
renderMsgs();toast('✓ 已创建');return id}

//== mgrExecReplace ==//
async function mgrExecReplace(){

if(!kw){toast('请输入搜索内容');return}if(!frSel.size){toast('未选中匹配');return}
const confirmMsg=rp?`将 ${frSel.size} 处「${kw.substring(0,20)}」替换为「${rp.substring(0,20)}」？`:`将删除 ${frSel.size} 处「${kw.substring(0,20)}」（替换为空）？`;
if(!confirm(confirmMsg))return;
const scope=mgrCache.scope;
if(scope==='all'){let total=0,failed=0;const byConv={};frMatchesAll.forEach(r=>{r.matches.forEach(m=>{if(frSel.has(m._frIdx)){if(!byConv[r.convId])byConv[r.convId]={matches:[]};byConv[r.convId].matches.push(m)}})});for(const[cid,data]of Object.entries(byConv)){const conv=cid===curConvId&&curConv?curConv:await loadConvFull(cid);if(!conv)continue;const snap=snapshotMessageMutationState(conv);let convTotal=0;const byMsg={};data.matches.forEach(m=>{if(!byMsg[m.msgIdx])byMsg[m.msgIdx]=[];byMsg[m.msgIdx].push(m.charIdx)});Object.entries(byMsg).forEach(([mi,indices])=>{const msg=conv.messages[parseInt(mi)];if(!msg)return;indices.sort((a,b)=>b-a);const ek=kw.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');indices.forEach(ci=>{const before=msg.content.substring(0,ci);const after=msg.content.substring(ci);msg.content=before+after.replace(new RegExp(ek,caseS?'':'i'),rp);convTotal++});delete msg._mdCache;delete msg._mdKey});touchConv(conv,'content');const saved=await saveConvF(conv);if(!saved){restoreMessageMutationState(conv,snap);failed++;if(cid===curConvId&&curConv)renderMsgs();continue}total+=convTotal;if(cid===curConvId&&curConv)renderMsgs()}if(failed){toast(`⚠️ 已替换 ${total} 处，${failed} 个对话保存失败并已回滚`)}else ok(`替换 ${total} 处`);mgrDoSearch();return}
if(!curConv){toast('请先选择对话');return}
const selMatches=frMatches.filter((m,i)=>frSel.has(i));if(!selMatches.length){toast('未选中');return}
const byMsg={};selMatches.forEach(m=>{if(!byMsg[m.msgIdx])byMsg[m.msgIdx]=[];byMsg[m.msgIdx].push(m.charIdx)});let total=0;
const applyReplacements=conv=>{Object.entries(byMsg).forEach(([mi,indices])=>{const msg=conv.messages[parseInt(mi)];if(!msg)return;indices.sort((a,b)=>b-a);const ek=kw.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');indices.forEach(ci=>{const before=msg.content.substring(0,ci);const after=msg.content.substring(ci);msg.content=before+after.replace(new RegExp(ek,caseS?'':'i'),rp);total++});delete msg._mdCache;delete msg._mdKey})};
total=0;
const saved=await optimisticConvSave(curConv,{
snapshot:snapshotMessageMutationState,
restore:restoreMessageMutationState,
mutate:applyReplacements,
touch:'content',
failMsg:'⚠️ 替换保存失败，内容未改变'
});
if(!saved)return;
if(total){renderMsgs();updateTokCnt()}
ok(`替换 ${total} 处`);mgrDoSearch()}

//== exSnip ==//
function exSnip(t,kw,cl,charIdx){if(cl===undefined)cl=80;const i=charIdx!==undefined?charIdx:t.toLowerCase().indexOf(kw.toLowerCase());if(i===-1)return'';const s=Math.max(0,i-cl),e=Math.min(t.length,i+kw.length+cl);return(s>0?'...':'')+t.slice(s,e)+(e<t.length?'...':'')}

//== hlKw ==//
function hlKw(t,kw){if(!t||!kw)return esc(t);return esc(t).replace(new RegExp('('+kw.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi'),'<mark>$1</mark>')}

//== scrollToKeyword ==//
function scrollToKeyword(msgIdx,kw,charIdx){
const el=document.getElementById('msg-'+msgIdx);if(!el)return;
const msg=curConv?.messages?.[msgIdx];
if(msg&&foldMgr.isFolded(msg.id))toggleMsgFold(msgIdx);
const body=el.querySelector('.msg-body');
if(!body){el.scrollIntoView({block:'center'});el.style.outline='2px solid var(--ac)';el.style.outlineOffset='3px';setTimeout(()=>{el.style.outline='';el.style.outlineOffset=''},2500);return}
const walker=document.createTreeWalker(body,NodeFilter.SHOW_TEXT);
const nodes=[];let fullText='';let node;
while(node=walker.nextNode()){nodes.push({node,start:fullText.length});fullText+=node.textContent}
const kwLower=kw.toLowerCase(),ftLower=fullText.toLowerCase();
let bestPos=-1;
if(charIdx!=null&&charIdx>=0){let pos=-1,bestDist=Infinity;while(true){pos=ftLower.indexOf(kwLower,pos+1);if(pos===-1)break;const dist=Math.abs(pos-charIdx);if(dist<bestDist){bestDist=dist;bestPos=pos}}}
else{bestPos=ftLower.indexOf(kwLower)}
if(bestPos===-1){el.scrollIntoView({block:'center'});el.style.outline='2px solid var(--ac)';el.style.outlineOffset='3px';setTimeout(()=>{el.style.outline='';el.style.outlineOffset=''},2500);return}
let startNode=null,startOff=0,endNode=null,endOff=0;
for(let i=0;i<nodes.length;i++){const n=nodes[i],nEnd=n.start+n.node.textContent.length;if(!startNode&&bestPos<nEnd){startNode=n.node;startOff=bestPos-n.start}if(bestPos+kw.length<=nEnd){endNode=n.node;endOff=bestPos+kw.length-n.start;break}}
if(!startNode||!endNode){el.scrollIntoView({block:'center'});return}
try{const range=document.createRange();range.setStart(startNode,Math.min(startOff,startNode.textContent.length));range.setEnd(endNode,Math.min(endOff,endNode.textContent.length));const rect=range.getBoundingClientRect();const container=document.getElementById('msgsC');const cRect=container.getBoundingClientRect();container.scrollTop+=rect.top-cRect.top-cRect.height/3;try{const mark=document.createElement('mark');mark.style.cssText='background:rgba(251,191,36,.5);color:inherit;border-radius:2px;padding:0 1px';range.surroundContents(mark);setTimeout(()=>{try{if(mark.parentNode)mark.outerHTML=mark.innerHTML}catch(e2){}},2500)}catch(e2){el.style.outline='2px solid var(--ac)';el.style.outlineOffset='3px';setTimeout(()=>{el.style.outline='';el.style.outlineOffset=''},2500)}}catch(e){el.scrollIntoView({block:'center'})}}

//== addImageAttachment ==//
function addImageAttachment(file,slotId){
if(!file||!file.type.startsWith('image/'))return;
const removeSlot=()=>{if(slotId){const i=inputAttachments.findIndex(a=>a.id===slotId&&a.loading);if(i>=0)inputAttachments.splice(i,1);renderAttachBar();updateTokCnt()}};
const reader=new FileReader();
reader.onerror=function(){toast('❌ 读取图片失败');removeSlot()};
reader.onload=async function(){
const dataUrl=reader.result;
if(!dataUrl||typeof dataUrl!=='string'){toast('❌ 读取图片失败');removeSlot();return}
const img=new Image();
try{
img.src=dataUrl;
if(img.decode){await img.decode()}
else{await new Promise((res,rej)=>{img.onload=res;img.onerror=()=>rej(new Error('decode failed'));setTimeout(()=>{if(!img.complete)rej(new Error('decode timeout'))},10000)})}
}catch(e){toast('❌ 图片解码失败，可能是不支持的格式');removeSlot();return}
const ow=img.naturalWidth||img.width,oh=img.naturalHeight||img.height;
if(!ow||!oh){toast('❌ 图片尺寸异常');removeSlot();return}
if(oh/ow>3){try{await sliceLongImage(img,ow,oh,file,slotId)}catch(e){toast('❌ 长图切片失败: '+(e.message||e.name));removeSlot()}return}
const MAX_SIDE=2576;
const MAX_MP=3750000;
const JPEG_Q=0.92;
let w=ow,h=oh;
let needResize=false;
if(w>MAX_SIDE||h>MAX_SIDE){
if(w>h){h=Math.round(h*MAX_SIDE/w);w=MAX_SIDE}
else{w=Math.round(w*MAX_SIDE/h);h=MAX_SIDE}
needResize=true
}
if(w*h>MAX_MP){
const scale=Math.sqrt(MAX_MP/(w*h));
w=Math.round(w*scale);h=Math.round(h*scale);
needResize=true
}
const origMime=(file.type||'').toLowerCase();
const safeMime=origMime==='image/png'||origMime==='image/jpeg'||origMime==='image/webp'||origMime==='image/gif';
const isGif=origMime==='image/gif';
let outUrl=null,outMime=origMime||'image/png';
if(!needResize&&safeMime&&!isGif){
outUrl=dataUrl;
outMime=origMime
}else if(isGif&&!needResize){
outUrl=dataUrl;outMime='image/gif'
}else{
try{
const canvas=document.createElement('canvas');
canvas.width=w;canvas.height=h;
const ctx2=canvas.getContext('2d');
if(!ctx2)throw new Error('no canvas ctx');
ctx2.imageSmoothingEnabled=true;
ctx2.imageSmoothingQuality='high';
ctx2.fillStyle='#fff';
ctx2.fillRect(0,0,w,h);
ctx2.drawImage(img,0,0,w,h);
let useMime='image/jpeg';
if(origMime==='image/png'){useMime='image/png'}
const encoded=canvas.toDataURL(useMime,useMime==='image/jpeg'?JPEG_Q:undefined);
if(!encoded||encoded.length<200){throw new Error('encode failed')}
outUrl=encoded;
outMime=useMime
}catch(e){
outUrl=dataUrl;
outMime=origMime||'image/png';
needResize=false
}}
const commaIdx=outUrl.indexOf(',');
const base64=commaIdx>=0?outUrl.substring(commaIdx+1):'';
if(!base64){toast('❌ 图片处理失败');removeSlot();return}
const finalItem={
id:slotId||gid2(),
type:'image',
base64,
mimeType:outMime,
dataUrl:outUrl,
width:w,
height:h,
name:file.name||'image',
size:Math.round(base64.length*3/4)
};
if(slotId){
const idx=inputAttachments.findIndex(a=>a.id===slotId);
if(idx>=0)inputAttachments[idx]=finalItem;
else inputAttachments.push(finalItem)
}else{
inputAttachments.push(finalItem)
}
renderAttachBar();
updateTokCnt();
toast('📷 已添加图片'+(needResize?' (已压缩)':''))
};
try{reader.readAsDataURL(file)}catch(e){toast('❌ 读取图片失败: '+e.name);removeSlot()}}

//== sliceLongImage ==//
async function sliceLongImage(img,ow,oh,file,slotId){
const MAX_SIDE=2560;
const MAX_SLICES=30;
const JPEG_Q=0.92;
const OVERLAP=0.05;
const sliceH=ow;
const ov=Math.round(sliceH*OVERLAP);
let step=Math.max(1,sliceH-ov);
let count=Math.max(1,Math.ceil((oh-ov)/step));
if(count>MAX_SLICES){step=Math.max(1,Math.ceil((oh-ov)/MAX_SLICES));count=MAX_SLICES}
let outW=ow,scale=1;
if(ow>MAX_SIDE){scale=MAX_SIDE/ow;outW=MAX_SIDE}
const baseName=(file.name||'image').replace(/\.[^.]+$/,'');
const slots=[];
for(let i=0;i<count;i++){
if(i===0&&slotId){slots.push(slotId)}
else{const sid=gid2();slots.push(sid);inputAttachments.push({id:sid,type:'image',loading:true,name:baseName+'_p'+(i+1),dataUrl:'',base64:'',mimeType:'image/jpeg',width:0,height:0,size:0})}
}
renderAttachBar();
toast('📑 长图切片中 ('+count+'片)...');
let failed=0;
for(let i=0;i<count;i++){
const sid=slots[i];
try{
const sy=i*step;
let sh=sliceH;
if(sy+sh>oh)sh=oh-sy;
if(sh<=0){const idx0=inputAttachments.findIndex(a=>a.id===sid);if(idx0>=0)inputAttachments.splice(idx0,1);continue}
const ch=Math.max(1,Math.round(sh*scale));
const canvas=document.createElement('canvas');
canvas.width=Math.round(outW);canvas.height=ch;
const ctx2=canvas.getContext('2d');
if(!ctx2)throw new Error('no canvas ctx');
ctx2.imageSmoothingEnabled=true;ctx2.imageSmoothingQuality='high';
ctx2.fillStyle='#fff';ctx2.fillRect(0,0,canvas.width,canvas.height);
ctx2.drawImage(img,0,sy,ow,sh,0,0,canvas.width,canvas.height);
const dataUrl=canvas.toDataURL('image/jpeg',JPEG_Q);
const base64=dataUrl.substring(dataUrl.indexOf(',')+1);
if(!base64)throw new Error('encode failed');
const item={id:sid,type:'image',base64,mimeType:'image/jpeg',dataUrl,width:canvas.width,height:canvas.height,name:baseName+'_p'+(i+1),size:Math.round(base64.length*3/4)};
const idx=inputAttachments.findIndex(a=>a.id===sid);
if(idx>=0)inputAttachments[idx]=item;else inputAttachments.push(item)
}catch(e){
failed++;
const idx=inputAttachments.findIndex(a=>a.id===sid&&a.loading);
if(idx>=0)inputAttachments.splice(idx,1)
}
if(i%2===0||i===count-1){renderAttachBar();await new Promise(r=>setTimeout(r,0))}
}
renderAttachBar();
updateTokCnt();
toast(failed?'📑 长图切成 '+(count-failed)+'/'+count+' 片 ('+failed+'失败)':'📑 长图已切成 '+count+' 片')}

//== extractPdfPages ==//
async function extractPdfPages(file){
toast('📕 加载PDF引擎...');
const okLib=await loadPdfJs();
if(!okLib){toast('❌ PDF引擎加载失败，请检查网络');return}
let pdf;
try{
const buf=await file.arrayBuffer();
pdf=await window.pdfjsLib.getDocument({data:buf}).promise
}catch(e){toast('❌ PDF解析失败: '+((e.message||e.name)||'').substring(0,40));return}
const total=pdf.numPages;
const baseName=(file.name||'pdf').replace(/\.pdf$/i,'');
const slots=[];
for(let i=1;i<=total;i++){
const slotId=gid2();
slots.push(slotId);
inputAttachments.push({id:slotId,type:'image',loading:true,name:`${baseName}_p${i}`,dataUrl:'',base64:'',mimeType:'image/jpeg',width:0,height:0,size:0})
}
renderAttachBar();
toast(`📕 开始转换 ${total} 页...`);
const MAX_SIDE=2560;
let failed=0;
for(let i=1;i<=total;i++){
const slotId=slots[i-1];
try{
const page=await pdf.getPage(i);
const vp1=page.getViewport({scale:1});
let scale=MAX_SIDE/Math.max(vp1.width,vp1.height);
if(scale>4)scale=4;
if(scale<1)scale=1;
const vp=page.getViewport({scale});
const canvas=document.createElement('canvas');
canvas.width=Math.round(vp.width);
canvas.height=Math.round(vp.height);
const ctx2=canvas.getContext('2d');
if(!ctx2)throw new Error('no canvas ctx');
ctx2.fillStyle='#fff';ctx2.fillRect(0,0,canvas.width,canvas.height);
await page.render({canvasContext:ctx2,viewport:vp}).promise;
const blob=await new Promise(res=>canvas.toBlob(res,'image/jpeg',0.92));
if(!blob)throw new Error('canvas导出失败');
const pageFile=new File([blob],`${baseName}_p${i}.jpg`,{type:'image/jpeg'});
await addImageAttachment(pageFile,slotId)
}catch(e){
failed++;
const idx=inputAttachments.findIndex(a=>a.id===slotId&&a.loading);
if(idx>=0)inputAttachments.splice(idx,1)
}
if(i%2===0||i===total){renderAttachBar();await new Promise(r=>setTimeout(r,0))}
}

//== downloadMsgImage ==//
function downloadMsgImage(msgIdx,imgIdx){
const msg=curConv?.messages?.[msgIdx];
if(!msg?.images?.[imgIdx])return;
const img=msg.images[imgIdx];
if(img._stripped||!img.base64){toast('📷 此图片仅存于其他设备');return}
const ext=img.mimeType.split('/')[1]||'png';
const name=(img.name||'image').replace(/\.[^.]+$/,'')+'.'+ext;
const bin=atob(img.base64);
const arr=new Uint8Array(bin.length);
for(let i=0;i<bin.length;i++)arr[i]=bin.charCodeAt(i);
const blob=new Blob([arr],{type:img.mimeType});
const url=URL.createObjectURL(blob);
const a=document.createElement('a');
a.href=url;a.download=name;a.click();
setTimeout(()=>URL.revokeObjectURL(url),1000);
toast('✓ 已下载')}

//== fmtImgSize ==//
function fmtImgSize(base64Len){
const bytes=Math.round(base64Len*3/4);
if(bytes<1024)return bytes+'B';
if(bytes<1024*1024)return(bytes/1024).toFixed(1)+'KB';
return(bytes/1024/1024).toFixed(2)+'MB'}

//== loadJSZip ==//
async function loadJSZip(){

return new Promise(resolve=>{
const sc=document.createElement('script');
sc.src='https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js';

})}

//== exportConvImages ==//
async function exportConvImages(){
if(!curConv){toast('请先选择对话');return}
const imgs=[];
(curConv.messages||[]).forEach((m,mi)=>{(m.images||[]).forEach(img=>{if(img&&img.base64)imgs.push({img,mi})})});
if(!imgs.length){toast('当前对话没有图片');return}
showMo('🖼️ 导出图片',`<div style="text-align:center;padding:20px"><div id="eiStatus">加载打包引擎...</div><div class="prog-bar"><div class="prog-fill" id="eiFill" style="width:5%"></div></div></div>`,'');
await new Promise(r=>setTimeout(r,30));
const okLib=await loadJSZip();
if(!okLib){hideMo();toast('❌ 打包引擎加载失败，请检查网络');return}
try{
const zip=new JSZip();
const usedNames={};
for(let i=0;i<imgs.length;i++){
const{img,mi}=imgs[i];
const ext=(img.mimeType||'image/png').split('/')[1]||'png';
const base=(img.name||'image').replace(/\.[^.]+$/,'').replace(/[\/\\:*?"<>|]/g,'_');
let fn=String(i+1).padStart(3,'0')+'_msg'+(mi+1)+'_'+base+'.'+ext;
if(usedNames[fn]){usedNames[fn]++;fn=fn.replace('.'+ext,'_'+usedNames[fn]+'.'+ext)}else usedNames[fn]=1;
const bin=atob(img.base64);
const arr=new Uint8Array(bin.length);
for(let j=0;j<bin.length;j++)arr[j]=bin.charCodeAt(j);
zip.file(fn,arr);
const st=document.getElementById('eiStatus'),f=document.getElementById('eiFill');
if(st)st.textContent='打包 '+(i+1)+'/'+imgs.length+'...';
if(f)f.style.width=Math.round((i+1)/imgs.length*70)+'%';
if(i%5===0)await new Promise(r=>setTimeout(r,0))
}
const st2=document.getElementById('eiStatus');if(st2)st2.textContent='生成压缩包...';
const blob=await zip.generateAsync({type:'blob'},meta=>{const f=document.getElementById('eiFill');if(f)f.style.width=(70+Math.round(meta.percent*0.3))+'%'});
const safe=(curConv.name||'对话').replace(/[\/\\:*?"<>|]/g,'_').substring(0,40);
const url=URL.createObjectURL(blob);
const a=document.createElement('a');
a.href=url;a.download=safe+'_images_'+fmtD(new Date())+'.zip';a.click();
setTimeout(()=>URL.revokeObjectURL(url),1000);
hideMo();ok('已导出 '+imgs.length+' 张图片')
}catch(e){hideMo();toast('❌ 导出失败: '+(e.message||e.name))}}

//== buildImageContent ==//
function buildImageContent(msg){
if(!msg.images?.length)return msg.content||'';
const detail=(uiSettings.imageDetail)||'auto';
const parts=[];
if(msg.content&&msg.content.trim()&&msg.content!=='[图片]'&&!msg.content.startsWith('[图片: '))parts.push({type:'text',text:msg.content});
msg.images.forEach(img=>{
const url=img.dataUrl||('data:'+(img.mimeType||'image/png')+';base64,'+img.base64);
parts.push({type:'image_url',image_url:{url,detail}})
});
if(!parts.some(p=>p.type==='text'))parts.unshift({type:'text',text:'(图片)'});
return parts
}

function snapshotConvDraftState(conv){
return{
name:conv.name,
updatedAt:conv.updatedAt,
contentUpdatedAt:conv.contentUpdatedAt,
metaUpdatedAt:conv.metaUpdatedAt,
messageOps:syncClone(conv.messageOps||[]),
localMutations:syncClone(conv.localMutations||[]),
hadPendingAutoName:Object.prototype.hasOwnProperty.call(conv,'_pendingAutoName'),
pendingAutoName:conv._pendingAutoName
}
}

function rollbackInputPayload(conv,startIdx,snap){
conv.messages.splice(startIdx);
conv.name=snap.name;
conv.updatedAt=snap.updatedAt;
conv.contentUpdatedAt=snap.contentUpdatedAt;
conv.metaUpdatedAt=snap.metaUpdatedAt;
conv.messageOps=syncClone(snap.messageOps||[]);
conv.localMutations=syncClone(snap.localMutations||[]);
if(snap.hadPendingAutoName)conv._pendingAutoName=snap.pendingAutoName;
else delete conv._pendingAutoName
}

function captureConversationOperation(conv){
 const rootHandle=folderH,generation=_folderLoadGen,selectionEpoch=_selectionEpoch;
 return{
  conv:conv||null,
  id:conv?.id||'',
  rootHandle,
  generation,
  selectionEpoch,
  folderCurrent(){return folderH===rootHandle&&isFolderLoadCurrent(generation)},
  uiCurrent(){return this.folderCurrent()&&_selectionEpoch===selectionEpoch&&curConvId===this.id&&curConv===this.conv}
 }
}

function finishSavedInputPayload(op,inp,rawInput,attachments){
 if(!op?.uiCurrent())return false;
 if(inp.value===rawInput){inp.value='';inp.style.height='auto'}
 const sent=new Set(attachments||[]);
 inputAttachments=inputAttachments.filter(a=>!sent.has(a));
 renderAttachBar();
 const draftText=inp.value||'';
 if(draftText||inputAttachments.length)convDrafts[op.id]={text:draftText,attachments:[...inputAttachments]};
 else delete convDrafts[op.id];
 return true
}

function reconcileStoredDraftAfterSave(op,rawInput,attachments){
 const draft=convDrafts[op?.id];
 if(!draft)return;
 if((draft.text||'')===rawInput)draft.text='';
 const sent=new Set(attachments||[]);
 draft.attachments=(draft.attachments||[]).filter(a=>!sent.has(a));
 if(!draft.text&&!draft.attachments.length)delete convDrafts[op.id]
}

async function saveMsg(){
const inp=document.getElementById('userIn');
const rawInput=inp.value,c=rawInput.trim();
const attachments=[...inputAttachments];
const hasAttach=attachments.length>0;
if((!c&&!hasAttach)||!curConv)return;
if(_folderSwitching){toast('⏳ 工作文件夹还在加载，请稍候');return}
const op=captureConversationOperation(curConv),conv=op.conv;
if(!isConvWritable(op.id)){
toast('⚠️ 此对话正被另一个窗口编辑，无法保存');
return
}
if(attachments.some(a=>a.loading)){
toast('⏳ 图片加载中，请稍候');
return
}

const startIdx=conv.messages.length;

//== genMatCore ==//
function genMatCore(cfg,preMatApps){if(!cfg)return'';const sl=cfg.spotlight||[],ap=cfg.appear||[],mn=cfg.mention||[],ab=cfg.absent||[],hd=cfg.hidden||[];const det=[...sl,...ap].filter(n=>!hd.includes(n));let o='';const allM=materials.metaPrompts;const selM=Object.keys(cfg.metaPrompts||{}).filter(n=>cfg.metaPrompts[n]&&allM[n]);if(selM.length){o+='【系统设定】\n════════\n\n';selM.forEach(n=>{o+=(allM[n]||'')+'\n\n'})}if(preMatApps?.length)preMatApps.forEach(a=>{o+='◆ '+a.name+'\n'+a.content+'\n\n'});if(det.length){o+='【出场角色】\n════════\n\n';det.forEach(n=>{const c=materials.chars[n];if(!c)return;const p=c.g==='女'?'她':'他';o+='■ '+n+'\n'+(c.d||'').replace(/\{TA\}/g,p)+'\n';if(c.h?.trim()&&cfg.hToggles?.[n])o+='\n【H】\n'+c.h.replace(/\{TA\}/g,p)+'\n';o+='\n'})}if(!cfg.hideRel&&det.length>1){o+='【关系】\n════════\n\n';det.forEach(a=>{det.forEach(b=>{if(a!==b&&materials.rels[a+'→'+b])o+='▸ '+a+'→'+b+'\n'+(materials.rels[a+'→'+b].d||'').replace(/\{TA\}/g,materials.chars[b]?.g==='女'?'她':'他')+'\n\n'})})}if(!cfg.hideRel&&det.length&&mn.length){o+='【出场→提及】\n════════\n\n';det.forEach(a=>{mn.forEach(b=>{if(materials.rels[a+'→'+b])o+='▸ '+a+'→'+b+'\n'+(materials.rels[a+'→'+b].d||'').replace(/\{TA\}/g,materials.chars[b]?.g==='女'?'她':'他')+'\n\n'})})}if(mn.length){o+='【提及角色】\n════════\n\n';mn.forEach(n=>{const c=materials.chars[n];if(!c)return;o+='• '+n+'：'+(c.s||'').replace(/\{TA\}/g,c.g==='女'?'她':'他')+'\n'});o+='\n'}const abChars=ab.filter(n=>!hd.includes(n)&&materials.chars[n]);if(abChars.length){o+='【不出场角色】\n════════\n\n';abChars.forEach(n=>{const c=materials.chars[n];const s=c.s||'';if(!s.trim())return;o+='• '+n+'：'+s.replace(/\{TA\}/g,c.g==='女'?'她':'他')+'\n'});o+='\n'}return o}

//== isStoryBeforeCut ==//
function isStoryBeforeCut(story,cutIdx){if(cutIdx===null||cutIdx===undefined)return true;const ti=story.timeInfo;if(!ti)return true;let yid,sem;if(ti.type==='point'&&ti.point){yid=ti.point.yearId;sem=ti.point.semester}else if(ti.type==='range'&&ti.start){yid=ti.start.yearId;sem=ti.start.semester}else if(ti.type==='fuzzy'&&ti.fuzzyStart){yid=ti.fuzzyStart.yearId;sem=ti.fuzzyStart.semester}else return true;const idx=tlPointsChat.findIndex(p=>p.yearId===yid&&p.semester===sem);return idx===-1||idx<cutIdx}

//== getStoryOut ==//
function getStoryOut(story,cfg){const cr=story.characterRoles||{};const protagonists=new Set(materials.charOrder.filter(n=>materials.chars[n]?.protagonist));const chars=Object.keys(cr).filter(c=>cr[c]?.role&&cr[c].role!=='none'&&!protagonists.has(c));if(chars.length>0&&chars.every(c=>getCSt(cfg,c)==='hidden'))return'skip';const type=story.type||'main';const isPlot=type==='main'||type==='dlc';const isDaily=type==='daily';const isIntimate=type==='intimate';let result='brief';if(isPlot){if(chars.some(c=>{const us=getCSt(cfg,c),sr=cr[c]?.role;return(us==='spotlight'||us==='appear')&&(sr==='spotlight'||sr==='appear')}))result='detailed'}else if(isDaily){if(chars.some(c=>{const us=getCSt(cfg,c),sr=cr[c]?.role;return us==='spotlight'&&sr==='spotlight'}))result='detailed'}else if(isIntimate){if(chars.some(c=>{const us=getCSt(cfg,c),sr=cr[c]?.role;return us==='spotlight'&&sr==='spotlight'}))result='detailed';else if(chars.some(c=>cfg.hToggles?.[c]&&cr[c]?.h))result='detailed'}if(result==='brief'&&!story.brief?.trim())return'skip';if(result==='detailed'&&!story.detailed?.trim()&&!story.brief?.trim())return'skip';return result}

//== genStorySec ==//
function genStorySec(cfg){if(!storyData.stories?.length||cfg?.hideStory)return'';const cut=cfg?.timelineCutoffIdx;const years=(storyData.timelineYears||[]).sort((a,b)=>a.order-b.order);const yg={};years.forEach(y=>{yg[y.id]={name:y.name,order:y.order,stories:[]}});storyData.stories.forEach(s=>{if(!isStoryBeforeCut(s,cut))return;const out=getStoryOut(s,cfg);if(out==='skip')return;const ti=s.timeInfo?.point||s.timeInfo?.start||s.timeInfo?.fuzzyStart||{};if(yg[ti.yearId])yg[ti.yearId].stories.push({...s,_out:out})});const sorted=Object.entries(yg).filter(([,y])=>y.stories.length>0).sort((a,b)=>a[1].order-b[1].order);if(!sorted.length)return'';let o='【剧情时间线】\n════════\n\n';sorted.forEach(([,y])=>{o+=`### ${y.name}\n\n`;y.stories.sort((a,b)=>(a.order||0)-(b.order||0));y.stories.forEach(s=>{const cr=s.characterRoles||{};const chars=Object.keys(cr).filter(c=>cr[c]?.role&&cr[c].role!=='none');if(s._out==='detailed'){o+=`#### ${s.title}\n`;if(chars.length)o+=`角色：${chars.join('、')}\n`;o+='\n'+(s.detailed||s.brief||'')+'\n\n'}else{o+=`• ${s.title}：${s.brief||''}\n`}});o+='\n'});return o}

const _streamCheckpointSaves={};
function applyStreamCheckpointResult(live,snapshot){

async function drainStreamCheckpointState(state){
let saved=false;
do{
state.dirty=false;
const activeReq=(pendReqs[state.conv.id]||[]).find(req=>req.msgId===state.msgId&&req.status==='generating');
if(activeReq&&!requestFolderIsCurrent(activeReq))return false;
const snapshot=syncClone(state.conv);
saved=await saveConvF(snapshot,{bumpRevision:false});
if(saved)applyStreamCheckpointResult(state.conv,snapshot);
else{
_syncLastError='生成中内容暂存失败: '+(state.conv.name||state.conv.id);
syncTrace('streaming.checkpoint.failed',{convId:state.conv.id,msgId:state.msgId})
}
if(state.dirty)syncTrace('streaming.checkpoint.trailing',{convId:state.conv.id,msgId:state.msgId})
}while(state.dirty);
return saved
}
function queueStreamCheckpointSave(conv,msgId){
if(!conv||!msgId)return Promise.resolve(false);
const activeReq=(pendReqs[conv.id]||[]).find(req=>req.msgId===msgId&&req.status==='generating');
if(activeReq&&!requestFolderIsCurrent(activeReq))return Promise.resolve(false);
const key=conv.id+'|'+msgId;
const existing=_streamCheckpointSaves[key];
if(existing){existing.conv=conv;existing.dirty=true;return existing.promise}
const state={key,conv,msgId,dirty:false,promise:null};
state.promise=drainStreamCheckpointState(state)
.catch(e=>{_syncLastError='生成中内容暂存失败: '+(e.message||e.name);syncTrace('streaming.checkpoint.error',{convId:state.conv.id,msgId,error:e.message||e.name});return false})
.finally(()=>{if(_streamCheckpointSaves[key]===state)delete _streamCheckpointSaves[key]});
_streamCheckpointSaves[key]=state;
return state.promise

async function execReq(cid,req){const cfg=apiConfigs.find(c=>c.id===req.apiId);if(!cfg){req.status='failed';req.content='❌ 未找到API配置';await finalizeReq(cid,req);return}let conv=cid===curConvId&&curConv?curConv:await loadConvFull(cid);if(!conv){req.status='failed';req.content='❌ 无法加载对话';await finalizeReq(cid,req);return}const ep=getEffectiveParams(conv);const pi=new Set((pendReqs[cid]||[]).filter(r=>r.status==='generating').map(r=>r.msgId));const cm=conv.messages.filter((m,i)=>i<=req.ctxIdx&&!pi.has(m.id)&&!m.muted);const am=buildApiMsgs(conv,cm,ep);req._inputTok=am.reduce((s,m)=>s+cntTok(m.content),0);const body={model:req.model,messages:am,stream:ep.stream};if(ep.temperature!==null&&!isNaN(ep.temperature))body.temperature=ep.temperature;if(ep.maxTokens&&ep.maxTokens>0)body.max_tokens=ep.maxTokens;if(ep.topP!==null&&ep.topP!==undefined&&!isNaN(ep.topP))body.top_p=ep.topP;if(ep.topK!==null&&ep.topK!==undefined&&!isNaN(ep.topK))body.top_k=ep.topK;if(ep.frequencyPenalty!==null&&ep.frequencyPenalty!==undefined&&!isNaN(ep.frequencyPenalty))body.frequency_penalty=ep.frequencyPenalty;if(ep.presencePenalty!==null&&ep.presencePenalty!==undefined&&!isNaN(ep.presencePenalty))body.presence_penalty=ep.presencePenalty;const excl=cfg.excludeParams||[];excl.forEach(p=>{delete body[p]});const apiUrl=fixApiUrl(cfg.url);try{const resp=await fetch(apiUrl,{method:'POST',headers:{'Content-Type':'application/json','Authorization':`Bearer ${cfg.key}`},body:JSON.stringify(body),signal:req.abort.signal});const ct=resp.headers.get('content-type')||'';if(!resp.ok){let em=`HTTP ${resp.status}`;try{if(ct.includes('json')){const ej=await resp.json();em=ej.error?.message||ej.message||em}else{em+=': '+(await resp.text()).substring(0,100).replace(/<[^>]+>/g,'').trim()}}catch(e){}throw new Error(em)}if(ep.stream){const rdr=resp.body.getReader();const dec=new TextDecoder();let sseBuffer='';while(true){const{done,value}=await rdr.read();if(done)break;sseBuffer+=dec.decode(value,{stream:true});const lines=sseBuffer.split('\n');sseBuffer=lines.pop();for(const line of lines){const trimmed=line.trim();if(!trimmed||!trimmed.startsWith('data: '))continue;const d=trimmed.slice(6);if(d==='[DONE]')continue;try{const j=JSON.parse(d);const dl=j.choices?.[0]?.delta||{};if(dl.content){if(!req.firstTokenTime)req.firstTokenTime=Date.now();if(req.reasoningStart&&!req.reasoningEnd)req.reasoningEnd=Date.now();req.content+=stripZW(dl.content);req.charCount=req.content.length}for(const f of ep.reasoningFields){if(dl[f]){if(!req.reasoningStart)req.reasoningStart=Date.now();req.reasoning+=dl[f];break}}if(j.usage)req.usage=j.usage}catch(e){}}scheduleStreamUpdate(cid,req);const savedLen=lastStreamSaveLen[req.msgId]||0;if(req.content.length-savedLen>=1000){lastStreamSaveLen[req.msgId]=req.content.length;const cv=cid===curConvId&&curConv?curConv:await loadConvFull(cid);if(cv){const mg=cv.messages.find(m=>m.id===req.msgId);if(mg){mg.content=req.content;if(req.reasoning)mg.reasoning=req.reasoning;if(req.firstTokenTime)mg.firstTokenMs=req.firstTokenTime-req.startTime;touchConv(cv,'content');queueStreamCheckpointSave(cv,req.msgId)}}}}}else{let data;if(!ct.includes('json')){const txt=await resp.text();if(txt.trim().startsWith('<'))throw new Error('返回HTML');data=JSON.parse(txt)}else data=await resp.json();if(data.error)throw new Error(data.error.message||data.error.type||'API错误');req.content=stripZW(data.choices?.[0]?.message?.content||'');for(const f of ep.reasoningFields){if(data.choices?.[0]?.message?.[f]){req.reasoning=data.choices[0].message[f];break}}if(data.usage)req.usage=data.usage}if(!req.content?.trim()){req.content='⚠️ AI返回了空内容';req.status='failed'}else req.status='completed'}catch(e){if(e.name==='AbortError'){req.content+=(req.content?'\n\n':'')+'[已停止]';req.status='stopped'}else{if(req.content){req.content+='\n\n❌ '+e.message;req.status='stopped'}else{req.content=`❌ ${e.message}`;req.status='failed'}}}if(req.status==='failed')toast('❌ '+(req.content||'').substring(0,80));await finalizeReq(cid,req);return}

//== finalizeReq ==//
async function finalizeReq(cid,req){
if(streamRAF){cancelAnimationFrame(streamRAF);streamRAF=null;streamDirty=false}
if(_streamRetryTimer){clearTimeout(_streamRetryTimer);_streamRetryTimer=null}
let rsnDur=0;
if(req.reasoningStart)rsnDur=(req.reasoningEnd||Date.now())-req.reasoningStart;
const ftMs=req.firstTokenTime?req.firstTokenTime-req.startTime:0;
const totalDur=Date.now()-req.startTime;
const saved=await updateMC(cid,req.msgId,req.content,req.reasoning,rsnDur,ftMs,req.usage,totalDur);
if(!saved){
req.status='save_failed';
toast('⚠️ 生成完成，但最终保存失败；请先复制内容并检查工作文件夹权限')
}
await recordCostLog(cid,req);
delete lastStreamSaveLen[req.msgId];
pendReqs[cid]=(pendReqs[cid]||[]).filter(r=>r.id!==req.id);
if(!pendReqs[cid].length)delete pendReqs[cid];
updatePendB();
updateStopBar();
updateConvListActive();
if(cid===curConvId&&curConv){
const mi=curConv.messages.findIndex(m=>m.id===req.msgId);
if(mi>=0){
if(!foldMgr.isFolded(req.msgId))foldMgr.setFolded(req.msgId,false);

}else renderMsgs();

}
}

//== updateMC ==//
async function updateMC(cid,mid,ct,rsn,dur,ftMs,usage,totalDur){
const conv=cid===curConvId&&curConv?curConv:await loadConvFull(cid);
if(!conv)return false;
const msg=conv.messages.find(m=>m.id===mid);
if(!msg)return false;
const before=syncClone(msg);
const applyFinal=m=>{
m.content=ct;
if(rsn){m.reasoning=rsn;m.reasoningDuration=dur}
if(ftMs)m.firstTokenMs=ftMs;
if(totalDur)m.duration=totalDur;
if(usage){
m.promptTokens=usage.prompt_tokens||0;
m.completionTokens=usage.completion_tokens||0;
m.cacheHitTokens=usage.prompt_cache_hit_tokens||0;
m.cacheMissTokens=usage.prompt_cache_miss_tokens||0
}
};
applyFinal(msg);
recordEditOp(conv,before,msg,conv.messages.indexOf(msg));
touchConv(conv,'content');
const saved=await saveConvF(conv);
if(!saved){
msg.content='⚠️ 最终保存失败：生成结果未确认写入工作文件夹。请先复制下面内容，并检查工作文件夹权限。\n\n'+(ct||'');
if(cid===curConvId&&curConv){
const m=curConv.messages.find(m=>m.id===mid);
if(m&&m!==msg){applyFinal(m);m.content=msg.content}
}
return false
}
if(cid===curConvId&&curConv){
const m=curConv.messages.find(m=>m.id===mid);
if(m&&m!==msg)applyFinal(m)
}
return true
}

//== execApiRefreshAll ==//
async function execApiRefreshAll(){
if(window._apiRefreshRunning){toast('⏳ 上次刷新还在进行中...');return}
window._apiRefreshRunning=true;
const configSnap=captureConfigEditSnapshot();
hideMo();
toast(`🔄 后台刷新 ${apiConfigs.length} 个API中...`);
const result={total:apiConfigs.length,ok:0,fail:0,added:0,removed:0,failures:[],changed:[],staleStars:[]};
const oldStateMap={};
apiConfigs.forEach(cfg=>{oldStateMap[cfg.id]=[...(cfg.models||[])]});
const CONCURRENCY=5;
let idx=0;
async function worker(){
while(idx<apiConfigs.length){
const i=idx++;
const cfg=apiConfigs[i];
if(!cfg)continue;
const oldModels=oldStateMap[cfg.id]||[];
const r=await apiRefreshOne(cfg);
if(r.ok){
const newModels=r.models;
const oldSet=new Set(oldModels),newSet=new Set(newModels);
const add=newModels.filter(m=>!oldSet.has(m)).length;
const del=oldModels.filter(m=>!newSet.has(m)).length;
cfg.models=newModels;
result.ok++;result.added+=add;result.removed+=del;
if(add||del){apiTouchConfig(cfg.id);result.changed.push({name:cfg.name,added:add,removed:del})}
if(curApiId===cfg.id&&curModel&&!newSet.has(curModel))curModel=''
}else{
result.fail++;
result.failures.push({name:cfg.name,error:r.error||'未知错误'})
}
}
}
try{
const workerCount=Math.min(CONCURRENCY,apiConfigs.length);
await Promise.all(Array.from({length:workerCount},()=>worker()));
result.staleStars=starredModels.filter(s=>{const cfg=apiConfigs.find(c=>c.id===s.apiId);return!cfg||!cfg.models.includes(s.model)});
window._apiRefreshResult=result;
if(!await saveConfigEditOrRollback(configSnap,{render:renderApiSel,failMsg:'⚠️ 模型列表刷新结果保存失败，已恢复刷新前配置'}))return;
renderApiSel();
toast(`✓ 刷新完成: ${result.ok}成功/${result.fail}失败`);
showApiRefreshResult(result)
}finally{window._apiRefreshRunning=false}
}

//== apiRefreshOne ==//
async function apiRefreshOne(cfg){
try{
const headers={};
if(cfg.key)headers.Authorization='Bearer '+cfg.key;
const opt={headers};
if(window.AbortSignal&&AbortSignal.timeout)opt.signal=AbortSignal.timeout(30000);
const resp=await fetch(fixModelsUrl(cfg.url),opt);
if(!resp.ok)throw new Error('HTTP '+resp.status);
const data=await resp.json();
let arr=[];
if(Array.isArray(data.data))arr=data.data;
else if(Array.isArray(data.models))arr=data.models;
else if(Array.isArray(data))arr=data;
else throw new Error('未找到模型列表');
const models=[...new Set(arr.map(m=>typeof m==='string'?m:(m.id||m.model||m.name||'')).map(s=>String(s).trim()).filter(Boolean))];
if(!models.length)throw new Error('模型列表为空');
return{ok:true,models}
}catch(e){return{ok:false,error:e.name+': '+(e.message||'').substring(0,60)}}
}

//== cntTok ==//
function cntTok(t){if(!t)return 0;if(Array.isArray(t)){return t.reduce((s,p)=>s+(p.type==='text'?cntTok(p.text||''):p.type==='image_url'?85:0),0)}if(typeof t!=='string')return 0;let tok=0;t.split(/([\u4e00-\u9fff\u3400-\u4dbf]+)/g).forEach(p=>{if(!p)return;if(/[\u4e00-\u9fff]/.test(p))tok+=Math.ceil(p.length*1.5);else p.split(/\s+/).filter(w=>w).forEach(w=>{tok+=w.length<=4?1:w.length<=10?2:Math.ceil(w.length/4)})});return Math.max(1,Math.round(tok))}

let _matCfgEditSnap=null,_matCfgEditActive=false,_matCfgEditConvId='';
function ensureConvMaterialConfig(conv){
const d=defMC();
if(!conv)return syncClone(d);
if(!conv.materialConfig||typeof conv.materialConfig!=='object')conv.materialConfig=syncClone(d);
['spotlight','appear','mention','absent','hidden'].forEach(k=>{if(!Array.isArray(conv.materialConfig[k]))conv.materialConfig[k]=[]});
['hToggles','apps','metaPrompts'].forEach(k=>{if(!conv.materialConfig[k]||typeof conv.materialConfig[k]!=='object'||Array.isArray(conv.materialConfig[k]))conv.materialConfig[k]={}});
['hideRel','hideStory','worldBook'].forEach(k=>{if(typeof conv.materialConfig[k]!=='boolean')conv.materialConfig[k]=!!d[k]});
if(!Object.prototype.hasOwnProperty.call(conv.materialConfig,'timelineCutoffIdx'))conv.materialConfig.timelineCutoffIdx=null;
return conv.materialConfig
}
function snapshotMatCfgEditState(conv){
return{
id:conv?.id||'',
materialConfig:syncClone(ensureConvMaterialConfig(conv)),
updatedAt:conv?.updatedAt,
materialsUpdatedAt:conv?.materialsUpdatedAt
}
}
function beginMatCfgEditSession(){
if(!curConv)return;
ensureConvMaterialConfig(curConv);
if(_matCfgEditActive&&_matCfgEditConvId&&_matCfgEditConvId!==curConv.id){
_matCfgEditSnap=null;
_matCfgEditActive=false;
_matCfgEditConvId=''
}
if(!_matCfgEditActive){
_matCfgEditSnap=snapshotMatCfgEditState(curConv);
_matCfgEditActive=true;
_matCfgEditConvId=curConv.id||'';
if(curConv.id)bumpConvMemoryRevision(curConv.id)
}
}
function restoreMatCfgEditState(conv,snap){
if(!conv||!snap||snap.id&&conv.id!==snap.id)return;
conv.materialConfig=syncClone(snap.materialConfig||defMC());
conv.updatedAt=snap.updatedAt;
conv.materialsUpdatedAt=snap.materialsUpdatedAt
}
function finishMatCfgEditSession(){
_matCfgEditSnap=null;
_matCfgEditActive=false;
_matCfgEditConvId=''
}
function ensureMatCfgEditSession(){
if(!curConv)return;
ensureConvMaterialConfig(curConv);
if(!_matCfgEditActive||_matCfgEditConvId!==curConv.id)beginMatCfgEditSession()
}
function isMatCfgEditingConv(id){
return !!(_matCfgEditActive&&_matCfgEditConvId&&id&&_matCfgEditConvId===id)
}
function confirmDiscardMatCfgEditForNavigation(targetId){
if(!_matCfgEditActive)return true;
if(_matCfgEditConvId&&targetId&&_matCfgEditConvId===targetId)return true;
const ok=typeof confirm==='function'
?confirm('素材配置有未保存改动。切换对话会放弃这些改动，确定继续？')
:true;
if(!ok)return false;
restoreActiveMatCfgEditSession({closeModal:true});
return true
}
function replaceCurConvIfSafe(convId,nextConv,reason){
if(!nextConv||convId!==curConvId)return false;
if(nextConv._mergeBaseRevision!==undefined&&nextConv._mergeBaseRevision!==convMemoryRevision(convId)){
if(typeof syncTrace==='function')syncTrace('conv.replace.casMemoryRejected',{convId,reason:reason||'',expected:nextConv._mergeBaseRevision,current:convMemoryRevision(convId)});
return false
}
if(isMatCfgEditingConv(convId)){
if(typeof syncTrace==='function')syncTrace('materialConfig.activeEditSkipCurConvReplace',{convId,reason:reason||''});
return false
}
delete nextConv._mergeBaseRevision;
delete nextConv._mergeBaseDiskToken;
curConv=nextConv;
return true
}
function restoreActiveMatCfgEditSession(opts){
opts=opts||{};
if(!_matCfgEditActive)return false;
if(curConv&&_matCfgEditSnap&&(!_matCfgEditConvId||curConv.id===_matCfgEditConvId)){
restoreMatCfgEditState(curConv,_matCfgEditSnap);
if(typeof updateMatB==='function')updateMatB();
if(typeof updateTokCnt==='function')updateTokCnt()

async function collectExportTargets(scope,folderSnapshot){
const snap=folderSnapshot||currentFolderSnapshot();
if(scope==='current')return curConv?[curConv]:[];

let metas=exportableActiveMetas().map(c=>({id:c.id,groupId:c.groupId||'_default'}));
if(scope==='group'){
const gid=curConv?.groupId||'_default';
metas=metas.filter(c=>c.groupId===gid)
}
return await loadExportTargets(metas,{rootHandle:snap.handle,generation:snap.generation,guard:snap.guard})
}

function exportPlainText(targets,fmt){
let txt='';
targets.forEach(conv=>{
if(targets.length>1){
txt+=`\n${'='.repeat(40)}\n📁 ${conv.name}\n${'='.repeat(40)}\n\n`
}
(conv.messages||[]).forEach((m,i)=>{
if(fmt==='ai'&&m.role!=='assistant')return;
if(fmt==='txt'){
txt+=`[#${i+1} ${m.role==='user'?'用户':m.role==='system'?'系统':'AI'}]\n${m.content||''}\n\n`
}else{
txt+=(m.content||'')+'\n\n---#---\n\n'
}
})
});
return txt.trim()
}

//== showImport ==//
function importReadErrorMessage(err){
const msg=(err&&err.message||String(err)).substring(0,120);
if(msg.includes('已切换工作文件夹'))return '❌ '+msg;
if(msg.includes('not be found')||msg.includes('NotFound'))return '❌ 文件读取失败，请重试或重新选择文件夹: '+msg;
if(msg.includes('JSON')||msg.includes('Unexpected'))return '❌ 文件格式错误: '+msg;
return '❌ 导入失败: '+msg
}

function showImport(){
if(importLock){
toast('导入进行中');
return
}
const snap=currentFolderSnapshot();
if(!snap.handle||!snap.guard()){
toast('请先选择文件夹');
return
}

const inp=document.createElement('input');
inp.type='file';
inp.accept='.json,.txt';
inp.onchange=async e=>{
const f=e.target.files[0];
if(!f)return;
if(!snap.guard()){
toast('❌ 已切换工作文件夹，导入已取消');
return
}

const sizeMB=(f.size/1024/1024).toFixed(1);
showMo('📥 读取文件',`<div style="text-align:center;padding:20px"><div style="font-size:14px;margin-bottom:10px" id="impReadStatus">正在读取 ${esc(f.name)} (${sizeMB}MB)...</div><div class="prog-bar"><div class="prog-fill" id="impReadProg" style="width:10%"></div></div><div class="prog-text" id="impReadText">读取文件中</div></div>`,'');
await new Promise(r=>setTimeout(r,30));

try{
const rp=document.getElementById('impReadProg');
const rt=document.getElementById('impReadText');
if(rt)rt.textContent='读取文件内容...';

const text=await f.text();
if(!snap.guard())throw new Error('已切换工作文件夹，导入预览已取消');

if(rp)rp.style.width='40%';
if(rt)rt.textContent='解析JSON ('+sizeMB+'MB)...';
await new Promise(r=>setTimeout(r,10));

const data=JSON.parse(text);
if(!snap.guard())throw new Error('已切换工作文件夹，导入预览已取消');

if(rp)rp.style.width='60%';
if(rt)rt.textContent='分析导入内容...';
await new Promise(r=>setTimeout(r,10));

await analyzeImport(data);
if(!snap.guard())throw new Error('已切换工作文件夹，导入预览已取消')
}catch(err){
hideMo();
toast(importReadErrorMessage(err))
}
};
inp.click()
}

function parseChatboxApi(data){const apis=[];const providers=data.settings?.providers;const customProviders=data.settings?.customProviders;if(providers&&typeof providers==='object'){const nameMap={};(Array.isArray(customProviders)?customProviders:[]).forEach(cp=>{if(cp.id&&cp.name)nameMap[cp.id]=cp.name});Object.entries(providers).forEach(([pid,pdata])=>{if(pid==='chatbox-ai')return;if(!pdata.apiKey&&!pdata.apiHost)return;const displayName=nameMap[pid]||pid;const models=(pdata.models||[]).map(m=>typeof m==='string'?m:m.modelId).filter(m=>m);let host=(pdata.apiHost||'').trim().replace(/\/+$/,'');apis.push({id:gid2(),name:displayName,url:host,key:pdata.apiKey||'',models:models})})}if(!apis.length){if(data.openaiApiKey||data['openai.apiKey']){const key=data.openaiApiKey||data['openai.apiKey']||'';const host=data.openaiApiHost||data['openai.apiHost']||'https://api.openai.com';const model=data.openaiModel||data['openai.model']||'';if(key)apis.push({id:gid2(),name:'OpenAI',url:host,key:key,models:model?[model]:[]})}}return apis}

function importStable(v){if(Array.isArray(v))return v.map(importStable);if(v&&typeof v==='object'){const o={};Object.keys(v).sort().forEach(k=>{o[k]=importStable(v[k])});return o}return v}
function importStateSig(c){return JSON.stringify(importStable({name:c.name||'',pinned:!!c.pinned,materialConfig:c.materialConfig||null,tempAppendices:c.tempAppendices||[],groupId:c.groupId||null,convParams:c.convParams||{},foldGroups:c.foldGroups||[],foldedMsgIds:c.foldedMsgIds||[],lockedModel:c.lockedModel||null}))}
function importHasStateDiff(ex,ic){return importStateSig(ex)!==importStateSig(ic)}
function importStateTime(c){return Math.max(0,...['metaUpdatedAt','paramsUpdatedAt','materialsUpdatedAt','uiStateUpdatedAt','tempAppendicesUpdatedAt','updatedAt'].map(k=>Date.parse(c?.[k]||0)||0))}
function importSuggestStateChoice(ex,ic){const it=importStateTime(ic),et=importStateTime(ex);return it>et?'overwrite':'keep'}
function importShortVal(v){if(v===undefined||v===null)return'空';if(typeof v==='boolean')return v?'是':'否';if(typeof v==='string')return v||'空';if(Array.isArray(v))return v.length+'项';if(typeof v==='object')return Object.keys(v).length+'项';return String(v)}
function importSameStable(a,b){return JSON.stringify(importStable(a))===JSON.stringify(importStable(b))}
function importStateDiffSummary(ex,ic){
const out=[],add=(key,label,localVal,importVal,timeField)=>{
if(importSameStable(localVal,importVal))return;
out.push({key,label,local:importShortVal(localVal),imported:importShortVal(importVal),timeField,localTime:ex?.[timeField]||ex?.updatedAt||'',importTime:ic?.[timeField]||ic?.updatedAt||''})
};
add('name','标题',ex?.name||'',ic?.name||'','metaUpdatedAt');
add('pinned','星标/置顶',!!ex?.pinned,!!ic?.pinned,'metaUpdatedAt');
add('groupId','分组',ex?.groupId||'_default',ic?.groupId||'_default','metaUpdatedAt');
add('convParams','对话参数',ex?.convParams||{},ic?.convParams||{},'paramsUpdatedAt');
add('lockedModel','锁定模型',ex?.lockedModel||null,ic?.lockedModel||null,'paramsUpdatedAt');

return out
}
function importContentEvidenceStrong(ic){const msgs=ic.messages||[];const textLen=msgs.reduce((s,m)=>s+(m.content||'').length+(m.reasoning||'').length,0);return msgs.length>=2||textLen>=200}
function importFirstMsgSig(c){const m=(c.messages||[])[0];return m?importMsgSig(m):''}
async function classifyImportConvs(importConvs,existingConvs,loadFull,opts={}){
existingConvs=(existingConvs||[]).filter(c=>!c.deletedAt&&!(typeof isConflictVaultConv==='function'&&isConflictVaultConv(c)));
const nameMap={},idMap={},originMap={};
(existingConvs||[]).forEach(c=>{const n=c.name;if(!nameMap[n])nameMap[n]=[];nameMap[n].push(c);if(c.id)idMap[c.id]=c;if(c._importOriginKey)(originMap[c._importOriginKey]||(originMap[c._importOriginKey]=[])).push(c)});
const cats={new:[],identical:[],stateDiff:[],superset:[],subset:[],diverged:[],different:[]};
const fullCache={},assignments=new Map(),fixedLocalIds=new Set();let contentFirstMap=null;

function importMsgSig(m){const imgs=(m.images||[]).map(img=>[img.name||'',img.width||'',img.height||'',img.mimeType||'',img.base64?img.base64.length:0].join(':')).join('|');const atts=(m.attachments||[]).map(a=>[a.name||'',a.type||'',a.size||'',a.content?String(a.content).length:0].join(':')).join('|');return[m.role||'',m.content||'',m.reasoning||'',m.model||'',m.muted?'1':'0',imgs,atts].join('\u0001')}
